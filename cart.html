<!DOCTYPE html>
<html lang="ru">
<head>
    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PRORANK">
    <meta name="theme-color" content="#fbbf24">
    <meta name="mobile-web-app-capable" content="yes">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#fbbf24">
    <meta name="description" content="Корзина PRORANK — оформление заказов на экипировку и товары">
    <title>Корзина | PRORANK</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(ellipse at 30% 40%, rgba(251, 191, 36, 0.15) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 80%, rgba(251, 191, 36, 0.08) 0%, transparent 50%),
                        linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 40%, #1a1a1a 100%);
            background-attachment: fixed;
            color: #fff;
            line-height: 1.4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 160px;
        }
        
        main { flex: 1; }
        
        .gold-top { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 3px; 
            background: linear-gradient(90deg, #fbbf24, #ffdd88, #fbbf24, #b8860b); 
            z-index: 1001; 
        }
        
        .container { 
            max-width: 900px; 
            margin: 0 auto; 
            padding: 0 24px; 
            position: relative; 
            z-index: 2;
            width: 100%;
        }
        
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(251, 191, 36, 0.25);
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: all 0.3s ease;
        }
        
        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            cursor: pointer;
            background: linear-gradient(135deg, #ffffff, #fbbf24);
            background-clip: text;
            color: transparent;
            transition: transform 0.2s ease;
        }
        
        .logo:hover { transform: scale(1.02); }
        .logo span { background: linear-gradient(135deg, #fbbf24, #ffdd77); background-clip: text; color: transparent; }
        
        .balance-indicator {
            background: #111;
            border: 1px solid rgba(251,191,36,0.5);
            border-radius: 60px;
            padding: 7px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        
        .balance-indicator:hover {
            border-color: #fbbf24;
            box-shadow: 0 0 15px rgba(251,191,36,0.2);
        }
        
        .balance-count { color: #fbbf24; font-size: 1.1rem; }
        
        .balance-plus {
            background: rgba(251,191,36,0.15);
            border: none;
            color: #fbbf24;
            cursor: pointer;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            transition: all 0.2s ease;
        }
        
        .balance-plus:hover {
            background: rgba(251,191,36,0.3);
            transform: scale(1.05);
        }
        
        .balance-plus:active { 
            background: #fbbf24; 
            color: #000;
            transform: scale(0.94);
        }
        
        .menu-toggle { 
            display: none; 
            background: rgba(251,191,36,0.1); 
            border: 1px solid #fbbf24; 
            color: #fbbf24; 
            font-size: 1.6rem; 
            cursor: pointer; 
            padding: 8px 14px; 
            border-radius: 12px;
            transition: all 0.2s ease;
            min-height: 44px;
            min-width: 44px;
        }
        
        .menu-toggle:hover {
            background: rgba(251,191,36,0.2);
            transform: scale(1.02);
        }
        
        .menu-toggle:active { transform: scale(0.95); }
        
        .nav-links {
            display: flex;
            gap: 6px;
            background: rgba(15,15,15,0.7);
            backdrop-filter: blur(12px);
            padding: 5px 14px;
            border-radius: 60px;
            border: 1px solid rgba(251,191,36,0.2);
        }
        
        .nav-links a { 
            color: #ddd; 
            text-decoration: none; 
            font-size: 0.9rem; 
            font-weight: 500; 
            padding: 8px 18px; 
            border-radius: 40px; 
            transition: all 0.2s ease;
        }
        
        .nav-links a i { margin-right: 8px; color: #fbbf24; transition: transform 0.2s ease; }
        .nav-links a:hover { color: #fbbf24; background: rgba(251,191,36,0.1); transform: translateY(-2px); }
        .nav-links a:hover i { transform: scale(1.1); }
        
        .breadcrumb {
            margin: 20px 0 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 0.8rem;
        }
        
        .breadcrumb a {
            color: #aaa;
            text-decoration: none;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .breadcrumb a:hover { color: #fbbf24; }
        .breadcrumb .current { color: #fbbf24; font-weight: 500; }
        .breadcrumb .separator { color: #444; }
        
        .back-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(251,191,36,0.15);
            color: #aaa;
            padding: 6px 14px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.75rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }
        
        .back-btn:hover {
            background: rgba(251,191,36,0.12);
            color: #fbbf24;
            border-color: rgba(251,191,36,0.3);
            transform: translateX(-2px);
        }
        
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 8px 0 20px;
        }
        
        .page-header h1 { 
            font-size: clamp(1.5rem, 4vw, 1.8rem); 
            font-weight: 800; 
            background: linear-gradient(135deg, #fff, #fbbf24); 
            background-clip: text; 
            color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-header h1 i {
            color: #fbbf24;
            background: none;
            -webkit-text-fill-color: #fbbf24;
        }

        .cart-counter {
            font-size: 0.8rem;
            color: #666;
            background: rgba(15,15,15,0.6);
            padding: 6px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .cart-counter span {
            color: #fbbf24;
            font-weight: 600;
        }

        /* ===== СПИСОК ТОВАРОВ ===== */
        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 20px;
        }

        /* ===== КАРТОЧКА ТОВАРА (КАК В WB) ===== */
        .cart-item {
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(15,15,15,0.5);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 14px 18px;
            border: 1px solid rgba(251,191,36,0.06);
            transition: all 0.3s ease;
            animation: fadeInUp 0.4s ease both;
        }

        .cart-item:hover {
            border-color: rgba(251,191,36,0.15);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        /* ===== ФОТО СЛЕВА ===== */
        .cart-item-image {
            width: 80px;
            height: 80px;
            min-width: 80px;
            border-radius: 12px;
            object-fit: cover;
            background: #1a1a1a;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .cart-item-image:hover {
            transform: scale(1.04);
        }

        /* ===== ИНФОРМАЦИЯ ПОСЕРЕДИНЕ ===== */
        .cart-item-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .cart-item-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: #eee;
            cursor: pointer;
            transition: color 0.2s ease;
            line-height: 1.3;
        }

        .cart-item-name:hover {
            color: #fbbf24;
        }

        .cart-item-store {
            font-size: 0.65rem;
            color: #666;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .cart-item-store i {
            color: #fbbf24;
            font-size: 0.55rem;
        }

        .cart-item-price-block {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .cart-item-price {
            font-weight: 700;
            font-size: 1.05rem;
            color: #fbbf24;
        }

        .cart-item-price-unit {
            font-size: 0.6rem;
            color: #555;
        }

        /* ===== ДЕЙСТВИЯ СПРАВА ===== */
        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .item-quantity {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255,255,255,0.04);
            border-radius: 30px;
            padding: 2px 4px;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .quantity-btn {
            background: none;
            border: none;
            color: #888;
            width: 38px;              /* ← УВЕЛИЧЕНО */
            height: 38px;             /* ← УВЕЛИЧЕНО */
            border-radius: 50%;
            cursor: pointer;
            font-weight: 700;
            font-size: 1.1rem;        /* ← УВЕЛИЧЕНО */
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }

        .quantity-btn:hover {
            background: rgba(251,191,36,0.12);
            color: #fbbf24;
        }

        .quantity-btn:active {
            transform: scale(0.9);
        }

        .item-count {
            font-weight: 600;
            font-size: 1rem;          /* ← УВЕЛИЧЕНО */
            min-width: 30px;          /* ← УВЕЛИЧЕНО */
            text-align: center;
            color: #fff;
        }

        .btn-remove {
            background: rgba(220,38,38,0.08);
            color: #888;
            border: none;
            padding: 8px 16px;        /* ← УВЕЛИЧЕНО */
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.75rem;       /* ← УВЕЛИЧЕНО */
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            min-height: 40px;         /* ← УВЕЛИЧЕНО */
        }

        .btn-remove:hover {
            background: rgba(220,38,38,0.18);
            color: #dc2626;
            transform: translateY(-1px);
        }

        .btn-remove:active {
            transform: scale(0.95);
        }

        /* ===== КНОПКА "КУПИТЬ" ===== */
        .btn-buy-now {
            background: rgba(251,191,36,0.12);
            color: #fbbf24;
            border: 1px solid rgba(251,191,36,0.15);
            padding: 8px 16px;        /* ← УВЕЛИЧЕНО */
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.75rem;       /* ← УВЕЛИЧЕНО */
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
            min-height: 40px;         /* ← УВЕЛИЧЕНО */
        }

        .btn-buy-now:hover {
            background: rgba(251,191,36,0.2);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(251,191,36,0.15);
        }

        .btn-buy-now:active {
            transform: scale(0.95);
        }

        .btn-buy-now i {
            font-size: 0.8rem;        /* ← УВЕЛИЧЕНО */
        }

        /* ===== ФИКСИРОВАННАЯ НИЖНЯЯ ПАНЕЛЬ ===== */
        .checkout-fixed {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10,10,10,0.92);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(251,191,36,0.12);
            padding: 12px 20px;
            z-index: 999;
            display: none;
            animation: slideUpFixed 0.3s ease;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.3);
        }

        @keyframes slideUpFixed {
            from {
                transform: translateY(100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .checkout-fixed-inner {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .checkout-fixed-left {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .checkout-fixed-left .selected-label {
            font-size: 0.7rem;
            color: #888;
        }

        .checkout-fixed-left .selected-label span {
            color: #fbbf24;
            font-weight: 600;
        }

        .checkout-fixed-left .selected-total {
            font-size: 1.2rem;
            font-weight: 800;
            color: #fbbf24;
        }

        .checkout-fixed-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-checkout-fixed {
            background: #fbbf24;
            color: #000;
            padding: 12px 32px;       /* ← УВЕЛИЧЕНО */
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.95rem;       /* ← УВЕЛИЧЕНО */
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.25s ease;
            font-family: 'Inter', sans-serif;
            min-height: 52px;         /* ← УВЕЛИЧЕНО */
            min-width: 180px;         /* ← УВЕЛИЧЕНО */
        }

        .btn-checkout-fixed:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(251,191,36,0.25);
            background: #ffdd44;
        }

        .btn-checkout-fixed:active {
            transform: scale(0.97);
        }

        .btn-checkout-fixed i {
            font-size: 1rem;          /* ← УВЕЛИЧЕНО */
        }

        .btn-checkout-fixed .checkout-amount {
            background: rgba(0,0,0,0.1);
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 0.8rem;        /* ← УВЕЛИЧЕНО */
        }

        .btn-checkout-fixed:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-checkout-fixed:disabled:hover {
            box-shadow: none;
        }

        /* ===== ПУСТАЯ КОРЗИНА ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
            animation: fadeInUp 0.4s ease;
        }
        
        .empty-state i {
            font-size: 3.5rem;
            margin-bottom: 16px;
            color: #2a2a2a;
        }
        
        .empty-state h3 {
            color: #ccc;
            font-size: 1.1rem;
            margin-bottom: 6px;
        }
        
        .empty-state p {
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 18px;
        }
        
        .empty-state a {
            color: #fbbf24;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-block;
            padding: 10px 28px;
            border-radius: 40px;
            background: rgba(251,191,36,0.1);
            border: 1px solid rgba(251,191,36,0.15);
            font-weight: 600;
            font-size: 0.85rem;
        }
        
        .empty-state a:hover {
            background: rgba(251,191,36,0.2);
            transform: translateY(-2px);
        }

        /* ===== ВЫБОР ВСЕХ ===== */
        .select-all-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(15,15,15,0.3);
            border-radius: 12px;
            margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,0.04);
        }

        .select-all-wrap .custom-checkbox {
            width: 22px;
            height: 22px;
        }

        .select-all-wrap label {
            color: #aaa;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .select-all-wrap label:hover {
            color: #fff;
        }

        .select-all-wrap .selected-count {
            font-size: 0.7rem;
            color: #555;
            margin-left: auto;
        }

        /* ===== КАСТОМНЫЙ ЧЕКБОКС ===== */
        .custom-checkbox {
            position: relative;
            width: 24px;
            height: 24px;
            flex-shrink: 0;
            cursor: pointer;
        }

        .custom-checkbox input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .custom-checkbox .checkmark {
            position: absolute;
            top: 0;
            left: 0;
            width: 24px;
            height: 24px;
            border-radius: 6px;
            border: 2px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.03);
            transition: all 0.2s ease;
        }

        .custom-checkbox:hover .checkmark {
            border-color: rgba(251,191,36,0.4);
        }

        .custom-checkbox input:checked + .checkmark {
            background: #fbbf24;
            border-color: #fbbf24;
        }

        .custom-checkbox input:checked + .checkmark::after {
            content: '';
            position: absolute;
            left: 7px;
            top: 3px;
            width: 7px;
            height: 11px;
            border: solid #000;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        /* ===== МОДАЛЬНОЕ ОКНО ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }
        
        .modal-content {
            background: #151515;
            border-radius: 24px;
            padding: 24px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(251,191,36,0.12);
            animation: slideUpModal 0.3s ease;
        }

        @keyframes slideUpModal {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-header h3 {
            color: #fbbf24;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-close {
            background: rgba(255,255,255,0.05);
            border: none;
            color: #888;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        .modal-items-preview {
            background: rgba(0,0,0,0.25);
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 16px;
        }

        .modal-items-preview .preview-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            font-size: 0.8rem;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }

        .modal-items-preview .preview-item:last-child {
            border-bottom: none;
        }

        .modal-items-preview .preview-item .preview-name {
            color: #ddd;
        }

        .modal-items-preview .preview-item .preview-price {
            color: #fbbf24;
            font-weight: 600;
        }

        .modal-total-preview {
            display: flex;
            justify-content: space-between;
            padding: 10px 0 2px;
            border-top: 1px solid rgba(251,191,36,0.12);
            font-weight: 700;
            font-size: 1rem;
        }

        .modal-total-preview .total-price {
            color: #fbbf24;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            color: #888;
            font-size: 0.7rem;
            font-weight: 500;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            background: #1a1a1a;
            border: 1px solid rgba(251,191,36,0.12);
            color: #fff;
            border-radius: 40px;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #fbbf24;

    <script type="module" src="header.js"></script>
    <script type="module">
    import { initializeApp } from "firebase/app";
    import { getAuth, onAuthStateChanged } from "firebase/auth";
    import { getFirestore, addDoc, collection, doc, getDoc, serverTimestamp, updateDoc, runTransaction } from "firebase/firestore";

    const firebaseConfig = {
        apiKey: "AIzaSyDUGYJY7pX7q02MS5SACMIIQXpjpQ97mPw",
        authDomain: "proranklive.firebaseapp.com",
        projectId: "proranklive",
        storageBucket: "proranklive.firebasestorage.app",
        messagingSenderId: "716836144015",
        appId: "1:716836144015:web:f1575147750608d0f881fa"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    let currentUser = null;
    let currentUserData = null;

    async function updateHeaderBalance() {
        const user = auth.currentUser;
        const balanceDiv = document.getElementById('balanceIndicator');
        const balanceCount = document.getElementById('headerChallengesCount');
        if (!user || !balanceDiv) return;
        try {
            const userDoc = await getDoc(doc(db, "fighters", user.uid));
            const data = userDoc.data();
            const total = (data.freeChallenges || 0) + (data.purchasedChallenges || 0);
            balanceCount.innerText = total;
            balanceDiv.style.display = 'flex';
        } catch (err) { 
            console.error(err);
            balanceDiv.style.display = 'none';
        }
    }

    function getSelectedItems() {
        const checkedItems = [];
        document.querySelectorAll('.cart-item .custom-checkbox input:checked').forEach(cb => {
            const itemId = cb.dataset.itemId;
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const items = cart.filter(i => i.id === itemId);
            if (items.length > 0) {
                const grouped = {};
                items.forEach(i => {
                    const key = i.id;
                    if (grouped[key]) {
                        grouped[key].quantity++;
                    } else {
                        grouped[key] = { ...i, quantity: 1 };
                    }
                });
                Object.values(grouped).forEach(item => {
                    checkedItems.push(item);
                });
            }
        });
        return checkedItems;
    }

    function updateCheckoutFixed() {
        const selectedItems = getSelectedItems();
        const fixed = document.getElementById('checkoutFixed');
        const countEl = document.getElementById('fixedSelectedCount');
        const totalEl = document.getElementById('fixedTotalAmount');
        const amountEl = document.getElementById('fixedCheckoutAmount');
        const btn = document.getElementById('checkoutFixedBtn');

        if (selectedItems.length === 0) {
            btn.disabled = true;
            countEl.textContent = '0';
            totalEl.textContent = '0 ₽';
            amountEl.textContent = '0 ₽';
            return;
        }

        let total = 0;
        selectedItems.forEach(item => {
            total += (item.price || 0) * (item.quantity || 1);
        });

        btn.disabled = false;
        countEl.textContent = selectedItems.length;
        totalEl.textContent = total.toLocaleString() + ' ₽';
        amountEl.textContent = total.toLocaleString() + ' ₽';
    }

    function updateSelectAllState() {
        const checkboxes = document.querySelectorAll('.cart-item .custom-checkbox input');
        const checked = document.querySelectorAll('.cart-item .custom-checkbox input:checked');
        const selectAll = document.getElementById('selectAllCheckbox');
        const countEl = document.getElementById('selectedCount');

        if (checkboxes.length > 0) {
            selectAll.checked = checkboxes.length === checked.length;
            countEl.textContent = `Выбрано: ${checked.length} из ${checkboxes.length}`;
        }

        updateCheckoutFixed();
    }

    function loadCart() {
        const cart = JSON.parse(localStorage.getItem('cart') || '[]');
        const container = document.getElementById('cartItems');
        const itemsCountEl = document.getElementById('cartItemsCount');
        const selectAllWrap = document.getElementById('selectAllWrap');
        
        if (cart.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-shopping-cart"></i>
                    <h3>Корзина пуста</h3>
                    <p>Добавьте товары из каталога</p>
                    <a href="catalog.html"><i class="fas fa-store"></i> Перейти в каталог</a>
                </div>
            `;
            document.getElementById('checkoutFixed').style.display = 'none';
            selectAllWrap.style.display = 'none';
            if (itemsCountEl) itemsCountEl.textContent = '0';
            return;
        }
        
        const grouped = {};
        cart.forEach(item => {
            const key = item.id;
            if (grouped[key]) {
                grouped[key].quantity++;
            } else {
                grouped[key] = { ...item, quantity: 1 };
            }
        });
        
        let html = '';
        let totalItems = 0;
        const items = Object.values(grouped);
        
        items.forEach((item) => {
            totalItems += item.quantity;
            const imageUrl = item.image || 'https://placehold.co/300x200/1a1a1a/fbbf24?text=No+Image';
            const totalPrice = item.price * item.quantity;
            
            html += `
                <div class="cart-item" data-item-id="${item.id}">
                    <label class="custom-checkbox">
                        <input type="checkbox" data-item-id="${item.id}" checked>
                        <span class="checkmark"></span>
                    </label>
                    <img src="${imageUrl}" class="cart-item-image" onerror="this.src='https://placehold.co/300x200/1a1a1a/fbbf24?text=No+Image'">
                    <div class="cart-item-info">
                        <div class="cart-item-name">${escapeHtml(item.name)}</div>
                        <div class="cart-item-store"><i class="fas fa-store"></i> ${escapeHtml(item.partnerName || 'Продавец')}</div>
                        <div class="cart-item-price-block">
                            <span class="cart-item-price">${totalPrice.toLocaleString()} ₽</span>
                            <span class="cart-item-price-unit">${item.price.toLocaleString()} ₽ / шт</span>
                        </div>
                    </div>
                    <div class="cart-item-actions">
                        <div class="item-quantity">
                            <button class="quantity-btn dec" data-item-id="${item.id}">−</button>
                            <span class="item-count">${item.quantity}</span>
                            <button class="quantity-btn inc" data-item-id="${item.id}">+</button>
                        </div>
                        <button class="btn-buy-now" data-item-id="${item.id}"><i class="fas fa-bolt"></i> Купить</button>
                        <button class="btn-remove" data-item-id="${item.id}"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `;
        });
        
        container.innerHTML = html;
        
        if (itemsCountEl) itemsCountEl.textContent = totalItems;
        
        selectAllWrap.style.display = 'flex';
        document.getElementById('checkoutFixed').style.display = 'block';
        
        document.querySelectorAll('.cart-item .custom-checkbox input').forEach(cb => {
            cb.removeEventListener('change', handleCheckboxChange);
            cb.addEventListener('change', handleCheckboxChange);
        });
        
        const selectAll = document.getElementById('selectAllCheckbox');
        selectAll.removeEventListener('change', handleSelectAll);
        selectAll.addEventListener('change', handleSelectAll);
        
        document.querySelectorAll('.quantity-btn.dec').forEach(btn => {
            btn.removeEventListener('click', handleDec);
            btn.addEventListener('click', handleDec);
        });
        document.querySelectorAll('.quantity-btn.inc').forEach(btn => {
            btn.removeEventListener('click', handleInc);
            btn.addEventListener('click', handleInc);
        });
        document.querySelectorAll('.btn-remove').forEach(btn => {
            btn.removeEventListener('click', handleRemove);
            btn.addEventListener('click', handleRemove);
        });
        document.querySelectorAll('.btn-buy-now').forEach(btn => {
            btn.removeEventListener('click', handleBuyNow);
            btn.addEventListener('click', handleBuyNow);
        });
        document.querySelectorAll('.cart-item-image, .cart-item-name').forEach(el => {
            el.removeEventListener('click', handleItemClick);
            el.addEventListener('click', handleItemClick);
        });

        updateSelectAllState();
    }

    function handleCheckboxChange(e) {
        const cb = e.currentTarget;
        const item = cb.closest('.cart-item');
        if (cb.checked) {
            item.classList.remove('disabled');
        } else {
            item.classList.add('disabled');
        }
        updateSelectAllState();
    }

    function handleSelectAll(e) {
        const checked = e.currentTarget.checked;
        document.querySelectorAll('.cart-item .custom-checkbox input').forEach(cb => {
            cb.checked = checked;
            const item = cb.closest('.cart-item');
            if (checked) {
                item.classList.remove('disabled');
            } else {
                item.classList.add('disabled');
            }
        });
        updateSelectAllState();
    }

    function handleDec(e) {
        const btn = e.currentTarget;
        const itemId = btn.dataset.itemId;
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');
        const itemIndex = cart.findIndex(i => i.id === itemId);
        if (itemIndex !== -1) {
            cart.splice(itemIndex, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            loadCart();
        }
    }

    function handleInc(e) {
        const btn = e.currentTarget;
        const itemId = btn.dataset.itemId;
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');
        const itemIndex = cart.findIndex(i => i.id === itemId);
        if (itemIndex !== -1) {
            const newItem = { ...cart[itemIndex] };
            cart.push(newItem);
            localStorage.setItem('cart', JSON.stringify(cart));
            loadCart();
        }
    }

    function handleRemove(e) {
        const btn = e.currentTarget;
        const itemId = btn.dataset.itemId;
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');
        cart = cart.filter(i => i.id !== itemId);
        localStorage.setItem('cart', JSON.stringify(cart));
        loadCart();
    }

    function handleBuyNow(e) {
        e.stopPropagation();
        const btn = e.currentTarget;
        const itemId = btn.dataset.itemId;
        const cart = JSON.parse(localStorage.getItem('cart') || '[]');
        const items = cart.filter(i => i.id === itemId);
        if (items.length > 0) {
            const grouped = {};
            items.forEach(i => {
                const key = i.id;
                if (grouped[key]) {
                    grouped[key].quantity++;
                } else {
                    grouped[key] = { ...i, quantity: 1 };
                }
            });
            const item = Object.values(grouped)[0];
            alert(`🔥 Быстрая покупка\n\n${item.name}\n${(item.price * item.quantity).toLocaleString()} ₽\nКоличество: ${item.quantity}\n\nПереход к оформлению...`);
            openCheckoutModal([item]);
        }
    }

    function handleItemClick(e) {
        e.stopPropagation();
        alert('📦 Переход к товару');
    }

    function escapeHtml(str) { 
        if (!str) return ''; 
        return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); 
    }

    // ===== МОДАЛЬНОЕ ОКНО =====
    function updatePaymentMethodUI() {
        const options = document.querySelectorAll('.payment-option');
        options.forEach(opt => {
            const radio = opt.querySelector('input');
            opt.classList.toggle('selected', radio.checked);
        });
    }

    function openCheckoutModal(items) {
        const modal = document.getElementById('checkoutModal');
        const previewContainer = document.getElementById('modalItemsPreview');
        
        let previewHtml = '';
        let total = 0;
        items.forEach(item => {
            const itemTotal = item.price * (item.quantity || 1);
            total += itemTotal;
            previewHtml += `
                <div class="preview-item">
                    <span class="preview-name">${escapeHtml(item.name)} ×${item.quantity || 1}</span>
                    <span class="preview-price">${itemTotal.toLocaleString()} ₽</span>
                </div>
            `;
        });
        previewHtml += `
            <div class="modal-total-preview">
                <span>Итого</span>
                <span class="total-price">${total.toLocaleString()} ₽</span>
            </div>
        `;
        previewContainer.innerHTML = previewHtml;
        
        if (currentUserData) {
            document.getElementById('orderName').value = currentUserData.name || '';
            document.getElementById('orderPhone').value = currentUserData.phone || '';
        }
        updatePaymentMethodUI();
        modal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    // ===== КНОПКА В ФИКСИРОВАННОЙ ПАНЕЛИ =====
    document.getElementById('checkoutFixedBtn')?.addEventListener('click', () => {
        if (!currentUser) {
            alert('Войдите в аккаунт для оформления заказа');
            window.location.href = 'login.html';
            return;
        }
        const selectedItems = getSelectedItems();
        if (selectedItems.length === 0) {
            alert('Выберите товары для оформления');
            return;
        }
        openCheckoutModal(selectedItems);
    });

    const modal = document.getElementById('checkoutModal');

    document.querySelectorAll('.payment-option').forEach(opt => {
        opt.addEventListener('click', () => {
            const radio = opt.querySelector('input');
            radio.checked = true;
            updatePaymentMethodUI();
        });
    });

    document.getElementById('closeModalBtn')?.addEventListener('click', () => {
        modal.style.display = 'none';
        document.body.style.overflow = '';
    });

    document.getElementById('cancelOrderBtn')?.addEventListener('click', () => {
        modal.style.display = 'none';
        document.body.style.overflow = '';
    });
    
    window.addEventListener('click', (e) => {
        if (e.target === modal) {
            modal.style.display = 'none';
            document.body.style.overflow = '';
        }
    });

    document.getElementById('submitOrderBtn')?.addEventListener('click', async () => {
        const selectedItems = getSelectedItems();
        if (selectedItems.length === 0) { 
            alert('Выберите товары для оформления'); 
            return; 
        }
        
        const orderName = document.getElementById('orderName').value.trim();
        const orderPhone = document.getElementById('orderPhone').value.trim();
        const orderAddress = document.getElementById('orderAddress').value.trim();
        const orderComment = document.getElementById('orderComment').value.trim();
        const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked')?.value || 'card';
        
        if (!orderName || !orderPhone || !orderAddress) {
            alert('Заполните все обязательные поля');
            return;
        }
        
        const btn = document.getElementById('submitOrderBtn');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<div class="loading-spinner"></div> Оформление...';
        btn.disabled = true;
        
        try {
            // ===== 1. ГРУППИРУЕМ ТОВАРЫ ПО ПРОДАВЦАМ =====
            const itemsBySeller = {};
            selectedItems.forEach(item => {
                const sellerId = item.partnerId || 'unknown';
                if (!itemsBySeller[sellerId]) {
                    itemsBySeller[sellerId] = {
                        sellerId: sellerId,
                        sellerName: item.partnerName || 'Продавец',
                        items: [],
                        total: 0
                    };
                }
                itemsBySeller[sellerId].items.push(item);
                itemsBySeller[sellerId].total += (item.price || 0) * (item.quantity || 1);
            });
            
            // ===== 2. ПРОВЕРЯЕМ НАЛИЧИЕ ТОВАРОВ =====
            for (const [sellerId, group] of Object.entries(itemsBySeller)) {
                for (const item of group.items) {
                    const productRef = doc(db, "products", item.id);
                    const productDoc = await getDoc(productRef);
                    
                    if (!productDoc.exists()) {
                        throw new Error(`Товар "${item.name}" больше не доступен`);
                    }
                    
                    const productData = productDoc.data();
                    const currentStock = productData.stock || 0;
                    const requestedQuantity = item.quantity || 1;
                    
                    if (currentStock < requestedQuantity) {
                        throw new Error(`Товара "${item.name}" осталось только ${currentStock} шт, а вы заказали ${requestedQuantity}`);
                    }
                }
            }
            
            // ===== 3. УМЕНЬШАЕМ STOCK ДЛЯ КАЖДОГО ТОВАРА =====
            for (const [sellerId, group] of Object.entries(itemsBySeller)) {
                for (const item of group.items) {
                    const productRef = doc(db, "products", item.id);
                    const productDoc = await getDoc(productRef);
                    const currentStock = productDoc.data().stock || 0;
                    const newStock = currentStock - (item.quantity || 1);
                    
                    await updateDoc(productRef, {
                        stock: newStock
                    });
                    
                    if (newStock === 0) {
                        await updateDoc(productRef, {
                            outOfStock: true
                        });
                    }
                }
            }
            
            // ===== 4. УДАЛЯЕМ ТОВАРЫ ИЗ КОРЗИНЫ =====
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const selectedIds = selectedItems.map(i => i.id);
            cart = cart.filter(i => !selectedIds.includes(i.id));
            localStorage.setItem('cart', JSON.stringify(cart));
            
            // ===== 5. СОЗДАЁМ ОТДЕЛЬНЫЙ ЗАКАЗ ДЛЯ КАЖДОГО ПРОДАВЦА =====
            const createdOrders = [];
            let totalAll = 0;

            for (const [sellerId, group] of Object.entries(itemsBySeller)) {
                const orderItems = group.items.map(item => ({
                    productId: item.id,
                    productName: item.name,
                    price: item.price,
                    quantity: item.quantity || 1,
                    totalPrice: item.price * (item.quantity || 1),
                    partnerId: sellerId,
                    partnerName: group.sellerName,
                    image: item.image || null
                }));
                
                totalAll += group.total;
                
                // ===== ОПРЕДЕЛЯЕМ СТАТУС В ЗАВИСИМОСТИ ОТ СПОСОБА ОПЛАТЫ =====
                let orderStatus = 'pending';
                if (paymentMethod === 'card') {
                    orderStatus = 'paid';  // Карта — сразу оплачено
                } else {
                    orderStatus = 'pending';  // Баланс — ожидает подтверждения
                }
                
                const orderData = {
                    userId: currentUser.uid,
                    userName: orderName,
                    userPhone: orderPhone,
                    userAddress: orderAddress,
                    userComment: orderComment,
                    items: orderItems,
                    partnerId: sellerId,           // ← ЭТО ГЛАВНОЕ!
                    partnerName: group.sellerName,
                    totalPrice: group.total,
                    commission: Math.floor(group.total * 0.1),
                    paymentMethod: paymentMethod,
                    type: 'physical',
                    status: orderStatus,           // ← ИСПОЛЬЗУЕМ ПЕРЕМЕННУЮ
                    createdAt: serverTimestamp()
                };
                
                const orderRef = await addDoc(collection(db, "physical_orders"), orderData);
                createdOrders.push({ id: orderRef.id, sellerId, total: group.total });
            }
            
            // ===== 6. ОПЛАТА (если с баланса) =====
            if (paymentMethod === 'balance') {
                const { hasSufficientBalance, deductFunds, holdFunds } = await import('./wallet.js');
                
                const hasBalance = await hasSufficientBalance(currentUser.uid, totalAll);
                if (!hasBalance) {
                    alert('❌ Недостаточно средств на балансе. Пополните баланс или выберите оплату картой.');
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    // Возвращаем товары в корзину
                    const cartRestore = JSON.parse(localStorage.getItem('cart') || '[]');
                    selectedItems.forEach(item => {
                        for (let i = 0; i < (item.quantity || 1); i++) {
                            cartRestore.push({ ...item, quantity: 1 });
                        }
                    });
                    localStorage.setItem('cart', JSON.stringify(cartRestore));
                    loadCart();
                    return;
                }
                
                // Замораживаем средства по каждому заказу
                for (const order of createdOrders) {
                    await holdFunds(currentUser.uid, order.total, order.id);
                    await deductFunds(currentUser.uid, order.total, order.id);
                }
                
                alert(`✅ Заказы оформлены! Средства заморожены до получения товара.\nСоздано заказов: ${createdOrders.length}`);
                
            } else {
                alert(`✅ Заказы оформлены! Продавцы скоро свяжутся с вами.\nСоздано заказов: ${createdOrders.length}`);
            }
            
            modal.style.display = 'none';
            document.body.style.overflow = '';
            loadCart();
            
        } catch (err) {
            console.error('Ошибка:', err);
            alert(`❌ ${err.message || 'Ошибка при оформлении заказа'}`);
        } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    });

    document.getElementById('backBtn')?.addEventListener('click', () => {
        window.history.back();
    });

    onAuthStateChanged(auth, async (user) => {
        currentUser = user;
        if (user) {
            const userDoc = await getDoc(doc(db, "fighters", user.uid));
            currentUserData = userDoc.data();
            setTimeout(updateHeaderBalance, 1000);
        } else {
            const balanceDiv = document.getElementById('balanceIndicator');
            if (balanceDiv) balanceDiv.style.display = 'none';
        }
        loadCart();
    });

    const plusBtn = document.getElementById('balancePlusBtn');
    if (plusBtn) plusBtn.onclick = () => window.location.href = 'shop.html';

    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');
    if (menuToggle && navLinks) {
        menuToggle.addEventListener('click', () => {
            navLinks.classList.toggle('show');
        });
        
        navLinks.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                navLinks.classList.remove('show');
            });
        });
    }
</script>
</body>
