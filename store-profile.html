<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PRORANK">
    <meta name="theme-color" content="#fbbf24">
    <meta name="mobile-web-app-capable" content="yes">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#fbbf24">
    <meta name="description" content="Магазин на PRORANK">
    <title>Магазин | PRORANK</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(ellipse at 30% 40%, rgba(251, 191, 36, 0.15) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 80%, rgba(251, 191, 36, 0.08) 0%, transparent 50%),
                        linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 40%, #1a1a1a 100%);
            background-attachment: fixed;
            color: #fff;
            line-height: 1.4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        main { flex: 1; }
        
        .gold-top { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 3px; 
            background: linear-gradient(90deg, #fbbf24, #ffdd88, #fbbf24, #b8860b); 
            z-index: 1001; 
        }
        
        .container { 
            max-width: 1000px; 
            margin: 0 auto; 
            padding: 0 24px; 
            position: relative; 
            z-index: 2;
            width: 100%;
        }
        
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(251, 191, 36, 0.25);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        
        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            cursor: pointer;
            background: linear-gradient(135deg, #ffffff, #fbbf24);
            background-clip: text;
            color: transparent;
            transition: transform 0.2s ease;
        }
        
        .logo:hover { transform: scale(1.02); }
        .logo span { background: linear-gradient(135deg, #fbbf24, #ffdd77); background-clip: text; color: transparent; }
        
        .balance-indicator {
            background: #111;
            border: 1px solid rgba(251,191,36,0.5);
            border-radius: 60px;
            padding: 7px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 0.9rem;
        }
        
        .balance-count { color: #fbbf24; }
        
        .balance-plus {
            background: rgba(251,191,36,0.15);
            border: none;
            color: #fbbf24;
            cursor: pointer;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            transition: all 0.2s ease;
        }
        
        .balance-plus:hover {
            background: rgba(251,191,36,0.3);
            transform: scale(1.05);
        }
        
        .balance-plus:active { 
            background: #fbbf24; 
            color: #000;
            transform: scale(0.95);
        }
        
        .menu-toggle { 
            display: none; 
            background: rgba(251,191,36,0.1); 
            border: 1px solid #fbbf24; 
            color: #fbbf24; 
            font-size: 1.6rem; 
            cursor: pointer; 
            padding: 8px 14px; 
            border-radius: 12px;
            transition: all 0.2s ease;
            min-height: 44px;
            min-width: 44px;
        }
        
        .menu-toggle:hover {
            background: rgba(251,191,36,0.2);
            transform: scale(1.02);
        }
        
        .menu-toggle:active { transform: scale(0.95); }
        
        .nav-links {
            display: flex;
            gap: 6px;
            background: rgba(15,15,15,0.7);
            backdrop-filter: blur(12px);
            padding: 5px 14px;
            border-radius: 60px;
            border: 1px solid rgba(251,191,36,0.2);
        }
        
        .nav-links a { 
            color: #ddd; 
            text-decoration: none; 
            font-size: 0.9rem; 
            font-weight: 500; 
            padding: 8px 18px; 
            border-radius: 40px; 
            transition: all 0.2s ease;
        }
        
        .nav-links a i { margin-right: 8px; color: #fbbf24; }
        .nav-links a:hover { color: #fbbf24; background: rgba(251,191,36,0.1); }
        
        /* ===== ХЛЕБНЫЕ КРОШКИ ===== */
        .breadcrumb {
            margin: 20px 0 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 0.85rem;
        }
        
        .breadcrumb a {
            color: #aaa;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        
        .breadcrumb a:hover { color: #fbbf24; transform: translateX(2px); }
        .breadcrumb .current { color: #fbbf24; }
        .breadcrumb .separator { color: #444; }
        
        .back-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(251,191,36,0.3);
            color: #fff;
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            min-height: 38px;
            font-family: 'Inter', sans-serif;
        }
        
        .back-btn:hover {
            background: rgba(251,191,36,0.2);
            color: #fbbf24;
            transform: translateX(-2px);
        }
        
        .back-btn:active { transform: translateX(-1px) scale(0.97); }
        
        /* ===== ПРОФИЛЬ МАГАЗИНА ===== */
        .store-profile {
            margin: 16px 0 24px;
        }
        
        .store-header {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 24px;
            background: rgba(15,15,15,0.5);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            border: 1px solid rgba(251,191,36,0.08);
            flex-wrap: wrap;
            transition: all 0.3s ease;
        }
        
        .store-header:hover {
            border-color: rgba(251,191,36,0.15);
        }
        
        .store-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(251,191,36,0.2);
            background: #1a1a1a;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            transition: all 0.3s ease;
        }
        
        .store-avatar:hover {
            transform: scale(1.02);
            border-color: #fbbf24;
        }
        
        .store-info {
            flex: 1;
            min-width: 0;
        }
        
        .store-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .store-name i {
            color: #fbbf24;
            font-size: 0.9rem;
        }
        
        .store-status {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.6rem;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 20px;
            background: rgba(34,197,94,0.15);
            color: #22c55e;
            border: 1px solid rgba(34,197,94,0.2);
        }
        
        .store-status i { font-size: 0.4rem; }
        .store-status.offline {
            background: rgba(239,68,68,0.15);
            color: #ef4444;
            border-color: rgba(239,68,68,0.2);
        }
        
        .store-meta {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 6px;
            font-size: 0.8rem;
            color: #888;
        }
        
        .store-meta i {
            color: #fbbf24;
            margin-right: 4px;
        }
        
        .store-meta a {
            color: #fbbf24;
            text-decoration: none;
        }
        
        .store-meta a:hover {
            text-decoration: underline;
        }
        
        .store-desc {
            margin-top: 8px;
            color: #aaa;
            font-size: 0.85rem;
            line-height: 1.5;
        }
        
        .store-stats {
            display: flex;
            gap: 24px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        
        .store-stat {
            text-align: center;
            background: rgba(255,255,255,0.03);
            padding: 4px 12px;
            border-radius: 12px;
        }
        
        .store-stat .stat-number {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fbbf24;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .store-stat .stat-label {
            font-size: 0.6rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .store-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .store-actions .btn {
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            min-height: 38px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .store-actions .btn:hover {
            transform: translateY(-2px);
        }
        
        .btn-gold {
            background: #fbbf24;
            color: #000;
        }
        
        .btn-gold:hover {
            background: #ffdd44;
            box-shadow: 0 4px 20px rgba(251,191,36,0.3);
        }
        
        .btn-outline {
            background: rgba(255,255,255,0.05);
            color: #aaa;
            border: 1px solid rgba(255,255,255,0.08);
        }
        
        .btn-outline:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        
        .btn-subscribe {
            background: rgba(59,130,246,0.12);
            color: #60a5fa;
            border: 1px solid rgba(59,130,246,0.15);
        }
        
        .btn-subscribe:hover {
            background: rgba(59,130,246,0.2);
            box-shadow: 0 4px 15px rgba(59,130,246,0.1);
        }
        
        .btn-subscribe.subscribed {
            background: rgba(16,185,129,0.12);
            color: #34d399;
            border-color: rgba(16,185,129,0.2);
        }
        
        .btn-subscribe.subscribed:hover {
            background: rgba(16,185,129,0.2);
        }
        
        /* ===== ТОВАРЫ ===== */
        .store-products {
            margin-top: 24px;
        }
        
        .store-products-title {
            font-size: 1rem;
            font-weight: 600;
            color: #888;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .store-products-title span {
            color: #fbbf24;
        }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }
        
        .product-card {
            background: rgba(15,15,15,0.5);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 12px;
            border: 1px solid rgba(251,191,36,0.06);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        
        .product-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, transparent 80%, rgba(251,191,36,0.03));
            pointer-events: none;
        }
        
        .product-card:hover {
            border-color: rgba(251,191,36,0.2);
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }
        
        .product-card .product-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            object-fit: cover;
            background: #1a1a1a;
            margin-bottom: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .product-card:hover .product-image {
            transform: scale(1.02);
        }
        
        .product-card .product-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: #eee;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 40px;
        }
        
        .product-card .product-price {
            font-weight: 700;
            color: #fbbf24;
            font-size: 0.95rem;
            margin-top: 4px;
        }
        
        .product-card .product-rating {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.65rem;
            color: #fbbf24;
            margin-top: 4px;
        }
        
        .product-card .product-rating .stars {
            letter-spacing: 1px;
        }
        
        .product-card .product-rating .stars .empty {
            color: #333;
        }
        
        .product-card .product-rating .count {
            color: #666;
            font-size: 0.6rem;
        }
        
        .product-card .product-actions {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }
        
        .product-card .product-actions .btn {
            flex: 1;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-height: 32px;
        }
        
        .product-card .product-actions .btn:hover {
            transform: translateY(-1px);
        }
        
        .product-card .product-actions .btn-buy {
            background: #fbbf24;
            color: #000;
        }
        
        .product-card .product-actions .btn-buy:hover {
            background: #ffdd44;
            box-shadow: 0 4px 15px rgba(251,191,36,0.2);
        }
        
        .product-card .product-actions .btn-cart {
            background: rgba(255,255,255,0.05);
            color: #aaa;
            border: 1px solid rgba(255,255,255,0.06);
        }
        
        .product-card .product-actions .btn-cart:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        
        /* ===== ОТЗЫВЫ ===== */
        .store-reviews {
            margin-top: 24px;
        }
        
        .store-reviews-title {
            font-size: 1rem;
            font-weight: 600;
            color: #888;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .store-reviews-title span {
            color: #fbbf24;
        }
        
        .reviews-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .review-card {
            background: rgba(15,15,15,0.3);
            border-radius: 12px;
            padding: 14px 16px;
            border: 1px solid rgba(251,191,36,0.05);
            transition: all 0.2s ease;
        }
        
        .review-card:hover {
            border-color: rgba(251,191,36,0.1);
        }
        
        .review-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }
        
        .review-author {
            font-weight: 600;
            color: #eee;
            font-size: 0.85rem;
        }
        
        .review-stars {
            color: #fbbf24;
            font-size: 0.7rem;
            letter-spacing: 1px;
        }
        
        .review-stars .empty {
            color: #333;
        }
        
        .review-date {
            font-size: 0.6rem;
            color: #555;
            margin-left: auto;
        }
        
        .review-text {
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 4px;
            line-height: 1.5;
        }
        
        .review-empty {
            text-align: center;
            padding: 30px 20px;
            color: #666;
        }
        
        .review-empty i {
            font-size: 2rem;
            color: #2a2a2a;
            margin-bottom: 8px;
            display: block;
        }
        
        .review-empty .btn {
            margin-top: 12px;
        }
        
        /* ===== ПУСТО ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }
        
        .empty-state i {
            font-size: 3rem;
            color: #2a2a2a;
            margin-bottom: 16px;
        }
        
        .empty-state h3 {
            color: #ccc;
            margin-bottom: 6px;
        }
        
        .empty-state p {
            color: #666;
        }
        
        /* ===== PREVIEW MODE (СКРЫВАЕМ КНОПКИ) ===== */
        body.preview-mode .store-actions .btn {
            pointer-events: none;
            opacity: 0.5;
        }
        
        body.preview-mode .product-actions .btn {
            pointer-events: none;
            opacity: 0.5;
        }
        
        body.preview-mode .preview-badge {
            display: inline-flex !important;
        }
        
        .preview-badge {
            display: none;
            align-items: center;
            gap: 4px;
            font-size: 0.55rem;
            font-weight: 600;
            color: #fbbf24;
            background: rgba(251,191,36,0.1);
            padding: 2px 10px;
            border-radius: 20px;
            border: 1px solid rgba(251,191,36,0.15);
        }
        
        /* ===== АДАПТИВ ===== */
        @media (max-width: 768px) {
            .navbar { padding: 12px 18px; }
            .menu-toggle { display: block; }
            .nav-links { 
                display: none; 
                flex-direction: column; 
                position: absolute; 
                top: 68px; 
                left: 18px; 
                right: 18px; 
                background: #0f0f0f; 
                border-radius: 24px; 
                padding: 20px; 
                gap: 10px; 
                border: 1px solid rgba(251,191,36,0.3); 
                z-index: 1000; 
                backdrop-filter: blur(20px);
            }
            .nav-links.show { display: flex; animation: fadeIn 0.2s ease; }
            .nav-links a { width: 100%; text-align: center; padding: 12px; }
            .container { padding: 0 16px; }
            
            .store-header {
                flex-direction: column;
                text-align: center;
            }
            
            .store-actions {
                justify-content: center;
                width: 100%;
            }
            
            .products-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            
            .breadcrumb {
                justify-content: center;
            }
            
            .product-card .product-actions {
                flex-direction: column;
            }
        }
        
        @media (max-width: 480px) {
            .products-grid {
                gap: 8px;
            }
            .product-card .product-name {
                font-size: 0.7rem;
                min-height: 32px;
            }
            .product-card .product-price {
                font-size: 0.75rem;
            }
            .product-card .product-actions .btn {
                font-size: 0.6rem;
                padding: 4px 8px;
                min-height: 28px;
            }
            .store-avatar {
                width: 60px;
                height: 60px;
                font-size: 2rem;
            }
            .store-stats {
                gap: 12px;
            }
            .store-stat .stat-number {
                font-size: 1rem;
            }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #fbbf24; border-radius: 10px; }
        
        .loading-spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 2px solid rgba(251,191,36,0.3);
            border-top-color: #fbbf24;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .toast-notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(12px);
            color: #fff;
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.85rem;
            border: 1px solid rgba(251,191,36,0.2);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            z-index: 9999;
            animation: slideUp 0.3s ease;
            display: none;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    </style>
</head>
<body>
    <div class="gold-top"></div>

    <header class="navbar">
        <div class="logo" onclick="window.location='index.html'">PRO<span>RANK</span></div>
        <div class="balance-indicator" id="balanceIndicator" style="display: none;">
            <i class="fas fa-crosshairs"></i>
            <span class="balance-count" id="headerChallengesCount">0</span>
            <button class="balance-plus" id="balancePlusBtn">+</button>
        </div>
        <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
        <nav class="nav-links" id="navLinks"></nav>
    </header>

    <main class="container">
        <!-- ХЛЕБНЫЕ КРОШКИ -->
        <div class="breadcrumb">
            <button class="back-btn" id="backBtn"><i class="fas fa-arrow-left"></i> Назад</button>
            <span class="separator">/</span>
            <a href="catalog.html">Каталог</a>
            <span class="separator">/</span>
            <span class="current" id="storeNameBreadcrumb">Магазин</span>
        </div>

        <!-- ПРОФИЛЬ МАГАЗИНА -->
        <div class="store-profile" id="storeProfile">
            <div id="storeLoading" style="text-align:center;padding:40px;">
                <div class="loading-spinner"></div>
                <p style="margin-top:12px;color:#666;">Загрузка магазина...</p>

            <div id="storeContent" style="display:none;">
                <div class="store-header" id="storeHeader"></div>
                
                <!-- Товары -->
                <div class="store-products" id="storeProductsSection">
                    <div class="store-products-title"><i class="fas fa-box"></i> Товары <span id="productsCount">(0)</span></div>
                    <div class="products-grid" id="productsGrid"></div>
                </div>
                
                <!-- Отзывы -->
                <div class="store-reviews" id="storeReviewsSection">
                    <div class="store-reviews-title"><i class="fas fa-star"></i> Отзывы <span id="reviewsCount">(0)</span></div>
                    <div class="reviews-grid" id="reviewsGrid"></div>
                </div>
            </div>
            <div id="storeNotFound" style="display:none;text-align:center;padding:60px 20px;color:#888;">
                <i class="fas fa-store-slash" style="font-size:3rem;color:#2a2a2a;margin-bottom:16px;display:block;"></i>
                <h3 style="color:#ccc;">Магазин не найден</h3>
                <p style="color:#666;">Возможно, магазин был удалён или ещё не создан</p>
                <a href="catalog.html" style="display:inline-block;margin-top:16px;color:#fbbf24;text-decoration:none;padding:10px 28px;border-radius:40px;background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.15);">Вернуться в каталог</a>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="container">
            <div class="footer-inner">
                <div class="footer-logo">
                    <div class="logo">PRO<span>RANK</span></div>
                    <p style="font-size:0.65rem;color:#777;margin-top:4px;">Рейтинг спортсменов-любителей</p>
                </div>
                <div class="footer-social">
                    <a href="#" target="_blank" class="social-icon"><i class="fab fa-telegram"></i></a>
                    <a href="#" target="_blank" class="social-icon"><i class="fab fa-vk"></i></a>
                    <a href="#" target="_blank" class="social-icon"><i class="fab fa-youtube"></i></a>
                    <a href="#" target="_blank" class="social-icon"><i class="fab fa-instagram"></i></a>
                </div>
                <div class="footer-links">
                    <a href="about.html">О проекте</a>
                    <a href="privacy.html">Конфиденциальность</a>
                    <a href="disclaimer.html">Дисклеймер</a>
                </div>
            </div>
            <div class="footer-bottom">
                <p style="text-align:center;padding-top:16px;border-top:1px solid rgba(255,255,255,0.05);font-size:0.6rem;color:#555;">© 2026 PRORANK. Все права защищены.</p>
            </div>
        </div>
    </footer>

    <div id="mobileBottomNavContainer"></div>

    <div class="toast-notification" id="toastNotification"></div>

    <div id="errorContainer" style="position: fixed; top: 15px; left: 50%; transform: translateX(-50%); z-index: 9999; max-width: 90%; width: 480px; padding: 14px 20px; border-radius: 16px; font-weight: 600; font-size: 0.9rem; animation: slideDown 0.3s ease; box-shadow: 0 10px 30px rgba(0,0,0,0.4); backdrop-filter: blur(8px); display: none; text-align: center; border: 1px solid rgba(255,255,255,0.1);"></div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js"
            }
        }
    </script>
    <script type="module" src="header.js"></script>
    <script type="module">
    import { initializeApp } from "firebase/app";
    import { getFirestore, collection, getDocs, query, where, doc, getDoc, setDoc, updateDoc, arrayUnion, arrayRemove } from "firebase/firestore";
    import { getAuth, onAuthStateChanged } from "firebase/auth";

    const firebaseConfig = {
        apiKey: "AIzaSyDUGYJY7pX7q02MS5SACMIIQXpjpQ97mPw",
        authDomain: "proranklive.firebaseapp.com",
        projectId: "proranklive",
        storageBucket: "proranklive.firebasestorage.app",
        messagingSenderId: "716836144015",
        appId: "1:716836144015:web:f1575147750608d0f881fa"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUser = null;
    let partnerId = null;
    let partnerData = null;
    let products = [];
    let reviews = [];
    let isSubscribed = false;
    let isPreviewMode = false;

    function showNotification(message, type = 'info') {
        const container = document.getElementById('errorContainer');
        if (!container) return;
        const colors = { success: '#22c55e', error: '#ef4444', warning: '#f59e0b', info: '#fbbf24' };
        container.style.display = 'block';
        container.style.background = colors[type] || colors.info;
        container.style.color = '#000';
        container.textContent = message;
        clearTimeout(container._timeout);
        container._timeout = setTimeout(() => { container.style.display = 'none'; }, 4000);
    }

    function showToast(message) {
        const toast = document.getElementById('toastNotification');
        if (!toast) return;
        toast.textContent = message;
        toast.style.display = 'block';
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
    }

    function generateStars(rating) {
        const full = Math.floor(rating);
        const hasHalf = rating % 1 >= 0.5;
        let html = '';
        for (let i = 0; i < 5; i++) {
            if (i < full) html += '<i class="fas fa-star"></i>';
            else if (i === full && hasHalf) html += '<i class="fas fa-star-half-alt"></i>';
            else html += '<i class="far fa-star empty"></i>';
        }
        return html;
    }

    // ===== ПРОВЕРКА РЕЖИМА ПРЕВЬЮ =====
    function checkPreviewMode() {
        const params = new URLSearchParams(window.location.search);
        isPreviewMode = params.get('mode') === 'preview';
        
        if (isPreviewMode) {
            document.body.classList.add('preview-mode');
        }
    }

    // ===== ЗАГРУЗКА ДАННЫХ МАГАЗИНА =====
    async function loadStore(storeId) {
        const loadingEl = document.getElementById('storeLoading');
        const contentEl = document.getElementById('storeContent');
        const notFoundEl = document.getElementById('storeNotFound');

        if (!loadingEl || !contentEl || !notFoundEl) return;

        try {
            const partnerRef = doc(db, "partners", storeId);
            const partnerSnap = await getDoc(partnerRef);

            if (!partnerSnap.exists()) {
                loadingEl.style.display = 'none';
                notFoundEl.style.display = 'block';
                return;
            }

            partnerData = { id: storeId, ...partnerSnap.data() };
            
            // Обновляем хлебные крошки
            const breadcrumbName = document.getElementById('storeNameBreadcrumb');
            if (breadcrumbName) breadcrumbName.textContent = partnerData.name || 'Магазин';
            
            // Загружаем товары
            const productsSnap = await getDocs(query(collection(db, "products"), where("partnerId", "==", storeId)));
            products = productsSnap.docs.map(d => ({ id: d.id, ...d.data() }));

            // Загружаем отзывы
            const reviewsSnap = await getDocs(query(collection(db, "reviews"), where("partnerId", "==", storeId)));
            reviews = reviewsSnap.docs.map(d => ({ id: d.id, ...d.data() }));

            let ratingSum = 0;
            reviews.forEach(r => ratingSum += (r.rating || 5));
            const avgRating = reviews.length ? (ratingSum / reviews.length) : 0;

            // Проверяем подписку
            if (currentUser) {
                const userDoc = await getDoc(doc(db, "fighters", currentUser.uid));
                const userData = userDoc.data();
                isSubscribed = userData?.subscribedTo?.includes(storeId) || false;
            }

            renderStore(partnerData, products, avgRating, reviews.length);

            loadingEl.style.display = 'none';
            contentEl.style.display = 'block';
            notFoundEl.style.display = 'none';

            // Увеличиваем счётчик просмотров (только не в режиме превью)
            if (!isPreviewMode) {
                await updateDoc(partnerRef, {
                    views: (partnerData.views || 0) + 1
                });
            }

        } catch (err) {
            console.error('Ошибка загрузки магазина:', err);
            loadingEl.style.display = 'none';
            notFoundEl.style.display = 'block';
        }
    }

    // ===== ОТРИСОВКА МАГАЗИНА =====
    function renderStore(data, products, rating, reviewsCount) {
        const header = document.getElementById('storeHeader');
        const grid = document.getElementById('productsGrid');
        const countEl = document.getElementById('productsCount');
        const reviewsGrid = document.getElementById('reviewsGrid');
        const reviewsCountEl = document.getElementById('reviewsCount');
        
        if (!header || !grid || !countEl) return;

        const logoHtml = data.logo 
            ? `<img src="${data.logo}" class="store-avatar" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">`
            : `<div class="store-avatar"><i class="fas fa-store"></i></div>`;

        const statusClass = data.isOnline !== false ? 'online' : 'offline';
        const statusIcon = data.isOnline !== false ? 'fa-circle' : 'fa-circle';
        const statusText = data.isOnline !== false ? 'Онлайн' : 'Офлайн';

        const starsHtml = generateStars(rating);

        header.innerHTML = `
            ${logoHtml}
            <div class="store-info">
                <div class="store-name">
                    ${escapeHtml(data.name || 'Магазин')} 
                    <i class="fas fa-store"></i>
                    <span class="store-status ${statusClass}">
                        <i class="fas ${statusIcon}"></i> ${statusText}
                    </span>
                    <span class="preview-badge">
                        <i class="fas fa-eye"></i> Режим просмотра
                    </span>
                </div>
                <div class="store-meta">
                    ${data.url ? `<span><i class="fas fa-link"></i> <a href="${data.url}" target="_blank">${data.url}</a></span>` : ''}
                    ${data.phone ? `<span><i class="fas fa-phone"></i> ${escapeHtml(data.phone)}</span>` : ''}
                    <span><i class="fas fa-calendar-alt"></i> На рынке с ${data.createdAt ? new Date(data.createdAt.seconds * 1000).getFullYear() : '2024'}</span>
                </div>
                <div class="store-desc">${escapeHtml(data.description || 'Нет описания')}</div>
                <div class="store-stats">
                    <div class="store-stat">
                        <div class="stat-number">${products.length}</div>
                        <div class="stat-label">Товаров</div>
                    </div>
                    <div class="store-stat">
                        <div class="stat-number" style="display:flex;align-items:center;gap:4px;">
                            ${rating > 0 ? rating.toFixed(1) : '0.0'}
                            <span style="font-size:0.7rem;color:#fbbf24;">${starsHtml}</span>
                        </div>
                        <div class="stat-label">Рейтинг</div>
                    </div>
                    <div class="store-stat">
                        <div class="stat-number">${reviewsCount}</div>
                        <div class="stat-label">Отзывов</div>
                    </div>
                    <div class="store-stat">
                        <div class="stat-number">${data.views || 0}</div>
                        <div class="stat-label">👁 Просмотров</div>
                    </div>
                </div>
            </div>
            <div class="store-actions">
                <button class="btn btn-gold" id="chatBtn"><i class="fas fa-comment"></i> Написать</button>
                <button class="btn ${isSubscribed ? 'btn-subscribe subscribed' : 'btn-subscribe'}" id="subscribeBtn">
                    <i class="fas ${isSubscribed ? 'fa-bell' : 'fa-bell-slash'}"></i> 
                    ${isSubscribed ? 'Подписан' : 'Подписаться'}
                </button>
            </div>
        `;

        // Чат
        const chatBtn = document.getElementById('chatBtn');
        if (chatBtn) {
            chatBtn.addEventListener('click', async () => {
                if (isPreviewMode) {
                    showToast('🔍 Режим просмотра — действие недоступно');
                    return;
                }
                if (!currentUser) {
                    showNotification('Войдите в аккаунт для чата', 'warning');
                    setTimeout(() => window.location.href = 'login.html', 1000);
                    return;
                }
                await findOrCreateChat(data.id);
            });
        }

        // Подписка
        const subscribeBtn = document.getElementById('subscribeBtn');
        if (subscribeBtn) {
            subscribeBtn.addEventListener('click', async () => {
                if (isPreviewMode) {
                    showToast('🔍 Режим просмотра — действие недоступно');
                    return;
                }
                await toggleSubscribe();
            });
        }

        // Товары
        countEl.textContent = `(${products.length})`;

        if (products.length === 0) {
            grid.innerHTML = `
                <div class="empty-state" style="grid-column:1/-1;">
                    <i class="fas fa-box-open"></i>
                    <h3>Нет товаров</h3>
                    <p>В этом магазине пока нет товаров</p>
                </div>
            `;
        } else {
            let html = '';
            products.forEach(product => {
                const image = product.image || 'https://placehold.co/300x200/1a1a1a/fbbf24?text=No+Image';
                const productRating = product.rating || 0;
                const productStars = generateStars(productRating);
                
                html += `
                    <div class="product-card" data-product-id="${product.id}">
                        <img src="${image}" class="product-image" loading="lazy" onclick="viewProduct('${product.id}')" onerror="this.src='https://placehold.co/300x200/1a1a1a/fbbf24?text=No+Image'">
                        <div class="product-name">${escapeHtml(product.name)}</div>
                        <div class="product-price">${(product.price || 0).toLocaleString()} ₽</div>
                        ${productRating > 0 ? `
                            <div class="product-rating">
                                <span class="stars">${productStars}</span>
                                <span class="count">(${product.reviewsCount || 0})</span>
                            </div>
                        ` : `
                            <div class="product-rating" style="color:#555;">
                                <span>Нет отзывов</span>
                            </div>
                        `}
                        <div class="product-actions">
                            <button class="btn btn-buy" onclick="buyProduct('${product.id}')">
                                <i class="fas fa-bolt"></i> Купить
                            </button>
                            <button class="btn btn-cart" onclick="addToCart('${product.id}')">
                                <i class="fas fa-cart-plus"></i> В корзину
                            </button>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        // Отзывы
        if (reviewsCountEl) reviewsCountEl.textContent = `(${reviews.length})`;

        if (!reviewsGrid) return;

        if (reviews.length === 0) {
            reviewsGrid.innerHTML = `
                <div class="review-empty">
                    <i class="fas fa-comment-slash"></i>
                    <p>Нет отзывов</p>
                    ${!isPreviewMode ? `
                        <button class="btn btn-gold" style="margin-top:12px;padding:6px 16px;font-size:0.7rem;" onclick="showReviewForm()">
                            <i class="fas fa-pen"></i> Написать отзыв
                        </button>
                    ` : ''}
                </div>
            `;
        } else {
            let html = '';
            reviews.slice(0, 5).forEach(review => {
                const stars = generateStars(review.rating || 5);
                const date = review.createdAt ? new Date(review.createdAt.seconds * 1000).toLocaleDateString('ru') : '';
                html += `
                    <div class="review-card">
                        <div class="review-header">
                            <span class="review-author">${escapeHtml(review.authorName || 'Пользователь')}</span>
                            <span class="review-stars">${stars}</span>
                            <span class="review-date">${date}</span>
                        </div>
                        <div class="review-text">${escapeHtml(review.text || '')}</div>
                    </div>
                `;
            });
            
            if (reviews.length > 5) {
                html += `
                    <div class="review-card" style="text-align:center;cursor:pointer;" onclick="showAllReviews()">
                        <span style="color:#fbbf24;">Показать все ${reviews.length} отзывов →</span>
                    </div>
                `;
            }
            
            if (!isPreviewMode) {
                html += `
                    <div style="text-align:center;margin-top:8px;">
                        <button class="btn btn-gold" style="padding:6px 16px;font-size:0.7rem;" onclick="showReviewForm()">
                            <i class="fas fa-pen"></i> Написать отзыв
                        </button>
                    </div>
                `;
            }
            
            reviewsGrid.innerHTML = html;
        }
    }

    // ===== ПОДПИСКА =====
    async function toggleSubscribe() {
        if (!currentUser) {
            showNotification('Войдите в аккаунт', 'warning');
            setTimeout(() => window.location.href = 'login.html', 1000);
            return;
        }

        try {
            const userRef = doc(db, "fighters", currentUser.uid);
            const userDoc = await getDoc(userRef);
            const userData = userDoc.data();
            const subscribedTo = userData?.subscribedTo || [];

            if (isSubscribed) {
                await updateDoc(userRef, {
                    subscribedTo: arrayRemove(partnerId)
                });
                isSubscribed = false;
                showToast('❌ Вы отписались от магазина');
            } else {
                await updateDoc(userRef, {
                    subscribedTo: arrayUnion(partnerId)
                });
                isSubscribed = true;
                showToast('✅ Вы подписались на магазин');
            }

            const subscribeBtn = document.getElementById('subscribeBtn');
            if (subscribeBtn) {
                subscribeBtn.innerHTML = `<i class="fas ${isSubscribed ? 'fa-bell' : 'fa-bell-slash'}"></i> ${isSubscribed ? 'Подписан' : 'Подписаться'}`;
                subscribeBtn.classList.toggle('subscribed', isSubscribed);
            }

        } catch (err) {
            console.error('Ошибка подписки:', err);
            showNotification('Ошибка подписки', 'error');
        }
    }

    // ===== ЧАТ =====
    async function findOrCreateChat(sellerId) {
        try {
            const chatsQuery = query(
                collection(db, "chats"),
                where("participants", "array-contains", currentUser.uid)
            );
            const chatsSnap = await getDocs(chatsQuery);
            
            for (const docSnap of chatsSnap.docs) {
                const chat = docSnap.data();
                if (chat.participants.includes(sellerId)) {
                    window.location.href = `chat.html?id=${docSnap.id}`;
                    return;
                }
            }

            const newChatRef = doc(collection(db, "chats"));
            await setDoc(newChatRef, {
                participants: [currentUser.uid, sellerId],
                createdAt: new Date(),
                lastMessage: '',
                lastMessageTime: null,
                lastMessageAuthor: null,
                unreadCounts: {},
                pinned: {}
            });
            window.location.href = `chat.html?id=${newChatRef.id}`;
        } catch (err) {
            console.error('Ошибка создания чата:', err);
            showNotification('Не удалось открыть чат', 'error');
        }
    }

    // ===== ФУНКЦИИ ДЛЯ ТОВАРОВ =====
    window.viewProduct = function(productId) {
        showToast('📦 Просмотр товара (в разработке)');
    };

    window.buyProduct = function(productId) {
        if (isPreviewMode) {
            showToast('🔍 Режим просмотра — покупка недоступна');
            return;
        }
        if (!currentUser) {
            showNotification('Войдите в аккаунт', 'warning');
            setTimeout(() => window.location.href = 'login.html', 1000);
            return;
        }
        showToast('💳 Оформление заказа (в разработке)');
    };

    window.addToCart = function(productId) {
        if (isPreviewMode) {
            showToast('🔍 Режим просмотра — действие недоступно');
            return;
        }
        if (!currentUser) {
            showNotification('Войдите в аккаунт', 'warning');
            setTimeout(() => window.location.href = 'login.html', 1000);
            return;
        }
        showToast('🛒 Товар добавлен в корзину');
    };

    window.showReviewForm = function() {
        if (isPreviewMode) {
            showToast('🔍 Режим просмотра — действие недоступно');
            return;
        }
        if (!currentUser) {
            showNotification('Войдите в аккаунт', 'warning');
            setTimeout(() => window.location.href = 'login.html', 1000);
            return;
        }
        showNotification('📝 Форма отзыва (в разработке)', 'info');
    };

    window.showAllReviews = function() {
        showNotification('📋 Все отзывы (в разработке)', 'info');
    };

    // ===== КНОПКА НАЗАД =====
    document.getElementById('backBtn')?.addEventListener('click', () => {
        window.history.back();
    });

    // ===== ИНИЦИАЛИЗАЦИЯ =====
    checkPreviewMode();

    onAuthStateChanged(auth, async (user) => {
        currentUser = user;
        const params = new URLSearchParams(window.location.search);
        partnerId = params.get('id');

        if (!partnerId) {
            const loadingEl = document.getElementById('storeLoading');
            const notFoundEl = document.getElementById('storeNotFound');
            if (loadingEl) loadingEl.style.display = 'none';
            if (notFoundEl) {
                notFoundEl.style.display = 'block';
                const title = notFoundEl.querySelector('h3');
                if (title) title.textContent = 'ID магазина не указан';
            }
            return;
        }

        await loadStore(partnerId);
    });

    // Меню
    const plusBtn = document.getElementById('balancePlusBtn');
    if (plusBtn) plusBtn.onclick = () => window.location.href = 'shop.html';

    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');
    if (menuToggle && navLinks) {
        menuToggle.addEventListener('click', () => navLinks.classList.toggle('show'));
        navLinks.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => navLinks.classList.remove('show'));
        });
    }

    console.log('✅ Публичная страница магазина для покупателей загружена');
    console.log('📌 Работает для любого магазина по ID из URL');
    console.log(`📌 Режим просмотра: ${isPreviewMode ? 'ВКЛЮЧЁН (кнопки заблокированы)' : 'ВЫКЛЮЧЕН'}`);
    </script>
</body>
