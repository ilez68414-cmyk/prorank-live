<!DOCTYPE html>
<html lang="ru">
<head>
    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="/prorank-live/manifest.json">
    <link rel="apple-touch-icon" href="/prorank-live/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PRORANK">
    <meta name="theme-color" content="#fbbf24">
    <meta name="mobile-web-app-capable" content="yes">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#fbbf24">
    <meta name="description" content="Мои заказы на PRORANK — отслеживайте статус и историю покупок">
    <title>Мои заказы | PRORANK</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(ellipse at 30% 40%, rgba(251, 191, 36, 0.15) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 80%, rgba(251, 191, 36, 0.08) 0%, transparent 50%),
                        linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 40%, #1a1a1a 100%);
            background-attachment: fixed;
            color: #fff;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        main { flex: 1; }
        
        .gold-top { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 3px; 
            background: linear-gradient(90deg, #fbbf24, #ffdd88, #fbbf24, #b8860b); 
            z-index: 1001; 
        }
        
        .container { 
            max-width: 1000px; 
            margin: 0 auto; 
            padding: 0 24px; 
            position: relative; 
            z-index: 2;
            width: 100%;
        }
        
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(251, 191, 36, 0.25);
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: all 0.3s ease;
        }
        
        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            cursor: pointer;
            background: linear-gradient(135deg, #ffffff, #fbbf24);
            background-clip: text;
            color: transparent;
            transition: transform 0.2s ease;
        }
        
        .logo:hover { transform: scale(1.02); }
        .logo span { background: linear-gradient(135deg, #fbbf24, #ffdd77); background-clip: text; color: transparent; }
        
        .balance-indicator {
            background: #111;
            border: 1px solid rgba(251, 191, 36, 0.5);
            border-radius: 60px;
            padding: 7px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        
        .balance-indicator:hover {
            border-color: #fbbf24;
            box-shadow: 0 0 15px rgba(251,191,36,0.2);
        }
        
        .balance-count { color: #fbbf24; font-size: 1.1rem; }
        
        .balance-plus {
            background: rgba(251,191,36,0.15);
            border: none;
            color: #fbbf24;
            cursor: pointer;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            transition: all 0.2s ease;
        }
        
        .balance-plus:hover {
            background: rgba(251,191,36,0.3);
            transform: scale(1.05);
        }
        
        .balance-plus:active { 
            background: #fbbf24; 
            color: #000;
            transform: scale(0.94);
        }
        
        .menu-toggle { 
            display: none; 
            background: rgba(251,191,36,0.1); 
            border: 1px solid #fbbf24; 
            color: #fbbf24; 
            font-size: 1.6rem; 
            cursor: pointer; 
            padding: 8px 14px; 
            border-radius: 12px;
            transition: all 0.2s ease;
            min-height: 44px;
            min-width: 44px;
        }
        
        .menu-toggle:hover {
            background: rgba(251,191,36,0.2);
            transform: scale(1.02);
        }
        
        .menu-toggle:active { transform: scale(0.95); }
        
        .nav-links {
            display: flex;
            gap: 6px;
            background: rgba(15,15,15,0.7);
            backdrop-filter: blur(12px);
            padding: 5px 14px;
            border-radius: 60px;
            border: 1px solid rgba(251,191,36,0.2);
        }
        
        .nav-links a { 
            color: #ddd; 
            text-decoration: none; 
            font-size: 0.9rem; 
            font-weight: 500; 
            padding: 8px 18px; 
            border-radius: 40px; 
            transition: all 0.2s;
        }
        
        .nav-links a i { margin-right: 8px; color: #fbbf24; }
        .nav-links a:hover { color: #fbbf24; background: rgba(251,191,36,0.1); }
        
        .page-header { 
            text-align: center; 
            padding: 40px 20px 20px;
        }
        
        .page-header h1 { 
            font-size: clamp(1.6rem, 5vw, 2rem); 
            font-weight: 700; 
            background: linear-gradient(135deg, #fff, #fbbf24); 
            background-clip: text; 
            color: transparent;
        }
        
        .page-header p { 
            color: #aaa; 
            margin-top: 8px; 
            font-size: clamp(0.85rem, 3vw, 0.95rem);
        }
        
        /* ===== ФИЛЬТР - ДРОПДАУН ===== */
        .filter-dropdown {
            margin-bottom: 16px;
            position: relative;
        }

        .filter-toggle {
            width: 100%;
            padding: 12px 18px;
            background: rgba(15,15,15,0.7);
            border: 1px solid rgba(251,191,36,0.15);
            border-radius: 16px;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
            min-height: 50px;
        }

        .filter-toggle:hover {
            background: rgba(25,25,35,0.8);
            border-color: rgba(251,191,36,0.3);
        }

        .filter-toggle-left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .filter-toggle-left i {
            color: #fbbf24;
            font-size: 0.9rem;
        }

        .filter-toggle-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .filter-count {
            background: rgba(251,191,36,0.15);
            color: #fbbf24;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        #filterArrow {
            color: #555;
            font-size: 0.8rem;
            transition: transform 0.3s ease;
        }

        #filterArrow.open {
            transform: rotate(180deg);
        }

        /* ===== ВЫПАДАЮЩИЙ СПИСОК ===== */
        .filter-options {
            display: none;
            margin-top: 8px;
            background: rgba(15,15,15,0.95);
            border: 1px solid rgba(251,191,36,0.1);
            border-radius: 16px;
            padding: 6px;
            animation: slideDown 0.25s ease;
            backdrop-filter: blur(12px);
            overflow: hidden;
            position: relative;
            z-index: 100;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .filter-options.open {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .filter-option {
            width: 100%;
            padding: 10px 14px;
            background: none;
            border: none;
            border-radius: 12px;
            color: #aaa;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            transition: all 0.15s ease;
            font-family: 'Inter', sans-serif;
        }

        .filter-option:hover {
            background: rgba(255,255,255,0.05);
            color: #fff;
        }

        .filter-option.active {
            background: rgba(251,191,36,0.12);
            color: #fbbf24;
        }

        .filter-option .count {
            background: rgba(255,255,255,0.06);
            padding: 1px 8px;
            border-radius: 12px;
            font-size: 0.6rem;
            color: #666;
        }

        .filter-option.active .count {
            background: rgba(251,191,36,0.15);
            color: #fbbf24;
        }

        .filter-option i {
            width: 20px;
            text-align: center;
            font-size: 0.85rem;
        }

        .filter-option .option-label {
            flex: 1;
            text-align: left;
        }

        /* ===== ТАБЫ ===== */
        .orders-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            background: rgba(15,15,15,0.5);
            padding: 6px;
            border-radius: 60px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .tab-btn {
            background: none;
            border: none;
            color: #aaa;
            padding: 10px 24px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 40px;
            transition: all 0.2s;
            min-height: 44px;
        }
        
        .tab-btn i { margin-right: 6px; }
        
        .tab-btn:hover {
            background: rgba(251,191,36,0.1);
            color: #fbbf24;
        }
        
        .tab-btn.active {
            background: #fbbf24;
            color: #000;
        }
        
        .tab-pane {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        
        .tab-pane.active {
            display: block;
        }
        
        /* ===== СПИСОК ЗАКАЗОВ ===== */
        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 30px;
        }
        
        .order-card {
            background: rgba(15,15,15,0.6);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(251,191,36,0.1);
            transition: all 0.2s;
        }
        
        .order-card:hover {
            border-color: rgba(251,191,36,0.3);
            transform: translateX(3px);
        }
        
        /* ===== ПРОДАВЕЦ ===== */
        .order-seller {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .order-seller .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(251,191,36,0.2);
        }
        .order-seller .name {
            font-weight: 600;
            font-size: 0.85rem;
        }
        .order-seller .role {
            font-size: 0.6rem;
            color: #666;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }
        
        .order-number {
            font-weight: 700;
            color: #fbbf24;
            font-size: 0.9rem;
        }
        
        .order-date {
            font-size: 0.7rem;
            color: #888;
        }
        
        .order-status {
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        
        .status-paid { background: #f59e0b; color: #000; }
        .status-shipped { background: #8b5cf6; color: #fff; }
        .status-completed { background: #10b981; color: #fff; }
        .status-cancelled { background: #dc2626; color: #fff; }
        .status-rejected { background: #dc2626; color: #fff; }
        
        /* ===== ТОВАРЫ ===== */
        .order-items-list { margin: 10px 0; }
        
        .order-item-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.85rem;
        }
        
        .order-item-row:last-child { border-bottom: none; }
        
        .item-name-small {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .item-quantity-badge {
            background: rgba(251,191,36,0.2);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.65rem;
            color: #fbbf24;
        }
        
        .item-price {
            font-weight: 600;
            color: #fbbf24;
        }
        
        .order-total {
            text-align: right;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        
        .order-total span {
            font-size: 1rem;
            font-weight: 700;
            color: #fbbf24;
        }
        
        /* ===== НИЗ КАРТОЧКИ ===== */
        .order-footer {
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .tracking-info {
            font-size: 0.7rem;
            color: #aaa;
            padding: 8px 12px;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tracking-info:hover {
            background: rgba(0,0,0,0.5);
            color: #fff;
        }
        .tracking-info i { color: #fbbf24; margin-right: 4px; }
        
        .order-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .btn-confirm, .btn-cancel, .btn-chat, .btn-review {
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 38px;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-confirm {
            background: #10b981;
            color: #fff;
        }
        .btn-confirm:hover {
            background: #059669;
            transform: translateY(-2px);
        }
        
        .btn-chat {
            background: rgba(251,191,36,0.15);
            color: #fbbf24;
            border: 1px solid rgba(251,191,36,0.2);
        }
        .btn-chat:hover {
            background: rgba(251,191,36,0.25);
            transform: translateY(-2px);
        }
        
        .btn-review {
            background: rgba(34,197,94,0.15);
            color: #22c55e;
            border: 1px solid rgba(34,197,94,0.2);
        }
        .btn-review:hover {
            background: rgba(34,197,94,0.25);
            transform: translateY(-2px);
        }
        
        .btn-cancel {
            background: #dc2626;
            color: #fff;
        }
        .btn-cancel:hover {
            background: #b91c1c;
            transform: translateY(-2px);
        }
        
        .clear-history-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 38px;
            margin-left: auto;
        }
        .clear-history-btn:hover {
            background: #b91c1c;
            transform: translateY(-2px);
        }
        
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .reject-reason {
            font-size: 0.65rem;
            color: #dc2626;
            margin-top: 8px;
            padding: 6px 10px;
            background: rgba(220,38,38,0.1);
            border-radius: 12px;
        }

        /* ===== МОДАЛ ОТЗЫВА ===== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: #1a1a2e;
            border: 1px solid rgba(251,191,36,0.2);
            border-radius: 20px;
            padding: 32px 24px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .modal h3 { margin-bottom: 8px; }
        .modal p { color: #888; font-size: 0.85rem; margin-bottom: 20px; }
        .modal .stars {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 16px;
        }
        .modal .stars i {
            font-size: 2rem;
            color: #333;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .modal .stars i.active { color: #fbbf24; }
        .modal .stars i:hover { transform: scale(1.1); }
        .modal textarea {
            width: 100%;
            padding: 12px;
            background: #0f0f1a;
            border: 1px solid rgba(251,191,36,0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 0.85rem;
            resize: vertical;
            min-height: 80px;
            font-family: 'Inter', sans-serif;
        }
        .modal textarea:focus { outline: none; border-color: #fbbf24; }
        .modal .actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        .modal .actions button {
            flex: 1;
            padding: 12px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
        }
        .modal .cancel-btn { background: rgba(255,255,255,0.08); color: #fff; }
        .modal .cancel-btn:hover { background: rgba(255,255,255,0.15); }
        .modal .submit-btn { background: #fbbf24; color: #000; }
        .modal .submit-btn:hover { background: #ffdd44; transform: scale(1.02); }
        
        .empty-state {
            text-align: center;
            padding: 60px;
            color: #888;
        }
        
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 16px;
            color: #555;
        }
        
        .empty-state a {
            color: #fbbf24;
            text-decoration: none;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        
        .main-footer {
            background: #0a0a0a;
            border-top: 1px solid rgba(251,191,36,0.15);
            margin-top: 60px;
            padding: 40px 0 24px;
        }
        
        .footer-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 24px;
            margin-bottom: 24px;
        }
        
        .footer-logo .logo {
            font-size: 1.2rem;
            display: inline-block;
        }
        
        .footer-logo p {
            font-size: 0.65rem;
            color: #777;
            margin-top: 4px;
        }
        
        .footer-social {
            display: flex;
            gap: 16px;
        }
        
        .social-icon {
            color: #aaa;
            font-size: 1.2rem;
            transition: 0.2s;
        }
        
        .social-icon:hover {
            color: #fbbf24;
        }
        
        .footer-links {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .footer-links a {
            color: #888;
            text-decoration: none;
            font-size: 0.7rem;
            transition: 0.2s;
        }
        
        .footer-links a:hover {
            color: #fbbf24;
        }
        
        .footer-bottom {
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.05);
            font-size: 0.6rem;
            color: #555;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @media (max-width: 768px) {
            .navbar {
                padding: 12px 18px;
            }
            .menu-toggle {
                display: block;
            }
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 68px;
                left: 18px;
                right: 18px;
                background: #0f0f0f;
                border-radius: 20px;
                padding: 16px;
                gap: 8px;
                border: 1px solid rgba(251,191,36,0.3);
                z-index: 1000;
            }
            .nav-links.show {
                display: flex;
            }
            .nav-links a {
                width: 100%;
                text-align: center;
                padding: 10px;
            }
            .container {
                padding: 0 16px;
            }
            .order-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .order-footer {
                flex-direction: column;
                align-items: stretch;
            }
            .order-actions {
                justify-content: center;
            }
            .btn-confirm, .btn-cancel, .btn-chat, .btn-review {
                width: 100%;
                justify-content: center;
            }
            .clear-history-btn {
                width: 100%;
                justify-content: center;
            }
            .history-header {
                flex-direction: column;
                align-items: stretch;
            }
            .footer-inner {
                flex-direction: column;
                text-align: center;
                gap: 16px;
            }
            .filter-toggle {
                padding: 10px 14px;
                min-height: 44px;
                border-radius: 14px;
            }
            .filter-toggle-left {
                font-size: 0.8rem;
                gap: 8px;
            }
            .filter-option {
                padding: 8px 12px;
                font-size: 0.75rem;
            }
            .filter-option i {
                font-size: 0.75rem;
                width: 18px;
            }
            .filter-count {
                font-size: 0.6rem;
                padding: 1px 8px;
            }
            .orders-tabs {
                gap: 6px;
                padding: 4px;
                border-radius: 40px;
            }
            .tab-btn {
                padding: 6px 14px;

    <div id="errorContainer" style="position: fixed; top: 15px; left: 50%; transform: translateX(-50%); z-index: 9999; max-width: 90%; width: 480px; padding: 14px 20px; border-radius: 16px; font-weight: 600; font-size: 0.9rem; animation: slideDown 0.3s ease; box-shadow: 0 10px 30px rgba(0,0,0,0.4); backdrop-filter: blur(8px); display: none; text-align: center; border: 1px solid rgba(255,255,255,0.1);"></div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js",
                "firebase/analytics": "https://www.gstatic.com/firebasejs/11.0.2/firebase-analytics.js"
            }
        }
    </script>
    <script type="module" src="header.js?v=3"></script>
    <script type="module">
    import { initializeApp } from "firebase/app";
    import { getFirestore, collection, getDocs, query, where, orderBy, doc, getDoc, updateDoc, deleteDoc, addDoc, setDoc } from "firebase/firestore";
    import { getAuth, onAuthStateChanged } from "firebase/auth";
    import { releaseFunds } from './wallet.js';

    const firebaseConfig = {
        apiKey: "AIzaSyDUGYJY7pX7q02MS5SACMIIQXpjpQ97mPw",
        authDomain: "proranklive.firebaseapp.com",
        projectId: "proranklive",
        storageBucket: "proranklive.firebasestorage.app",
        messagingSenderId: "716836144015",
        appId: "1:716836144015:web:f1575147750608d0f881fa"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUser = null;
    let allOrders = [];
    let currentFilter = 'all';
    let selectedOrderId = null;
    let selectedRating = 0;
    let sellerCache = {};

    // ===== УВЕДОМЛЕНИЯ =====
    function showNotification(message, type = 'info') {
        const container = document.getElementById('errorContainer');
        if (!container) return;
        const colors = { success: '#22c55e', error: '#ef4444', warning: '#f59e0b', info: '#fbbf24' };
        container.style.display = 'block';
        container.style.background = colors[type] || colors.info;
        container.style.color = '#000';
        container.textContent = message;
        clearTimeout(container._timeout);
        container._timeout = setTimeout(() => { container.style.display = 'none'; }, 3000);
    }

    // ===== ФОРМАТИРОВАНИЕ =====
    function formatDate(date) {
        if (!date) return '';
        const d = date.toDate ? date.toDate() : new Date(date);
        return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function getStatusText(status) {
        const statuses = {
            'paid': '✅ Оплачен',
            'shipped': '📦 Отправлен',
            'completed': '✔️ Завершён',
            'cancelled': '❌ Отменён',
            'rejected': '❌ Отклонён'
        };
        return statuses[status] || status;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
    }

    // ===== ЗАГРУЗКА ПРОДАВЦА =====
    async function getSellerData(sellerId) {
        if (!sellerId) return { name: 'Продавец', avatar: 'Avatar.png' };
        if (sellerCache[sellerId]) return sellerCache[sellerId];
        
        try {
            const docRef = doc(db, "fighters", sellerId);
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                const data = docSnap.data();
                sellerCache[sellerId] = { name: data.name || 'Продавец', avatar: data.avatar || 'Avatar.png' };
                return sellerCache[sellerId];
            }
        } catch (err) {}
        
        sellerCache[sellerId] = { name: 'Продавец', avatar: 'Avatar.png' };
        return sellerCache[sellerId];
    }

    // ===== ЗАГРУЗКА ЗАКАЗОВ =====
    async function loadOrders() {
        if (!currentUser) return;
        
        try {
            const ordersQuery = query(
                collection(db, "orders"),
                where("userId", "==", currentUser.uid),
                where("type", "==", "physical"),
                orderBy("createdAt", "desc")
            );
            const snapshot = await getDocs(ordersQuery);
            
            allOrders = [];
            for (const docSnap of snapshot.docs) {
                const order = { id: docSnap.id, ...docSnap.data() };
                
                let sellerId = order.partnerId || null;
                if (!sellerId && order.items && order.items.length > 0) {
                    sellerId = order.items[0]?.partnerId || null;
                }
                if (!sellerId && order.partnerIds && order.partnerIds.length > 0) {
                    sellerId = order.partnerIds[0];
                }
                
                order.sellerId = sellerId;
                order.sellerData = await getSellerData(sellerId);
                allOrders.push(order);
            }
            
            updateFilterCounts(allOrders);
            renderOrders('active', currentFilter);
            renderOrders('history', currentFilter);
            
        } catch (err) {
            console.error('Ошибка загрузки заказов:', err);
            document.getElementById('activeOrdersList').innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Ошибка загрузки</p></div>';
            document.getElementById('historyOrdersList').innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Ошибка загрузки</p></div>';
        }
    }

    // ===== ОБНОВЛЕНИЕ СЧЁТЧИКОВ ДЛЯ ДРОПДАУНА =====
    function updateFilterCounts(orders) {
        const counts = {
            all: orders.length,
            paid: orders.filter(o => o.status === 'paid').length,
            shipped: orders.filter(o => o.status === 'shipped').length,
            completed: orders.filter(o => o.status === 'completed').length,
            cancelled: orders.filter(o => o.status === 'cancelled').length,
            rejected: orders.filter(o => o.status === 'rejected').length
        };

        document.getElementById('countAll').textContent = counts.all;
        document.getElementById('countPaid').textContent = counts.paid;
        document.getElementById('countShipped').textContent = counts.shipped;
        document.getElementById('countCompleted').textContent = counts.completed;
        document.getElementById('countCancelled').textContent = counts.cancelled;
        document.getElementById('countRejected').textContent = counts.rejected;
        
        document.getElementById('filterTotalCount').textContent = counts.all;
    }

    // ===== РЕНДЕР ЗАКАЗОВ =====
    function renderOrders(tab, filter) {
        const container = document.getElementById(tab === 'active' ? 'activeOrdersList' : 'historyOrdersList');
        
        const activeStatuses = ['paid', 'shipped'];
        let filtered = allOrders;
        
        if (filter !== 'all') {
            filtered = filtered.filter(o => o.status === filter);
        }
        
        if (tab === 'active') {
            filtered = filtered.filter(o => activeStatuses.includes(o.status));
        } else {
            filtered = filtered.filter(o => !activeStatuses.includes(o.status));
        }

        if (filtered.length === 0) {
            const messages = {
                active: 'У вас нет активных заказов',
                history: 'У вас нет истории заказов'
            };
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas ${tab === 'active' ? 'fa-inbox' : 'fa-history'}"></i>
                    <p>${messages[tab]}</p>
                    ${tab === 'active' ? '<p><a href="catalog.html" style="color: #fbbf24;">Перейти в каталог →</a></p>' : ''}
                </div>
            `;
            return;
        }

        let html = '';
        
        if (tab === 'history') {
            html += `<div class="history-header"><h3><i class="fas fa-history"></i> История заказов</h3>
                <button id="clearHistoryBtn" class="clear-history-btn"><i class="fas fa-trash"></i> Очистить историю</button>
            </div>`;
        }

        filtered.forEach((order, index) => {
            const date = order.createdAt ? formatDate(order.createdAt) : '—';
            const statusText = getStatusText(order.status);
            const statusClass = `status-${order.status}`;
            const seller = order.sellerData || { name: 'Продавец', avatar: 'Avatar.png' };
            const canReview = order.status === 'completed' && !order.hasReview;
            
            let itemsHtml = '';
            if (order.items && order.items.length > 0) {
                itemsHtml = '<div class="order-items-list">';
                order.items.forEach(item => {
                    itemsHtml += `
                        <div class="order-item-row">
                            <div class="item-name-small">
                                <span>${escapeHtml(item.productName)}</span>
                                ${item.quantity > 1 ? `<span class="item-quantity-badge">×${item.quantity}</span>` : ''}
                            </div>
                            <span class="item-price">${(item.price * item.quantity).toLocaleString()} ₽</span>
                        </div>
                    `;
                });
                itemsHtml += '</div>';
            } else {
                itemsHtml = `
                    <div class="order-item-row">
                        <span>${escapeHtml(order.productName || 'Товар')} ${order.quantity > 1 ? `× ${order.quantity}` : ''}</span>
                        <span class="item-price">${(order.totalPrice || order.price || 0).toLocaleString()} ₽</span>
                    </div>
                `;
            }

            html += `
                <div class="order-card" style="animation-delay: ${(index % 10) * 0.03}s;">
                    <div class="order-seller" data-seller-id="${order.sellerId || ''}">
                        <img src="${seller.avatar || 'Avatar.png'}" class="avatar" onerror="this.src='Avatar.png'">
                        <div>
                            <div class="name">${escapeHtml(seller.name || 'Продавец')}</div>
                            <div class="role">${date}</div>
                        </div>
                    </div>
                    <div class="order-header">
                        <span class="order-number"><i class="fas fa-receipt"></i> Заказ #${order.id.slice(0, 8)}</span>
                        <span class="order-status ${statusClass}">${statusText}</span>
                    </div>
                    ${itemsHtml}
                    <div class="order-total">
                        <span>Итого: ${(order.totalPrice || 0).toLocaleString()} ₽</span>
                    </div>
                    <div class="order-footer">
                        ${order.trackingNumber ? `<div class="tracking-info"><i class="fas fa-box"></i> Трек: ${escapeHtml(order.trackingNumber)}</div>` : '<div></div>'}
                        <div class="order-actions">
                            ${tab === 'active' ? renderActiveButtons(order) : ''}
                            ${canReview ? `<button class="btn-review" data-order-id="${order.id}"><i class="fas fa-star"></i> Отзыв</button>` : ''}
                            ${order.sellerId ? `<button class="btn-chat" data-seller-id="${order.sellerId}"><i class="fas fa-comment"></i> Чат</button>` : ''}
                        </div>
                    </div>
                    ${order.rejectReason ? `<div class="reject-reason"><i class="fas fa-info-circle"></i> Причина: ${escapeHtml(order.rejectReason)}</div>` : ''}
                </div>
            `;
        });

        container.innerHTML = html;
        attachHandlers(tab);
    }

    // ===== КНОПКИ ДЛЯ АКТИВНЫХ =====
    function renderActiveButtons(order) {
        if (order.status === 'paid') {
            return `<span style="color: #fbbf24;"><i class="fas fa-clock"></i> Ожидает отправки...</span>`;
        }
        if (order.status === 'shipped') {
            return `<button class="btn-confirm" data-order-id="${order.id}" data-total="${order.totalPrice}" data-seller-id="${order.sellerId || ''}">
                <i class="fas fa-check-circle"></i> Подтвердить получение
            </button>`;
        }
        return '';
    }

    // ===== ОБРАБОТЧИКИ =====
    function attachHandlers(tab) {
        const container = document.getElementById(tab === 'active' ? 'activeOrdersList' : 'historyOrdersList');

        container.querySelectorAll('.order-seller').forEach(el => {
            el.removeEventListener('click', handleSellerClick);
            el.addEventListener('click', handleSellerClick);
        });

        container.querySelectorAll('.btn-confirm').forEach(btn => {
            btn.removeEventListener('click', handleConfirmClick);
            btn.addEventListener('click', handleConfirmClick);
        });

        container.querySelectorAll('.btn-chat').forEach(btn => {
            btn.removeEventListener('click', handleChatClick);
            btn.addEventListener('click', handleChatClick);
        });

        container.querySelectorAll('.btn-review').forEach(btn => {
            btn.removeEventListener('click', handleReviewClick);
            btn.addEventListener('click', handleReviewClick);
        });

        const clearBtn = document.getElementById('clearHistoryBtn');
        if (clearBtn) {
            clearBtn.removeEventListener('click', handleClearHistory);
            clearBtn.addEventListener('click', handleClearHistory);
        }
    }

    async function handleSellerClick(e) {
        const el = e.currentTarget;
        const sellerId = el.dataset.sellerId;
        if (sellerId && sellerId !== 'null' && sellerId !== 'undefined') {
            window.location.href = `profile.html?id=${sellerId}`;
        }
    }

    async function handleConfirmClick(e) {
        const btn = e.currentTarget;
        const orderId = btn.dataset.orderId;
        const totalPrice = parseFloat(btn.dataset.total);
        const sellerId = btn.dataset.sellerId;

        if (!sellerId || sellerId === 'null' || sellerId === 'undefined' || sellerId === '') {
            showNotification('❌ Не удалось определить продавца', 'error');
            return;
        }

        if (!confirm('Подтвердите получение товара? Средства будут переведены продавцу.')) return;

        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Обработка...';
        btn.disabled = true;

        try {
            await updateDoc(doc(db, "orders", orderId), { 
                status: 'completed',
                completedAt: new Date()
            });

            await releaseFunds(currentUser.uid, sellerId, totalPrice, orderId);

            showNotification('✅ Спасибо за покупку! Заказ завершён.', 'success');
            await loadOrders();

        } catch (err) {
            console.error('❌ Ошибка:', err);
            showNotification('❌ Ошибка: ' + err.message, 'error');
            try {
                await updateDoc(doc(db, "orders", orderId), { status: 'shipped' });
            } catch (rollbackErr) {}
        } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    }

    async function handleChatClick(e) {
        const btn = e.currentTarget;
        const sellerId = btn.dataset.sellerId;
        if (!sellerId) {
            showNotification('Не удалось найти продавца', 'error');
            return;
        }
        await findOrCreateChat(sellerId);
    }

    async function findOrCreateChat(sellerId) {
        try {
            const chatsQuery = query(
                collection(db, "chats"),
                where("participants", "array-contains", currentUser.uid)
            );
            const chatsSnap = await getDocs(chatsQuery);
            
            for (const docSnap of chatsSnap.docs) {
                const chat = docSnap.data();
                if (chat.participants.includes(sellerId)) {
                    window.location.href = `chat.html?id=${docSnap.id}`;
                    return;
                }
            }

            const newChatRef = doc(collection(db, "chats"));
            await setDoc(newChatRef, {
                participants: [currentUser.uid, sellerId],
                createdAt: new Date(),
                lastMessage: '',
                lastMessageTime: null,
                lastMessageAuthor: null,
                unreadCounts: {},
                pinned: {}
            });
            window.location.href = `chat.html?id=${newChatRef.id}`;
        } catch (err) {
            console.error('Ошибка создания чата:', err);
            showNotification('Не удалось открыть чат', 'error');
        }
    }

    function handleReviewClick(e) {
        const btn = e.currentTarget;
        selectedOrderId = btn.dataset.orderId;
        openReviewModal();
    }

    async function handleClearHistory() {
        if (!confirm('Вы уверены, что хотите очистить всю историю заказов?')) return;
        
        try {
            const ordersQuery = query(
                collection(db, "orders"),
                where("userId", "==", currentUser.uid),
                where("type", "==", "physical"),
                where("status", "in", ['completed', 'cancelled', 'rejected'])
            );
            const snapshot = await getDocs(ordersQuery);
            
            let deleted = 0;
            for (const docSnap of snapshot.docs) {
                await deleteDoc(doc(db, "orders", docSnap.id));
                deleted++;
            }
            
            showNotification(`✅ Удалено ${deleted} заказов`, 'success');
            await loadOrders();
        } catch (err) {
            console.error('Ошибка очистки:', err);
            showNotification('❌ Ошибка очистки', 'error');
        }
    }

    // ===== ОТЗЫВЫ =====
    function openReviewModal() {
        selectedRating = 0;
        document.getElementById('reviewText').value = '';
        document.querySelectorAll('#starRating i').forEach(el => el.classList.remove('active'));
        document.getElementById('reviewModal').classList.add('show');
    }

    document.querySelectorAll('#starRating i').forEach(star => {
        star.addEventListener('click', () => {
            selectedRating = parseInt(star.dataset.star);
            document.querySelectorAll('#starRating i').forEach((el, index) => {
                el.classList.toggle('active', index < selectedRating);
            });
        });
    });

    document.getElementById('cancelReviewBtn').addEventListener('click', () => {
        document.getElementById('reviewModal').classList.remove('show');
    });

    document.getElementById('submitReviewBtn').addEventListener('click', async () => {
        if (selectedRating === 0) {
            showNotification('Выберите оценку', 'warning');
            return;
        }
        const text = document.getElementById('reviewText').value.trim();
        if (!text) {
            showNotification('Напишите текст отзыва', 'warning');
            return;
        }

        try {
            await addDoc(collection(db, "reviews"), {
                orderId: selectedOrderId,
                userId: currentUser.uid,
                rating: selectedRating,
                text: text,
                createdAt: new Date()
            });

            await updateDoc(doc(db, "orders", selectedOrderId), {
                hasReview: true,
                reviewedAt: new Date()
            });

            showNotification('✅ Отзыв отправлен! Спасибо!', 'success');
            document.getElementById('reviewModal').classList.remove('show');
            await loadOrders();
        } catch (err) {
            console.error('Ошибка:', err);
            showNotification('❌ Не удалось отправить отзыв', 'error');
        }
    });

    // ===== ФИЛЬТР - ДРОПДАУН =====
    const filterToggle = document.getElementById('filterToggle');
    const filterOptions = document.getElementById('filterOptions');
    const filterArrow = document.getElementById('filterArrow');
    const currentFilterLabel = document.getElementById('currentFilterLabel');

    filterToggle.addEventListener('click', () => {
        filterOptions.classList.toggle('open');
        filterArrow.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
        if (!filterToggle.contains(e.target) && !filterOptions.contains(e.target)) {
            filterOptions.classList.remove('open');
            filterArrow.classList.remove('open');
        }
    });

    document.querySelectorAll('.filter-option').forEach(option => {
        option.addEventListener('click', () => {
            const filter = option.dataset.filter;
            const label = option.querySelector('.option-label')?.textContent || option.textContent.trim();
            
            document.querySelectorAll('.filter-option').forEach(o => o.classList.remove('active'));
            option.classList.add('active');
            
            currentFilterLabel.textContent = label;
            
            filterOptions.classList.remove('open');
            filterArrow.classList.remove('open');
            
            currentFilter = filter;
            const activeTab = document.querySelector('.tab-btn.active')?.dataset.tab || 'active';
            renderOrders(activeTab, currentFilter);
        });
    });

    // ===== ТАБЫ =====
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const tab = btn.dataset.tab;
            document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
            document.getElementById(tab === 'active' ? 'activeOrders' : 'historyOrders').classList.add('active');
            
            renderOrders(tab, currentFilter);
        });
    });

    // ===== БАЛАНС =====
    async function updateHeaderBalance() {
        const user = auth.currentUser;
        const balanceDiv = document.getElementById('balanceIndicator');
        const balanceCount = document.getElementById('headerChallengesCount');
        if (!user || !balanceDiv) return;
        try {
            const userDoc = await getDoc(doc(db, "fighters", user.uid));
            const data = userDoc.data();
            const total = (data.freeChallenges || 0) + (data.purchasedChallenges || 0);
            balanceCount.innerText = total;
            balanceDiv.style.display = 'flex';
        } catch (err) { 
            console.error(err);
            balanceDiv.style.display = 'none';
        }
    }

    // ===== АВТОРИЗАЦИЯ =====
    onAuthStateChanged(auth, async (user) => {
        currentUser = user;
        if (user) {
            setTimeout(updateHeaderBalance, 1000);
            await loadOrders();
        } else {
            const balanceDiv = document.getElementById('balanceIndicator');
            if (balanceDiv) balanceDiv.style.display = 'none';
            document.getElementById('activeOrdersList').innerHTML = '<div class="empty-state"><i class="fas fa-lock"></i><p>Войдите, чтобы увидеть свои заказы</p></div>';
            document.getElementById('historyOrdersList').innerHTML = '<div class="empty-state"><i class="fas fa-lock"></i><p>Войдите, чтобы увидеть свои заказы</p></div>';
        }
    });

    // ===== ОБРАБОТЧИКИ МЕНЮ =====
    const plusBtn = document.getElementById('balancePlusBtn');
    if (plusBtn) plusBtn.onclick = () => window.location.href = 'shop.html';

    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');
    if (menuToggle && navLinks) {
        menuToggle.addEventListener('click', () => navLinks.classList.toggle('show'));
        navLinks.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => navLinks.classList.remove('show'));
        });
    }

    console.log('✅ Мои заказы обновлены: дропдаун-фильтр, продавцы, отзывы');
</script>

</body>
</html>
