        function buildBracketHtml(containerMatches, clickable) {
            if (!containerMatches.length) return `<div class="empty-state"><i class="fas fa-sitemap"></i><h3>Нет матчей</h3></div>`;

            const rounds = [...new Set(containerMatches.map(m => m.round))].sort((a, b) => a - b);
            const totalRounds = rounds.length;
            const roundNames = {};
            roundNames[totalRounds] = '🏆 ФИНАЛ';
            if (totalRounds >= 2) roundNames[totalRounds - 1] = '1/2 ФИНАЛА';
            if (totalRounds >= 3) roundNames[totalRounds - 2] = '1/4 ФИНАЛА';
            if (totalRounds >= 4) roundNames[totalRounds - 3] = '1/8 ФИНАЛА';

            const buildMatchCard = (m, isFinal = false) => {
                const isMy = currentUser && (m.fighter1?.id === currentUser.uid || m.fighter2?.id === currentUser.uid);
                const canClick = clickable && m.status === 'pending' && m.fighter1 && m.fighter2;
                const isBye = m.status === 'bye';
                return `<div class="match-card ${m.status} ${canClick ? 'clickable' : ''} ${isMy ? 'my-match' : ''} ${isBye ? 'bye-match' : ''} ${isFinal ? 'final-match' : ''}" ${canClick ? `onclick="openResultModal('${m.id}')"` : ''}>
                    <div class="match-number">БОЙ ${m.matchNumber}${isMy ? ' · ВАШ' : ''}</div>
                    ${[m.fighter1, m.fighter2].map((f, idx) => {
                        const isW = m.winner && f && m.winner.id === f.id;
                        const isMe = f?.id === currentUser?.uid;
                        const corner = idx === 0 ? 'red' : 'blue';
                        return `<div class="match-fighter ${!f ? 'empty' : ''} ${isW ? 'winner' : ''} ${isMe ? 'me' : ''} ${corner}-corner">
                            <div class="fighter-avatar">${f ? f.name[0].toUpperCase() : '?'}</div>
                            <div class="fighter-info">
                                <div class="fighter-name">${f ? escapeHtml(f.name) : 'TBD'} ${isMe ? '<span class="you-label">ВЫ</span>' : ''}</div>
                                ${f?.club ? `<div class="fighter-club">${escapeHtml(f.club)}</div>` : ''}
                            </div>
                            ${isW ? '<div class="winner-badge"><i class="fas fa-trophy"></i></div>' : ''}
                            ${isBye && f ? '<div class="bye-badge"><i class="fas fa-arrow-right"></i></div>' : ''}
                        </div>`;
                    }).join('')}
                </div>`;
            };

            const buildRound = (roundNum, isFinal = false) => {
                const rm = containerMatches.filter(m => m.round === roundNum);
                return `<div class="bracket-round-premium">
                    <div class="round-title ${isFinal ? 'final-title' : ''}">${roundNames[roundNum] || `РАУНД ${roundNum}`}</div>
                    ${rm.map(m => buildMatchCard(m, isFinal)).join('')}
                </div>`;
            };

            if (totalRounds === 1) {
                return `<div class="bracket-container-premium" id="bracketSvgContainer">
                    <div class="bracket-part center-part">${buildRound(rounds[0], true)}</div>
                </div>`;
            }

            const finalRound = totalRounds;
            const semiRounds = rounds.filter(r => r < finalRound);
            const halfIndex = Math.ceil(semiRounds.length / 2);
            const leftRounds = semiRounds.slice(0, halfIndex);
            const rightRounds = semiRounds.slice(halfIndex).reverse();

            return `<div class="bracket-container-premium" id="bracketSvgContainer">
                <div class="bracket-part left-part">${leftRounds.map(r => buildRound(r, false)).join('')}</div>
                <div class="bracket-part center-part">${buildRound(finalRound, true)}</div>
                <div class="bracket-part right-part">${rightRounds.map(r => buildRound(r, false)).join('')}</div>
            </div>`;
        }

        function drawBracketLines() {
            const container = document.getElementById('bracketSvgContainer');
            if (!container) return;
            container.querySelectorAll('.bracket-svg').forEach(el => el.remove());

            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.classList.add('bracket-svg');
            svg.setAttribute('preserveAspectRatio', 'none');
            container.appendChild(svg);

            const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
            defs.innerHTML = `<marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/></marker>`;
            svg.appendChild(defs);

            const cRect = container.getBoundingClientRect();
            const drawPath = (d, arrow = false) => {
                const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                p.setAttribute('d', d);
                p.setAttribute('stroke', '#fbbf24');
                p.setAttribute('stroke-width', '2');
                p.setAttribute('fill', 'none');
                p.setAttribute('stroke-linecap', 'round');
                p.setAttribute('stroke-linejoin', 'round');
                if (arrow) p.setAttribute('marker-end', 'url(#arrowGold)');
                svg.appendChild(p);
            };
            const getCY = el => { const r = el.getBoundingClientRect(); return r.top + r.height / 2 - cRect.top; };

            function drawHalfLines(rounds, isRight) {
                for (let i = 0; i < rounds.length - 1; i++) {
                    const cur = rounds[i], nxt = rounds[i + 1];
                    const curMatches = Array.from(cur.querySelectorAll('.match-card'));
                    const nextMatches = Array.from(nxt.querySelectorAll('.match-card'));
                    nextMatches.forEach((nextMatch, idx) => {
                        const nextCY = getCY(nextMatch);
                        const nextRect = nextMatch.getBoundingClientRect();
                        const nextEdgeX = isRight ? nextRect.right - cRect.left : nextRect.left - cRect.left;
                        const src1 = curMatches[idx * 2], src2 = curMatches[idx * 2 + 1];
                        [src1, src2].forEach(src => {
                            if (!src) return;
                            const srcCY = getCY(src);
                            const srcRect = src.getBoundingClientRect();
                            const srcEdgeX = isRight ? srcRect.left - cRect.left : srcRect.right - cRect.left;
                            const midX = (srcEdgeX + nextEdgeX) / 2;
                            drawPath(`M ${srcEdgeX} ${srcCY} L ${midX} ${srcCY} L ${midX} ${nextCY} L ${nextEdgeX} ${nextCY}`, false);
                        });
                    });
                }
            }

            const leftPart = container.querySelector('.bracket-part.left-part');
            const leftRounds = leftPart ? Array.from(leftPart.querySelectorAll('.bracket-round-premium')) : [];
            drawHalfLines(leftRounds, false);
            const rightPart = container.querySelector('.bracket-part.right-part');
            const rightRounds = rightPart ? Array.from(rightPart.querySelectorAll('.bracket-round-premium')) : [];
            drawHalfLines(rightRounds, true);

            const centerPart = container.querySelector('.bracket-part.center-part');
            const finalRound = centerPart ? centerPart.querySelector('.bracket-round-premium') : null;
            const finalMatches = finalRound ? Array.from(finalRound.querySelectorAll('.match-card')) : [];

            if (leftRounds.length && finalMatches.length) {
                const lastLeft = leftRounds[leftRounds.length - 1];
                Array.from(lastLeft.querySelectorAll('.match-card')).forEach((m, idx) => {
                    const cy = getCY(m), r = m.getBoundingClientRect();
                    const startX = r.right - cRect.left;
                    const fm = finalMatches[Math.min(idx, finalMatches.length - 1)];
                    const fr = fm.getBoundingClientRect();
                    const finalCY = getCY(fm);
                    const endX = fr.left - cRect.left;
                    const midX = (startX + endX) / 2;
                    drawPath(`M ${startX} ${cy} L ${midX} ${cy} L ${midX} ${finalCY} L ${endX} ${finalCY}`, true);
                });
            }

            if (rightRounds.length && finalMatches.length) {
                const lastRight = rightRounds[rightRounds.length - 1];
                Array.from(lastRight.querySelectorAll('.match-card')).forEach((m, idx) => {
                    const cy = getCY(m), r = m.getBoundingClientRect();
                    const startX = r.left - cRect.left;
                    const fm = finalMatches[Math.min(idx, finalMatches.length - 1)];
                    const fr = fm.getBoundingClientRect();
                    const finalCY = getCY(fm);
                    const endX = fr.right - cRect.left;
                    const midX = (startX + endX) / 2;
                    drawPath(`M ${startX} ${cy} L ${midX} ${cy} L ${midX} ${finalCY} L ${endX} ${finalCY}`, true);
                });
            }
        }

        function scheduleDrawLines() {
            if (drawLinesTimer) clearTimeout(drawLinesTimer);
            drawLinesTimer = setTimeout(() => requestAnimationFrame(drawBracketLines), 100);
        }

                            <i class="fas fa-info-circle"></i> После генерации набор закроется
                        </p>
                    </div>
                `;
                return;
            }

            function selectedWeightClassesCount() {
                return [...new Set(registrations.filter(r => r.status === 'approved').map(r => r.weightClass))].filter(Boolean).length;
            }
            if (!matches.length) { c.innerHTML = `<div class="empty-state"><i class="fas fa-sitemap"></i><h3>Сетка пуста</h3></div>`; return; }
            renderCategoryFilters('bracketCategoryFilters');
            const fm = selectedCategory ? matches.filter(m => m.weightClass === selectedCategory) : matches;
            c.innerHTML = buildBracketHtml(fm, isOwner);
            scheduleDrawLines();
        }

        window.confirmMatchResult = async function(mid) {
            try {
                const m = matches.find(x => x.id === mid);
                if (!m || !m.fighter1 || !m.fighter2) throw new Error('Не оба бойца известны');
                const winnerId = document.getElementById('modalWinnerId').value;
                const winType = document.getElementById('modalWinType').value;
                const comment = document.getElementById('modalComment').value.trim();
                const winnerData = m.fighter1.id === winnerId ? m.fighter1 : m.fighter2;
                const loserData = m.fighter1.id === winnerId ? m.fighter2 : m.fighter1;
                const frsWinner = winType === 'decision' ? FRS_WIN : FRS_WIN_FINISH;

                await updateDoc(doc(db, `tournaments/${tournamentId}/matches`, mid), {
                    winner: { id: winnerData.id, name: winnerData.name },
                    winType, comment: comment || null, status: 'completed',
                    completedAt: new Date().toISOString()
                });

                try { await updateDoc(doc(db, "fighters", winnerData.id), { frs: increment(frsWinner), wins: increment(1), finishes: winType !== 'decision' ? increment(1) : increment(0), lastFightDate: new Date().toISOString() }); } catch (e) {}
                try { await updateDoc(doc(db, "fighters", loserData.id), { frs: increment(FRS_LOSS), losses: increment(1), lastFightDate: new Date().toISOString() }); } catch (e) {}
                try { await addDoc(collection(db, "fights"), { winnerId: winnerData.id, winnerName: winnerData.name, loserId: loserData.id, loserName: loserData.name, sport: tournamentData.sport || 'ММА', isFinish: winType !== 'decision', date: serverTimestamp(), tournamentId, tournamentName: tournamentData.name }); } catch (e) {}

                const nr = m.round + 1;
                const nm = Math.ceil(m.matchNumber / 2);
                const nextMatch = matches.find(x => x.round === nr && x.matchNumber === nm && x.weightClass === m.weightClass);
                if (nextMatch) {
                    const slot = m.matchNumber % 2 === 1 ? 'fighter1' : 'fighter2';
                    await updateDoc(doc(db, `tournaments/${tournamentId}/matches`, nextMatch.id), { [slot]: winnerData });

                closeModal('resultModal');

        // ============================================================
        // RINGS
        // ============================================================
        function renderRingsBlock() {
            const t = tournamentData;
            if (userRole !== 'organizer') return '';
            if (!isUserOrganizerOfTournament(currentUser?.uid)) return '';

            const ringsCount = t.ringsCount || 1;
            const token = t.judgeToken;
            const ringSessions = t.ringSessions || {};
            const now = Date.now();
            const STALE_MS = 2 * 60 * 1000;

            let onlineCount = 0;
            if (token && t.status === 'active') {
                for (let r = 1; r <= ringsCount; r++) {
                    const s = ringSessions[r];
                    if (!s || !s.lastSeen) continue;
                    const lastSeen = typeof s.lastSeen === 'number'
                        ? s.lastSeen
                        : (s.lastSeen.toMillis ? s.lastSeen.toMillis() : new Date(s.lastSeen).getTime());
                    if (now - lastSeen < STALE_MS) onlineCount++;
                }
            }

            const completed = matches.filter(m => m.status === 'completed').length;
            const total = matches.filter(m => m.round === 1 && m.status !== 'bye').length;

            return `
                <div class="panel">
                    <div class="panel-header">
                        <h3><i class="fas fa-circle-nodes"></i> Столы и судьи</h3>
                    </div>
                    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;">
                        <div style="font-size: 0.8rem; color: #aaa;">
                            <b style="color: #fbbf24;">${ringsCount}</b> ${plural(ringsCount, 'стол', 'стола', 'столов')}

        window.saveRingsCount = async function() {

            const count = parseInt(input.value) || 1;
            if (count < 1 || count > 20) { showToast('От 1 до 20', 'error'); return; }
            try {
                await updateDoc(doc(db, "tournaments", tournamentId), {
                    ringsCount: count,
                    updatedAt: new Date().toISOString()
                });
                tournamentData.ringsCount = count;
                showToast(`✅ Столов: ${count}`, 'success');

        window.applyDistribution = async function() {
            const input = document.getElementById('ringsCountInput');
            const ringsCount = parseInt(input?.value) || tournamentData.ringsCount || 1;

            if (ringsCount < 1 || ringsCount > 20) { showToast('От 1 до 20 столов', 'error'); return; }

            const firstRoundMatches = matches.filter(m => m.round === 1 && m.status !== 'bye');
            if (!firstRoundMatches.length) { showToast('Нет боёв для распределения', 'error'); return; }

            const ok = await showConfirm(
                'Применить распределение?',
                `<div>Распределить <strong>${firstRoundMatches.length}</strong> ${plural(firstRoundMatches.length, 'бой', 'боя', 'боёв')} между <strong>${ringsCount}</strong> ${plural(ringsCount, 'столом', 'столами', 'столами')}?</div>`,
                'Применить'
            );
            if (!ok) return;

            const sorted = [...firstRoundMatches].sort((a, b) =>
                (a.weightClass || '').localeCompare(b.weightClass || '') ||
                a.matchNumber - b.matchNumber
            );

            const assignments = {};

            if (distributionMode === 'round-robin') {
                let ringCounter = 0;
                sorted.forEach(m => {
                    ringCounter++;
                    assignments[m.id] = ((ringCounter - 1) % ringsCount) + 1;
                });
            } else {
                const byCat = {};
                sorted.forEach(m => {
                    const cat = m.weightClass || 'Все';
                    if (!byCat[cat]) byCat[cat] = [];
                    byCat[cat].push(m);
                });
                Object.keys(byCat).forEach((cat, idx) => {
                    const ringId = (idx % ringsCount) + 1;
                    byCat[cat].forEach(m => { assignments[m.id] = ringId; });
                });
            }

            try {
                const batch = writeBatch(db);
                batch.update(doc(db, "tournaments", tournamentId), {
                    ringsCount,
                    distributedAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                });
                for (const [mid, ringId] of Object.entries(assignments)) {
                    batch.update(doc(db, `tournaments/${tournamentId}/matches`, mid), { ringId });
                }
                await batch.commit();

                tournamentData.ringsCount = ringsCount;
                await loadMatches();
                renderOverview();
                showToast(`✅ Распределено ${sorted.length} боёв`, 'success');
            } catch (e) {
                console.error(e);
                showToast('Ошибка: ' + e.message, 'error');
            }
        };

            // ===== Сессии и статусы =====
            const now = Date.now();
            const STALE_MS = 2 * 60 * 1000;
            function getRingStatus(ringId) {
                const ringSessions = tournamentData.ringSessions || {};
                const session = ringSessions[ringId];
                if (!session || !session.lastSeen) return { cls: 'offline', label: 'Не подключился' };

                    ? session.lastSeen
                    : (session.lastSeen.toMillis ? session.lastSeen.toMillis() : new Date(session.lastSeen).getTime());
                const diff = now - lastSeen;
                if (diff < STALE_MS) return { cls: 'online', label: session.judgeName || 'Онлайн' };

                return { cls: 'stale', label: `Был ${min} мин назад` };

                            </button>

            // ===== 2. СТОЛЫ + СЧЁТЧИК =====

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; flex-wrap: wrap;">

        // ===== Счётчик столов =====
        window.changeRingsCount = async function(delta) {
            const current = tournamentData.ringsCount || 1;
            const next = current + delta;
            if (next < 1 || next > 15) {
                showToast(delta > 0 ? 'Максимум 15 столов' : 'Минимум 1 стол', 'error');
                return;
            }
            try {
                await updateDoc(doc(db, "tournaments", tournamentId), {
                    ringsCount: next,
                    updatedAt: new Date().toISOString()
                });
                tournamentData.ringsCount = next;
                openJudgesPanel(); // перерисовать модалку
                showToast(`Столов: ${next}`, 'success');
            } catch (e) {
                showToast('Ошибка: ' + e.message, 'error');
            }
        };

        // ===== Раскрыть/скрыть опции распределения =====
        window.toggleDistOptions = function() {
            const el = document.getElementById('distOptions');
            if (!el) return;
            el.style.display = el.style.display === 'none' ? 'block' : 'none';
        };

        // ===== Режим распределения =====
        window.setDistMode = function(mode) {
            document.querySelectorAll('.dist-mode-btn').forEach(b => {
                const isActive = b.dataset.mode === mode;
                b.style.background = isActive ? 'rgba(251,191,36,0.12)' : 'rgba(255,255,255,0.03)';
                b.style.borderColor = isActive ? 'rgba(251,191,36,0.5)' : 'rgba(255,255,255,0.08)';
                b.style.color = isActive ? '#fbbf24' : '#888';
            });
            window.__distMode = mode;
        };

        // ===== Применить распределение из модалки =====
        window.applyDistributionFromModal = async function() {
            const mode = window.__distMode || 'round-robin';
            const ringsCount = tournamentData.ringsCount || 1;
            const firstRoundMatches = matches.filter(m => m.round === 1 && m.status !== 'bye');
            if (!firstRoundMatches.length) {
                showToast('Нет боёв для распределения', 'error');
                return;
            }

            const sorted = [...firstRoundMatches].sort((a, b) =>
                (a.weightClass || '').localeCompare(b.weightClass || '') ||
                a.matchNumber - b.matchNumber
            );

            const assignments = {};

            if (mode === 'round-robin') {
                sorted.forEach((m, i) => {
                    assignments[m.id] = (i % ringsCount) + 1;
                });
            } else if (mode === 'by-category') {
                const byCat = {};
                sorted.forEach(m => {
                    const cat = m.weightClass || 'Все';
                    if (!byCat[cat]) byCat[cat] = [];
                    byCat[cat].push(m);
                });
                Object.keys(byCat).forEach((cat, idx) => {
                    const ringId = (idx % ringsCount) + 1;
                    byCat[cat].forEach(m => { assignments[m.id] = ringId; });
                });
            } else if (mode === 'random') {
                const shuffled = [...sorted].sort(() => Math.random() - 0.5);
                shuffled.forEach((m, i) => {
                    assignments[m.id] = (i % ringsCount) + 1;
                });
            }

            try {
                const batch = writeBatch(db);
                batch.update(doc(db, "tournaments", tournamentId), {
                    ringsCount,
                    distributedAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                });
                for (const [mid, ringId] of Object.entries(assignments)) {
                    batch.update(doc(db, `tournaments/${tournamentId}/matches`, mid), { ringId });
                }
                await batch.commit();

                await loadMatches();
                openJudgesPanel();
                showToast(`✅ Распределено ${sorted.length} боёв`, 'success');
            } catch (e) {
                console.error(e);
                showToast('Ошибка: ' + e.message, 'error');
            }
        };

        // ===== Изменение количества столов из модалки =====
        window.changeRingsCount = async function(delta) {
            const current = tournamentData.ringsCount || 1;
            const next = current + delta;
            if (next < 1 || next > 15) {
                showToast(delta > 0 ? 'Максимум 15 столов' : 'Минимум 1 стол', 'error');
                return;
            }
            try {
                await updateDoc(doc(db, "tournaments", tournamentId), {
                    ringsCount: next,
                    updatedAt: new Date().toISOString()
                });
                tournamentData.ringsCount = next;
                // перерисовать список
                const inner = document.getElementById('ringsListInner');
                if (inner) inner.innerHTML = window.__renderRingsList();
                const label = document.getElementById('ringsCountLabel');
                if (label) label.textContent = next;
                showToast(`Столов: ${next}`, 'success');
            } catch (e) {
                showToast('Ошибка: ' + e.message, 'error');
            }
        };

        // ===== Отправить одному судье =====
        window.sendJudgeLink = function(ringId) {
            if (!tournamentData.judgeToken) {
                showToast('Сначала создайте токен', 'error');
                return;
            }
            const token = tournamentData.judgeToken;
            const baseUrl = window.location.origin + window.location.pathname.replace(/tournament-details\.html.*$/, 'live-judging.html');
            const panelUrl = `${baseUrl}?id=${tournamentId}&ring=${ringId}&k=${token}`;
            const displayUrl = `${baseUrl}?id=${tournamentId}&ring=${ringId}&role=display`;
            const tournamentName = tournamentData.name || 'Турнир';

            const text = `🥊 Стол ${ringId} · ${tournamentName}

        📱 Панель судьи (открой на ноутбуке):
        ${panelUrl}

        📺 Табло (открой на втором экране через HDMI):
        ${displayUrl}

        Как настроить (2 минуты):
        1. Подключи ТВ к ноутбуку через HDMI
        2. Windows: Win+P → «Расширить экран»
        3. Открой ссылку №1 — это твоя рабочая панель
        4. Перетащи второе окно браузера на ТВ, открой ссылку №2
        5. F11 на ТВ-окне — полный экран`;

            copyToClipboard(text, `✅ Сообщение для судьи стола ${ringId} скопировано`);
        };

        // ===== Скопировать все ссылки =====
        window.copyAllJudgeLinks = function() {
            if (!tournamentData.judgeToken) {
                showToast('Сначала создайте токен', 'error');
                return;
            }
            const token = tournamentData.judgeToken;
            const ringsCount = tournamentData.ringsCount || 1;
            const baseUrl = window.location.origin + window.location.pathname.replace(/tournament-details\.html.*$/, 'live-judging.html');
            const tournamentName = tournamentData.name || 'Турнир';

            let text = `🏆 ${tournamentName}\n\nСсылки для судей и табло\n\n`;

            for (let r = 1; r <= ringsCount; r++) {
                const panelUrl = `${baseUrl}?id=${tournamentId}&ring=${r}&k=${token}`;
                const displayUrl = `${baseUrl}?id=${tournamentId}&ring=${r}&role=display`;
                text += `━━━ СТОЛ ${r} ━━━\n`;
                text += `📱 Панель: ${panelUrl}\n`;
                text += `📺 Табло: ${displayUrl}\n\n`;
            }

            text += `Как настроить: подключи ТВ по HDMI, открой панель на ноуте, табло на ТВ (Win+P → Расширить).`;

            copyToClipboard(text, `✅ Все ссылки (${ringsCount} столов) скопированы`);
        };

        window.generateJudgeToken = async function() {
            const rand = () => Math.random().toString(36).slice(2, 10);
            const token = 'prk_' + rand() + rand().slice(0, 2);
            try {
                await updateDoc(doc(db, "tournaments", tournamentId), {
                    judgeToken: token,
                    judgeTokenCreatedAt: serverTimestamp()
                });
                tournamentData.judgeToken = token;
                showToast('🔑 Токен создан', 'success');
                openJudgesPanel();
            } catch (e) { showToast('Ошибка: ' + e.message, 'error'); }
        };

        window.regenerateJudgeToken = async function() {
            const ok = await showConfirm(
                'Перегенерировать токен?',
                '<div>Старые ссылки судей перестанут работать. Придётся отправить новые.</div>',
                'Обновить'
            );
            if (!ok) return;
            await generateJudgeToken();
        };

        function buildJudgeUrl(role) {
            const url = new URL(window.location.href);
            url.pathname = url.pathname.replace(/tournament-details\.html$/, 'live-judging.html');
            url.search = '';
            url.searchParams.set('id', tournamentId);
            const token = tournamentData.judgeToken || '';
            if (role === 'chief') {
                url.searchParams.set('role', 'chief');
                url.searchParams.set('k', token);
            } else {
                url.searchParams.set('ring', role);
                url.searchParams.set('k', token);
            }
            return url.toString();
        }

        function buildDisplayUrl(ring) {
            const url = new URL(window.location.href);
            url.pathname = url.pathname.replace(/tournament-details\.html$/, 'live-judging.html');
            url.search = '';
            url.searchParams.set('id', tournamentId);
            url.searchParams.set('ring', ring);
            url.searchParams.set('role', 'display');
            return url.toString();
        }

        function buildDisplayGridUrl() {
            const url = new URL(window.location.href);
            url.pathname = url.pathname.replace(/tournament-details\.html$/, 'live-judging.html');
            url.search = '';
            url.searchParams.set('id', tournamentId);
            url.searchParams.set('role', 'display');
            return url.toString();
        }

        function copyToClipboard(url, successMsg) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(url).then(() => showToast(successMsg, 'success'));
            } else {
                const t = document.createElement('textarea');
                t.value = url;
                document.body.appendChild(t);
                t.select();
                document.execCommand('copy');
                t.remove();
                showToast(successMsg, 'success');
            }
        }

        window.copyJudgeLink = function(role) {
            if (!tournamentData.judgeToken) { showToast('Сначала создайте токен', 'error'); return; }
            copyToClipboard(buildJudgeUrl(role), '✅ Ссылка судьи скопирована');
        };

        window.openJudgeLink = function(role) {
            if (!tournamentData.judgeToken) { showToast('Сначала создайте токен', 'error'); return; }
            window.open(buildJudgeUrl(role), '_blank');
        };

        window.copyDisplayLink = function(ring) {
            copyToClipboard(buildDisplayUrl(ring), `✅ Ссылка табло стола ${ring} скопирована`);
        };

        window.openDisplayLink = function(ring) {
            window.open(buildDisplayUrl(ring), '_blank');
        };

        window.copyDisplayGridLink = function() {
            copyToClipboard(buildDisplayGridUrl(), '✅ Ссылка общего табло скопирована');
        };

        window.openDisplayGridLink = function() {
            window.open(buildDisplayGridUrl(), '_blank');
        };

        // ============================================================
        // РЕГИСТРАЦИЯ
        // ============================================================
        window.openRegisterModal = async function() {
            if (!currentUser) { window.location.href = 'login.html'; return; }

            const existing = registrations.find(r =>
                r.fighterId === currentUser.uid &&
                (r.status === 'approved' || r.status === 'pending')
            );
            if (existing) { showToast('Вы уже записаны на этот турнир', 'error'); return; }

            let balance = 0;
            try {
                const balDoc = await getDoc(doc(db, "wallet_balances", currentUser.uid));
                if (balDoc.exists()) balance = balDoc.data().available || 0;
            } catch (e) {}

            const fee = tournamentData.entryFee || 0;
            const hasEnough = balance >= fee;

            const fighterWeight = currentFighterData?.weight || 0;
            const tournamentClasses = Array.isArray(tournamentData.weightClasses) ? tournamentData.weightClasses : [];

            let suggestedWeightClass = '';
            if (fighterWeight > 0) {
                for (const wc of WEIGHT_CLASSES) {
                    if (fighterWeight >= wc.min && fighterWeight <= wc.max) {
                        const full = `${wc.name} (${wc.range})`;
                        if (tournamentClasses.includes(full)) { suggestedWeightClass = full; break; }
                    }
                }
            }

            const fighterSport = currentFighterData?.sport || '';
            const tournamentSport = tournamentData.sport || '';
            const sportMismatch = fighterSport && tournamentSport && fighterSport !== tournamentSport;

            const weightOptions = tournamentClasses.map(wc =>
                `<option value="${wc}" ${wc === suggestedWeightClass ? 'selected' : ''}>${escapeHtml(wc)}</option>`
            ).join('');

            document.getElementById('registerModalContent').innerHTML = `
                <div class="reg-info-row"><span class="label">Турнир</span><span class="value">${escapeHtml(tournamentData.name)}</span></div>
                <div class="reg-info-row"><span class="label">Дата</span><span class="value">${formatDate(tournamentData.date)}</span></div>
                <div class="reg-info-row"><span class="label">Ваш вес</span><span class="value">${fighterWeight > 0 ? fighterWeight + ' кг' : 'Не указан'}</span></div>
                <div class="reg-info-row"><span class="label">Ваш спорт</span><span class="value">${escapeHtml(fighterSport || '—')}</span></div>

                <div class="form-group" style="margin-top:14px;">
                    <label>Весовая категория *</label>
                    <select id="regWeightClass" class="form-select">
                        <option value="">-- Выберите весовую --</option>
                        ${weightOptions}
                    </select>
                </div>

                ${sportMismatch ? `
                    <div style="background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.3);border-radius:10px;padding:10px;margin-top:10px;font-size:0.75rem;color:#fcd34d;">
                        <i class="fas fa-exclamation-triangle"></i>
                        Вы — <b>${escapeHtml(fighterSport)}</b>, турнир по <b>${escapeHtml(tournamentSport)}</b>. Уверены?
                    </div>
                ` : ''}

                <div class="reg-info-row" style="border-top:1px solid rgba(255,255,255,0.1);padding-top:12px;margin-top:14px;">
                    <span class="label" style="font-size:0.95rem;font-weight:700;color:#fff;">Взнос</span>
                    <span class="value highlight">${fee.toLocaleString('ru-RU')} ₽</span>
                </div>

                <div class="reg-info-row">
                    <span class="label">Баланс</span>
                    <span class="value" style="color:${hasEnough ? '#10b981' : '#ef4444'};">${balance.toLocaleString('ru-RU')} ₽</span>
                </div>

                ${!hasEnough ? `
                    <div style="background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.3);border-radius:10px;padding:10px;margin-top:10px;font-size:0.75rem;color:#fca5a5;">
                        <i class="fas fa-exclamation-circle"></i>
                        Недостаточно средств. Нужно ещё <b>${(fee - balance).toLocaleString('ru-RU')} ₽</b>
                    </div>
                    <button class="btn btn-primary btn-large" onclick="window.location.href='buyer-wallet.html'" style="width:100%;justify-content:center;margin-top:16px;">
                        <i class="fas fa-plus-circle"></i> Пополнить баланс
                    </button>
                ` : `
                    <button class="btn btn-primary btn-large" onclick="processRegistration()" style="width:100%;justify-content:center;margin-top:16px;">
                        <i class="fas fa-check"></i> Оплатить ${fee.toLocaleString('ru-RU')} ₽ и записаться
                    </button>
                `}
            `;

            openModal('registerModal');
        };

        window.processRegistration = async function() {
            if (isRegistering) return;
            if (!currentUser) return;
            isRegistering = true;

            try {
                const weightClassStr = document.getElementById('regWeightClass')?.value || '';
                if (!weightClassStr) { showToast('Выберите весовую категорию', 'error'); return; }

                const fee = tournamentData.entryFee || 0;
                const fighterWeight = currentFighterData?.weight || null;
                const fighterClub = currentFighterData?.clubName || null;

                await OrganizerWallet.payEntry({
                    fighterId: currentUser.uid,
                    fighterName: currentFighterData?.name || 'Боец',
                    fighterWeight,
                    fighterClub,
                    amount: fee,
                    tournamentId,
                    tournamentName: tournamentData.name,
                    organizationId: tournamentData.organizationId,
                    weightClass: weightClassStr,
                    paymentMethod: 'balance'
                });

                showToast('✅ Вы записаны! Оплата прошла', 'success');
                closeModal('registerModal');

                await loadRegistrations();
                await loadTournament(tournamentId);
                renderOverview(); renderTabs(); renderStickyCta();
            } catch (e) {
                console.error(e);
                showToast('❌ ' + (e.message || 'Ошибка записи'), 'error');
            } finally {
                isRegistering = false;
            }
        };

        window.cancelMyRegistration = async function(rid) {
            if (tournamentData.status !== 'registration') { showToast('❌ Турнир начался', 'error'); return; }
            const r = registrations.find(x => x.id === rid);
            if (!r) return;
            const paid = r.paymentStatus === 'paid';
            const ok = await showConfirm('Отменить заявку?', `<div>Ваша заявка будет отменена</div>${paid ? `<div class="info-box">${r.paymentAmount} ₽ вернётся</div>` : ''}`, 'Отменить');
            if (!ok) return;
            try {
                if (paid && r.paymentAmount > 0) {
                    await OrganizerWallet.refundEntry(r.fighterId, tournamentId, 'Отмена бойцом');
                }
                await deleteDoc(doc(db, "tournament_registrations", rid));
                myRegistration = null;
                await loadRegistrations(); await loadTournament(tournamentId);
                renderOverview(); renderTabs(); renderStickyCta();
                showToast('✅ Отменена', 'success');
            } catch (e) { showToast('Ошибка', 'error'); }
        };

        // ============================================================
        // РАССЫЛКА
        // ============================================================
        document.getElementById('broadcastBtn')?.addEventListener('click', () => openModal('broadcastModal'));
        document.getElementById('sendBroadcastBtn')?.addEventListener('click', async () => {
            const msg = document.getElementById('broadcastMessage').value.trim();
            if (!msg) return showToast('Введите сообщение', 'error');
            try {
                await addDoc(collection(db, "notifications"), { tournamentId, type: 'broadcast', message: msg, recipients: registrations.filter(r => r.status === 'approved').map(r => r.fighterId), createdAt: serverTimestamp() });
                showToast('✅ Отправлено', 'success');
                closeModal('broadcastModal');
                document.getElementById('broadcastMessage').value = '';
            } catch (e) { showToast('Ошибка', 'error'); }
        });

        document.getElementById('exportCsvBtn')?.addEventListener('click', () => {
            const a = registrations.filter(r => r.status === 'approved');
            if (!a.length) return showToast('Нет данных', 'error');
            const csv = ['Имя,Вес,Клуб,Категория,Оплата'];
            a.forEach(r => csv.push(`"${r.fighterName || ''}","${r.fighterWeight || ''}","${r.fighterClub || ''}","${r.weightClass || ''}","${r.paymentStatus || ''}"`));
            const blob = new Blob(['\uFEFF' + csv.join('\n')], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `participants_${new Date().toISOString().slice(0, 10)}.csv`;
            link.click();
            showToast('✅ Скачано', 'success');
        });

        async function checkRegisterParam() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('register') === '1' && currentUser && tournamentData.status === 'registration' && !tournamentData.deleted) {
                const existing = registrations.find(r => r.fighterId === currentUser.uid);
                if (!existing || existing.status === 'rejected') {
                    setTimeout(() => openRegisterModal(), 400);
                    window.history.replaceState(null, '', `?id=${tournamentId}`);
                }
            }
        }

        document.getElementById('menuToggle')?.addEventListener('click', () => document.getElementById('navLinks').classList.toggle('show'));

        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            try { await OrganizerWallet.ensureEscrowAccount(); } catch (e) { console.warn('escrow init', e); }
            const id = new URLSearchParams(window.location.search).get('id');
            if (!id) { window.location.href = 'index.html'; return; }
            await loadTournament(id);
            if (!tournamentData) return;
            if (user) {
                await loadFighterData(user.uid);
                myOrgId = await getUserOrgId(user.uid);
                userRole = isUserOrganizerOfTournament(user.uid) ? 'organizer' : 'fighter';
            } else userRole = 'guest';
            escrowAmount = tournamentData.escrowAmount || 0;
            renderHeader();
            subscribeToRegistrations();
            subscribeToTournament();
            await loadMatches();

            renderTabs();
            renderOverview();
            renderParticipants();
            renderBracket();
            renderResults();
            renderStickyCta();

            await checkRegisterParam();
        });

        window.addEventListener('beforeunload', () => {
            if (registrationsUnsubscribe) registrationsUnsubscribe();
            if (tournamentUnsubscribe) tournamentUnsubscribe();
        });
    </script>
</body>
</html>
