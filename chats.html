<!DOCTYPE html>
<html lang="ru">
<head>
    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PRORANK">
    <meta name="theme-color" content="#fbbf24">
    <meta name="mobile-web-app-capable" content="yes">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#fbbf24">
    <meta name="description" content="Чаты PRORANK — общайся с соперниками после принятых вызовов">
    <title>Чаты | PRORANK</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(ellipse at 30% 40%, rgba(251, 191, 36, 0.15) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 80%, rgba(251, 191, 36, 0.08) 0%, transparent 50%),
                        linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 40%, #1a1a1a 100%);
            background-attachment: fixed;
            color: #fff;
            line-height: 1.4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
        }

        .gold-top {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #fbbf24, #ffdd88, #fbbf24, #b8860b);
            z-index: 1001;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px;
            position: relative;
            z-index: 2;
            width: 100%;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(251, 191, 36, 0.25);
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            cursor: pointer;
            background: linear-gradient(135deg, #ffffff, #fbbf24);
            background-clip: text;
            color: transparent;
            transition: transform 0.2s ease;
        }

        .logo:hover {
            transform: scale(1.02);
        }

        .logo span {
            background: linear-gradient(135deg, #fbbf24, #ffdd77);
            background-clip: text;
            color: transparent;
        }

        .balance-indicator {
            background: #111;
            border: 1px solid rgba(251, 191, 36, 0.5);
            border-radius: 60px;
            padding: 7px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .balance-indicator:hover {
            border-color: #fbbf24;
            box-shadow: 0 0 15px rgba(251,191,36,0.2);
        }

        .balance-count {
            color: #fbbf24;
            font-size: 1.1rem;
        }

        .balance-plus {
            background: rgba(251,191,36,0.15);
            border: none;
            color: #fbbf24;
            cursor: pointer;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .balance-plus:hover {
            background: rgba(251,191,36,0.3);
            transform: scale(1.05);
        }

        .balance-plus:active {
            background: #fbbf24;
            color: #000;
            transform: scale(0.94);
        }

        .menu-toggle {
            display: none;
            background: rgba(251,191,36,0.1);
            border: 1px solid #fbbf24;
            color: #fbbf24;
            font-size: 1.6rem;
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 12px;
            transition: all 0.2s ease;
            min-height: 44px;
            min-width: 44px;
        }

        .menu-toggle:hover {
            background: rgba(251,191,36,0.2);
            transform: scale(1.02);
        }

        .menu-toggle:active {
            transform: scale(0.95);
        }

        .nav-links {
            display: flex;
            gap: 6px;
            background: rgba(15,15,15,0.7);
            backdrop-filter: blur(12px);
            padding: 5px 14px;
            border-radius: 60px;
            border: 1px solid rgba(251,191,36,0.2);
        }

        .nav-links a {
            color: #ddd;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 8px 18px;
            border-radius: 40px;
            transition: all 0.2s ease;
        }

        .nav-links a i {
            margin-right: 8px;
            color: #fbbf24;
            transition: transform 0.2s ease;
        }

        .nav-links a:hover {
            color: #fbbf24;
            background: rgba(251,191,36,0.1);
            transform: translateY(-2px);
        }

        .nav-links a:hover i {
            transform: scale(1.1);
        }

        .page-header {
            text-align: center;
            padding: 40px 20px 20px;
            animation: fadeInUp 0.5s ease;
        }

        .page-header h1 {
            font-size: clamp(1.6rem, 5vw, 2rem);
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #fbbf24);
            background-clip: text;
            color: transparent;
        }

        .page-header h1 i {
            background: none;
            background-clip: unset;
            color: #fbbf24;
        }

        .page-header p {
            color: #aaa;
            margin-top: 8px;
            font-size: clamp(0.8rem, 3vw, 0.9rem);
        }

        /* ===== ПОИСК ===== */
        .search-container {
            margin-bottom: 16px;
        }

        .search-input-wrap {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(15,15,15,0.7);
            border-radius: 40px;
            border: 1px solid rgba(251,191,36,0.15);
            transition: all 0.3s ease;
            padding: 0 16px;
        }

        .search-input-wrap:focus-within {
            border-color: #fbbf24;
            box-shadow: 0 0 20px rgba(251,191,36,0.1);
        }

        .search-input-wrap i {
            color: #666;
            font-size: 0.9rem;
        }

        #searchChats {
            width: 100%;
            padding: 12px 14px;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            outline: none;
        }

        #searchChats::placeholder {
            color: #555;
        }

        .search-clear {
            color: #555;
            cursor: pointer;
            padding: 4px 8px;
            display: none;
            font-size: 0.8rem;
        }

        .search-clear.show {
            display: block;
        }

        .search-clear:hover {
            color: #fff;
        }

        /* ===== ВЕРХНЯЯ ПАНЕЛЬ ===== */
        .chats-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .chats-stats {
            font-size: 0.75rem;
            color: #666;
        }

        .chats-stats span {
            color: #fbbf24;
            font-weight: 600;
        }

        .new-chat-btn {
            background: rgba(251,191,36,0.15);
            border: 1px solid rgba(251,191,36,0.3);
            color: #fbbf24;
            padding: 8px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .new-chat-btn:hover {
            background: rgba(251,191,36,0.25);
            transform: translateY(-2px);
        }

        .new-chat-btn:active {
            transform: scale(0.97);
        }

        /* ===== СПИСОК ЧАТОВ ===== */
        .chats-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 40px;
        }

        .chat-group-label {
            font-size: 0.7rem;
            color: #555;
            padding: 12px 0 6px 4px;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 4px;
        }

        .chat-item {
            background: rgba(15,15,15,0.7);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(251,191,36,0.1);
            animation: fadeInUp 0.3s ease both;
            position: relative;
        }

        .chat-item.pinned {
            border-color: rgba(251,191,36,0.4);
            background: rgba(251,191,36,0.05);
        }

        .chat-item.hidden {
            display: none;
        }

        .chat-item:nth-child(1) { animation-delay: 0.03s; }
        .chat-item:nth-child(2) { animation-delay: 0.06s; }
        .chat-item:nth-child(3) { animation-delay: 0.09s; }
        .chat-item:nth-child(4) { animation-delay: 0.12s; }
        .chat-item:nth-child(5) { animation-delay: 0.15s; }

        .chat-item:hover {
            transform: translateX(6px);
            border-color: rgba(251,191,36,0.3);
            background: rgba(25,25,35,0.9);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .chat-item:active {
            transform: scale(0.99);
        }

        .chat-item .chat-avatar-wrap {
            position: relative;
            flex-shrink: 0;
        }

        .chat-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(251,191,36,0.3);
            flex-shrink: 0;
            transition: transform 0.2s ease;
        }

        .chat-item:hover .chat-avatar {
            transform: scale(1.05);
        }

        .chat-online-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            background: #22c55e;
            border: 2px solid #0f0f0f;
            border-radius: 50%;
            display: none;
        }

        .chat-online-dot.show {
            display: block;
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-name-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 2px;
        }

        .chat-name {
            font-size: 1rem;
            font-weight: 700;
        }

        .chat-name .premium-icon {
            font-size: 0.7rem;
        }

        .chat-league-icon {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }

        .chat-last-message {
            font-size: 0.75rem;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .chat-last-message .my-message {
            color: #fbbf24;
            font-weight: 600;
        }

        .chat-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            flex-shrink: 0;
        }

        .chat-time {
            font-size: 0.6rem;
            color: #555;
        }

        .chat-time.today {
            color: #fbbf24;
        }

        .unread-badge {
            background: #fbbf24;
            color: #000;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 2px 9px;
            border-radius: 20px;
            min-width: 20px;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        /* ===== КНОПКА ТРИ ТОЧКИ ===== */
        .chat-more-btn {
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 6px 8px;
            border-radius: 50%;
            transition: all 0.2s ease;
            flex-shrink: 0;
            line-height: 1;
        }

        .chat-more-btn:hover {
            color: #fbbf24;
            background: rgba(251,191,36,0.1);
        }

        .chat-more-btn:active {
            transform: scale(0.9);
        }

        .chat-item.blocked {
            opacity: 0.5;
        }

        .chat-item.blocked .chat-last-message {
            color: #ef4444;
        }

        /* ===== МЕНЮ ДЕЙСТВИЙ (ТРИ ТОЧКИ) ===== */
        .action-menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 9998;
            animation: fadeIn 0.2s ease;
        }

        .action-menu {
            position: fixed;
            background: #1a1a2e;
            border: 1px solid rgba(251,191,36,0.15);
            border-radius: 16px;
            padding: 8px 0;
            min-width: 200px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            z-index: 9999;
            animation: slideUp 0.2s ease;
            overflow: hidden;
        }

        .action-menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #ddd;
            font-size: 0.85rem;
            font-weight: 500;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-family: 'Inter', sans-serif;
        }

        .action-menu-item:hover {
            background: rgba(255,255,255,0.05);
        }

        .action-menu-item:active {
            transform: scale(0.98);
        }

        .action-menu-item i {
            width: 20px;
            text-align: center;
            font-size: 0.9rem;
            color: #666;
        }

        .action-menu-item .item-label {
            flex: 1;
        }

        .action-menu-item.danger {
            color: #ef4444;
        }

        .action-menu-item.danger i {
            color: #ef4444;
        }

        .action-menu-item.danger:hover {
            background: rgba(239,68,68,0.1);
        }

        .action-menu-item.warning {
            color: #f59e0b;
        }

        .action-menu-item.warning i {
            color: #f59e0b;
        }

        .action-menu-item.warning:hover {
            background: rgba(245,158,11,0.1);
        }

        .action-menu-item.pin-action {
            color: #fbbf24;
        }

        .action-menu-item.pin-action i {
            color: #fbbf24;
        }

        .action-menu-item.pin-action:hover {
            background: rgba(251,191,36,0.1);
        }

        .action-menu-divider {
            height: 1px;
            background: rgba(255,255,255,0.05);
            margin: 4px 16px;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== ПУСТОЕ СОСТОЯНИЕ ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .empty-state .icon-wrap {
            font-size: 3.5rem;
            margin-bottom: 16px;
            color: #333;
            display: block;
        }

        .empty-state h3 {
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 0.85rem;
            color: #666;
            max-width: 400px;
            margin: 0 auto;
        }

        .empty-state .actions-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .empty-state .action-btn {
            background: rgba(251,191,36,0.15);
            border: 1px solid rgba(251,191,36,0.3);
            color: #fbbf24;
            padding: 10px 24px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .empty-state .action-btn:hover {
            background: rgba(251,191,36,0.25);
            transform: translateY(-2px);
        }

        /* ===== МОДАЛЬНОЕ ОКНО ПОДТВЕРЖДЕНИЯ ===== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }

        .modal {
            background: #1a1a2e;
            border: 1px solid rgba(251,191,36,0.2);
            border-radius: 20px;
            padding: 32px 24px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            animation: fadeInUp 0.2s ease;
        }

        .modal h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: #fff;
        }

        .modal p {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .modal .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .modal .actions button {
            padding: 10px 32px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
        }

        .modal .cancel-btn {
            background: rgba(255,255,255,0.08);
            color: #fff;
        }

        .modal .cancel-btn:hover {
            background: rgba(255,255,255,0.15);
        }

        .modal .danger-btn {
            background: #ef4444;
            color: #fff;
        }

        .modal .danger-btn:hover {
            background: #dc2626;
            transform: scale(1.02);
        }

        .modal .warning-btn {
            background: #f59e0b;
            color: #000;
        }

        .modal .warning-btn:hover {
            background: #d97706;
            transform: scale(1.02);
        }

        /* ===== ПОДВАЛ ===== */
        .main-footer {
            background: #0a0a0a;
            border-top: 1px solid rgba(251,191,36,0.15);
            margin-top: 40px;
            padding: 40px 0 24px;
        }

        .footer-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 32px;
            margin-bottom: 32px;
        }

        .footer-logo .logo {
            font-size: 1.3rem;
            display: inline-block;
        }

        .footer-logo p {
            font-size: 0.7rem;
            color: #777;
            margin-top: 6px;
        }

        .footer-social {
            display: flex;
            gap: 20px;
        }

        .social-icon {
            color: #aaa;
            font-size: 1.3rem;
            transition: all 0.2s ease;
        }

        .social-icon:hover {
            color: #fbbf24;
            transform: translateY(-3px);
        }

        .footer-links {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: #888;
            text-decoration: none;
            font-size: 0.75rem;
            transition: color 0.2s ease;
        }

        .footer-links a:hover {
            color: #fbbf24;
        }

        .footer-bottom {
            text-align: center;
            padding-top: 24px;
            border-top: 1px solid rgba(255,255,255,0.05);
            font-size: 0.65rem;
            color: #555;
        }

        /* ===== АНИМАЦИИ ===== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 768px) {
            .container {
                padding: 0 16px;
            }
            
            .navbar {
                padding: 12px 18px;
            }
            
            .menu-toggle {
                display: block;
            }
            
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 68px;
                left: 18px;
                right: 18px;
                background: #0f0f0f;
                border-radius: 24px;
                padding: 20px;
                gap: 10px;
                border: 1px solid rgba(251,191,36,0.3);
                z-index: 1000;
                backdrop-filter: blur(20px);
            }
            
            .nav-links.show {
                display: flex;
                animation: fadeIn 0.2s ease;
            }
            
            .nav-links a {
                width: 100%;
                text-align: center;
                padding: 12px;
            }
            
            .page-header h1 {
                font-size: 1.6rem;
            }

            .chat-item {
                padding: 14px 14px;
                gap: 12px;
                border-radius: 16px;
            }

            .chat-avatar {
                width: 44px;
                height: 44px;
            }

            .chat-name {
                font-size: 0.9rem;
            }

            .chat-last-message {
                font-size: 0.7rem;
                max-width: 150px;
            }

            .chat-time {
                font-size: 0.55rem;
            }

            .chats-toolbar {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }

            .new-chat-btn {
                justify-content: center;
            }

            .footer-inner {
                flex-direction: column;
                text-align: center;
            }

            .action-menu {
                min-width: 180px;
                left: 50% !important;
                transform: translateX(-50%) !important;
                bottom: 20px;

    <script type="module" src="header.js"></script>
    <script type="module">
        import { initializeApp } from "firebase/app";
        import { 
            getFirestore, 
            collection, getDocs, getDoc, 
            query, where, 
            doc, updateDoc, deleteDoc, setDoc,
            writeBatch, 
            onSnapshot
        } from "firebase/firestore";
        import { getAuth, onAuthStateChanged } from "firebase/auth";

        const firebaseConfig = {
            apiKey: "AIzaSyDUGYJY7pX7q02MS5SACMIIQXpjpQ97mPw",
            authDomain: "proranklive.firebaseapp.com",
            projectId: "proranklive",
            storageBucket: "proranklive.firebasestorage.app",
            messagingSenderId: "716836144015",
            appId: "1:716836144015:web:f1575147750608d0f881fa"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentUser = null;
        let unsubscribeChats = null;
        let allChatsData = [];

        // ===== ФУНКЦИИ ДЛЯ ЛИГ =====
        function getLeague(frs) {
            if (frs >= 5000) return { name: 'ЛЕГЕНДАРНАЯ', icon: 'fa-skull', color: '#ff4500' };
            if (frs >= 3500) return { name: 'ЭЛИТНАЯ', icon: 'fa-dragon', color: '#9400d3' };
            if (frs >= 2000) return { name: 'АЛМАЗНАЯ', icon: 'fa-gem', color: '#00ffff' };
            if (frs >= 1000) return { name: 'ЗОЛОТАЯ', icon: 'fa-crown', color: '#ffd700' };
            if (frs >= 500) return { name: 'СЕРЕБРЯНАЯ', icon: 'fa-medal', color: '#c0c0c0' };
            return { name: 'БРОНЗОВАЯ', icon: 'fa-medal', color: '#cd7f32' };
        }

        function getLeagueIconPath(leagueName) {
            const leagueMap = {
                'БРОНЗОВАЯ': 'bronze.png',
                'СЕРЕБРЯНАЯ': 'silver.png',
                'ЗОЛОТАЯ': 'gold.png',
                'АЛМАЗНАЯ': 'diamond.png',
                'ЭЛИТНАЯ': 'elite.png',
                'ЛЕГЕНДАРНАЯ': 'legendary.png'
            };
            return `./league-icons/${leagueMap[leagueName] || 'bronze.png'}`;
        }

        // ===== МОДАЛЬНОЕ ОКНО ПОДТВЕРЖДЕНИЯ =====
        let modalResolve = null;

        function showModal(title, message, type = 'danger') {
            return new Promise((resolve) => {
                const modal = document.getElementById('modal');
                document.getElementById('modalTitle').textContent = title;
                document.getElementById('modalMessage').textContent = message;
                
                const confirmBtn = document.getElementById('modalConfirm');
                confirmBtn.className = type === 'danger' ? 'danger-btn' : 'warning-btn';
                confirmBtn.textContent = type === 'danger' ? 'Удалить' : 'Очистить';
                
                modal.style.display = 'flex';
                modalResolve = resolve;
            });
        }

        // ===== МЕНЮ ДЕЙСТВИЙ (ТРИ ТОЧКИ) =====
        function showActionMenu(event, chatId, otherId, isPinned, isBlocked) {
            // Удаляем старые меню
            document.querySelectorAll('.action-menu-overlay, .action-menu').forEach(el => el.remove());

            const overlay = document.createElement('div');
            overlay.className = 'action-menu-overlay';
            
            const menu = document.createElement('div');
            menu.className = 'action-menu';
            
            // Позиционирование
            const rect = event.target.getBoundingClientRect();
            const isMobile = window.innerWidth <= 768;
            
            if (isMobile) {
                menu.style.bottom = '20px';
                menu.style.left = '50%';
                menu.style.transform = 'translateX(-50%)';
                menu.style.top = 'auto';
            } else {
                const menuWidth = 220;
                let left = rect.left + rect.width / 2 - menuWidth / 2;
                let top = rect.bottom + 8;
                
                // Проверяем чтобы не выходило за экран
                if (left < 10) left = 10;
                if (left + menuWidth > window.innerWidth - 10) left = window.innerWidth - menuWidth - 10;
                if (top + 250 > window.innerHeight) top = rect.top - 250;
                
                menu.style.left = left + 'px';
                menu.style.top = top + 'px';
                menu.style.transform = 'none';
            }
            
            const pinLabel = isPinned ? 'Открепить чат' : 'Закрепить чат';
            const pinIcon = isPinned ? 'fa-thumbtack' : 'fa-thumbtack';
            
            menu.innerHTML = `
                <button class="action-menu-item pin-action" data-action="pin">
                    <i class="fas ${pinIcon}"></i>
                    <span class="item-label">${pinLabel}</span>
                </button>
                <div class="action-menu-divider"></div>
                <button class="action-menu-item warning" data-action="clear">
                    <i class="fas fa-eraser"></i>
                    <span class="item-label">Очистить историю</span>
                </button>
                ${!isBlocked ? `
                    <button class="action-menu-item danger" data-action="block">
                        <i class="fas fa-ban"></i>
                        <span class="item-label">Заблокировать</span>
                    </button>
                ` : ''}
                <button class="action-menu-item danger" data-action="delete">
                    <i class="fas fa-trash"></i>
                    <span class="item-label">Удалить чат</span>
                </button>
            `;
            
            document.body.appendChild(overlay);
            document.body.appendChild(menu);
            
            // Закрытие по клику вне меню
            overlay.addEventListener('click', () => {
                overlay.remove();
                menu.remove();
            });
            
            // Обработчики действий
            menu.querySelector('[data-action="pin"]').addEventListener('click', (e) => {
                e.stopPropagation();
                togglePinChat(chatId, isPinned);
                overlay.remove();
                menu.remove();
            });
            
            menu.querySelector('[data-action="clear"]').addEventListener('click', (e) => {
                e.stopPropagation();
                clearChatHistory(chatId);
                overlay.remove();
                menu.remove();
            });
            
            menu.querySelector('[data-action="block"]')?.addEventListener('click', (e) => {
                e.stopPropagation();
                blockUser(chatId, otherId);
                overlay.remove();
                menu.remove();
            });
            
            menu.querySelector('[data-action="delete"]').addEventListener('click', (e) => {
                e.stopPropagation();
                deleteChat(chatId);
                overlay.remove();
                menu.remove();
            });
        }

        // ===== ДЕЙСТВИЯ С ЧАТАМИ =====
        async function deleteChat(chatId) {
            if (!currentUser || !chatId) return;
            const confirmed = await showModal('Удалить чат?', 'Все сообщения будут удалены безвозвратно.', 'danger');
            if (!confirmed) return;
            try {
                await deleteDoc(doc(db, "chats", chatId));
                showNotification('✅ Чат удалён', 'success');
            } catch (err) {
                console.error('❌ Ошибка удаления чата:', err);
                showNotification('Не удалось удалить чат', 'error');
            }
        }

        async function clearChatHistory(chatId) {
            if (!currentUser || !chatId) return;
            const confirmed = await showModal('Очистить историю?', 'Все сообщения будут удалены, чат останется.', 'warning');
            if (!confirmed) return;
            try {
                const messagesRef = collection(db, "chats", chatId, "messages");
                const snapshot = await getDocs(messagesRef);
                const batch = writeBatch(db);
                snapshot.forEach(doc => batch.delete(doc.ref));
                await batch.commit();
                await updateDoc(doc(db, "chats", chatId), {
                    lastMessage: '',
                    lastMessageTime: null,
                    lastMessageAuthor: null
                });
                showNotification('✅ История очищена', 'success');
            } catch (err) {
                console.error('❌ Ошибка очистки:', err);
                showNotification('Не удалось очистить историю', 'error');
            }
        }

        async function blockUser(chatId, userId) {
            if (!currentUser || !chatId || !userId) return;
            const confirmed = await showModal('Заблокировать пользователя?', 'Вы не сможете отправлять сообщения этому пользователю.', 'danger');
            if (!confirmed) return;
            try {
                const blockedRef = doc(db, "users", currentUser.uid, "blocked", userId);
                await setDoc(blockedRef, { blockedAt: new Date(), userId: userId });
                await deleteDoc(doc(db, "chats", chatId));
                showNotification('🔒 Пользователь заблокирован', 'success');
            } catch (err) {
                console.error('❌ Ошибка блокировки:', err);
                showNotification('Не удалось заблокировать', 'error');
            }
        }

        async function togglePinChat(chatId, isPinned) {
            if (!currentUser || !chatId) return;
            try {
                await updateDoc(doc(db, "chats", chatId), {
                    [`pinned.${currentUser.uid}`]: !isPinned
                });
                showNotification(isPinned ? '📌 Чат откреплён' : '📌 Чат закреплён', 'success');
            } catch (err) {
                console.error('❌ Ошибка закрепления:', err);
                showNotification('Не удалось закрепить чат', 'error');
            }
        }

        // ===== НОВЫЙ ЧАТ =====
        async function createNewChat() {
            if (!currentUser) {
                showNotification('Войдите в аккаунт', 'warning');
                return;
            }
            
            try {
                const fighters = await getDocs(collection(db, "fighters"));
                const fighterList = fighters.docs
                    .map(d => ({ id: d.id, ...d.data() }))
                    .filter(f => f.id !== currentUser.uid && !f.isPartner);
                
                if (fighterList.length === 0) {
                    showNotification('Нет доступных бойцов для чата', 'warning');
                    return;
                }
                
                const container = document.getElementById('chatsList');
                const oldContent = container.innerHTML;
                
                container.innerHTML = `
                    <div style="background:rgba(15,15,15,0.7);border-radius:20px;padding:24px;">
                        <h3 style="margin-bottom:16px;color:#fff;"><i class="fas fa-user-plus"></i> Выберите бойца</h3>
                        <div style="display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto;">
                            ${fighterList.map(f => `
                                <div class="chat-item" data-id="${f.id}" style="cursor:pointer;">
                                    <img src="${f.avatar || 'Avatar.png'}" style="width:40px;height:40px;border-radius:50%;border:2px solid #fbbf24;object-fit:cover;">
                                    <div style="flex:1;">
                                        <div style="font-weight:600;">${escapeHtml(f.name || 'Боец')}</div>
                                        <div style="font-size:0.7rem;color:#888;">${f.sport || ''} • ${f.city || ''}</div>
                                    </div>
                                    <i class="fas fa-chevron-right" style="color:#555;"></i>
                                </div>
                            `).join('')}
                        </div>
                        <button class="new-chat-btn" id="closeNewChat" style="margin-top:16px;width:100%;justify-content:center;">
                            <i class="fas fa-times"></i> Отмена
                        </button>
                    </div>
                `;
                
                container.querySelectorAll('.chat-item').forEach(item => {
                    item.onclick = async () => {
                        const otherId = item.dataset.id;
                        const existing = await getDocs(query(
                            collection(db, "chats"),
                            where("participants", "array-contains", currentUser.uid)
                        ));
                        let found = false;
                        for (const docSnap of existing.docs) {
                            const chat = docSnap.data();
                            if (chat.participants.includes(otherId)) {
                                window.location.href = `chat.html?id=${docSnap.id}`;
                                found = true;
                                break;
                            }
                        }
                        if (!found) {
                            const newChatRef = doc(collection(db, "chats"));
                            await setDoc(newChatRef, {
                                participants: [currentUser.uid, otherId],
                                createdAt: new Date(),
                                lastMessage: '',
                                lastMessageTime: null,
                                lastMessageAuthor: null,
                                unreadCounts: {},
                                pinned: {}
                            });
                            window.location.href = `chat.html?id=${newChatRef.id}`;
                        }
                    };
                });
                
                document.getElementById('closeNewChat').onclick = () => {
                    loadChatsRealtime();
                };
                
            } catch (err) {
                console.error('Ошибка создания чата:', err);
                showNotification('Ошибка создания чата', 'error');
            }
        }

        // ===== УВЕДОМЛЕНИЯ =====
        function showNotification(message, type = 'info') {
            const container = document.getElementById('errorContainer');
            if (!container) return;
            const colors = { success: '#22c55e', error: '#ef4444', warning: '#f59e0b', info: '#fbbf24' };
            container.style.display = 'block';
            container.style.background = colors[type] || colors.info;
            container.style.color = '#000';
            container.textContent = message;
            setTimeout(() => { container.style.display = 'none'; }, 3000);
        }

        // ===== БАЛАНС =====
        async function updateHeaderBalance() {
            const user = auth.currentUser;
            const balanceDiv = document.getElementById('balanceIndicator');
            const balanceCount = document.getElementById('headerChallengesCount');
            if (!user || !balanceDiv) return;
            try {
                const userDoc = await getDoc(doc(db, "fighters", user.uid));
                const data = userDoc.data();
                const total = (data.freeChallenges || 0) + (data.purchasedChallenges || 0);
                balanceCount.innerText = total;
                balanceDiv.style.display = 'flex';
            } catch (err) { 
                console.error(err);
                balanceDiv.style.display = 'none';
            }
        }

        // ===== ФОРМАТИРОВАНИЕ ВРЕМЕНИ =====
        function formatTime(date) {
            const now = new Date();
            const diff = now - date;
            const minutes = Math.floor(diff / (1000 * 60));
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            
            if (minutes < 1) return 'только что';
            if (minutes < 60) return `${minutes} мин`;
            if (hours < 24) return `${hours} ч`;
            if (days < 7) return `${days} д`;
            return date.toLocaleDateString();
        }

        function getDateGroup(date) {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            
            const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
            
            if (d.getTime() === today.getTime()) return 'Сегодня';
            if (d.getTime() === yesterday.getTime()) return 'Вчера';
            if (now - date < 7 * 24 * 60 * 60 * 1000) return 'На этой неделе';
            return 'Ранее';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
        }

        // ===== ЗАГРУЗКА ЧАТОВ =====
        function loadChatsRealtime(searchTerm = '') {
            if (!currentUser) return;

            if (unsubscribeChats) {
                unsubscribeChats();
                unsubscribeChats = null;
            }

            const q = query(
                collection(db, "chats"),
                where("participants", "array-contains", currentUser.uid)
            );

            unsubscribeChats = onSnapshot(q, async (snapshot) => {
                const container = document.getElementById('chatsList');
                
                if (snapshot.empty) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <span class="icon-wrap"><i class="fas fa-comments"></i></span>
                            <h3>У вас пока нет чатов</h3>
                            <p>Начните общение после принятия вызова или создайте новый чат</p>
                            <div class="actions-row">
                                <button class="action-btn" id="emptyNewChatBtn">
                                    <i class="fas fa-plus"></i> Новый чат
                                </button>
                                <a href="rating.html" class="action-btn">
                                    <i class="fas fa-search"></i> Найти бойца
                                </a>
                            </div>
                        </div>
                    `;
                    document.getElementById('chatsCount').textContent = '0';
                    
                    document.getElementById('emptyNewChatBtn')?.addEventListener('click', createNewChat);
                    return;
                }

                let chats = [];
                for (const docSnap of snapshot.docs) {
                    const chat = docSnap.data();
                    const chatId = docSnap.id;
                    const participants = chat.participants || [];
                    const otherId = participants.find(id => id !== currentUser.uid);
                    
                    if (!otherId) continue;
                    
                    let isBlocked = false;
                    try {
                        const blockedRef = doc(db, "users", currentUser.uid, "blocked", otherId);
                        const blockedSnap = await getDoc(blockedRef);
                        isBlocked = blockedSnap.exists();
                    } catch (err) {}
                    
                    const otherFighterRef = doc(db, "fighters", otherId);
                    const otherFighterSnap = await getDoc(otherFighterRef);
                    const otherData = otherFighterSnap.data();
                    const otherName = otherData?.name || 'Соперник';
                    const otherAvatar = otherData?.avatar || 'Avatar.png';
                    const otherFrs = otherData?.frs || 0;
                    const otherPremium = otherData?.premium === true;
                    const otherLeague = getLeague(otherFrs);
                    const leagueIconPath = getLeagueIconPath(otherLeague.name);
                    
                    let isOnline = false;
                    if (otherData?.lastSeen) {
                        const lastSeen = otherData.lastSeen.toDate();
                        isOnline = (new Date() - lastSeen) < 5 * 60 * 1000;
                    }
                    
                    const lastMessage = chat.lastMessage || 'Нет сообщений';
                    const lastMessageTime = chat.lastMessageTime?.toDate();
                    const timeStr = lastMessageTime ? formatTime(lastMessageTime) : '';
                    const isToday = lastMessageTime ? new Date().getDate() === lastMessageTime.getDate() : false;
                    
                    const lastMessageAuthor = chat.lastMessageAuthor || '';
                    const isMyMessage = lastMessageAuthor === currentUser.uid;
                    const unreadCount = chat.unreadCounts?.[currentUser.uid] || 0;
                    const isPinned = chat.pinned?.[currentUser.uid] || false;
                    const dateGroup = lastMessageTime ? getDateGroup(lastMessageTime) : 'Ранее';
                    
                    let messagePreview = escapeHtml(lastMessage);
                    if (isMyMessage) {
                        messagePreview = `<span class="my-message">Вы: </span>${messagePreview}`;
                    }
                    
                    if (isBlocked) {
                        messagePreview = '🔒 Заблокирован';
                    }
                    
                    chats.push({
                        chatId,
                        otherId,
                        otherName,
                        otherAvatar,
                        otherFrs,
                        otherPremium,
                        otherLeague,
                        leagueIconPath,
                        isOnline,
                        lastMessage: messagePreview,
                        lastMessageTime,
                        timeStr,
                        isToday,
                        isMyMessage,
                        unreadCount,
                        isPinned,
                        isBlocked,
                        dateGroup,
                        raw: chat
                    });
                }

                chats.sort((a, b) => {
                    if (a.isPinned && !b.isPinned) return -1;
                    if (!a.isPinned && b.isPinned) return 1;
                    if (a.lastMessageTime && b.lastMessageTime) {
                        return b.lastMessageTime - a.lastMessageTime;
                    }
                    return 0;
                });

                allChatsData = chats;
                document.getElementById('chatsCount').textContent = chats.length;

                const search = searchTerm.toLowerCase().trim();
                let filtered = chats;
                if (search) {
                    filtered = chats.filter(c => c.otherName.toLowerCase().includes(search));
                }

                let html = '';
                let currentGroup = '';
                let hasItems = false;

                filtered.forEach((chat, index) => {
                    const group = chat.dateGroup;
                    if (group !== currentGroup) {
                        currentGroup = group;
                        html += `<div class="chat-group-label">${group}</div>`;
                    }
                    hasItems = true;
                    
                    const pinIcon = chat.isPinned ? 'fa-thumbtack' : '';
                    const pinClass = chat.isPinned ? 'pinned' : '';
                    const blockedClass = chat.isBlocked ? 'blocked' : '';
                    
                    html += `
                        <div class="chat-item ${pinClass} ${blockedClass}" data-chat-id="${chat.chatId}" data-other-id="${chat.otherId}" data-pinned="${chat.isPinned}" style="animation-delay: ${(index % 10) * 0.03}s;">
                            <div class="chat-avatar-wrap">
                                <img src="${chat.otherAvatar}" class="chat-avatar" onerror="this.src='Avatar.png'">
                                <div class="chat-online-dot ${chat.isOnline ? 'show' : ''}"></div>
                            </div>
                            <div class="chat-info">
                                <div class="chat-name-row">
                                    <span class="chat-name">
                                        ${escapeHtml(chat.otherName)}
                                        ${chat.otherPremium ? '<span class="premium-icon">👑</span>' : ''}
                                    </span>
                                    <img src="${chat.leagueIconPath}" class="chat-league-icon" alt="${chat.otherLeague.name}">
                                    ${chat.isPinned ? '<i class="fas fa-thumbtack" style="color:#fbbf24;font-size:0.7rem;"></i>' : ''}
                                </div>
                                <div class="chat-last-message">${chat.lastMessage}</div>
                            </div>
                            <div class="chat-right">
                                <div class="chat-time ${chat.isToday ? 'today' : ''}">${chat.timeStr}</div>
                                ${chat.unreadCount > 0 ? `<span class="unread-badge">${chat.unreadCount > 99 ? '99+' : chat.unreadCount}</span>` : ''}
                            </div>
                            <button class="chat-more-btn" data-action="more">
                                <i class="fas fa-ellipsis-v"></i>
                            </button>
                        </div>
                    `;
                });

                if (!hasItems && search) {
                    html = `
                        <div class="empty-state" style="padding:30px 20px;">
                            <span class="icon-wrap"><i class="fas fa-search"></i></span>
                            <h3>Ничего не найдено</h3>
                            <p>Попробуйте изменить запрос поиска</p>
                        </div>
                    `;
                }

                container.innerHTML = html;

                // Обработчики
                container.querySelectorAll('.chat-item').forEach(item => {
                    const chatId = item.dataset.chatId;
                    const otherId = item.dataset.otherId;
                    const isPinned = item.dataset.pinned === 'true';

                    // Клик по чату
                    item.addEventListener('click', async (e) => {
                        if (e.target.closest('.chat-more-btn')) return;
                        try {
                            const chatRef = doc(db, "chats", chatId);
                            const updateData = {};
                            updateData[`unreadCounts.${currentUser.uid}`] = 0;
                            await updateDoc(chatRef, updateData);
                        } catch (err) {}
                        window.location.href = `chat.html?id=${chatId}`;
                    });

                    // Кнопка три точки - показать меню
                    const moreBtn = item.querySelector('.chat-more-btn');
                    if (moreBtn) {
                        moreBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const isBlocked = item.classList.contains('blocked');
                            showActionMenu(e, chatId, otherId, isPinned, isBlocked);
                        });
                    }
                });

            }, (error) => {
                console.error('Ошибка загрузки чатов:', error);
                const container = document.getElementById('chatsList');
                container.innerHTML = `
                    <div class="empty-state">
                        <span class="icon-wrap"><i class="fas fa-exclamation-triangle"></i></span>
                        <h3>Ошибка загрузки</h3>
                        <p>Попробуйте обновить страницу</p>
                    </div>
                `;
            });
        }

        // ===== ПОИСК =====
        let searchTimeout;
        document.getElementById('searchChats').addEventListener('input', function() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                const term = this.value;
                document.getElementById('searchClear').classList.toggle('show', term.length > 0);
                loadChatsRealtime(term);
            }, 300);
        });

        document.getElementById('searchClear').addEventListener('click', function() {
            const input = document.getElementById('searchChats');
            input.value = '';
            this.classList.remove('show');
            loadChatsRealtime('');
        });

        // ===== МОДАЛЬНЫЕ ОБРАБОТЧИКИ =====
        document.getElementById('modalCancel').addEventListener('click', () => {
            document.getElementById('modal').style.display = 'none';
            if (modalResolve) modalResolve(false);
        });

        document.getElementById('modalConfirm').addEventListener('click', () => {
            document.getElementById('modal').style.display = 'none';
            if (modalResolve) modalResolve(true);
        });

        // ===== АВТОРИЗАЦИЯ =====
        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            if (user) {
                setTimeout(updateHeaderBalance, 1000);
                loadChatsRealtime();
            } else {
                if (unsubscribeChats) {
                    unsubscribeChats();
                    unsubscribeChats = null;
                }
                const balanceDiv = document.getElementById('balanceIndicator');
                if (balanceDiv) balanceDiv.style.display = 'none';
                document.getElementById('chatsList').innerHTML = `
                    <div class="empty-state">
                        <span class="icon-wrap"><i class="fas fa-lock"></i></span>
                        <h3>Войдите в аккаунт</h3>
                        <p>Чтобы увидеть свои чаты</p>
                        <div class="actions-row">
                            <a href="login.html" class="action-btn">
                                <i class="fas fa-sign-in-alt"></i> Войти
                            </a>
                        </div>
                    </div>
                `;
                document.getElementById('chatsCount').textContent = '0';
            }
        });

        // ===== ОБРАБОТЧИКИ =====
        document.getElementById('newChatBtn').addEventListener('click', createNewChat);

        const plusBtn = document.getElementById('balancePlusBtn');
        if (plusBtn) plusBtn.onclick = () => window.location.href = 'shop.html';

        const menuToggle = document.getElementById('menuToggle');
        const navLinks = document.getElementById('navLinks');
        if (menuToggle && navLinks) {
            menuToggle.addEventListener('click', () => {
                navLinks.classList.toggle('show');
            });
            navLinks.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    navLinks.classList.remove('show');
                });
            });
        }

        console.log('✅ Чаты загружены с меню через три точки');
    </script>

    <!-- ===== МОДАЛЬНОЕ ОКНО (внизу для доступа) ===== -->
    <div id="modal" class="modal-overlay" style="display:none;">
        <div class="modal">
            <h3 id="modalTitle">Подтверждение</h3>
            <p id="modalMessage">Вы уверены?</p>
            <div class="actions">
                <button class="cancel-btn" id="modalCancel">Отмена</button>
                <button class="danger-btn" id="modalConfirm">Удалить</button>
            </div>
        </div>
    </div>

</body>
</html>
