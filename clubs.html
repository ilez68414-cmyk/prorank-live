<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="manifest" href="/prorank-live/manifest.json">
    <link rel="apple-touch-icon" href="/prorank-live/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PRORANK">
    <meta name="theme-color" content="#fbbf24">
    <meta name="mobile-web-app-capable" content="yes">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Клубы PRORANK — найдите свой клуб или создайте новый">
    <title>Клубы | PRORANK</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(ellipse at 30% 40%, rgba(251, 191, 36, 0.15) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 80%, rgba(251, 191, 36, 0.08) 0%, transparent 50%),
                        linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 40%, #1a1a1a 100%);
            background-attachment: fixed;
            color: #fff;
            line-height: 1.4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main { flex: 1; }

        .gold-top {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #fbbf24, #ffdd88, #fbbf24, #b8860b);
            z-index: 1001;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
            position: relative;
            z-index: 2;
            width: 100%;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(251, 191, 36, 0.25);
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            cursor: pointer;
            background: linear-gradient(135deg, #ffffff, #fbbf24);
            background-clip: text;
            color: transparent;
            transition: transform 0.2s ease;
        }

        .logo:hover { transform: scale(1.02); }
        .logo span {
            background: linear-gradient(135deg, #fbbf24, #ffdd77);
            background-clip: text;
            color: transparent;
        }

        .balance-indicator {
            background: #111;
            border: 1px solid rgba(251, 191, 36, 0.5);
            border-radius: 60px;
            padding: 7px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .balance-indicator:hover {
            border-color: #fbbf24;
            box-shadow: 0 0 15px rgba(251,191,36,0.2);
        }

        .balance-count { color: #fbbf24; font-size: 1.1rem; }

        .balance-plus {
            background: rgba(251,191,36,0.15);
            border: none;
            color: #fbbf24;
            cursor: pointer;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .balance-plus:hover {
            background: rgba(251,191,36,0.3);
            transform: scale(1.05);
        }

        .balance-plus:active {
            background: #fbbf24;
            color: #000;
            transform: scale(0.94);
        }

        .menu-toggle {
            display: none;
            background: rgba(251,191,36,0.1);
            border: 1px solid #fbbf24;
            color: #fbbf24;
            font-size: 1.6rem;
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 12px;
            transition: all 0.2s ease;
            min-height: 44px;
            min-width: 44px;
        }

        .menu-toggle:hover {
            background: rgba(251,191,36,0.2);
            transform: scale(1.02);
        }

        .menu-toggle:active { transform: scale(0.95); }

        .nav-links {
            display: flex;
            gap: 6px;
            background: rgba(15,15,15,0.7);
            backdrop-filter: blur(12px);
            padding: 5px 14px;
            border-radius: 60px;
            border: 1px solid rgba(251,191,36,0.2);
        }

        .nav-links a {
            color: #ddd;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 8px 18px;
            border-radius: 40px;
            transition: all 0.2s ease;
        }

        .nav-links a i {
            margin-right: 8px;
            color: #fbbf24;
            transition: transform 0.2s ease;
        }

        .nav-links a:hover {
            color: #fbbf24;
            background: rgba(251,191,36,0.1);
            transform: translateY(-2px);
        }

        .nav-links a:hover i { transform: scale(1.1); }

        /* ===== СТИЛИ ДЛЯ КЛУБОВ ===== */
        .clubs-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 24px;
        }

        .clubs-header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInUp 0.5s ease;
        }

        .clubs-header h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #fbbf24);
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }

        .clubs-header p {
            color: #888;
            font-size: 1rem;
        }

        .create-club-banner {
            background: rgba(15,15,15,0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(251,191,36,0.3);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInUp 0.5s ease 0.1s both;
        }

        .create-club-banner h2 {
            color: #fbbf24;
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        .create-club-banner p {
            color: #888;
            margin-bottom: 20px;
        }

        .btn-create-club {
            padding: 12px 30px;
            background: #fbbf24;
            color: #000;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        .btn-create-club:hover {
            background: #ffdd44;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.25);
        }

        .clubs-search {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            animation: fadeInUp 0.5s ease 0.2s both;
        }

        .clubs-search input,
        .clubs-search select {
            flex: 1;
            min-width: 200px;
            padding: 12px 16px;
            background: rgba(15,15,15,0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(251,191,36,0.2);
            border-radius: 40px;
            color: #fff;
            font-size: 0.9rem;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .clubs-search input:focus,
        .clubs-search select:focus {
            border-color: #fbbf24;
            outline: none;
            box-shadow: 0 0 20px rgba(251,191,36,0.1);
        }

        .clubs-search select option {
            background: #1a1a1a;
        }

        .clubs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .club-card {
            background: rgba(15,15,15,0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(251,191,36,0.15);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            animation: fadeInUp 0.5s ease both;
        }

        .club-card:hover {
            transform: translateY(-5px);
            border-color: rgba(251,191,36,0.4);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4), 0 0 30px rgba(251,191,36,0.08);
        }

        .club-card-header {
            height: 120px;
            background: linear-gradient(135deg, rgba(251,191,36,0.1), rgba(251,191,36,0.02));
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .club-logo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #fbbf24;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
            color: #000;
            border: 3px solid #fbbf24;
            box-shadow: 0 0 25px rgba(251, 191, 36, 0.3);
            overflow: hidden;
        }

        .club-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .club-card-body {
            padding: 20px;
        }

        .club-card-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #fff;
        }

        .club-card-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 15px;
        }

        .club-card-info span {
            color: #888;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .club-card-info i {
            color: #fbbf24;
            width: 16px;
            text-align: center;
        }

        .club-card-stats {
            display: flex;
            gap: 10px;
            padding: 15px 0;
            border-top: 1px solid rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 15px;
        }

        .club-stat {
            flex: 1;
            text-align: center;
        }

        .club-stat-value {
            font-size: 1.1rem;
            font-weight: 800;
            color: #fbbf24;
        }

        .club-stat-label {
            font-size: 0.7rem;
            color: #888;
            margin-top: 3px;
        }

        .club-status {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .club-status.open {
            background: rgba(16,185,129,0.15);
            border: 1px solid rgba(16,185,129,0.3);
            color: #10b981;
        }

        .club-status.request {
            background: rgba(251,191,36,0.15);
            border: 1px solid rgba(251,191,36,0.3);
            color: #fbbf24;
        }

        .club-status.closed {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.3);
            color: #ef4444;
        }

        .no-clubs {
            text-align: center;
            padding: 60px 20px;
            color: #888;
            font-size: 1.1rem;
            background: rgba(15,15,15,0.7);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(251,191,36,0.15);
        }

        /* ===== ПОДВАЛ ===== */
        .main-footer {
            background: #0a0a0a;
            border-top: 1px solid rgba(251,191,36,0.15);
            margin-top: 60px;
            padding: 48px 0 24px;
        }

        .footer-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 32px;
            margin-bottom: 32px;
        }

        .footer-logo .logo {
            font-size: 1.3rem;
            display: inline-block;
        }

        .footer-logo p {
            font-size: 0.75rem;
            color: #777;
            margin-top: 8px;
        }

        .footer-social {
            display: flex;
            gap: 20px;
        }

        .social-icon {
            color: #aaa;
            font-size: 1.4rem;
            transition: all 0.2s ease;
        }

        .social-icon:hover {
            color: #fbbf24;
            transform: translateY(-3px);
        }

        .footer-links {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: #aaa;
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.2s ease;
        }

        .footer-links a:hover { color: #fbbf24; }

        .footer-bottom {
            text-align: center;
            padding-top: 24px;
            border-top: 1px solid rgba(255,255,255,0.05);
            font-size: 0.7rem;
            color: #666;
        }

        /* ===== АНИМАЦИИ ===== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 768px) {
            .container { padding: 0 16px; }
            .navbar { padding: 12px 18px; }
            .menu-toggle { display: block; }

            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 68px;
                left: 18px;
                right: 18px;
                background: #0f0f0f;
                border-radius: 24px;
                padding: 20px;
                gap: 10px;
                border: 1px solid rgba(251,191,36,0.3);
                backdrop-filter: blur(20px);
            }

            .nav-links.show {
                display: flex;
                animation: fadeIn 0.2s ease;
            }

            .nav-links a {
                width: 100%;
                text-align: center;
                padding: 12px;
            }

            .clubs-container { padding: 0 16px; }

            .clubs-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .clubs-search {
                flex-direction: column;
            }

            .clubs-search input,
            .clubs-search select {
                min-width: 100%;
            }

            .footer-inner {
                flex-direction: column;
                text-align: center;
                align-items: center;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="mobileBottomNavContainer"></div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js"
            }
        }
    </script>
    <script type="module" src="header.js?v=3"></script>
    <script type="module">
        import { initializeApp } from "firebase/app";
        import { 
            getFirestore, 
            collection, 
            getDocs, 
            query, 
            where, 
            orderBy,
            doc,
            getDoc
        } from "firebase/firestore";
        import { getAuth, onAuthStateChanged } from "firebase/auth";

        const firebaseConfig = {
            apiKey: "AIzaSyDUGYJY7pX7q02MS5SACMIIQXpjpQ97mPw",
            authDomain: "proranklive.firebaseapp.com",
            projectId: "proranklive",
            storageBucket: "proranklive.firebasestorage.app",
            messagingSenderId: "716836144015",
            appId: "1:716836144015:web:f1575147750608d0f881fa"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let allClubs = [];
        let currentUser = null;

        // Проверка авторизации
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            loadClubs();
            checkUserClub();
        });

        // Проверка, есть ли у пользователя клуб
        async function checkUserClub() {
            const createBanner = document.getElementById('createClubBanner');
            
            if (!currentUser) {
                createBanner.style.display = 'none';
                return;
            }
            
            try {
                const userDoc = await getDoc(doc(db, 'fighters', currentUser.uid));
                const userData = userDoc.data();
                
                if (!userData.clubId && !userData.isClubAccount) {
                    createBanner.style.display = 'block';
                }
            } catch (error) {
                console.error('Ошибка проверки клуба:', error);
            }
        }

        // Загрузка клубов
        async function loadClubs() {
            const clubsGrid = document.getElementById('clubsGrid');
            const cityFilter = document.getElementById('cityFilter');
            
            clubsGrid.innerHTML = '<div style="text-align: center; padding: 50px; color: #888; grid-column: 1/-1;"><div class="loading-spinner" style="display: inline-block; width: 24px; height: 24px; border: 2px solid rgba(251,191,36,0.3); border-top-color: #fbbf24; border-radius: 50%; animation: spin 0.8s linear infinite;"></div> Загрузка клубов...</div>';
            
            try {
                const clubsRef = collection(db, 'clubs');
                const q = query(
                    clubsRef, 
                    where('status', '==', 'approved'),
                    where('isActive', '==', true),
                    orderBy('clubFRS', 'desc')
                );
                
                const snapshot = await getDocs(q);
                allClubs = [];
                const cities = new Set();
                
                snapshot.forEach((docSnap) => {
                    const club = {
                        id: docSnap.id,
                        ...docSnap.data()
                    };
                    allClubs.push(club);
                    
                    if (club.city) {
                        cities.add(club.city);
                    }
                });
                
                // Заполняем фильтр городов
                cityFilter.innerHTML = '<option value="">Все города</option>';
                cities.forEach(city => {
                    const option = document.createElement('option');
                    option.value = city;
                    option.textContent = city;
                    cityFilter.appendChild(option);
                });
                
                displayClubs(allClubs);
                
            } catch (error) {
                console.error('Ошибка загрузки клубов:', error);
                clubsGrid.innerHTML = '<div style="text-align: center; padding: 50px; color: #ef4444; grid-column: 1/-1;">Ошибка загрузки клубов</div>';
            }
        }

        // Отображение клубов
        function displayClubs(clubs) {
            const clubsGrid = document.getElementById('clubsGrid');
            const noClubs = document.getElementById('noClubs');
            
            clubsGrid.innerHTML = '';
            
            if (clubs.length === 0) {
                noClubs.style.display = 'block';
                clubsGrid.style.display = 'none';
                return;
            }
            
            noClubs.style.display = 'none';
            clubsGrid.style.display = 'grid';
            
            clubs.forEach((club, index) => {
                const card = document.createElement('div');
                card.className = 'club-card';
                card.style.animationDelay = `${index * 0.05}s`;
                card.onclick = () => {
                    window.location.href = `club-profile.html?id=${club.id}`;
                };
                
                const statusClass = club.joinPolicy === 'open' ? 'open' : 
                                   club.joinPolicy === 'request' ? 'request' : 'closed';
                const statusText = club.joinPolicy === 'open' ? 'Открытый' : 
                                  club.joinPolicy === 'request' ? 'По заявке' : 'Закрытый';
                
                card.innerHTML = `
                    <div class="club-card-header">
                        <div class="club-logo">
                            ${club.logo ? `<img src="${club.logo}" alt="${club.name}">` : club.name.charAt(0)}
                        </div>
                        <div class="club-status ${statusClass}">${statusText}</div>
                    </div>
                    <div class="club-card-body">
                        <div class="club-card-title">${club.name}</div>
                        <div class="club-card-info">
                            <span><i class="fas fa-map-marker-alt"></i> ${club.city || 'Город не указан'}</span>
                            <span><i class="fas fa-fist-raised"></i> ${club.sports ? club.sports.join(', ') : 'Виды спорта не указаны'}</span>
                        </div>
                        <div class="club-card-stats">
                            <div class="club-stat">
                                <div class="club-stat-value">${club.clubFRS || 0}</div>
                                <div class="club-stat-label">FRS клуба</div>
                            </div>
                            <div class="club-stat">
                                <div class="club-stat-value">${club.memberCount || 0}</div>
                                <div class="club-stat-label">Бойцов</div>
                            </div>
                            <div class="club-stat">
                                <div class="club-stat-value">${club.wins || 0}</div>
                                <div class="club-stat-label">Побед</div>
                            </div>
                        </div>
                    </div>
                `;
                
                clubsGrid.appendChild(card);
            });
        }

        // Фильтрация клубов
        window.filterClubs = function() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const cityFilter = document.getElementById('cityFilter').value;
            const sportFilter = document.getElementById('sportFilter').value;
            
            const filtered = allClubs.filter(club => {
                const matchesSearch = club.name.toLowerCase().includes(searchTerm);
                const matchesCity = !cityFilter || club.city === cityFilter;
                const matchesSport = !sportFilter || (club.sports && club.sports.includes(sportFilter));
                
                return matchesSearch && matchesCity && matchesSport;
            });
            
            displayClubs(filtered);
        };
    </script>
</body>
</html>
