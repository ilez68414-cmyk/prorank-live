<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="manifest" href="/prorank-live/manifest.json">
    <link rel="apple-touch-icon" href="/prorank-live/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PRORANK">
    <meta name="theme-color" content="#fbbf24">
    <meta name="mobile-web-app-capable" content="yes">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Клубы PRORANK — найдите свой клуб">
    <title>Клубы | PRORANK</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(ellipse at 30% 40%, rgba(251, 191, 36, 0.15) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 80%, rgba(251, 191, 36, 0.08) 0%, transparent 50%),
                        linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 40%, #1a1a1a 100%);
            background-attachment: fixed;
            color: #fff;
            line-height: 1.4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main { flex: 1; }

        .gold-top {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #fbbf24, #ffdd88, #fbbf24, #b8860b);
            z-index: 1001;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(251, 191, 36, 0.25);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            cursor: pointer;
            background: linear-gradient(135deg, #ffffff, #fbbf24);
            background-clip: text;
            color: transparent;
        }

        .logo span {
            background: linear-gradient(135deg, #fbbf24, #ffdd77);
            background-clip: text;
            color: transparent;
        }

        .menu-toggle {
            display: none;
            background: rgba(251,191,36,0.1);
            border: 1px solid #fbbf24;
            color: #fbbf24;
            font-size: 1.6rem;
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 12px;
            min-height: 44px;
            min-width: 44px;
        }

        .nav-links {
            display: flex;
            gap: 6px;
            background: rgba(15,15,15,0.7);
            backdrop-filter: blur(12px);
            padding: 5px 14px;
            border-radius: 60px;
            border: 1px solid rgba(251,191,36,0.2);
        }

        .nav-links a {
            color: #ddd;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 8px 18px;
            border-radius: 40px;
            transition: all 0.2s ease;
        }

        .nav-links a i {
            margin-right: 8px;
            color: #fbbf24;
        }

        .nav-links a:hover {
            color: #fbbf24;
            background: rgba(251,191,36,0.1);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 1.5rem 24px;
        }

        /* ===== ВКЛАДКИ ===== */
        .club-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .club-tab {
            flex: 1;
            padding: 12px 20px;
            background: rgba(15,15,15,0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(251,191,36,0.15);
            border-radius: 16px;
            color: #888;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 50px;
            text-decoration: none;
        }

        .club-tab:hover {
            border-color: rgba(251,191,36,0.3);
            color: #fff;
            transform: translateY(-2px);
        }

        .club-tab.active {
            background: #fbbf24;
            color: #000;
            border-color: #fbbf24;
            box-shadow: 0 4px 20px rgba(251, 191, 36, 0.3);
        }

        .club-tab i {
            font-size: 1.2rem;
        }

        /* ===== СЧЕТЧИКИ ===== */
        .compact-stats {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .compact-stat {
            flex: 1;
            background: rgba(15,15,15,0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(251,191,36,0.15);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .compact-stat:hover {
            border-color: rgba(251,191,36,0.4);
            transform: translateY(-2px);
        }

        .compact-stat i {
            font-size: 1.2rem;
            color: #fbbf24;
            flex-shrink: 0;
        }

        .compact-stat .stat-info {
            flex: 1;
        }

        .compact-stat .stat-value {
            font-size: 1rem;
            font-weight: 800;
            color: #fbbf24;
        }

        .compact-stat .stat-label {
            font-size: 0.6rem;
            color: #888;
        }

        .compact-stat .stat-arrow {
            font-size: 0.7rem;
            color: #666;
            flex-shrink: 0;
        }

        /* ===== ПОИСК ===== */
        .search-bar {
            margin-bottom: 10px;
        }

        .search-input {
            width: 100%;
            padding: 10px 16px;
            background: #1a1a1a;
            border: 1px solid rgba(251,191,36,0.3);
            color: #fff;
            border-radius: 40px;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        .search-input:focus {
            outline: none;
            border-color: #fbbf24;
            box-shadow: 0 0 15px rgba(251,191,36,0.2);
        }

        .filters-row {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .filter-select {
            flex: 1;
            min-width: 120px;
            padding: 8px 12px;
            background: #1a1a1a;
            border: 1px solid rgba(251,191,36,0.3);
            color: #fff;
            border-radius: 40px;
            font-size: 0.75rem;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }

        .filter-select:focus {
            outline: none;
            border-color: #fbbf24;
        }

        /* ===== СПИСОК КЛУБОВ ===== */
        .clubs-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .club-card-horizontal {
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(145deg, rgba(20,20,20,0.9), rgba(10,10,10,0.95));
            border-radius: 16px;
            padding: 12px 14px;
            border: 1px solid rgba(251,191,36,0.15);
            cursor: pointer;
            transition: all 0.2s ease;
            min-height: 70px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .club-card-horizontal:active {
            transform: scale(0.98);
        }

        .club-card-horizontal .card-logo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #fbbf24;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: #000;
            border: 2px solid #fbbf24;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 0 15px rgba(251,191,36,0.2);
        }

        .club-card-horizontal .card-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .club-card-horizontal .card-info {
            flex: 1;
            min-width: 0;
        }

        .club-card-horizontal .card-name {
            font-weight: 700;
            font-size: 0.85rem;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .club-card-horizontal .card-details {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 0.6rem;
            color: #888;
            margin-top: 3px;
        }

        .club-card-horizontal .card-details span {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .club-card-horizontal .card-details i {
            font-size: 0.55rem;
            color: #fbbf24;
        }

        .club-card-horizontal .card-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            flex-shrink: 0;
        }

        .club-card-horizontal .card-frs {
            font-size: 0.9rem;
            font-weight: 900;
            color: #fbbf24;
            white-space: nowrap;
        }

        .club-card-horizontal .card-frs i {
            font-size: 0.65rem;
            margin-right: 2px;
        }

        .club-card-horizontal .card-status {
            font-size: 0.5rem;
            padding: 1px 8px;
            border-radius: 12px;
            font-weight: 700;
        }

        .club-card-horizontal .card-status.open {
            background: rgba(16,185,129,0.15);
            color: #10b981;
        }

        .club-card-horizontal .card-status.request {
            background: rgba(251,191,36,0.15);
            color: #fbbf24;
        }

        .club-card-horizontal .card-status.closed {
            background: rgba(239,68,68,0.15);
            color: #ef4444;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #888;
        }

        .empty-state i {
            font-size: 3rem;
            color: #444;
            display: block;
            margin-bottom: 15px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(251,191,36,0.3);
            border-top-color: #fbbf24;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .container { padding: 1rem 16px; }
            .navbar { padding: 10px 16px; }
            .menu-toggle { display: block; }
            
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 68px;
                left: 18px;
                right: 18px;
                background: #0f0f0f;
                border-radius: 24px;
                padding: 20px;
                gap: 10px;
                border: 1px solid rgba(251,191,36,0.3);
                z-index: 1000;
            }
            
            .nav-links.show {
                display: flex;
            }
            
            .nav-links a {
                width: 100%;
                text-align: center;
            }
            
            .club-tab {
                padding: 10px 16px;
                font-size: 0.8rem;
                min-height: 44px;
            }
            
            .club-tab i {
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            .container { padding: 0.8rem 10px; }
            
            .club-tab {
                padding: 8px 12px;
                font-size: 0.7rem;
                gap: 6px;
                min-height: 40px;
            }
            
            .club-card-horizontal {
                padding: 10px;
                gap: 10px;
                min-height: 65px;
                border-radius: 14px;
            }
            
            .club-card-horizontal .card-logo {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
            
            .club-card-horizontal .card-name {
                font-size: 0.75rem;
            }
            
            .compact-stat {
                padding: 8px;
                gap: 6px;
            }
            
            .compact-stat i {
                font-size: 1rem;
            }
            
            .compact-stat .stat-value {
                font-size: 0.9rem;
            }
            
            .compact-stat .stat-label {
                font-size: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="gold-top"></div>

    <header class="navbar">
        <div class="logo" onclick="window.location='index.html'">PRO<span>RANK</span></div>
        <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
        <nav class="nav-links" id="navLinks"></nav>
    </header>

    <main>
        <div class="container">
            <!-- ВКЛАДКИ -->
            <div class="club-tabs" id="clubTabs">
                <!-- Заполняется через JS -->
            </div>

            <!-- СЧЕТЧИКИ -->
            <div class="compact-stats">
                <div class="compact-stat">
                    <i class="fas fa-users"></i>
                    <div class="stat-info">
                        <div class="stat-value" id="totalClubsCount">0</div>
                        <div class="stat-label">Клубов</div>
                    </div>
                </div>
                <div class="compact-stat" onclick="window.location.href='tournaments.html'">
                    <i class="fas fa-trophy"></i>
                    <div class="stat-info">
                        <div class="stat-value" id="totalTournamentsCount">0</div>
                        <div class="stat-label">Турниров</div>
                    </div>
                    <i class="fas fa-chevron-right stat-arrow"></i>
                </div>
            </div>

            <!-- ПОИСК -->
            <div class="search-bar">
                <input type="text" class="search-input" id="searchInput" placeholder="🔍 Поиск клубов...">
            </div>
            
            <!-- ФИЛЬТРЫ -->
            <div class="filters-row">
                <select class="filter-select" id="cityFilter">
                    <option value="">Все города</option>
                </select>
                <select class="filter-select" id="sportFilter">
                    <option value="">Все виды</option>
                    <option value="MMA">MMA</option>
                    <option value="Бокс">Бокс</option>
                    <option value="БЖЖ">БЖЖ</option>
                    <option value="Борьба">Борьба</option>
                </select>
            </div>

            <!-- СПИСОК КЛУБОВ -->
            <div class="clubs-list" id="clubsList">
                <div class="loading"><div class="loading-spinner"></div> Загрузка клубов...</div>
            </div>
        </div>
    </main>

    <div id="mobileBottomNavContainer"></div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js"
            }
        }
    </script>
    <script type="module" src="header.js?v=3"></script>
    <script type="module">
        import { initializeApp } from "firebase/app";
        import { 
            getFirestore, 
            collection, 
            getDocs, 
            query, 
            where, 
            orderBy,
            doc,
            getDoc
        } from "firebase/firestore";
        import { getAuth, onAuthStateChanged } from "firebase/auth";

        const firebaseConfig = {
            apiKey: "AIzaSyDUGYJY7pX7q02MS5SACMIIQXpjpQ97mPw",
            authDomain: "proranklive.firebaseapp.com",
            projectId: "proranklive",
            storageBucket: "proranklive.firebasestorage.app",
            messagingSenderId: "716836144015",
            appId: "1:716836144015:web:f1575147750608d0f881fa"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentUser = null;
        let myClubId = null;
        let allClubs = [];

        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            
            if (user) {
                try {
                    const fighterDoc = await getDoc(doc(db, 'fighters', user.uid));
                    if (fighterDoc.exists()) {
                        myClubId = fighterDoc.data().clubId || null;
                    }
                } catch (err) {
                    console.error('Ошибка проверки клуба:', err);
                }
            }
            
            renderTabs();
            loadClubs();
            loadStats();
        });

        function renderTabs() {
            const tabsContainer = document.getElementById('clubTabs');
            
            if (myClubId) {
                tabsContainer.innerHTML = `
                    <a href="club-profile.html?id=${myClubId}" class="club-tab">
                        <i class="fas fa-shield-alt"></i> Мой клуб
                    </a>
                    <button class="club-tab active">
                        <i class="fas fa-search"></i> Искать клубы
                    </button>
                `;
            } else {
                tabsContainer.innerHTML = '';
            }
        }

        async function loadStats() {
            try {
                const clubsSnap = await getDocs(query(
                    collection(db, 'clubs'),
                    where('status', '==', 'approved'),
                    where('isActive', '==', true)
                ));
                document.getElementById('totalClubsCount').textContent = clubsSnap.size;
                document.getElementById('totalTournamentsCount').textContent = '0';
            } catch (error) {
                console.error('Ошибка загрузки статистики:', error);
            }
        }

        async function loadClubs() {
            const clubsList = document.getElementById('clubsList');
            const cityFilter = document.getElementById('cityFilter');
            
            try {
                const q = query(
                    collection(db, 'clubs'),
                    where('status', '==', 'approved'),
                    where('isActive', '==', true),
                    orderBy('clubFRS', 'desc')
                );
                
                const snapshot = await getDocs(q);
                allClubs = [];
                const cities = new Set();
                
                snapshot.forEach((docSnap) => {
                    const club = { id: docSnap.id, ...docSnap.data() };
                    allClubs.push(club);
                    if (club.city) cities.add(club.city);
                });
                
                cityFilter.innerHTML = '<option value="">Все города</option>';
                cities.forEach(city => {
                    const option = document.createElement('option');
                    option.value = city;
                    option.textContent = city;
                    cityFilter.appendChild(option);
                });
                
                displayClubs(allClubs);
                
            } catch (error) {
                console.error('Ошибка загрузки клубов:', error);
                clubsList.innerHTML = '<div class="empty-state"><i class="fas fa-search"></i> Ошибка загрузки</div>';
            }
        }

        function displayClubs(clubs) {
            const clubsList = document.getElementById('clubsList');
            
            if (!clubs.length) {
                clubsList.innerHTML = '<div class="empty-state"><i class="fas fa-search"></i> Клубы не найдены</div>';
                return;
            }
            
            clubsList.innerHTML = '';
            
            clubs.forEach(club => {
                const card = document.createElement('div');
                card.className = 'club-card-horizontal';
                card.onclick = () => {
                    window.location.href = `club-profile.html?id=${club.id}`;
                };
                
                const statusClass = club.joinPolicy === 'open' ? 'open' : 
                                   club.joinPolicy === 'request' ? 'request' : 'closed';
                const statusText = club.joinPolicy === 'open' ? 'Открытый' : 
                                  club.joinPolicy === 'request' ? 'По заявке' : 'Закрытый';
                
                card.innerHTML = `
                    <div class="card-logo">
                        ${club.logo ? `<img src="${club.logo}" alt="${club.name}">` : club.name.charAt(0)}
                    </div>
                    <div class="card-info">
                        <div class="card-name">${club.name || 'Клуб'}</div>
                        <div class="card-details">
                            <span><i class="fas fa-map-marker-alt"></i> ${club.city || '—'}</span>
                            <span><i class="fas fa-user-friends"></i> ${club.memberCount || 0}</span>
                        </div>
                    </div>
                    <div class="card-right">
                        <div class="card-frs"><i class="fas fa-star"></i>${club.clubFRS || 0}</div>
                        <div class="card-status ${statusClass}">${statusText}</div>
                    </div>
                `;
                
                clubsList.appendChild(card);
            });
        }

        document.getElementById('searchInput').addEventListener('input', filterClubs);
        document.getElementById('cityFilter').addEventListener('change', filterClubs);
        document.getElementById('sportFilter').addEventListener('change', filterClubs);

        function filterClubs() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const city = document.getElementById('cityFilter').value;
            const sport = document.getElementById('sportFilter').value;
            
            const filtered = allClubs.filter(club => {
                const matchesSearch = (club.name || '').toLowerCase().includes(searchTerm);
                const matchesCity = !city || club.city === city;
                const matchesSport = !sport || (club.sports && club.sports.includes(sport));
                return matchesSearch && matchesCity && matchesSport;
            });
            
            displayClubs(filtered);
        }
    </script>
</body>
</html>
