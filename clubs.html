<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="manifest" href="/prorank-live/manifest.json">
    <link rel="apple-touch-icon" href="/prorank-live/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PRORANK">
    <meta name="theme-color" content="#fbbf24">
    <meta name="mobile-web-app-capable" content="yes">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Клубы PRORANK — найдите свой клуб">
    <title>Клубы | PRORANK</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(ellipse at 30% 40%, rgba(251, 191, 36, 0.15) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 80%, rgba(251, 191, 36, 0.08) 0%, transparent 50%),
                        linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 40%, #1a1a1a 100%);
            background-attachment: fixed;
            color: #fff;
            line-height: 1.4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main { flex: 1; }

        .gold-top {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #fbbf24, #ffdd88, #fbbf24, #b8860b);
            z-index: 1001;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(251, 191, 36, 0.25);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            cursor: pointer;
            background: linear-gradient(135deg, #ffffff, #fbbf24);
            background-clip: text;
            color: transparent;
        }

        .logo span {
            background: linear-gradient(135deg, #fbbf24, #ffdd77);
            background-clip: text;
            color: transparent;
        }

        .menu-toggle {
            display: none;
            background: rgba(251,191,36,0.1);
            border: 1px solid #fbbf24;
            color: #fbbf24;
            font-size: 1.6rem;
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 12px;
            min-height: 44px;
            min-width: 44px;
        }

        .nav-links {
            display: flex;
            gap: 6px;
            background: rgba(15,15,15,0.7);
            backdrop-filter: blur(12px);
            padding: 5px 14px;
            border-radius: 60px;
            border: 1px solid rgba(251,191,36,0.2);
        }

        .nav-links a {
            color: #ddd;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 8px 18px;
            border-radius: 40px;
            transition: all 0.2s ease;
        }

        .nav-links a i {
            margin-right: 8px;
            color: #fbbf24;
        }

        .nav-links a:hover {
            color: #fbbf24;
            background: rgba(251,191,36,0.1);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 1.5rem 24px;
        }

        /* ===== ПЕРЕКЛЮЧАТЕЛЬ (скрыт по умолчанию) ===== */
        .club-switcher {
            display: none;
            gap: 8px;
            margin-bottom: 20px;
            background: rgba(15,15,15,0.5);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 4px;
            border: 1px solid rgba(251,191,36,0.1);
        }

        .club-switcher.visible {
            display: flex;
        }

        .club-switch-btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            background: transparent;
            color: #888;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            min-height: 44px;
        }

        .club-switch-btn i {
            font-size: 1rem;
            transition: transform 0.2s ease;
        }

        .club-switch-btn:hover {
            color: #fff;
            background: rgba(255,255,255,0.05);
        }

        .club-switch-btn:hover i {
            transform: scale(1.1);
        }

        .club-switch-btn.active {
            color: #fbbf24;
            background: rgba(251,191,36,0.12);
            box-shadow: 0 0 20px rgba(251,191,36,0.05);
        }

        .club-switch-btn.active i {
            color: #fbbf24;
        }

        .club-switch-badge {
            background: rgba(251,191,36,0.12);
            color: #fbbf24;
            font-size: 0.55rem;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 700;
            max-width: 100px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 🔧 СЕЗОНЫ: плашка сезона */
        .season-banner {
            background: linear-gradient(135deg, rgba(251,191,36,0.12), rgba(251,191,36,0.03));
            border: 1px solid rgba(251,191,36,0.3);
            border-radius: 20px;
            padding: 16px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            box-shadow: 0 4px 20px rgba(251,191,36,0.05);
            transition: all 0.3s ease;
            animation: fadeInUp 0.4s ease;
        }

        .season-banner:hover {
            border-color: rgba(251,191,36,0.5);
            box-shadow: 0 6px 30px rgba(251,191,36,0.1);
        }

        .season-banner-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .season-banner-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: #000;
            flex-shrink: 0;
            box-shadow: 0 0 20px rgba(251,191,36,0.3);
        }

        .season-banner-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .season-banner-name {
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.3px;
        }

        .season-banner-sub {
            font-size: 0.7rem;
            color: #aaa;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .season-banner-sub i {
            color: #fbbf24;
            font-size: 0.65rem;
        }

        .season-banner-timer {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.4);
            padding: 8px 14px;
            border-radius: 12px;
            border: 1px solid rgba(251,191,36,0.15);
        }

        .season-banner-timer i {
            color: #fbbf24;
            font-size: 0.9rem;
        }

        .season-timer-value {
            font-family: 'Inter', monospace;
            font-size: 0.95rem;
            font-weight: 800;
            color: #fbbf24;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .season-banner-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .season-prize {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
        }

        .season-prize-label {
            font-size: 0.6rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .season-prize-value {
            font-size: 1.2rem;
            font-weight: 900;
            color: #fbbf24;
            text-shadow: 0 0 20px rgba(251,191,36,0.2);
            white-space: nowrap;
        }

        .season-banner-details-btn {
            background: #fbbf24;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
        }

        .season-banner-details-btn:hover {
            background: #ffdd44;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(251,191,36,0.3);
        }

        @media (max-width: 768px) {
            .season-banner { padding: 12px 14px; gap: 10px; }
            .season-banner-icon { width: 40px; height: 40px; font-size: 1.1rem; }
            .season-banner-name { font-size: 0.95rem; }
            .season-prize-value { font-size: 1rem; }
            .season-banner-timer { padding: 6px 10px; }
            .season-timer-value { font-size: 0.8rem; }
            .season-banner-details-btn { padding: 6px 12px; font-size: 0.7rem; }
        }

        @media (max-width: 480px) {
            .season-banner-right { width: 100%; justify-content: space-between; }
            .season-prize { align-items: flex-start; }
            .season-banner-sub { font-size: 0.6rem; }
        }

        /* ===== СЧЕТЧИКИ ===== */
        .compact-stats {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .compact-stat {
            flex: 1;
            background: rgba(15,15,15,0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(251,191,36,0.15);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .compact-stat:hover {
            border-color: rgba(251,191,36,0.4);
            transform: translateY(-2px);
        }

        .compact-stat i {
            font-size: 1.2rem;
            color: #fbbf24;
            flex-shrink: 0;
        }

        .compact-stat .stat-info {
            flex: 1;
        }

        .compact-stat .stat-value {
            font-size: 1rem;
            font-weight: 800;
            color: #fbbf24;
        }

        .compact-stat .stat-label {
            font-size: 0.6rem;
            color: #888;
        }

        .compact-stat .stat-btn {
            font-size: 0.6rem;
            font-weight: 700;
            color: #fbbf24;
            background: rgba(251,191,36,0.1);
            border: 1px solid rgba(251,191,36,0.15);
            padding: 4px 12px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
        }

        .compact-stat .stat-btn:hover {
            background: rgba(251,191,36,0.2);
            transform: scale(1.05);
        }

        /* ===== ПОИСК ===== */
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .search-input {
            flex: 1;
            padding: 10px 16px;
            background: #1a1a1a;
            border: 1px solid rgba(251,191,36,0.3);
            color: #fff;
            border-radius: 40px;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        .search-input:focus {
            outline: none;
            border-color: #fbbf24;
            box-shadow: 0 0 15px rgba(251,191,36,0.2);
        }

        .btn-shuffle {
            padding: 8px 14px;
            background: rgba(251,191,36,0.08);
            border: 1px solid rgba(251,191,36,0.15);
            color: #fbbf24;
            border-radius: 40px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            flex-shrink: 0;
            min-height: 38px;
        }

        .btn-shuffle:hover {
            background: rgba(251,191,36,0.15);
            border-color: rgba(251,191,36,0.3);
            transform: translateY(-2px);
        }

        .btn-shuffle:active {
            transform: scale(0.95);
        }

        .filters-row {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .filter-select {
            flex: 1;
            min-width: 120px;
            padding: 8px 12px;
            background: #1a1a1a;
            border: 1px solid rgba(251,191,36,0.3);
            color: #fff;
            border-radius: 40px;
            font-size: 0.75rem;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }

        .filter-select:focus {
            outline: none;
            border-color: #fbbf24;
        }

        .filter-select option {
            background: #1a1a1a;
            color: #fff;
        }

        /* ===== СПИСОК КЛУБОВ ===== */
        .clubs-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .club-card-horizontal {
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(145deg, rgba(20,20,20,0.9), rgba(10,10,10,0.95));
            border-radius: 16px;
            padding: 12px 14px;
            border: 1px solid rgba(251,191,36,0.15);
            cursor: pointer;
            transition: all 0.2s ease;
            min-height: 70px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            animation: fadeInUp 0.3s ease;
        }

        .club-card-horizontal:hover {
            border-color: rgba(251,191,36,0.4);
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0,0,0,0.4);
        }

        .club-card-horizontal:active {
            transform: scale(0.98);
        }

        .club-card-horizontal .card-logo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #fbbf24;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: #000;
            border: 2px solid #fbbf24;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 0 15px rgba(251,191,36,0.2);
        }

        .club-card-horizontal .card-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .club-card-horizontal .card-info {
            flex: 1;
            min-width: 0;
        }

        .club-card-horizontal .card-name {
            font-weight: 700;
            font-size: 0.85rem;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .club-card-horizontal .card-details {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 0.6rem;
            color: #888;
            margin-top: 3px;
        }

        .club-card-horizontal .card-details span {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .club-card-horizontal .card-details i {
            font-size: 0.55rem;
            color: #fbbf24;
        }

        .club-card-horizontal .card-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            flex-shrink: 0;
        }

        .club-card-horizontal .card-frs {
            font-size: 0.9rem;
            font-weight: 900;
            color: #fbbf24;
            white-space: nowrap;
        }

        .club-card-horizontal .card-frs i {
            font-size: 0.65rem;
            margin-right: 2px;
        }

        .club-card-horizontal .card-members {
            font-size: 0.6rem;
            color: #888;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .club-card-horizontal .card-members i {
            color: #fbbf24;
            font-size: 0.5rem;
        }

        .club-card-horizontal .card-members .member-count {
            color: #fbbf24;
            font-weight: 700;
        }

        .club-card-horizontal .card-status {
            font-size: 0.5rem;
            padding: 1px 8px;
            border-radius: 12px;
            font-weight: 700;
        }

        .club-card-horizontal .card-status.open {
            background: rgba(16,185,129,0.15);
            color: #10b981;
        }

        .club-card-horizontal .card-status.request {
            background: rgba(251,191,36,0.15);
            color: #fbbf24;
        }

        .club-card-horizontal .card-status.closed {
            background: rgba(239,68,68,0.15);
            color: #ef4444;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #888;
        }

        .empty-state i {
            font-size: 3rem;
            color: #444;
            display: block;
            margin-bottom: 15px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(251,191,36,0.3);
            border-top-color: #fbbf24;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 768px) {
            .container { padding: 1rem 16px; }
            .navbar { padding: 10px 16px; }
            .menu-toggle { display: block; }
            
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 68px;
                left: 18px;
                right: 18px;
                background: #0f0f0f;
                border-radius: 24px;
                padding: 20px;
                gap: 10px;
                border: 1px solid rgba(251,191,36,0.3);
                z-index: 1000;
            }
            
            .nav-links.show {
                display: flex;
            }
            
            .nav-links a {
                width: 100%;
                text-align: center;
            }

            .club-switcher {
                gap: 4px;
                padding: 3px;
                border-radius: 14px;
                margin-bottom: 16px;
            }

            .club-switch-btn {
                padding: 10px 14px;
                font-size: 0.75rem;
                min-height: 38px;
                border-radius: 10px;
            }

            .club-switch-btn i {
                font-size: 0.85rem;
            }

            .club-switch-badge {
                font-size: 0.5rem;
                padding: 1px 8px;
                max-width: 70px;
            }

            .search-bar {
                flex-direction: row;
            }

            .btn-shuffle {
                font-size: 0.65rem;
                padding: 6px 12px;
                min-height: 34px;
            }
        }

        @media (max-width: 480px) {
            .container { padding: 0.8rem 10px; }
            
            .club-switch-btn {
                padding: 8px 10px;
                font-size: 0.65rem;
                min-height: 34px;
                gap: 5px;
                border-radius: 8px;
            }

            .club-switch-btn i {
                font-size: 0.75rem;
            }

            .club-card-horizontal {
                padding: 10px;
                gap: 10px;
                min-height: 65px;
                border-radius: 14px;
            }
            
            .club-card-horizontal .card-logo {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
            
            .club-card-horizontal .card-name {
                font-size: 0.75rem;
            }
            
            .compact-stat {
                padding: 8px;
                gap: 6px;
            }
            
            .compact-stat i {
                font-size: 1rem;
            }
            
            .compact-stat .stat-value {
                font-size: 0.9rem;
            }
            
            .compact-stat .stat-label {
                font-size: 0.5rem;
            }

            /* ===== ИСПРАВЛЕНИЕ ДЛЯ ПОИСКА И ФИЛЬТРОВ ===== */
            .search-bar {
                flex-direction: row !important;
                gap: 8px !important;
                align-items: center !important;
            }

            .search-input {
                flex: 1 !important;
                min-width: 0 !important;
                padding: 8px 14px !important;
                font-size: 0.75rem !important;
                height: 36px !important;
            }

            .btn-shuffle {
                flex-shrink: 0 !important;
                padding: 6px 12px !important;
                font-size: 0.6rem !important;
                min-height: 36px !important;
                height: 36px !important;
                align-self: center !important;
            }

            .filters-row {
                flex-direction: row !important;
                gap: 6px !important;
                flex-wrap: nowrap !important;
            }

            .filter-select {
                flex: 1 !important;
                min-width: 0 !important;
                padding: 6px 10px !important;
                font-size: 0.65rem !important;
                height: 34px !important;
            }

            /* Кнопка "Создать клуб" на мобиле */
            .compact-stat .stat-btn {
                font-size: 0.5rem !important;
                padding: 2px 8px !important;
            }

            .compact-stat .stat-value[style*="font-size: 0.85rem"] {
                font-size: 0.7rem !important;
            }
        }

        @media (max-width: 380px) {
            .club-switch-btn span:not(.club-switch-badge) {
                display: none;
            }
            .club-switch-btn i {
                font-size: 1rem;
            }

            .search-bar {
                gap: 6px !important;
            }

            .search-input {
                font-size: 0.7rem !important;
                padding: 6px 10px !important;
                height: 32px !important;
            }

            .btn-shuffle {
                font-size: 0.55rem !important;
                padding: 4px 10px !important;
                min-height: 32px !important;
                height: 32px !important;
            }

            .filters-row {
                gap: 4px !important;
            }

            .filter-select {
                font-size: 0.6rem !important;
                padding: 4px 8px !important;
                height: 30px !important;
            }
        }
        /* ===== КНОПКА "СОЗДАТЬ КЛУБ" ===== */
        #createClubBtn {
            position: relative;
            transition: all 0.3s ease;
        }

        #createClubBtn.locked {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #createClubBtn.locked .stat-btn {
            background: rgba(100,100,120,0.1);
            border-color: rgba(100,100,120,0.15);
            color: #555;
            cursor: not-allowed;
        }

        #createClubBtn.locked .stat-btn:hover {
            transform: none;
        }

        #createClubBtn.locked #createClubIcon {
            color: #555;
        }

        #createClubBtn .lock-icon {
            display: none;
            font-size: 0.7rem;
            color: #555;
            margin-left: 4px;
        }

        #createClubBtn.locked .lock-icon {
            display: inline;
        }

        #createClubBtn .frs-requirement {
            display: none;
            font-size: 0.55rem;
            color: #555;
            font-weight: 400;
        }

        #createClubBtn.locked .frs-requirement {
            display: inline;
        }

        #createClubBtn:not(.locked) .stat-btn {
            background: rgba(251,191,36,0.12);
            border-color: rgba(251,191,36,0.2);
            color: #fbbf24;
        }

        #createClubBtn:not(.locked) .stat-btn:hover {
            background: rgba(251,191,36,0.2);
            transform: scale(1.05);
        }

        #createClubBtn:not(.locked):hover {
            border-color: rgba(251,191,36,0.3);
            transform: translateY(-2px);
        }

        #createClubBtn .stat-value .frs-count {
            color: #fbbf24;
            font-weight: 800;
        }

        #createClubBtn.locked .stat-value .frs-count {
            color: #555;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 480px) {
            #createClubBtn .stat-value {
                font-size: 0.7rem !important;
            }
            
            #createClubBtn .stat-label {
                font-size: 0.45rem !important;
            }
            
            #createClubBtn .lock-icon {
                font-size: 0.6rem;
            }
            
            #createClubBtn .frs-requirement {
                font-size: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="gold-top"></div>

    <header class="navbar">
        <div class="logo" onclick="window.location='index.html'">PRO<span>RANK</span></div>
        <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
        <nav class="nav-links" id="navLinks"></nav>
    </header>

    <main>
        <div class="container">

            <!-- 🔧 СЕЗОНЫ: плашка сезона -->
            <div class="season-banner" id="seasonBanner" style="display: none;">
                <div class="season-banner-left">
                    <div class="season-banner-icon"><i class="fas fa-trophy"></i></div>
                    <div class="season-banner-info">
                        <div class="season-banner-name" id="seasonBannerName">—</div>
                        <div class="season-banner-sub">
                            <span><i class="fas fa-calendar-alt"></i> <span id="seasonBannerDates">—</span></span>
                        </div>
                    </div>
                </div>
                <div class="season-banner-right">
                    <div class="season-banner-timer">
                        <i class="fas fa-hourglass-half"></i>
                        <span class="season-timer-value" id="seasonTimer">—</span>
                    </div>
                    <div class="season-prize">
                        <span class="season-prize-label">Призовой фонд клубов</span>
                        <span class="season-prize-value" id="seasonPrizePool">0 ₽</span>
                    </div>
                    <button class="season-banner-details-btn" id="seasonDetailsBtn">
                        <i class="fas fa-info-circle"></i> Подробнее
                    </button>
                </div>
            </div>

            <!-- ПЕРЕКЛЮЧАТЕЛЬ (скрыт по умолчанию, показывается через JS) -->
            <div class="club-switcher" id="clubSwitcher"></div>

            <!-- СЧЕТЧИКИ -->
            <div class="compact-stats">
                <div class="compact-stat">
                    <i class="fas fa-users"></i>
                    <div class="stat-info">
                        <div class="stat-value" id="totalClubsCount">0</div>
                        <div class="stat-label">Клубов</div>
                    </div>
                </div>
                
                <!-- ===== НОВАЯ КНОПКА "СОЗДАТЬ КЛУБ" ===== -->
                <div class="compact-stat" id="createClubBtn">
                    <i class="fas fa-plus-circle" id="createClubIcon"></i>
                    <div class="stat-info">
                        <div class="stat-value" id="createClubText" style="font-size: 0.85rem; color: #fbbf24;">
                            Создать клуб
                        </div>
                        <div class="stat-label" id="createClubSubtext">
                            Основать свой клуб
                        </div>
                    </div>
                    <div class="stat-btn" id="createClubAction">
                        <i class="fas fa-arrow-right"></i>
                    </div>
                </div>
            </div>

            <!-- ПОИСК + ПЕРЕМЕШАТЬ -->
            <div class="search-bar">
                <input type="text" class="search-input" id="searchInput" placeholder="🔍 Поиск клубов...">
                <button class="btn-shuffle" id="shuffleBtn"><i class="fas fa-random"></i> Перемешать</button>
            </div>
            
            <!-- ФИЛЬТРЫ -->
            <div class="filters-row">
                <select class="filter-select" id="cityFilter">
                    <option value="">Все города</option>
                </select>
                <select class="filter-select" id="sportFilter">
                    <option value="">Все виды</option>
                    <option value="Бокс">🥊 Бокс</option>
                    <option value="Борьба">🤼 Борьба</option>
                    <option value="ММА">🥋 ММА</option>
                </select>
            </div>

            <!-- СПИСОК КЛУБОВ -->
            <div class="clubs-list" id="clubsList">
                <div class="loading"><div class="loading-spinner"></div> Загрузка клубов...</div>
            </div>
        </div>
    </main>

    <div id="mobileBottomNavContainer"></div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js"
            }
        }
    </script>
    <script type="module" src="header.js?v=3"></script>
        <script type="module">
        import { initializeApp } from "firebase/app";
        import { 
            getFirestore, 
            collection, 
            getDocs, 
            query, 
            where,
            doc,
            getDoc
        } from "firebase/firestore";
        import { getAuth, onAuthStateChanged } from "firebase/auth";
        // 🔧 СЕЗОНЫ
        import { initSeasons, getActiveSeason } from './seasons.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDUGYJY7pX7q02MS5SACMIIQXpjpQ97mPw",
            authDomain: "proranklive.firebaseapp.com",
            projectId: "proranklive",
            storageBucket: "proranklive.firebasestorage.app",
            messagingSenderId: "716836144015",
            appId: "1:716836144015:web:f1575147750608d0f881fa"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentUser = null;
        let myClubId = null;
        let myClubName = null;
        let allClubs = [];
        let currentUserFRS = 0;
        let _seasonTimerInterval = null;

        // ===== УВЕДОМЛЕНИЕ =====
        function showNotification(message, type = 'info') {
            const container = document.getElementById('errorContainer');
            if (!container) return;
            const colors = { success: '#22c55e', error: '#ef4444', warning: '#f59e0b', info: '#fbbf24' };
            container.style.display = 'block';
            container.style.background = colors[type] || colors.info;
            container.style.color = '#000';
            container.textContent = message;
            clearTimeout(container._timeout);
            container._timeout = setTimeout(() => { container.style.display = 'none'; }, 3000);
        }

        // ===== РЕНДЕР ПЕРЕКЛЮЧАТЕЛЯ =====
        function renderSwitcher() {
            const switcher = document.getElementById('clubSwitcher');
            
            if (myClubId && myClubName) {
                switcher.innerHTML = `
                    <a href="club-profile.html?id=${myClubId}" class="club-switch-btn">
                        <i class="fas fa-shield-alt"></i> Мой клуб
                        <span class="club-switch-badge">${myClubName}</span>
                    </a>
                    <button class="club-switch-btn active">
                        <i class="fas fa-search"></i> Клубы
                    </button>
                `;
                switcher.classList.add('visible');
            } else {
                switcher.innerHTML = '';
                switcher.classList.remove('visible');
            }
        }

        // ===== ЗАГРУЗКА СТАТИСТИКИ =====
        async function loadStats() {
            try {
                const clubsSnap = await getDocs(query(
                    collection(db, 'clubs'),
                    where('status', '==', 'approved')
                ));
                document.getElementById('totalClubsCount').textContent = clubsSnap.size;
            } catch (error) {
                console.error('Ошибка загрузки статистики:', error);
            }
        }

        // ===== ПОЛУЧЕНИЕ FRS ПОЛЬЗОВАТЕЛЯ =====
        async function getUserFRS() {
            if (!currentUser) return 0;
            
            try {
                const fighterDoc = await getDoc(doc(db, "fighters", currentUser.uid));
                if (fighterDoc.exists()) {
                    currentUserFRS = fighterDoc.data().frs || 0;
                    return currentUserFRS;
                }
            } catch (err) {
                console.error('Ошибка получения FRS:', err);
            }
            return 0;
        }

        // ===== ОБНОВЛЕНИЕ КНОПКИ "СОЗДАТЬ КЛУБ" =====
        function updateCreateClubButton() {
            const btn = document.getElementById('createClubBtn');
            const text = document.getElementById('createClubText');
            const subtext = document.getElementById('createClubSubtext');
            const icon = document.getElementById('createClubIcon');
            const action = document.getElementById('createClubAction');
            
            // Если пользователь не авторизован
            if (!currentUser) {
                btn.classList.add('locked');
                text.innerHTML = 'Создать клуб <span class="lock-icon"><i class="fas fa-lock"></i></span>';
                subtext.textContent = 'Войдите, чтобы создать клуб';
                icon.className = 'fas fa-plus-circle';
                action.innerHTML = '<i class="fas fa-arrow-right"></i>';
                
                btn.onclick = (e) => {
                    e.stopPropagation();
                    window.location.href = 'login.html';
                };
                return;
            }
            
            // Проверяем, есть ли у пользователя уже клуб
            if (myClubId) {
                btn.classList.add('locked');
                text.innerHTML = 'Вы уже в клубе';
                subtext.textContent = 'Покините клуб, чтобы создать свой';
                icon.className = 'fas fa-check-circle';
                action.innerHTML = '<i class="fas fa-check"></i>';
                
                btn.onclick = () => {
                    showNotification('Вы уже состоите в клубе. Покините его, чтобы создать свой.', 'warning');
                };
                return;
            }
            
            // Проверяем FRS
            const userFRS = currentUserFRS || 0;
            const canCreate = userFRS >= 5000;
            
            if (canCreate) {
                // Может создать клуб
                btn.classList.remove('locked');
                text.innerHTML = 'Создать клуб';
                subtext.textContent = 'Основать свой клуб';
                icon.className = 'fas fa-plus-circle';
                action.innerHTML = '<i class="fas fa-arrow-right"></i>';
                
                btn.onclick = (e) => {
                    e.stopPropagation();
                    window.location.href = 'create-club.html';
                };
            } else {
                // Не может создать клуб
                btn.classList.add('locked');
                const remaining = 5000 - userFRS;
                text.innerHTML = `Создать клуб <span class="lock-icon"><i class="fas fa-lock"></i></span>`;
                subtext.innerHTML = `Нужно <span class="frs-count">5000 FRS</span> (осталось ${remaining})`;
                icon.className = 'fas fa-plus-circle';
                action.innerHTML = '<i class="fas fa-lock"></i>';
                
                btn.onclick = (e) => {
                    e.stopPropagation();
                    showNotification(`Для создания клуба нужно 5000 FRS. У вас ${userFRS}`, 'warning');
                };
            }
        }

        // ===== ЗАГРУЗКА КЛУБОВ =====
        async function loadClubs() {
            const clubsList = document.getElementById('clubsList');
            const cityFilter = document.getElementById('cityFilter');
            
            try {
                const q = query(
                    collection(db, 'clubs'),
                    where('status', '==', 'approved')
                );
                
                const snapshot = await getDocs(q);
                allClubs = [];
                const cities = new Set();
                
                snapshot.forEach((docSnap) => {
                    const club = { id: docSnap.id, ...docSnap.data() };
                    allClubs.push(club);
                    if (club.city) cities.add(club.city);
                });
                
                // Заполняем фильтр городов
                cityFilter.innerHTML = '<option value="">Все города</option>';
                const sortedCities = Array.from(cities).sort();
                sortedCities.forEach(city => {
                    const option = document.createElement('option');
                    option.value = city;
                    option.textContent = city;
                    cityFilter.appendChild(option);
                });
                
                // Перемешиваем и показываем
                shuffleClubs();
                
                // Обновляем кнопку создания клуба
                updateCreateClubButton();
                
            } catch (error) {
                console.error('Ошибка загрузки клубов:', error);
                clubsList.innerHTML = '<div class="empty-state"><i class="fas fa-search"></i> Ошибка загрузки</div>';
            }
        }

        // ===== ПЕРЕМЕШИВАНИЕ =====
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function shuffleClubs() {
            const shuffled = shuffleArray(allClubs);
            displayClubs(shuffled);
        }

        // ===== ОТОБРАЖЕНИЕ КЛУБОВ =====
        function displayClubs(clubs) {
            const clubsList = document.getElementById('clubsList');
            
            if (!clubs.length) {
                clubsList.innerHTML = '<div class="empty-state"><i class="fas fa-search"></i> Клубы не найдены</div>';
                return;
            }
            
            clubsList.innerHTML = '';
            
            clubs.forEach((club, index) => {
                const card = document.createElement('div');
                card.className = 'club-card-horizontal';
                card.style.animationDelay = `${index * 0.05}s`;
                card.onclick = () => {
                    window.location.href = `club-profile.html?id=${club.id}`;
                };
                
                const statusClass = club.joinPolicy === 'open' ? 'open' : 
                                club.joinPolicy === 'request' ? 'request' : 'closed';
                const statusText = club.joinPolicy === 'open' ? 'Открытый' : 
                                club.joinPolicy === 'request' ? 'По заявке' : 'Закрытый';
                
                const memberCount = club.memberCount || 0;
                const maxMembers = club.maxMembers || 50;
                
                const hasLogo = club.logo && club.logo.trim() !== '';
                
                card.innerHTML = `
                    <div class="card-logo">
                        ${hasLogo ? `<img src="${club.logo}" alt="${club.name}">` : club.name.charAt(0)}
                    </div>
                    <div class="card-info">
                        <div class="card-name">${club.name || 'Клуб'}</div>
                        <div class="card-details">
                            <span><i class="fas fa-map-marker-alt"></i> ${club.city || '—'}</span>
                            <span><i class="fas fa-user-tie"></i> ${club.ownerName || '—'}</span>
                        </div>
                    </div>
                    <div class="card-right">
                        <div class="card-frs"><i class="fas fa-star"></i>${club.clubFRS || 0}</div>
                        <div class="card-members">
                            <i class="fas fa-users"></i>
                            <span class="member-count">${memberCount}</span>
                            <span style="color:#555;">/ ${maxMembers}</span>
                        </div>
                        <div class="card-status ${statusClass}">${statusText}</div>
                    </div>
                `;
                
                clubsList.appendChild(card);
            });
        }

        // ===== ФИЛЬТРАЦИЯ =====
        function filterClubs() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            const city = document.getElementById('cityFilter').value;
            const sport = document.getElementById('sportFilter').value;
            
            const filtered = allClubs.filter(club => {
                const matchesSearch = (club.name || '').toLowerCase().includes(searchTerm);
                const matchesCity = !city || club.city === city;
                const matchesSport = !sport || (club.sports && club.sports.includes(sport));
                return matchesSearch && matchesCity && matchesSport;
            });
            
            displayClubs(filtered);
        }

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        // Сначала показываем загрузку
        document.getElementById('clubsList').innerHTML = `
            <div class="loading"><div class="loading-spinner"></div> Загрузка клубов...</div>
        `;

        // Потом проверяем пользователя
        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            
            // 1. ОПРЕДЕЛЯЕМ РОЛЬ ПОЛЬЗОВАТЕЛЯ (есть ли клуб)
            if (user) {
                try {
                    const fighterDoc = await getDoc(doc(db, 'fighters', user.uid));
                    if (fighterDoc.exists()) {
                        myClubId = fighterDoc.data().clubId || null;
                        if (myClubId) {
                            const clubDoc = await getDoc(doc(db, 'clubs', myClubId));
                            if (clubDoc.exists()) {
                                myClubName = clubDoc.data().name || 'Мой клуб';
                            }
                        }
                        // Получаем FRS пользователя
                        await getUserFRS();
                    }
                } catch (err) {
                    console.error('Ошибка проверки клуба:', err);
                }
            } else {
                currentUserFRS = 0;
            }
            
            // 2. РЕНДЕРИМ ПЕРЕКЛЮЧАТЕЛЬ (с данными или без)
            renderSwitcher();
            
            // 3. ЗАГРУЖАЕМ КЛУБЫ И СТАТИСТИКУ
            await Promise.all([loadClubs(), loadStats()]);
            
            // 4. ОБНОВЛЯЕМ КНОПКУ (на всякий случай)
            updateCreateClubButton();
        });

        // ===== СОБЫТИЯ =====
        document.getElementById('searchInput').addEventListener('input', filterClubs);
        document.getElementById('cityFilter').addEventListener('change', filterClubs);
        document.getElementById('sportFilter').addEventListener('change', filterClubs);
        document.getElementById('shuffleBtn').addEventListener('click', shuffleClubs);

        // ============================================================
        // 🔧 СЕЗОНЫ: плашка сезона
        // ============================================================
        async function loadSeasonBanner() {
            try {
                initSeasons(db, auth);
                const season = await getActiveSeason();

                if (!season) {
                    document.getElementById('seasonBanner').style.display = 'none';
                    return;
                }

                const banner = document.getElementById('seasonBanner');
                banner.style.display = 'flex';

                document.getElementById('seasonBannerName').textContent = season.name || 'Сезон';

                const startDate = season.startDate?.toDate?.() || (season.startDate ? new Date(season.startDate) : null);
                const endDate = season.endDate?.toDate?.() || (season.endDate ? new Date(season.endDate) : null);
                if (startDate && endDate) {
                    const fmt = (d) => d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
                    document.getElementById('seasonBannerDates').textContent = `${fmt(startDate)} — ${fmt(endDate)}`;
                }

                // Для клубов показываем сумму призов клубов
                let clubPool = 0;
                if (Array.isArray(season.clubPrizes)) {
                    clubPool = season.clubPrizes.reduce((sum, p) => sum + (p.amount || 0), 0);
                } else {
                    clubPool = season.prizePool || 0;
                }
                document.getElementById('seasonPrizePool').textContent = clubPool.toLocaleString() + ' ₽';

                startSeasonTimer(endDate);

            } catch (e) {
                console.warn('⚠️ Ошибка загрузки сезона:', e);
                document.getElementById('seasonBanner').style.display = 'none';
            }
        }

        function startSeasonTimer(endDate) {
            if (_seasonTimerInterval) clearInterval(_seasonTimerInterval);
            if (!endDate) return;

            const timerEl = document.getElementById('seasonTimer');

            function update() {
                const now = Date.now();
                const diff = endDate.getTime() - now;

                if (diff <= 0) {
                    timerEl.textContent = 'Завершён';
                    clearInterval(_seasonTimerInterval);
                    return;
                }

                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const secs = Math.floor((diff % (1000 * 60)) / 1000);

                if (days > 0) timerEl.textContent = `${days}д ${hours}ч ${mins}м`;
                else if (hours > 0) timerEl.textContent = `${hours}ч ${mins}м ${secs}с`;
                else timerEl.textContent = `${mins}м ${secs}с`;
            }

            update();
            _seasonTimerInterval = setInterval(update, 1000);
        }

        document.getElementById('seasonDetailsBtn')?.addEventListener('click', async () => {
            try {
                const season = await getActiveSeason();
                if (season) window.location.href = `season-details.html?id=${season.id}`;
            } catch (e) {}
        });

        // Запускаем после загрузки клубов
        loadSeasonBanner();
    </script>
</body>
