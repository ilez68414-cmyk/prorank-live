<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="manifest" href="/prorank-live/manifest.json">
    <link rel="apple-touch-icon" href="/prorank-live/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PRORANK">
    <meta name="theme-color" content="#fbbf24">
    <meta name="mobile-web-app-capable" content="yes">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Клуб PRORANK — просмотр, вступление, управление">
    <title>Клуб | PRORANK</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(ellipse at 30% 40%, rgba(251, 191, 36, 0.15) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 80%, rgba(251, 191, 36, 0.08) 0%, transparent 50%),
                        linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 40%, #1a1a1a 100%);
            background-attachment: fixed;
            color: #fff;
            line-height: 1.4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main { flex: 1; }

        .gold-top {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #fbbf24, #ffdd88, #fbbf24, #b8860b);
            z-index: 1001;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(251, 191, 36, 0.25);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            cursor: pointer;
            background: linear-gradient(135deg, #ffffff, #fbbf24);
            background-clip: text;
            color: transparent;
        }

        .logo span {
            background: linear-gradient(135deg, #fbbf24, #ffdd77);
            background-clip: text;
            color: transparent;
        }

        .menu-toggle {
            display: none;
            background: rgba(251,191,36,0.1);
            border: 1px solid #fbbf24;
            color: #fbbf24;
            font-size: 1.6rem;
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 12px;
            min-height: 44px;
            min-width: 44px;
        }

        .nav-links {
            display: flex;
            gap: 6px;
            background: rgba(15,15,15,0.7);
            backdrop-filter: blur(12px);
            padding: 5px 14px;
            border-radius: 60px;
            border: 1px solid rgba(251,191,36,0.2);
        }

        .nav-links a {
            color: #ddd;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 8px 18px;
            border-radius: 40px;
            transition: all 0.2s ease;
        }

        .nav-links a i {
            margin-right: 8px;
            color: #fbbf24;
        }

        .nav-links a:hover {
            color: #fbbf24;
            background: rgba(251,191,36,0.1);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 1.5rem 24px;
        }

        /* ===== ВКЛАДКИ ===== */
        .club-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .club-tab {
            flex: 1;
            padding: 12px 20px;
            background: rgba(15,15,15,0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(251,191,36,0.15);
            border-radius: 16px;
            color: #888;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 50px;
            text-decoration: none;
        }

        .club-tab:hover {
            border-color: rgba(251,191,36,0.3);
            color: #fff;
            transform: translateY(-2px);
        }

        .club-tab.active {
            background: #fbbf24;
            color: #000;
            border-color: #fbbf24;
            box-shadow: 0 4px 20px rgba(251, 191, 36, 0.3);
        }

        .club-tab i {
            font-size: 1.2rem;
        }

        /* ===== CLUB PROFILE ===== */
        .club-header {
            background: rgba(15,15,15,0.7);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid rgba(251,191,36,0.2);
            text-align: center;
            animation: fadeInUp 0.5s ease;
        }

        .club-logo {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #fbbf24;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            font-weight: bold;
            color: #000;
            border: 4px solid #fbbf24;
            box-shadow: 0 0 40px rgba(251, 191, 36, 0.3);
            overflow: hidden;
            margin: 0 auto 15px;
            position: relative;
            transition: all 0.3s ease;
        }

        .club-logo.clickable:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(251, 191, 36, 0.5);
        }

        .club-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .club-name {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 8px;
        }

        .club-status {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .club-status.open {
            background: rgba(16,185,129,0.15);
            border: 1px solid rgba(16,185,129,0.3);
            color: #10b981;
        }

        .club-status.request {
            background: rgba(251,191,36,0.15);
            border: 1px solid rgba(251,191,36,0.3);
            color: #fbbf24;
        }

        .club-status.closed {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.3);
            color: #ef4444;
        }

        .club-meta {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 12px;
            color: #888;
            font-size: 0.85rem;
        }

        .club-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .club-meta i {
            color: #fbbf24;
        }

        .club-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: #fbbf24;
            color: #000;
        }

        .btn-primary:hover {
            background: #ffdd44;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.25);
        }

        .btn-primary:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-danger {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.3);
            color: #ef4444;
        }

        .btn-danger:hover {
            background: rgba(239,68,68,0.25);
        }

        .btn-outline {
            background: #333;
            border: 1px solid #555;
            color: #fff;
        }

        .btn-outline:hover {
            background: #444;
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 0.75rem;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(15,15,15,0.7);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 18px;
            text-align: center;
            border: 1px solid rgba(251,191,36,0.15);
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 800;
            color: #fbbf24;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #888;
            margin-top: 4px;
        }

        .tabs {
            display: flex;
            gap: 4px;
            background: rgba(15,15,15,0.5);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 4px;
            margin-bottom: 20px;
            border: 1px solid rgba(251,191,36,0.1);
            overflow-x: auto;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            background: transparent;
            color: #888;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.8rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 40px;
            white-space: nowrap;
        }

        .tab-btn:hover {
            color: #fff;
            background: rgba(255,255,255,0.05);
        }

        .tab-btn.active {
            color: #fbbf24;
            background: rgba(251,191,36,0.12);
        }

        .tab-content {
            display: none;
            animation: fadeInUp 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        .panel {
            background: rgba(15,15,15,0.7);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(251,191,36,0.15);
        }

        .panel-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel-title i {
            color: #fbbf24;
        }

        .members-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }

        .member-card {
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .member-card:hover {
            border-color: rgba(251,191,36,0.3);
            transform: translateY(-2px);
        }

        .member-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fbbf24;
            overflow: hidden;
            flex-shrink: 0;
        }

        .member-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .member-info {
            flex: 1;
            min-width: 0;
        }

        .member-name {
            font-weight: 600;
            color: #fff;
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .member-frs {
            font-size: 0.7rem;
            color: #888;
        }

        .member-role {
            font-size: 0.6rem;
            padding: 2px 8px;
            border-radius: 20px;
            background: #fbbf24;
            color: #000;
            font-weight: 700;
            flex-shrink: 0;
        }

        .member-actions {
            display: none;
            gap: 4px;
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
        }

        .member-card.owner-mode:hover .member-actions {
            display: flex;
        }

        .member-actions button {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn-remove {
            background: rgba(239,68,68,0.15);
            color: #ef4444;
            border: 1px solid rgba(239,68,68,0.3) !important;
        }

        .btn-remove:hover {
            background: rgba(239,68,68,0.3);
        }

        .btn-message {
            background: rgba(59,130,246,0.15);
            color: #60a5fa;
            border: 1px solid rgba(59,130,246,0.3) !important;
        }

        .btn-message:hover {
            background: rgba(59,130,246,0.3);
        }

        .applications-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .application-item {
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .application-info {
            flex: 1;
        }

        .application-name {
            font-weight: 600;
            color: #fff;
            font-size: 0.9rem;
        }

        .application-frs {
            font-size: 0.75rem;
            color: #888;
        }

        .application-message {
            font-size: 0.75rem;
            color: #666;
            margin-top: 3px;
        }

        .application-actions {
            display: flex;
            gap: 6px;
        }

        .btn-approve {
            padding: 6px 14px;
            background: rgba(16,185,129,0.15);
            border: 1px solid rgba(16,185,129,0.3);
            color: #10b981;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s ease;
        }

        .btn-approve:hover {
            background: rgba(16,185,129,0.25);
        }

        .btn-reject {
            padding: 6px 14px;
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.3);
            color: #ef4444;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s ease;
        }

        .btn-reject:hover {
            background: rgba(239,68,68,0.25);
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: #888;
        }

        .empty-state i {
            font-size: 2rem;
            display: block;
            margin-bottom: 10px;
            color: #444;
        }

        .tournament-placeholder {
            text-align: center;
            padding: 40px;
            color: #888;
            background: rgba(251,191,36,0.03);
            border-radius: 16px;
            border: 1px dashed rgba(251,191,36,0.2);
        }

        .tournament-placeholder i {
            font-size: 3rem;
            color: #fbbf24;
            display: block;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #151515;
            padding: 24px;
            border-radius: 24px;
            width: 90%;
            max-width: 500px;
            border: 1px solid rgba(251,191,36,0.3);
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fbbf24;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #ccc;
            font-size: 0.8rem;
        }

        .input-group input,
        .input-group select,
        .input-group textarea {
            width: 100%;
            padding: 10px 14px;
            background: #1a1a1a;
            border: 1px solid rgba(251,191,36,0.25);
            color: #fff;
            border-radius: 12px;
            font-size: 0.9rem;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .input-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .input-group input:focus,
        .input-group select:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: #fbbf24;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        .btn-confirm {
            background: #fbbf24;
            color: #000;
        }

        .btn-confirm:hover {
            background: #ffdd44;
        }

        .btn-cancel {
            background: #333;
            color: #fff;
        }

        .btn-cancel:hover {
            background: #444;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #888;
        }

        .error-message {
            text-align: center;
            padding: 50px;
            color: #ef4444;
        }

        .error-message a {
            color: #fbbf24;
            text-decoration: none;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(251,191,36,0.3);
            border-top-color: #fbbf24;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @media (max-width: 768px) {
            .container { padding: 1rem 16px; }
            .navbar { padding: 10px 16px; }
            .menu-toggle { display: block; }
            
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 68px;
                left: 18px;
                right: 18px;
                background: #0f0f0f;
                border-radius: 24px;
                padding: 20px;
                gap: 10px;
                border: 1px solid rgba(251,191,36,0.3);
                z-index: 1000;
            }
            
            .nav-links.show {
                display: flex;
            }
            
            .nav-links a {
                width: 100%;
                text-align: center;
            }
            
            .club-tab {
                padding: 10px 16px;
                font-size: 0.8rem;
                min-height: 44px;
            }
            
            .club-tab i {
                font-size: 1rem;
            }
            
            .club-header {
                padding: 20px;
            }
            
            .club-name {
                font-size: 1.4rem;
            }
            
            .members-grid {
                grid-template-columns: 1fr;
            }
            
            .tab-btn {
                font-size: 0.7rem;
                padding: 8px 10px;
            }
        }

        @media (max-width: 480px) {
            .container { padding: 0.8rem 10px; }
            
            .club-tab {
                padding: 8px 12px;
                font-size: 0.7rem;
                gap: 6px;
                min-height: 40px;
            }
            
            .stats-row {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            
            .stat-card {
                padding: 15px;
            }
            
            .stat-value {
                font-size: 1.3rem;
            }
            
            .member-actions {
                display: flex !important;
                position: static;
                transform: none;
            }
        }
    </style>
</head>
<body>
    <div class="gold-top"></div>

    <header class="navbar">
        <div class="logo" onclick="window.location='index.html'">PRO<span>RANK</span></div>
        <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
        <nav class="nav-links" id="navLinks"></nav>
    </header>

    <main>
        <div class="container">
            <!-- ВКЛАДКИ -->
            <div class="club-tabs" id="clubTabs" style="display: none;">
                <button class="club-tab active">
                    <i class="fas fa-shield-alt"></i> Мой клуб
                </button>
                <a href="clubs.html" class="club-tab">
                    <i class="fas fa-search"></i> Искать клубы
                </a>
            </div>

            <!-- КЛУБ -->
            <div id="clubContainer">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p style="margin-top: 10px;">Загрузка клуба...</p>
                </div>
            </div>
        </div>
    </main>

    <input type="file" id="clubLogoInput" accept="image/*" style="display: none;">

    <!-- Модалка заявки -->
    <div class="modal" id="applicationModal">
        <div class="modal-content">
            <div class="modal-title"><i class="fas fa-envelope"></i> Заявка на вступление</div>
            <div class="input-group">
                <label>Сообщение владельцу (опционально)</label>
                <textarea id="applicationMessage" placeholder="Напишите о себе..."></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeApplicationModal()">Отмена</button>
                <button class="btn-confirm" onclick="submitApplication()">Отправить</button>
            </div>
        </div>
    </div>

    <!-- Модалка редактирования -->
    <div class="modal" id="editClubModal">
        <div class="modal-content">
            <div class="modal-title"><i class="fas fa-edit"></i> Редактировать клуб</div>
            
            <div class="input-group">
                <label>Название клуба</label>
                <input type="text" id="editClubName">
            </div>
            
            <div class="input-group">
                <label>Логотип клуба</label>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <img id="editClubLogoPreview" src="" alt="Логотип" style="width: 60px; height: 60px; border-radius: 50%; object-fit: cover; background: #333; display: none;">
                    <input type="file" id="editClubLogoInput" accept="image/*" style="flex: 1; padding: 8px; background: #1a1a1a; border: 1px solid rgba(251,191,36,0.25); color: #fff; border-radius: 12px; font-size: 0.8rem;">
                </div>
                <small style="color: #888; font-size: 0.7rem;">Рекомендуемый размер: 400x400 px</small>
            </div>

            <div class="input-group">
                <label>Город</label>
                <input type="text" id="editClubCity">
            </div>
            
            <div class="input-group">
                <label>Адрес зала</label>
                <input type="text" id="editClubAddress">
            </div>
            
            <div class="input-group">
                <label>Телефон</label>
                <input type="text" id="editClubPhone">
            </div>
            
            <div class="input-group">
                <label>Описание</label>
                <textarea id="editClubDescription" rows="3"></textarea>
            </div>
            
            <div class="input-group">
                <label>Политика вступления</label>
                <select id="editJoinPolicy">
                    <option value="open">Открытый (все могут вступить)</option>
                    <option value="request">По заявке (нужно одобрение)</option>
                    <option value="closed">Закрытый (только по приглашению)</option>
                </select>
            </div>
            
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeEditModal()">Отмена</button>
                <button class="btn-confirm" onclick="saveClubChanges()">Сохранить</button>
            </div>
        </div>
    </div>

    <div id="mobileBottomNavContainer"></div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js"
            }
        }
    </script>
    <script type="module" src="header.js?v=3"></script>
    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs, query, where, arrayUnion, arrayRemove, serverTimestamp, increment } from "firebase/firestore";
        import { getAuth, onAuthStateChanged } from "firebase/auth";

        const firebaseConfig = {
            apiKey: "AIzaSyDUGYJY7pX7q02MS5SACMIIQXpjpQ97mPw",
            authDomain: "proranklive.firebaseapp.com",
            projectId: "proranklive",
            storageBucket: "proranklive.firebasestorage.app",
            messagingSenderId: "716836144015",
            appId: "1:716836144015:web:f1575147750608d0f881fa"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const CLOUD_NAME = 'dbv7bfkgy'; 
        const UPLOAD_PRESET = 'prorank_avatars'; 

        let currentUser = null;
        let clubId = null;
        let clubData = null;
        let userRole = 'guest';

        const urlParams = new URLSearchParams(window.location.search);
        clubId = urlParams.get('id');

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            
            if (!clubId) {
                // Если нет id, пробуем найти клуб пользователя
                if (user) {
                    getDoc(doc(db, 'fighters', user.uid)).then(fighterDoc => {
                        if (fighterDoc.exists() && fighterDoc.data().clubId) {
                            window.location.href = `club-profile.html?id=${fighterDoc.data().clubId}`;
                        } else {
                            window.location.href = 'clubs.html';
                        }
                    });
                } else {
                    window.location.href = 'clubs.html';
                }
                return;
            }
            
            loadClubData();
        });

        async function loadClubData() {
            const container = document.getElementById('clubContainer');
            
            try {
                const clubDoc = await getDoc(doc(db, 'clubs', clubId));
                
                if (!clubDoc.exists()) {
                    container.innerHTML = '<div class="error-message">Клуб не найден</div>';
                    return;
                }
                
                clubData = {
                    id: clubDoc.id,
                    ...clubDoc.data()
                };
                
                if (currentUser && clubData.ownerId === currentUser.uid) {
                    userRole = 'owner';
                } else if (currentUser && clubData.members && clubData.members.includes(currentUser.uid)) {
                    userRole = 'member';
                } else {
                    userRole = 'guest';
                }
                
                // Показываем вкладки только для member (не owner)
                const clubTabs = document.getElementById('clubTabs');
                if (userRole === 'member') {
                    clubTabs.style.display = 'flex';
                } else {
                    clubTabs.style.display = 'none';
                }
                
                if (clubData.status !== 'approved' && userRole !== 'owner') {
                    container.innerHTML = '<div class="error-message">Клуб ещё не одобрен администратором</div>';
                    return;
                }
                
                renderClubPage();
                
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                container.innerHTML = '<div class="error-message">Ошибка загрузки данных</div>';
            }
        }

        function renderClubPage() {
            const container = document.getElementById('clubContainer');
            
            const statusClass = clubData.joinPolicy === 'open' ? 'open' : 
                               clubData.joinPolicy === 'request' ? 'request' : 'closed';
            const statusText = clubData.joinPolicy === 'open' ? 'Открытый' : 
                              clubData.joinPolicy === 'request' ? 'По заявке' : 'Закрытый';
            
            container.innerHTML = `
                <div class="club-header">
                    <div class="club-logo ${userRole === 'owner' ? 'clickable' : ''}" ${userRole === 'owner' ? `onclick="document.getElementById('clubLogoInput').click()" title="Изменить логотип"` : ''}>
                        ${clubData.logo ? `<img src="${clubData.logo}" alt="${clubData.name}">` : clubData.name.charAt(0)}
                        ${userRole === 'owner' ? `
                            <div style="position: absolute; bottom: -5px; right: -5px; width: 30px; height: 30px; background: #fbbf24; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid #0a0a0a;">
                                <i class="fas fa-camera" style="font-size: 0.7rem; color: #000;"></i>
                            </div>
                        ` : ''}
                    </div>
                    <div class="club-name">${clubData.name || 'Клуб'}</div>
                    <div class="club-status ${statusClass}">${statusText}</div>
                    
                    <div class="club-meta">
                        <span><i class="fas fa-map-marker-alt"></i> ${clubData.city || '—'}</span>
                        <span><i class="fas fa-phone"></i> ${clubData.phone || '—'}</span>
                        <span><i class="fas fa-fist-raised"></i> ${clubData.sports ? clubData.sports.join(', ') : '—'}</span>
                        <span><i class="fas fa-user-tie"></i> ${clubData.ownerName || '—'}</span>
                    </div>
                    
                    ${clubData.description ? `<p style="color: #ccc; margin-bottom: 15px;">${clubData.description}</p>` : ''}
                    
                    <div class="club-actions">
                        ${renderActionButtons()}
                    </div>
                </div>
                
                <div class="stats-row">
                    <div class="stat-card">
                        <div class="stat-value">${clubData.clubFRS || 0}</div>
                        <div class="stat-label">FRS клуба</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${clubData.memberCount || 0}</div>
                        <div class="stat-label">Участников</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${clubData.wins || 0}</div>
                        <div class="stat-label">Побед</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${clubData.losses || 0}</div>
                        <div class="stat-label">Поражений</div>
                    </div>
                </div>
                
                <div class="tabs">
                    <button class="tab-btn active" data-tab="members">
                        <i class="fas fa-users"></i> Участники
                    </button>
                    <button class="tab-btn" data-tab="about">
                        <i class="fas fa-info-circle"></i> О клубе
                    </button>
                    <button class="tab-btn" data-tab="tournaments">
                        <i class="fas fa-trophy"></i> Турниры
                    </button>
                    ${userRole === 'owner' ? `
                    <button class="tab-btn" data-tab="applications">
                        <i class="fas fa-envelope"></i> Заявки
                    </button>
                    <button class="tab-btn" data-tab="settings">
                        <i class="fas fa-cog"></i> Настройки
                    </button>
                    ` : ''}
                </div>
                
                <div class="tab-content active" id="tab-members">
                    <div class="panel">
                        <div class="panel-title"><i class="fas fa-users"></i> Участники клуба</div>
                        <div class="members-grid" id="membersGrid">
                            <div class="empty-state">Загрузка...</div>
                        </div>
                    </div>
                </div>
                
                <div class="tab-content" id="tab-about">
                    <div class="panel">
                        <div class="panel-title"><i class="fas fa-info-circle"></i> О клубе</div>
                        <div style="color: #ccc; line-height: 1.6;">
                            ${clubData.description ? clubData.description : 'Описание отсутствует'}
                        </div>
                        <div style="margin-top: 20px; display: grid; gap: 10px;">
                            <div style="display: flex; gap: 10px; align-items: center;">
                                <i class="fas fa-map-marker-alt" style="color: #fbbf24; width: 20px;"></i>
                                <span>${clubData.address || 'Адрес не указан'}</span>
                            </div>
                            <div style="display: flex; gap: 10px; align-items: center;">
                                <i class="fas fa-phone" style="color: #fbbf24; width: 20px;"></i>
                                <span>${clubData.phone || 'Телефон не указан'}</span>
                            </div>
                            <div style="display: flex; gap: 10px; align-items: center;">
                                <i class="fas fa-fist-raised" style="color: #fbbf24; width: 20px;"></i>
                                <span>${clubData.sports ? clubData.sports.join(', ') : 'Виды спорта не указаны'}</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="tab-content" id="tab-tournaments">
                    <div class="panel">
                        <div class="panel-title"><i class="fas fa-trophy"></i> Турниры клуба</div>
                        <div class="tournament-placeholder">
                            <i class="fas fa-trophy"></i>
                            <h3 style="margin-bottom: 10px;">Скоро здесь будут турниры</h3>
                            <p style="font-size: 0.9rem;">Клуб сможет создавать турниры и соревнования</p>
                        </div>
                    </div>
                </div>
                
                ${userRole === 'owner' ? `
                <div class="tab-content" id="tab-applications">
                    <div class="panel">
                        <div class="panel-title"><i class="fas fa-envelope"></i> Заявки на вступление</div>
                        <div class="applications-list" id="applicationsList">
                            <div class="empty-state">Загрузка...</div>
                        </div>
                    </div>
                </div>
                
                <div class="tab-content" id="tab-settings">
                    <div class="panel">
                        <div class="panel-title"><i class="fas fa-cog"></i> Настройки клуба</div>
                        
                        <div style="display: grid; gap: 15px;">
                            <div>
                                <label style="font-size: 0.8rem; color: #888;">Ссылка на клуб</label>
                                <div style="display: flex; gap: 8px; margin-top: 5px;">
                                    <input type="text" id="clubLink" readonly value="${window.location.origin}/prorank-live/club-profile.html?id=${clubId}" style="flex: 1; padding: 10px; background: #1a1a1a; border: 1px solid rgba(251,191,36,0.25); color: #fff; border-radius: 12px; font-size: 0.75rem;">
                                    <button class="btn btn-primary btn-sm" onclick="copyClubLink()"><i class="fas fa-copy"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                ` : ''}
            `;
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    
                    const tabName = this.dataset.tab;
                    document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
                    document.getElementById('tab-' + tabName).classList.add('active');
                });
            });
            
            loadMembers();
            
            if (userRole === 'owner') {
                loadApplications();
            }
        }

       function renderActionButtons() {
            if (!currentUser) {
                return `<button class="btn btn-primary" onclick="window.location.href='login.html'"><i class="fas fa-sign-in-alt"></i> Войдите, чтобы вступить</button>`;
            }
            
            if (userRole === 'owner') {
                return `
                    <button class="btn btn-primary" onclick="openEditModal()"><i class="fas fa-edit"></i> Редактировать</button>
                    <button class="btn btn-outline" onclick="copyClubLink()"><i class="fas fa-share"></i> Поделиться</button>
                `;
            }
            
            if (userRole === 'member') {
                return `
                    <button class="btn btn-danger" onclick="leaveClub()"><i class="fas fa-sign-out-alt"></i> Покинуть клуб</button>
                `;
            }
            
            if (clubData.joinPolicy === 'closed') {
                return `<button class="btn btn-primary" disabled><i class="fas fa-lock"></i> Клуб закрыт</button>`;
            }
            
            // Проверяем, есть ли уже заявка
            checkExistingApplication();
            
            return `<button class="btn btn-primary" id="joinButton" onclick="openApplicationModal()"><i class="fas fa-user-plus"></i> ${clubData.joinPolicy === 'open' ? 'Вступить в клуб' : 'Подать заявку'}</button>`;
        }

        async function checkExistingApplication() {
            if (!currentUser || !clubId) return;
            
            try {
                const appsRef = collection(db, 'club_applications');
                const q = query(
                    appsRef,
                    where('clubId', '==', clubId),
                    where('userId', '==', currentUser.uid),
                    where('status', '==', 'pending')
                );
                
                const snapshot = await getDocs(q);
                
                if (!snapshot.empty) {
                    const btn = document.getElementById('joinButton');
                    if (btn) {
                        btn.textContent = 'Ожидает подтверждения';
                        btn.disabled = true;
                    }
                }
            } catch (error) {
                console.error('Ошибка проверки заявки:', error);
            }
        }

        async function loadMembers() {
            const membersGrid = document.getElementById('membersGrid');
            
            if (!clubData.members || clubData.members.length === 0) {
                membersGrid.innerHTML = '<div class="empty-state"><i class="fas fa-users"></i> В клубе пока нет участников</div>';
                return;
            }
            
            membersGrid.innerHTML = '';
            
            for (const memberId of clubData.members) {
                const memberDoc = await getDoc(doc(db, 'fighters', memberId));
                
                if (memberDoc.exists()) {
                    const member = memberDoc.data();
                    const memberCard = document.createElement('div');
                    memberCard.className = 'member-card';
                    
                    if (userRole === 'owner') {
                        memberCard.classList.add('owner-mode');
                    }
                    
                    const isOwnerMember = memberId === clubData.ownerId;
                    
                    memberCard.innerHTML = `
                        <div class="member-avatar" onclick="window.location.href='profile.html?id=${memberId}'">
                            ${member.avatar ? `<img src="${member.avatar}" alt="${member.name}">` : member.name.charAt(0)}
                        </div>
                        <div class="member-info" onclick="window.location.href='profile.html?id=${memberId}'">
                            <div class="member-name">${member.name || 'Боец'} ${isOwnerMember ? '👑' : ''}</div>
                            <div class="member-frs">FRS: ${member.frs || 0}</div>
                        </div>
                        ${isOwnerMember ? '<span class="member-role">Глава</span>' : ''}
                        ${userRole === 'owner' && !isOwnerMember ? `
                            <div class="member-actions">
                                <button class="btn-message" onclick="event.stopPropagation(); window.location.href='chats.html'" title="Написать">
                                    <i class="fas fa-comment"></i>
                                </button>
                                <button class="btn-remove" onclick="event.stopPropagation(); removeMember('${memberId}')" title="Исключить">
                                    <i class="fas fa-user-minus"></i>
                                </button>
                            </div>
                        ` : ''}
                    `;
                    
                    membersGrid.appendChild(memberCard);
                }
            }
        }

        async function loadApplications() {
            const applicationsList = document.getElementById('applicationsList');
            
            try {
                const appsRef = collection(db, 'club_applications');
                const q = query(
                    appsRef,
                    where('clubId', '==', clubId),
                    where('status', '==', 'pending')
                );
                
                const snapshot = await getDocs(q);
                
                if (snapshot.empty) {
                    applicationsList.innerHTML = '<div class="empty-state"><i class="fas fa-envelope"></i> Нет заявок</div>';
                    return;
                }
                
                applicationsList.innerHTML = '';
                
                snapshot.forEach((docSnap) => {
                    const app = docSnap.data();
                    const appItem = document.createElement('div');
                    appItem.className = 'application-item';
                    
                    appItem.innerHTML = `
                        <div class="application-info">
                            <div class="application-name">${app.userName || 'Боец'}</div>
                            <div class="application-frs">FRS: ${app.userFRS || 0}</div>
                            ${app.message ? `<div class="application-message">${app.message}</div>` : ''}
                        </div>
                        <div class="application-actions">
                            <button class="btn-approve" onclick="approveApplication('${docSnap.id}', '${app.userId}')">Принять</button>
                            <button class="btn-reject" onclick="rejectApplication('${docSnap.id}')">Отклонить</button>
                        </div>
                    `;
                    
                    applicationsList.appendChild(appItem);
                });
                
            } catch (error) {
                console.error('Ошибка загрузки заявок:', error);
                applicationsList.innerHTML = '<div class="empty-state">Ошибка загрузки</div>';
            }
        }

        // ===== ФУНКЦИИ =====
        window.openApplicationModal = function() {
            document.getElementById('applicationModal').classList.add('show');
        };

        window.closeApplicationModal = function() {
            document.getElementById('applicationModal').classList.remove('show');
            document.getElementById('applicationMessage').value = '';
        };

        window.submitApplication = async function() {
            if (!currentUser || !clubId) return;
            
            const message = document.getElementById('applicationMessage').value.trim();
            
            try {
                const fighterDoc = await getDoc(doc(db, 'fighters', currentUser.uid));
                
                if (!fighterDoc.exists()) {
                    alert('Только бойцы могут вступать в клубы');
                    return;
                }
                
                const fighterData = fighterDoc.data();
                
                const appsRef = collection(db, 'club_applications');
                await setDoc(doc(appsRef), {
                    clubId: clubId,
                    clubName: clubData.name,
                    userId: currentUser.uid,
                    userName: fighterData.name || 'Боец',
                    userFRS: fighterData.frs || 0,
                    status: 'pending',
                    message: message,
                    createdAt: serverTimestamp(),
                    processedAt: null,
                    processedBy: ''
                });
                
                closeApplicationModal();
                alert('✅ Заявка отправлена!');
                
               const btn = document.getElementById('joinButton');
                if (btn) {
                    btn.textContent = 'Ожидает подтверждения';
                    btn.disabled = true;
                }
                
            } catch (error) {
                console.error('Ошибка отправки:', error);
                alert('Ошибка отправки заявки');
            }
        };

        window.leaveClub = async function() {
            if (!currentUser || !clubId) return;
            
            if (!confirm('Вы уверены, что хотите покинуть клуб?')) return;
            
            try {
                await updateDoc(doc(db, 'clubs', clubId), {
                    members: arrayRemove(currentUser.uid),
                    memberCount: increment(-1),
                    updatedAt: serverTimestamp()
                });
                
                await updateDoc(doc(db, 'fighters', currentUser.uid), {
                    clubId: null,
                    clubRole: null,
                    clubName: null,
                    clubLogo: null
                });
                
                alert('Вы покинули клуб');
                window.location.href = 'clubs.html';
                
            } catch (error) {
                console.error('Ошибка выхода:', error);
                alert('Ошибка выхода из клуба');
            }
        };

        window.openEditModal = function() {
            document.getElementById('editClubName').value = clubData.name || '';
            document.getElementById('editClubCity').value = clubData.city || '';
            document.getElementById('editClubAddress').value = clubData.address || '';
            document.getElementById('editClubPhone').value = clubData.phone || '';
            document.getElementById('editClubDescription').value = clubData.description || '';
            document.getElementById('editJoinPolicy').value = clubData.joinPolicy || 'request';
            
            const logoPreview = document.getElementById('editClubLogoPreview');
            if (clubData.logo) {
                logoPreview.src = clubData.logo;
                logoPreview.style.display = 'block';
            } else {
                logoPreview.style.display = 'none';
            }
            
            document.getElementById('editClubLogoInput').value = '';
            
            document.getElementById('editClubModal').classList.add('show');
        };

        window.closeEditModal = function() {
            document.getElementById('editClubModal').classList.remove('show');
        };

        async function uploadClubLogo(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', UPLOAD_PRESET);
            
            const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                method: 'POST',
                body: formData
            });
            
            const data = await response.json();
            
            if (data.secure_url) {
                return data.secure_url.replace('/upload/', '/upload/w_400,h_400,c_fill,f_auto,q_auto/');
            } else {
                throw new Error(data.error?.message || 'Ошибка загрузки');
            }
        }

        window.saveClubChanges = async function() {
            const name = document.getElementById('editClubName').value.trim();
            const city = document.getElementById('editClubCity').value.trim();
            const address = document.getElementById('editClubAddress').value.trim();
            const phone = document.getElementById('editClubPhone').value.trim();
            const description = document.getElementById('editClubDescription').value.trim();
            const joinPolicy = document.getElementById('editJoinPolicy').value;
            
            if (!name || !city) {
                alert('Название и город обязательны');
                return;
            }
            
            try {
                await updateDoc(doc(db, 'clubs', clubId), {
                    name: name,
                    city: city,
                    address: address,
                    phone: phone,
                    description: description,
                    joinPolicy: joinPolicy,
                    updatedAt: serverTimestamp()
                });
                
                clubData.name = name;
                clubData.city = city;
                clubData.address = address;
                clubData.phone = phone;
                clubData.description = description;
                clubData.joinPolicy = joinPolicy;
                
                closeEditModal();
                renderClubPage();
                
            } catch (error) {
                console.error('Ошибка сохранения:', error);
                alert('Ошибка сохранения');
            }
        };

        window.copyClubLink = function() {
            const link = `${window.location.origin}/prorank-live/club-profile.html?id=${clubId}`;
            
            if (navigator.clipboard) {
                navigator.clipboard.writeText(link).then(() => {
                    alert('Ссылка скопирована!');
                });
            } else {
                const input = document.createElement('input');
                input.value = link;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                alert('Ссылка скопирована!');
            }
        };

        window.removeMember = async function(memberId) {
            if (!confirm('Исключить участника из клуба?')) return;
            
            try {
                await updateDoc(doc(db, 'clubs', clubId), {
                    members: arrayRemove(memberId),
                    memberCount: increment(-1),
                    updatedAt: serverTimestamp()
                });
                
                await updateDoc(doc(db, 'fighters', memberId), {
                    clubId: null,
                    clubRole: null,
                    clubName: null,
                    clubLogo: null
                });
                
                clubData.members = clubData.members.filter(id => id !== memberId);
                clubData.memberCount--;
                
                loadMembers();
                
            } catch (error) {
                console.error('Ошибка исключения:', error);
                alert('Ошибка исключения участника');
            }
        };

        window.approveApplication = async function(applicationId, userId) {
            try {
                await updateDoc(doc(db, 'club_applications', applicationId), {
                    status: 'approved',
                    processedAt: serverTimestamp(),
                    processedBy: currentUser.uid
                });
                
                await updateDoc(doc(db, 'clubs', clubId), {
                    members: arrayUnion(userId),
                    memberCount: increment(1),
                    updatedAt: serverTimestamp()
                });
                
                await updateDoc(doc(db, 'fighters', userId), {
                    clubId: clubId,
                    clubRole: 'member',
                    clubName: clubData.name,
                    clubLogo: clubData.logo || ''
                });
                
                const fighterDoc = await getDoc(doc(db, 'fighters', userId));
                const fighterFRS = fighterDoc.data().frs || 0;
                await updateDoc(doc(db, 'clubs', clubId), {
                    clubFRS: increment(fighterFRS)
                });
                
                alert('✅ Участник добавлен!');
                loadApplications();
                loadMembers();
                
            } catch (error) {
                console.error('Ошибка одобрения:', error);
                alert('Ошибка одобрения заявки');
            }
        };

        window.rejectApplication = async function(applicationId) {
            if (!confirm('Отклонить заявку?')) return;
            
            try {
                await updateDoc(doc(db, 'club_applications', applicationId), {
                    status: 'rejected',
                    processedAt: serverTimestamp(),
                    processedBy: currentUser.uid
                });
                
                loadApplications();
                
            } catch (error) {
                console.error('Ошибка отклонения:', error);
            }
        };

        // Предпросмотр логотипа
        document.getElementById('editClubLogoInput')?.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const preview = document.getElementById('editClubLogoPreview');
                    preview.src = event.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        // Загрузка логотипа по клику
        document.getElementById('clubLogoInput')?.addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            if (userRole !== 'owner') return;
            
            try {
                const logoElement = document.querySelector('.club-logo');
                if (logoElement) {
                    logoElement.innerHTML = '<div class="loading-spinner"></div>';
                }
                
                const logoUrl = await uploadClubLogo(file);
                
                await updateDoc(doc(db, 'clubs', clubId), {
                    logo: logoUrl,
                    updatedAt: serverTimestamp()
                });
                
                clubData.logo = logoUrl;
                
                renderClubPage();
                
                alert('✅ Логотип обновлён!');
                
            } catch (error) {
                console.error('Ошибка загрузки логотипа:', error);
                alert('Ошибка загрузки логотипа: ' + error.message);
                renderClubPage();
            }
            
            e.target.value = '';
        });
    </script>
</body>
</html>
