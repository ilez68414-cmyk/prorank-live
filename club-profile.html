<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="manifest" href="/prorank-live/manifest.json">
    <link rel="apple-touch-icon" href="/prorank-live/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PRORANK">
    <meta name="theme-color" content="#fbbf24">
    <meta name="mobile-web-app-capable" content="yes">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Клуб PRORANK — просмотр, вступление, управление">
    <title>Клуб | PRORANK</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <style>
        /* ===== ДОПОЛНИТЕЛЬНЫЕ СТИЛИ ДЛЯ СТРАНИЦЫ КЛУБА ===== */
        .club-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 24px;
        }

        /* ===== КАРТОЧКА КЛУБА ===== */
        .club-profile-card {
            background: rgba(15,15,15,0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 20px 24px;
            margin-bottom: 24px;
            border: 1px solid rgba(251,191,36,0.15);
            transition: all 0.3s ease;
            animation: fadeInUp 0.5s ease;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .club-profile-card:hover {
            border-color: rgba(251,191,36,0.35);
            box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 30px rgba(251,191,36,0.05);
        }

        .club-profile-top {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .club-avatar-section {
            flex-shrink: 0;
            position: relative;
        }

        .club-avatar-section img {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            object-fit: cover;
            border: 2.5px solid #fbbf24;
            background: #1a1a1a;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(251,191,36,0.15);
            transition: all 0.3s ease;
        }

        .club-avatar-section img:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(251,191,36,0.3);
        }

        .club-avatar-edit {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 28px;
            height: 28px;
            background: #fbbf24;
            border-radius: 50%;
            border: 3px solid #1a1a1a;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #000;
            font-size: 11px;
        }

        .club-avatar-edit:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(251,191,36,0.4);
        }

        .club-avatar-edit.visible {
            display: flex;
        }

        .club-info-section {
            flex: 1;
            min-width: 0;
        }

        .club-top-row {
            display: flex;
            align-items: center;
            gap: 6px 10px;
            flex-wrap: wrap;
            margin-bottom: 4px;
        }

        .club-name-text {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.3px;
            white-space: nowrap;
        }

        .club-status-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 0.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            height: 20px;
        }

        .club-status-badge.open {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .club-status-badge.request {
            background: rgba(251, 191, 36, 0.12);
            border: 1px solid rgba(251, 191, 36, 0.2);
            color: #fbbf24;
        }

        .club-status-badge.closed {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .club-status-badge i {
            font-size: 0.4rem;
        }

        .club-details-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 14px;
            margin-bottom: 8px;
            align-items: center;
        }

        .club-details-row span {
            font-size: 0.7rem;
            color: #999;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .club-details-row i {
            color: #fbbf24;
            font-size: 0.65rem;
            width: 14px;
            text-align: center;
        }

        /* FRS и Участники на карточке */
        .club-frs-display {
            display: inline-flex;
            align-items: baseline;
            gap: 4px;
            background: rgba(251, 191, 36, 0.06);
            padding: 2px 14px 2px 8px;
            border-radius: 30px;
            border: 1px solid rgba(251, 191, 36, 0.12);
            height: 24px;
        }

        .club-frs-display i {
            color: #fbbf24;
            font-size: 0.65rem;
        }

        .club-frs-value {
            font-size: 1.1rem;
            font-weight: 800;
            color: #fbbf24;
            line-height: 1;
        }

        .club-frs-label {
            font-size: 0.45rem;
            font-weight: 700;
            color: #888;
            letter-spacing: 0.3px;
        }

        .club-members-display {
            display: inline-flex;
            align-items: baseline;
            gap: 4px;
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 14px 2px 8px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            height: 24px;
        }

        .club-members-display i {
            color: #fbbf24;
            font-size: 0.65rem;
        }

        .club-members-value {
            font-size: 1.1rem;
            font-weight: 800;
            color: #fbbf24;
            line-height: 1;
        }

        .club-members-label {
            font-size: 0.45rem;
            font-weight: 700;
            color: #888;
            letter-spacing: 0.3px;
        }

        .club-actions-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-club {
            padding: 5px 16px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: 'Inter', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 34px;
        }

        .btn-club:active {
            transform: scale(0.96);
        }

        .btn-club-primary {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1a1a1a;
            box-shadow: 0 4px 20px rgba(251,191,36,0.2);
        }

        .btn-club-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(251,191,36,0.3);
        }

        .btn-club-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-club-danger {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .btn-club-danger:hover {
            background: rgba(239, 68, 68, 0.2);
            transform: translateY(-2px);
        }

        .btn-club-outline {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .btn-club-outline:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .btn-club-outline-gold {
            background: rgba(251,191,36,0.08);
            border: 1px solid rgba(251,191,36,0.15);
            color: #fbbf24;
        }

        .btn-club-outline-gold:hover {
            background: rgba(251,191,36,0.15);
            border-color: rgba(251,191,36,0.3);
            transform: translateY(-2px);
        }

        .btn-club-sm {
            padding: 4px 12px;
            font-size: 0.6rem;
            min-height: 28px;
        }

        /* ===== ВКЛАДКИ ===== */
        .club-tabs {
            display: flex;
            gap: 4px;
            background: rgba(15,15,15,0.5);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 4px;
            margin-bottom: 20px;
            border: 1px solid rgba(251,191,36,0.1);
        }

        .club-tab-btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            background: transparent;
            color: #888;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 44px;
        }

        .club-tab-btn i {
            font-size: 1rem;
            transition: transform 0.2s ease;
        }

        .club-tab-btn:hover {
            color: #fff;
            background: rgba(255,255,255,0.05);
        }

        .club-tab-btn:hover i {
            transform: scale(1.1);
        }

        .club-tab-btn.active {
            color: #fbbf24;
            background: rgba(251,191,36,0.12);
            box-shadow: 0 0 20px rgba(251,191,36,0.05);
        }

        .club-tab-btn.active i {
            color: #fbbf24;
        }

        .club-tab-btn .badge {
            background: rgba(251,191,36,0.12);
            color: #fbbf24;
            font-size: 0.6rem;
            padding: 1px 8px;
            border-radius: 10px;
            font-weight: 700;
        }

        .club-tab-btn.owner-only {
            border-left: 1px solid rgba(255,255,255,0.05);
            color: #555;
        }

        .club-tab-btn.owner-only.active {
            color: #fbbf24;
        }

        .club-tab-content {
            display: none;
            animation: fadeInUp 0.3s ease;
        }

        .club-tab-content.active {
            display: block;
        }

        /* ===== ПАНЕЛИ ===== */
        .club-panel {
            background: rgba(15,15,15,0.7);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 20px;
            border: 1px solid rgba(251,191,36,0.15);
            transition: all 0.3s ease;
        }

        .club-panel:hover {
            border-color: rgba(251,191,36,0.3);
        }

        .club-panel-title {
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .club-panel-title i {
            color: #fbbf24;
        }

        .club-panel-title span {
            color: #888;
            font-weight: 400;
            font-size: 0.85rem;
        }

        /* ===== УЧАСТНИКИ ===== */
        .club-members-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .club-search-input {
            padding: 8px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 40px;
            color: #fff;
            font-size: 0.8rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.2s ease;
            width: 180px;
        }

        .club-search-input::placeholder {
            color: #555;
        }

        .club-search-input:focus {
            border-color: rgba(251,191,36,0.25);
            background: rgba(255,255,255,0.07);
        }

        .club-members-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }

        .club-member-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
            cursor: pointer;
            position: relative;
        }

        .club-member-card:hover {
            background: rgba(255,255,255,0.05);
            border-color: rgba(251,191,36,0.1);
            transform: translateY(-2px);
        }

        .club-member-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #333, #444);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            color: #fbbf24;
            overflow: hidden;
            flex-shrink: 0;
        }

        .club-member-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .club-member-info {
            flex: 1;
            min-width: 0;
        }

        .club-member-name {
            font-weight: 600;
            font-size: 0.85rem;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .club-member-name .you-tag {
            font-size: 0.55rem;
            font-weight: 700;
            color: #fbbf24;
            background: rgba(251,191,36,0.1);
            padding: 1px 7px;
            border-radius: 8px;
            margin-left: 4px;
        }

        .club-member-frs {
            font-size: 0.7rem;
            color: #888;
        }

        .club-member-frs i {
            color: #fbbf24;
            margin-right: 3px;
            font-size: 0.6rem;
        }

        .club-member-role {
            font-size: 0.55rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            flex-shrink: 0;
            background: rgba(251,191,36,0.08);
            color: #fbbf24;
            border: 1px solid rgba(251,191,36,0.08);
        }

        .club-member-role.captain {
            background: rgba(251,191,36,0.12);
            color: #fbbf24;
            border-color: rgba(251,191,36,0.15);
        }

        .club-member-role.member {
            background: rgba(255,255,255,0.03);
            color: #777;
            border-color: rgba(255,255,255,0.04);
        }

        .club-member-online {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #10b981;
            flex-shrink: 0;
            box-shadow: 0 0 8px rgba(16,185,129,0.25);
        }

        .club-member-online.offline {
            background: #444;
            box-shadow: none;
        }

        .club-member-remove {
            display: none;
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.2);
            color: #ef4444;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
            align-items: center;
            justify-content: center;
        }

        .club-member-card.owner-mode:hover .club-member-remove {
            display: flex;
        }

        .club-member-remove:hover {
            background: rgba(239,68,68,0.3);
            transform: scale(1.1);
        }

        /* ===== О КЛУБЕ ===== */
        .club-about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .club-about-item {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.2s ease;
        }

        .club-about-item:hover {
            background: rgba(255,255,255,0.05);
        }

        .club-about-item i {
            font-size: 16px;
            color: #fbbf24;
            width: 22px;
            text-align: center;
        }

        .club-about-item .label {
            font-size: 0.6rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .club-about-item .value {
            font-size: 0.85rem;
            font-weight: 600;
            color: #eee;
        }

        .club-about-item .value.empty {
            color: #555;
            font-weight: 400;
        }

        .club-about-description {
            margin-top: 14px;
            padding: 14px 18px;
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.04);
            color: #bbb;
            font-size: 0.85rem;
            line-height: 1.7;
        }

        .club-about-description strong {
            color: #fbbf24;
        }

        /* ===== ЗАЯВКИ ===== */
        .club-applications-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .club-application-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
        }

        .club-application-item:hover {
            background: rgba(255,255,255,0.04);
        }

        .club-application-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fbbf24;
            flex-shrink: 0;
            font-size: 14px;
            overflow: hidden;
        }

        .club-application-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .club-application-info {
            flex: 1;
        }

        .club-application-name {
            font-weight: 600;
            color: #fff;
            font-size: 0.85rem;
        }

        .club-application-frs {
            font-size: 0.7rem;
            color: #888;
        }

        .club-application-message {
            font-size: 0.75rem;
            color: #777;
            margin-top: 2px;
            font-style: italic;
        }

        .club-application-actions {
            display: flex;
            gap: 5px;
        }

        .btn-app-club {
            padding: 5px 14px;
            border: none;
            border-radius: 16px;
            font-size: 0.65rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        .btn-app-club.approve {
            background: rgba(16,185,129,0.1);
            color: #10b981;
            border: 1px solid rgba(16,185,129,0.12);
        }

        .btn-app-club.approve:hover {
            background: rgba(16,185,129,0.18);
        }

        .btn-app-club.reject {
            background: rgba(239,68,68,0.06);
            color: #ef4444;
            border: 1px solid rgba(239,68,68,0.08);
        }

        .btn-app-club.reject:hover {
            background: rgba(239,68,68,0.12);
        }

        /* ===== НАСТРОЙКИ ===== */
        .club-settings-list {
            display: grid;
            gap: 10px;
        }

        .club-settings-item {
            background: rgba(255,255,255,0.03);
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .club-settings-item .label {
            font-size: 0.65rem;
            color: #666;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            display: block;
            margin-bottom: 4px;
        }

        .club-settings-item .value-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .club-settings-item .value-row input {
            flex: 1;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 40px;
            padding: 7px 14px;
            color: #888;
            font-size: 0.75rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            min-width: 0;
        }

        .club-settings-item .value-row input:focus {
            border-color: rgba(251,191,36,0.2);
        }

        .club-settings-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        /* ===== МОДАЛКИ ===== */
        .modal-club {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 2000;
            animation: fadeIn 0.2s ease;
            padding: 20px;
        }

        .modal-club.show {
            display: flex;
        }

        .modal-club-content {
            background: #151515;
            padding: 20px 24px;
            border-radius: 24px;
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            border: 1px solid rgba(251,191,36,0.3);
            animation: slideUp 0.3s ease;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-club-content .modal-scroll {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
            margin-right: -4px;
        }

        .modal-club-content .modal-scroll::-webkit-scrollbar {
            width: 3px;
        }

        .modal-club-content .modal-scroll::-webkit-scrollbar-thumb {
            background: #fbbf24;
            border-radius: 10px;
        }

        .modal-club-content .modal-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .modal-club-content .modal-footer {
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.05);
            margin-top: 16px;
            flex-shrink: 0;
        }

        .modal-club-content h3 {
            font-size: 1.1rem;
            margin-bottom: 16px;
            flex-shrink: 0;
            color: #fbbf24;

        // ===== FIREBASE КОНФИГ =====
        const firebaseConfig = {

            authDomain: "proranklive.firebaseapp.com",
            projectId: "proranklive",
            storageBucket: "proranklive.firebasestorage.app",

        const app = initializeApp(firebaseConfig);

        // ===== АВТОРИЗАЦИЯ =====
        onAuthStateChanged(auth, async (user) => {
            currentUser = user;

            if (!clubId) {
                // Если нет ID, ищем клуб пользователя
                if (user) {
                    try {
                        const fighterDoc = await getDoc(doc(db, 'fighters', user.uid));
                        if (fighterDoc.exists() && fighterDoc.data().clubId) {
                            window.location.href = `club-profile.html?id=${fighterDoc.data().clubId}`;

                return;
            }

            await loadClubData();

        // ===== ЗАГРУЗКА ДАННЫХ КЛУБА =====
        async function loadClubData() {
            const loading = document.getElementById('clubLoading');
            const content = document.getElementById('clubContent');
            const error = document.getElementById('clubError');

            loading.style.display = 'block';
            content.style.display = 'none';
            error.style.display = 'none';

            try {
                const clubDoc = await getDoc(doc(db, 'clubs', clubId));

                if (!clubDoc.exists()) {
                    loading.style.display = 'none';
                    error.style.display = 'block';
                    error.innerHTML = `
                        <i class="fas fa-exclamation-triangle" style="color: #ef4444;"></i>
                        <p style="color: #ef4444;">Клуб не найден</p>
                        <button class="btn-club btn-club-primary" onclick="window.location.href='clubs.html'" style="margin-top: 16px;">
                            <i class="fas fa-arrow-left"></i> Вернуться к списку
                        </button>
                    `;
                    return;
                }

                clubData = {
                    id: clubDoc.id,
                    ...clubDoc.data()
                };

                // Определяем роль пользователя
                if (currentUser) {
                    if (clubData.ownerId === currentUser.uid) {
                        userRole = 'owner';
                    } else if (clubData.members && clubData.members.includes(currentUser.uid)) {
                        userRole = 'member';
                    } else {
                        userRole = 'guest';
                    }
                } else {
                    userRole = 'guest';
                }

                // Проверяем статус клуба
                if (clubData.status !== 'approved' && userRole !== 'owner' && userRole !== 'member') {
                    loading.style.display = 'none';
                    error.style.display = 'block';
                    error.innerHTML = `
                        <i class="fas fa-clock" style="color: #fbbf24;"></i>
                        <p style="color: #fbbf24;">Клуб ожидает одобрения администратора</p>
                    `;
                    return;
                }

                // Рендерим страницу
                loading.style.display = 'none';
                content.style.display = 'block';
                renderClubPage();

            } catch (err) {
                console.error('Ошибка загрузки клуба:', err);
                loading.style.display = 'none';
                error.style.display = 'block';
                error.innerHTML = `
                    <i class="fas fa-exclamation-triangle" style="color: #ef4444;"></i>
                    <p style="color: #ef4444;">Ошибка загрузки: ${err.message}</p>
                `;
            }
        }

        // ===== РЕНДЕР СТРАНИЦЫ =====
        function renderClubPage() {

            const isMember = userRole === 'member';

            content.innerHTML = `
                <!-- ===== ПЕРЕКЛЮЧАТЕЛЬ (только для участников клуба) ===== -->
                ${isInClub ? `
                <div class="club-switcher">
                    <a href="club-profile.html?id=${clubId}" class="club-switch-btn active">

                        <span class="club-switch-badge">${clubData.name || ''}</span>

                    <a href="clubs.html" class="club-switch-btn">

                    </a>

                ` : ''}

                <!-- КАРТОЧКА КЛУБА -->
                <div class="club-profile-card">
                    <div class="club-profile-top">
                        <div class="club-avatar-section">
                            <img src="${clubData.logo || `https://ui-avatars.com/api/?name=${encodeURIComponent(clubData.name || 'Клуб')}&background=fbbf24&color=000&size=80&rounded=true`}" 
                                alt="${clubData.name || 'Клуб'}"
                                id="clubAvatarImg">
                            <div class="club-avatar-edit ${isOwner ? 'visible' : ''}" 
                                onclick="document.getElementById('clubLogoInput').click()" 
                                title="Изменить логотип">
                                <i class="fas fa-camera"></i>
                            </div>
                        </div>

                        <div class="club-info-section">
                            <div class="club-top-row">
                                <span class="club-name-text">${clubData.name || 'Клуб без названия'}</span>
                                <span class="club-status-badge ${statusClass}">
                                    <i class="fas fa-circle"></i> ${statusText}
                                </span>
                            </div>

                            <div class="club-details-row">
                                <span><i class="fas fa-map-marker-alt"></i> ${clubData.city || '—'}</span>
                                <span><i class="fas fa-user-tie"></i> ${clubData.ownerName || '—'}</span>
                                ${clubData.createdAt ? `<span><i class="far fa-calendar-alt"></i> Осн. ${formatDate(clubData.createdAt)}</span>` : ''}

                                <span class="club-frs-display">
                                    <i class="fas fa-star"></i>
                                    <span class="club-frs-value">${clubData.clubFRS || 0}</span>
                                    <span class="club-frs-label">FRS</span>
                                </span>

                                <span class="club-members-display">
                                    <i class="fas fa-users"></i>
                                    <span class="club-members-value">${clubData.memberCount || 0}</span>
                                    <span class="club-members-label">участников</span>
                                </span>
                            </div>

                            <div class="club-actions-row">
                                ${renderActionButtons()}
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ВКЛАДКИ -->
                <div class="club-tabs">
                    <button class="club-tab-btn active" data-tab="members">
                        <i class="fas fa-users"></i> Участники
                        <span class="badge">${clubData.memberCount || 0}</span>
                    </button>
                    <button class="club-tab-btn" data-tab="about">
                        <i class="fas fa-info-circle"></i> О клубе
                    </button>
                    ${isOwner ? `
                        <button class="club-tab-btn owner-only" data-tab="applications">
                            <i class="fas fa-envelope"></i> Заявки
                            <span class="badge" id="applicationsBadge">0</span>
                        </button>
                        <button class="club-tab-btn owner-only" data-tab="settings">
                            <i class="fas fa-cog"></i> Настройки
                        </button>
                    ` : ''}
                </div>

                <!-- ВКЛАДКА: УЧАСТНИКИ -->
                <div class="club-tab-content active" id="tab-members">
                    <div class="club-panel">
                        <div class="club-panel-title">
                            <i class="fas fa-users"></i> Участники
                            <span>— ${clubData.memberCount || 0} человек</span>
                        </div>
                        <div class="club-members-header">
                            <input class="club-search-input" type="text" placeholder="🔍 Найти участника...">
                        </div>
                        <div class="club-members-grid" id="membersGrid">
                            <div class="club-empty-state"><i class="fas fa-spinner fa-spin"></i> Загрузка...</div>
                        </div>
                    </div>
                </div>

                <!-- ВКЛАДКА: О КЛУБЕ -->
                <div class="club-tab-content" id="tab-about">
                    <div class="club-panel">
                        <div class="club-panel-title">
                            <i class="fas fa-info-circle"></i> О клубе
                        </div>
                        <div class="club-about-grid">
                            <div class="club-about-item">
                                <i class="fas fa-map-marker-alt"></i>
                                <div>
                                    <div class="label">Город</div>
                                    <div class="value">${clubData.city || 'Не указан'}</div>
                                </div>
                            </div>
                            <div class="club-about-item">
                                <i class="fas fa-home"></i>
                                <div>
                                    <div class="label">Адрес</div>
                                    <div class="value">${clubData.address || 'Не указан'}</div>
                                </div>
                            </div>
                            <div class="club-about-item">
                                <i class="fas fa-phone"></i>
                                <div>
                                    <div class="label">Телефон</div>
                                    <div class="value">${clubData.phone || 'Не указан'}</div>
                                </div>
                            </div>
                            <div class="club-about-item">
                                <i class="fas fa-fist-raised"></i>
                                <div>
                                    <div class="label">Виды спорта</div>
                                    <div class="value">${clubData.sports ? clubData.sports.join(', ') : 'Не указаны'}</div>
                                </div>
                            </div>
                            ${clubData.website ? `
                            <div class="club-about-item" style="grid-column: 1 / -1;">
                                <i class="fas fa-globe"></i>
                                <div>
                                    <div class="label">Сайт / Соцсети</div>
                                    <div class="value" style="color: #60a5fa;">${clubData.website}</div>
                                </div>
                            </div>
                            ` : ''}
                        </div>

                        <div class="club-about-description">
                            <strong>О нас:</strong><br>
                            ${clubData.description || 'Описание отсутствует'}
                        </div>
                    </div>
                </div>

                ${isOwner ? `
                <!-- ВКЛАДКА: ЗАЯВКИ -->
                <div class="club-tab-content" id="tab-applications">
                    <div class="club-panel">
                        <div class="club-panel-title">
                            <i class="fas fa-envelope"></i> Заявки на вступление
                        </div>
                        <div class="club-applications-list" id="applicationsList">
                            <div class="club-empty-state"><i class="fas fa-spinner fa-spin"></i> Загрузка...</div>
                        </div>
                    </div>
                </div>

                <!-- ВКЛАДКА: НАСТРОЙКИ -->
                <div class="club-tab-content" id="tab-settings">
                    <div class="club-panel">
                        <div class="club-panel-title">
                            <i class="fas fa-cog"></i> Настройки клуба
                        </div>
                        <div class="club-settings-list">
                            <div class="club-settings-item">
                                <span class="label"><i class="fas fa-link"></i> Ссылка на клуб</span>
                                <div class="value-row">
                                    <input type="text" id="clubLinkInput" readonly value="${window.location.href}">
                                    <button class="btn-club btn-club-primary btn-club-sm" onclick="copyClubLink()">
                                        <i class="fas fa-copy"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="club-settings-item">
                                <span class="label"><i class="fas fa-users"></i> Управление</span>
                                <div class="club-settings-actions">
                                    <button class="btn-club btn-club-outline btn-club-sm" onclick="openEditModal()">
                                        <i class="fas fa-edit"></i> Редактировать
                                    </button>
                                    <button class="btn-club btn-club-danger btn-club-sm" onclick="deleteClub()">
                                        <i class="fas fa-trash"></i> Удалить
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                ` : ''}
            `;

            // Подключаем события для вкладок
            document.querySelectorAll('.club-tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.club-tab-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');

                    const tabName = this.dataset.tab;
                    document.querySelectorAll('.club-tab-content').forEach(tc => tc.classList.remove('active'));
                    document.getElementById('tab-' + tabName).classList.add('active');
                });
            });

            // Поиск по участникам
            const searchInput = document.querySelector('.club-search-input');
            if (searchInput) {
                searchInput.addEventListener('input', function() {
                    const query = this.value.toLowerCase().trim();
                    document.querySelectorAll('.club-member-card').forEach(card => {
                        const name = card.querySelector('.club-member-name')?.textContent?.toLowerCase() || '';
                        card.style.display = name.includes(query) ? 'flex' : 'none';
                    });
                });
            }

            // Загружаем данные
            loadMembers();
            if (isOwner) {
                loadApplications();
            }

            // Проверяем существующую заявку для гостя
            if (userRole === 'guest' && currentUser) {
                checkExistingApplication();
            }
        }

        // ===== РЕНДЕР КНОПОК ДЕЙСТВИЙ =====
        function renderActionButtons() {
            if (!currentUser) {
                return `
                    <button class="btn-club btn-club-primary" onclick="window.location.href='login.html'">
                        <i class="fas fa-sign-in-alt"></i> Войдите, чтобы вступить
                    </button>
                `;
            }

            if (userRole === 'owner') {
                return `
                    <button class="btn-club btn-club-primary" onclick="openEditModal()">
                        <i class="fas fa-edit"></i> Редактировать
                    </button>
                    <button class="btn-club btn-club-outline-gold" onclick="copyClubLink()">
                        <i class="fas fa-share-alt"></i> Поделиться
                    </button>
                    <button class="btn-club btn-club-outline" onclick="window.location.href='chats.html'">
                        <i class="fas fa-comment"></i> Чат
                    </button>
                `;
            }

            if (userRole === 'member') {
                return `
                    <button class="btn-club btn-club-danger" onclick="leaveClub()">
                        <i class="fas fa-sign-out-alt"></i> Покинуть клуб
                    </button>
                    <button class="btn-club btn-club-outline" onclick="window.location.href='chats.html'">
                        <i class="fas fa-comment"></i> Чат
                    </button>
                `;
            }

            // Гость
            if (clubData.joinPolicy === 'closed') {
                return `
                    <button class="btn-club btn-club-primary" disabled>
                        <i class="fas fa-lock"></i> Клуб закрыт
                    </button>
                `;
            }

            const isOpen = clubData.joinPolicy === 'open';
            return `
                <button class="btn-club btn-club-primary" id="joinClubBtn" onclick="openApplicationModal()">
                    <i class="fas fa-user-plus"></i> ${isOpen ? 'Вступить в клуб' : 'Подать заявку'}
                </button>
                <button class="btn-club btn-club-outline" onclick="copyClubLink()">
                    <i class="fas fa-share-alt"></i> Поделиться
                </button>
            `;
        }

        // ===== ЗАГРУЗКА УЧАСТНИКОВ =====
        async function loadMembers() {
            const grid = document.getElementById('membersGrid');
            if (!grid) return;

            if (!clubData.members || clubData.members.length === 0) {
                grid.innerHTML = `
                    <div class="club-empty-state">
                        <i class="fas fa-users"></i>
                        В клубе пока нет участников
                    </div>
                `;
                return;
            }

            grid.innerHTML = '';

            // Сортируем участников по FRS (от большего к меньшему)
            const memberPromises = clubData.members.map(async (memberId) => {
                try {
                    const memberDoc = await getDoc(doc(db, 'fighters', memberId));
                    if (memberDoc.exists()) {
                        return { id: memberId, ...memberDoc.data() };
                    }
                    return null;
                } catch (e) {
                    return null;
                }
            });

            const members = (await Promise.all(memberPromises)).filter(m => m !== null);
            members.sort((a, b) => (b.frs || 0) - (a.frs || 0));

            const isOwner = userRole === 'owner';
            const currentUserId = currentUser?.uid;

            members.forEach(member => {
                const isOwnerMember = member.id === clubData.ownerId;
                const isCurrentUser = member.id === currentUserId;
                const card = document.createElement('div');
                card.className = `club-member-card ${isOwner ? 'owner-mode' : ''}`;

                const initials = member.name ? member.name.charAt(0) : '?';

                card.innerHTML = `
                    <div class="club-member-avatar" onclick="window.location.href='profile.html?id=${member.id}'">
                        ${member.avatar ? `<img src="${member.avatar}" alt="${member.name}">` : initials}
                    </div>
                    <div class="club-member-info" onclick="window.location.href='profile.html?id=${member.id}'">
                        <div class="club-member-name">
                            ${member.name || 'Боец'}
                            ${isOwnerMember ? '👑' : ''}
                            ${isCurrentUser ? '<span class="you-tag">Вы</span>' : ''}
                        </div>
                        <div class="club-member-frs"><i class="fas fa-star"></i> FRS: ${member.frs || 0}</div>
                    </div>
                    ${isOwnerMember ? '<span class="club-member-role captain">Владелец</span>' : '<span class="club-member-role member">Участник</span>'}
                    <span class="club-member-online ${Math.random() > 0.5 ? '' : 'offline'}"></span>
                    ${isOwner && !isOwnerMember ? `
                        <button class="club-member-remove" onclick="event.stopPropagation(); removeMember('${member.id}')" title="Исключить">
                            <i class="fas fa-user-minus"></i>
                        </button>
                    ` : ''}
                `;

                grid.appendChild(card);
            });
        }

        // ===== ЗАГРУЗКА ЗАЯВОК (ТОЛЬКО ВЛАДЕЛЕЦ) =====
        async function loadApplications() {
            const list = document.getElementById('applicationsList');
            if (!list) return;

            try {
                const appsRef = collection(db, 'club_applications');
                const q = query(
                    appsRef,
                    where('clubId', '==', clubId),
                    where('status', '==', 'pending')
                );

                const snapshot = await getDocs(q);

                const badge = document.getElementById('applicationsBadge');
                if (badge) badge.textContent = snapshot.size;

                if (snapshot.empty) {
                    list.innerHTML = `
                        <div class="club-empty-state">
                            <i class="fas fa-envelope"></i>
                            Нет заявок
                        </div>
                    `;
                    return;
                }

                list.innerHTML = '';

                snapshot.forEach((docSnap) => {
                    const app = docSnap.data();
                    const item = document.createElement('div');
                    item.className = 'club-application-item';

                    const initials = app.userName ? app.userName.charAt(0) : '?';

                    item.innerHTML = `
                        <div class="club-application-avatar">
                            ${initials}
                        </div>
                        <div class="club-application-info">
                            <div class="club-application-name">${app.userName || 'Боец'}</div>
                            <div class="club-application-frs"><i class="fas fa-star" style="color:#fbbf24;"></i> FRS: ${app.userFRS || 0}</div>
                            ${app.message ? `<div class="club-application-message">"${app.message}"</div>` : ''}
                        </div>
                        <div class="club-application-actions">
                            <button class="btn-app-club approve" onclick="approveApplication('${docSnap.id}', '${app.userId}')">Принять</button>
                            <button class="btn-app-club reject" onclick="rejectApplication('${docSnap.id}')">Отклонить</button>
                        </div>
                    `;

                    list.appendChild(item);
                });

            } catch (error) {
                console.error('Ошибка загрузки заявок:', error);
                list.innerHTML = `
                    <div class="club-empty-state">
                        <i class="fas fa-exclamation-triangle" style="color: #ef4444;"></i>
                        Ошибка загрузки
                    </div>
                `;
            }
        }

        // ===== ПРОВЕРКА СУЩЕСТВУЮЩЕЙ ЗАЯВКИ =====
        async function checkExistingApplication() {
            if (!currentUser || !clubId) return;

            try {
                const appsRef = collection(db, 'club_applications');
                const q = query(
                    appsRef,
                    where('clubId', '==', clubId),
                    where('userId', '==', currentUser.uid),
                    where('status', '==', 'pending')
                );

                const snapshot = await getDocs(q);

                if (!snapshot.empty) {
                    const btn = document.getElementById('joinClubBtn');
                    if (btn) {
                        btn.textContent = '⏳ Ожидает подтверждения';
                        btn.disabled = true;
                    }
                }
            } catch (error) {
                console.error('Ошибка проверки заявки:', error);
            }
        }

        // ===== ФУНКЦИИ ДЛЯ ГЛОБАЛЬНОГО ДОСТУПА =====
        window.openApplicationModal = function() {
            document.getElementById('applicationModal').classList.add('show');
            document.getElementById('applicationMessageInput').value = '';
        };

        window.closeApplicationModal = function() {
            document.getElementById('applicationModal').classList.remove('show');
        };

        window.submitApplication = async function() {
            if (!currentUser || !clubId || isSubmitting) return;

            isSubmitting = true;
            const message = document.getElementById('applicationMessageInput').value.trim();

            try {
                const fighterDoc = await getDoc(doc(db, 'fighters', currentUser.uid));

                if (!fighterDoc.exists()) {
                    alert('Только бойцы могут вступать в клубы');
                    isSubmitting = false;
                    return;
                }

                const fighterData = fighterDoc.data();

                // Проверяем, не в клубе ли уже
                if (fighterData.clubId) {
                    alert('Вы уже состоите в клубе');
                    isSubmitting = false;
                    return;
                }

                const appsRef = collection(db, 'club_applications');
                await setDoc(doc(appsRef), {
                    clubId: clubId,
                    clubName: clubData.name,
                    userId: currentUser.uid,
                    userName: fighterData.name || 'Боец',
                    userFRS: fighterData.frs || 0,
                    status: 'pending',
                    message: message,
                    createdAt: serverTimestamp(),
                    processedAt: null,
                    processedBy: ''
                });

                closeApplicationModal();
                alert('✅ Заявка отправлена!');

                const btn = document.getElementById('joinClubBtn');
                if (btn) {
                    btn.textContent = '⏳ Ожидает подтверждения';
                    btn.disabled = true;
                }

            } catch (error) {
                console.error('Ошибка отправки:', error);
                alert('Ошибка отправки заявки');
            }

            isSubmitting = false;
        };

        window.leaveClub = async function() {
            if (!currentUser || !clubId) return;
            if (!confirm('Вы уверены, что хотите покинуть клуб?')) return;

            try {
                await updateDoc(doc(db, 'clubs', clubId), {
                    members: arrayRemove(currentUser.uid),
                    memberCount: increment(-1),
                    updatedAt: serverTimestamp()
                });

                await updateDoc(doc(db, 'fighters', currentUser.uid), {
                    clubId: null,
                    clubRole: null,
                    clubName: null,
                    clubLogo: null
                });

                alert('Вы покинули клуб');
                window.location.href = 'clubs.html';

            } catch (error) {
                console.error('Ошибка выхода:', error);
                alert('Ошибка выхода из клуба');
            }
        };

        window.removeMember = async function(memberId) {
            if (!confirm('Исключить участника из клуба?')) return;

            try {
                // Получаем FRS участника для обновления клубного FRS
                const memberDoc = await getDoc(doc(db, 'fighters', memberId));
                const memberFRS = memberDoc.exists() ? (memberDoc.data().frs || 0) : 0;

                await updateDoc(doc(db, 'clubs', clubId), {
                    members: arrayRemove(memberId),
                    memberCount: increment(-1),
                    clubFRS: increment(-memberFRS),
                    updatedAt: serverTimestamp()
                });

                await updateDoc(doc(db, 'fighters', memberId), {
                    clubId: null,
                    clubRole: null,
                    clubName: null,
                    clubLogo: null
                });

                // Обновляем локальные данные
                clubData.members = clubData.members.filter(id => id !== memberId);
                clubData.memberCount--;
                clubData.clubFRS = (clubData.clubFRS || 0) - memberFRS;

                loadMembers();
                updateStatsDisplay();

            } catch (error) {
                console.error('Ошибка исключения:', error);
                alert('Ошибка исключения участника');
            }
        };

        window.approveApplication = async function(applicationId, userId) {
            if (!confirm('Принять заявку?')) return;

            try {
                // Получаем данные заявителя
                const fighterDoc = await getDoc(doc(db, 'fighters', userId));
                if (!fighterDoc.exists()) {
                    alert('Боец не найден');
                    return;
                }
                const fighterData = fighterDoc.data();
                const fighterFRS = fighterData.frs || 0;

                await updateDoc(doc(db, 'club_applications', applicationId), {
                    status: 'approved',
                    processedAt: serverTimestamp(),
                    processedBy: currentUser.uid
                });

                await updateDoc(doc(db, 'clubs', clubId), {
                    members: arrayUnion(userId),
                    memberCount: increment(1),
                    clubFRS: increment(fighterFRS),
                    updatedAt: serverTimestamp()
                });

                await updateDoc(doc(db, 'fighters', userId), {
                    clubId: clubId,
                    clubRole: 'member',
                    clubName: clubData.name,
                    clubLogo: clubData.logo || ''
                });

                // Обновляем локальные данные
                if (!clubData.members) clubData.members = [];
                clubData.members.push(userId);
                clubData.memberCount = (clubData.memberCount || 0) + 1;
                clubData.clubFRS = (clubData.clubFRS || 0) + fighterFRS;

                alert('✅ Участник добавлен!');
                loadApplications();
                loadMembers();
                updateStatsDisplay();

            } catch (error) {
                console.error('Ошибка одобрения:', error);
                alert('Ошибка одобрения заявки');
            }
        };

        window.rejectApplication = async function(applicationId) {
            if (!confirm('Отклонить заявку?')) return;

            try {
                await updateDoc(doc(db, 'club_applications', applicationId), {
                    status: 'rejected',
                    processedAt: serverTimestamp(),
                    processedBy: currentUser.uid
                });

                loadApplications();

            } catch (error) {
                console.error('Ошибка отклонения:', error);
            }
        };

        window.openEditModal = function() {
            document.getElementById('editClubName').value = clubData.name || '';
            document.getElementById('editClubCity').value = clubData.city || '';
            document.getElementById('editClubAddress').value = clubData.address || '';
            document.getElementById('editClubPhone').value = clubData.phone || '';
            document.getElementById('editClubDescription').value = clubData.description || '';
            document.getElementById('editJoinPolicy').value = clubData.joinPolicy || 'request';

            const preview = document.getElementById('editClubLogoPreview');
            if (clubData.logo) {
                preview.src = clubData.logo;
                preview.style.display = 'block';
            } else {
                preview.style.display = 'none';
            }

            document.getElementById('editClubLogoInput').value = '';
            document.getElementById('editClubModal').classList.add('show');
        };

        window.closeEditModal = function() {
            document.getElementById('editClubModal').classList.remove('show');
        };

        window.saveClubChanges = async function() {
            const name = document.getElementById('editClubName').value.trim();
            const city = document.getElementById('editClubCity').value.trim();
            const address = document.getElementById('editClubAddress').value.trim();
            const phone = document.getElementById('editClubPhone').value.trim();
            const description = document.getElementById('editClubDescription').value.trim();
            const joinPolicy = document.getElementById('editJoinPolicy').value;

            if (!name) {
                alert('Название клуба обязательно');
                return;
            }

            try {
                await updateDoc(doc(db, 'clubs', clubId), {
                    name: name,
                    city: city,
                    address: address,
                    phone: phone,
                    description: description,
                    joinPolicy: joinPolicy,
                    updatedAt: serverTimestamp()
                });

                clubData.name = name;
                clubData.city = city;
                clubData.address = address;
                clubData.phone = phone;
                clubData.description = description;
                clubData.joinPolicy = joinPolicy;

                closeEditModal();
                renderClubPage();

            } catch (error) {
                console.error('Ошибка сохранения:', error);
                alert('Ошибка сохранения');
            }
        };

        window.copyClubLink = function() {
            const link = window.location.href;

            if (navigator.clipboard) {
                navigator.clipboard.writeText(link).then(() => {
                    alert('Ссылка скопирована!');
                }).catch(() => {
                    fallbackCopy(link);
                });
            } else {
                fallbackCopy(link);
            }
        };

        function fallbackCopy(text) {
            const input = document.createElement('input');
            input.value = text;
            document.body.appendChild(input);
            input.select();
            document.execCommand('copy');
            document.body.removeChild(input);
            alert('Ссылка скопирована!');
        }

        window.deleteClub = async function() {
            if (!confirm('Вы уверены, что хотите удалить клуб? Это действие необратимо!')) return;
            if (!confirm('Все участники будут исключены. Продолжить?')) return;

            try {
                // Удаляем клуб
                await deleteDoc(doc(db, 'clubs', clubId));

                // Обновляем всех участников (убираем clubId)
                if (clubData.members && clubData.members.length > 0) {
                    for (const memberId of clubData.members) {
                        await updateDoc(doc(db, 'fighters', memberId), {
                            clubId: null,
                            clubRole: null,
                            clubName: null,
                            clubLogo: null
                        });
                    }
                }

                alert('Клуб удалён');
                window.location.href = 'clubs.html';

            } catch (error) {
                console.error('Ошибка удаления:', error);
                alert('Ошибка удаления клуба');
            }
        };

        // ===== ОБНОВЛЕНИЕ СТАТИСТИКИ =====
        function updateStatsDisplay() {
            const frsDisplay = document.querySelector('.club-frs-value');
            const membersDisplay = document.querySelector('.club-members-value');
            const badge = document.querySelector('.club-tab-btn .badge');

            if (frsDisplay) frsDisplay.textContent = clubData.clubFRS || 0;
            if (membersDisplay) membersDisplay.textContent = clubData.memberCount || 0;
            if (badge) badge.textContent = clubData.memberCount || 0;
        }

        // ===== ФОРМАТ ДАТЫ =====
        function formatDate(timestamp) {
            if (!timestamp) return 'Неизвестно';
            try {
                const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
                return date.toLocaleDateString('ru-RU', {
                    day: 'numeric',
                    month: 'short',
                    year: 'numeric'
                });
            } catch (e) {
                return 'Неизвестно';
            }
        }

        // ===== ЗАГРУЗКА ЛОГОТИПА =====
        async function uploadClubLogo(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', UPLOAD_PRESET);

            const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (data.secure_url) {
                return data.secure_url.replace('/upload/', '/upload/w_400,h_400,c_fill,f_auto,q_auto/');
            } else {
                throw new Error(data.error?.message || 'Ошибка загрузки');
            }
        }

        document.getElementById('clubLogoInput')?.addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (userRole !== 'owner') {
                alert('Только владелец может менять логотип');
                e.target.value = '';
                return;
            }

            try {
                const avatarImg = document.getElementById('clubAvatarImg');
                if (avatarImg) {
                    avatarImg.style.opacity = '0.5';
                }

                const logoUrl = await uploadClubLogo(file);

                await updateDoc(doc(db, 'clubs', clubId), {
                    logo: logoUrl,
                    updatedAt: serverTimestamp()
                });

                clubData.logo = logoUrl;

                if (avatarImg) {
                    avatarImg.src = logoUrl;
                    avatarImg.style.opacity = '1';
                }

                // Обновляем логотип в профилях участников
                if (clubData.members && clubData.members.length > 0) {
                    for (const memberId of clubData.members) {
                        await updateDoc(doc(db, 'fighters', memberId), {
                            clubLogo: logoUrl
                        });
                    }
                }

                alert('✅ Логотип обновлён!');

            } catch (error) {
                console.error('Ошибка загрузки логотипа:', error);
                alert('Ошибка загрузки логотипа: ' + error.message);
                const avatarImg = document.getElementById('clubAvatarImg');
                if (avatarImg) avatarImg.style.opacity = '1';
            }

            e.target.value = '';
        });

        // Предпросмотр логотипа в модалке
        document.getElementById('editClubLogoInput')?.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const preview = document.getElementById('editClubLogoPreview');
                    preview.src = event.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        // ===== ЗАКРЫТИЕ МОДАЛОК ПО ESC =====
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal-club.show').forEach(modal => {
                    modal.classList.remove('show');
                });
            }
        });

        // ===== ЗАКРЫТИЕ МОДАЛОК ПО КЛИКУ НА ФОН =====
        document.querySelectorAll('.modal-club').forEach(modal => {
            modal.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('show');
                }
            });
        });

        console.log('🏛️ Страница клуба загружена, роль:', userRole);
    </script>
</body>
</html>
