<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PRORANK">
    <meta name="theme-color" content="#fbbf24">
    <meta name="mobile-web-app-capable" content="yes">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Чат | PRORANK</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <style>
        /* ===== ВСЕ СТИЛИ ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: radial-gradient(ellipse at 30% 40%, rgba(251, 191, 36, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(251, 191, 36, 0.08) 0%, transparent 50%),
                linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 40%, #1a1a1a 100%);
    background-attachment: fixed;
    color: #fff;
    line-height: 1.4;
    height: 100vh;
    overflow: hidden;
}

.chat-wrapper {
    height: 100vh;
    display: flex;
    flex-direction: column;
    max-width: 900px;
    margin: 0 auto;
    background: rgba(10,10,10,0.6);
    backdrop-filter: blur(4px);
}

/* ===== HEADER ===== */
.chat-header {
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(251, 191, 36, 0.25);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
    min-height: 68px;
}

.back-btn {
    background: rgba(251,191,36,0.1);
    border: 1px solid rgba(251,191,36,0.3);
    color: #fbbf24;
    font-size: 1.2rem;
    cursor: pointer;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    flex-shrink: 0;
}
.back-btn:hover {
    background: rgba(251,191,36,0.2);
    transform: scale(1.05);
}

.chat-header-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(251,191,36,0.3);
    flex-shrink: 0;
}

.chat-header-info {
    flex: 1;
    min-width: 0;
}

.chat-header-name {
    font-size: 1.05rem;
    font-weight: 700;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
}

.chat-header-status {
    font-size: 0.65rem;
    color: #888;
    margin-top: 1px;
}

.chat-header-status .online {
    color: #22c55e;
}
.chat-header-status .typing {
    color: #fbbf24;
    animation: typingDots 1.2s infinite;
}

@keyframes typingDots {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
}

.chat-premium-badge {
    font-size: 0.7rem;
    background: linear-gradient(135deg, #fbbf24, #e5a500);
    color: #000;
    padding: 0 8px;
    border-radius: 12px;
    font-weight: 700;
    height: 18px;
    display: inline-flex;
    align-items: center;
}

/* ===== СООБЩЕНИЯ ===== */
.messages-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    scroll-behavior: smooth;
    touch-action: pan-y;
}

.messages-area::-webkit-scrollbar {
    width: 4px;
}
.messages-area::-webkit-scrollbar-track {
    background: #1a1a1a;
}
.messages-area::-webkit-scrollbar-thumb {
    background: #fbbf24;
    border-radius: 10px;
}

.message-date {
    text-align: center;
    font-size: 0.65rem;
    color: #555;
    padding: 16px 0 8px;
    font-weight: 500;
    letter-spacing: 0.5px;
}

/* ===== ОБНОВЛЕННЫЙ ДИЗАЙН СООБЩЕНИЙ ===== */
.message {
    max-width: 82%;
    padding: 8px 14px;
    border-radius: 18px;
    word-wrap: break-word;
    animation: fadeIn 0.15s ease;
    position: relative;
    transition: all 0.2s ease;
    cursor: default;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    margin-bottom: 1px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    clear: both;
}

.message .msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    margin-top: 2px;
    border: 1px solid rgba(251,191,36,0.15);
}

.message .msg-content {
    flex: 1;
    min-width: 0;
    position: relative;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

/* ===== СВОИ СООБЩЕНИЯ ===== */
.message.own {
    background: linear-gradient(135deg, #fbbf24, #e5a500);
    color: #000;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
    margin-left: auto;
}

.message.own .msg-avatar {
    display: none;
}

/* ===== ЧУЖИЕ СООБЩЕНИЯ ===== */
.message.other {
    background: #1f1f2a;
    color: #fff;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    border: 1px solid rgba(251,191,36,0.08);
}

/* ===== ГРУППИРОВКА ===== */
.message.first-in-group {
    margin-top: 6px;
}
.message.last-in-group {
    margin-bottom: 4px;
}
.message.solo {
    margin-top: 6px;
    margin-bottom: 4px;
}

/* ===== АВАТАР В ГРУППЕ ===== */
.message.other.has-avatar .msg-avatar {
    display: block;
}
.message.other.no-avatar .msg-avatar {
    display: none;
}

.message-sender {
    font-size: 0.6rem;
    opacity: 0.7;
    margin-bottom: 2px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 4px;
}

.message-text {
    font-size: 0.92rem;
    line-height: 1.4;
    word-break: break-word;
}

/* ===== ВРЕМЯ И ГАЛОЧКИ ===== */
.message-footer {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 4px;
    margin-top: 2px;
}

.message-time {
    font-size: 0.5rem;
    opacity: 0.4;
}

.message.own .message-time {
    opacity: 0.6;
}

.message-read-status.read {
    color: #22c55e;
    opacity: 1;
}

/* Для своих сообщений на золотом фоне - черный цвет */
.message.own .message-read-status.read {
    color: #000;
    opacity: 0.8;
}

.message.own .message-read-status.delivered {
    color: #000;
    opacity: 0.6;
}

.message.own .message-read-status.sent {
    color: #000;
    opacity: 0.4;
}

/* ===== РЕПЛАЙ ===== */
.reply-preview {
    background: rgba(0,0,0,0.2);
    border-left: 3px solid #fbbf24;
    padding: 4px 10px;
    margin-bottom: 4px;
    border-radius: 10px;
    font-size: 0.7rem;
}

.reply-preview .reply-author {
    color: #fbbf24;
    font-weight: 600;
    font-size: 0.6rem;
}

.reply-preview .reply-text {
    color: #aaa;
    font-style: italic;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 0.7rem;
}

.message.own .reply-preview {
    background: rgba(0,0,0,0.15);
}

/* ===== РЕАКЦИИ ===== */
.message-reactions {
    display: flex;
    gap: 3px;
    flex-wrap: wrap;
    margin-top: 4px;
}

.reaction-badge {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 20px;
    padding: 1px 8px 1px 6px;
    font-size: 0.7rem;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    transition: all 0.2s ease;
    user-select: none;
    min-height: 22px;
}

.reaction-badge:hover {
    background: rgba(251,191,36,0.1);
    border-color: rgba(251,191,36,0.2);
    transform: scale(1.05);
}

.reaction-badge .reaction-emoji {
    font-size: 0.8rem;
}

.reaction-badge .reaction-count {
    font-size: 0.6rem;
    color: #888;
}

.reaction-badge.reacted {
    background: rgba(251,191,36,0.15);
    border-color: rgba(251,191,36,0.25);
}

.reaction-badge.reacted .reaction-count {
    color: #fbbf24;
}

/* ===== ГОЛОСОВОЕ СООБЩЕНИЕ - НОВЫЙ СТИЛЬ ===== */
.voice-message {
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: 100%;
    padding: 2px 0;
    width: 100%;
}

.voice-play-btn {
    background: rgba(251,191,36,0.15);
    border: 1px solid rgba(251,191,36,0.3);
    color: #fbbf24;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    flex-shrink: 0;
    font-size: 14px;
    z-index: 2;
}

.voice-play-btn:hover {
    background: rgba(251,191,36,0.25);
    transform: scale(1.05);
}

.voice-play-btn.playing {
    background: rgba(251,191,36,0.3);
    border-color: #fbbf24;
}

.message.own .voice-play-btn {
    background: rgba(0,0,0,0.12);
    border-color: rgba(0,0,0,0.15);
    color: #000;
}

.message.own .voice-play-btn.playing {
    background: rgba(0,0,0,0.2);
}

/* ===== КОНТЕЙНЕР С ВОЛНАМИ (УМНЫЕ ВОЛНЫ) ===== */
.voice-waveform-container {
    display: flex;
    align-items: center;
    gap: 2px;
    height: 32px;
    min-width: 60px;
    flex-shrink: 0;
    cursor: pointer;
    position: relative;
    border-radius: 4px;
    overflow: hidden;
}

.voice-waveform-container .wf-bar {
    flex: 1;
    max-width: 4px;
    min-width: 2px;
    background: #444;
    border-radius: 2px;
    transition: height 0.05s linear, background 0.05s linear;
}

.voice-waveform-container .wf-bar.active {
    background: #fbbf24;
}

.message.own .voice-waveform-container .wf-bar {
    background: rgba(0,0,0,0.15);
}

.message.own .voice-waveform-container .wf-bar.active {
    background: #000;
}

/* ===== ДЛИТЕЛЬНОСТЬ ===== */
.voice-duration {
    font-size: 0.65rem;
    color: #888;
    min-width: 32px;
    text-align: center;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
}

.message.own .voice-duration {
    color: rgba(0,0,0,0.5);
}

/* ===== ИНДИКАТОР ОТВЕТА ===== */
.reply-indicator {
    background: #1f1f2a;
    border-left: 3px solid #fbbf24;
    padding: 8px 14px;
    margin: 0 20px;
    border-radius: 12px;
    font-size: 0.7rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    animation: slideDown 0.2s ease;
}

@keyframes slideDown {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}

.cancel-reply {
    background: rgba(220,38,38,0.2);
    border: none;
    color: #dc2626;
    cursor: pointer;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
}
.cancel-reply:hover {
    background: rgba(220,38,38,0.3);
}

/* ===== ИНПУТ ===== */
.chat-input-area {
    display: flex;
    flex-direction: column;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(16px);
    border-top: 1px solid rgba(251,191,36,0.15);
    flex-shrink: 0;
}

.input-wrapper {
    display: flex;
    gap: 8px;
    padding: 12px 20px;
    align-items: center;
}

.chat-input-area input {
    flex: 1;
    padding: 10px 18px;
    background: #1f1f2a;
    border: 1px solid rgba(251,191,36,0.25);
    color: #fff;
    border-radius: 40px;
    font-size: 0.9rem;
    font-family: inherit;
    transition: all 0.2s ease;
    min-height: 42px;
}

.chat-input-area input:focus {
    outline: none;
    border-color: #fbbf24;
    box-shadow: 0 0 0 3px rgba(251,191,36,0.1);
}

.chat-input-area input:disabled {
    opacity: 0.5;
    pointer-events: none;
}

/* ===== КНОПКИ ===== */
.input-btn {
    background: rgba(251,191,36,0.1);
    border: 1px solid rgba(251,191,36,0.2);
    color: #fbbf24;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    flex-shrink: 0;
    font-size: 1rem;
}

.input-btn:hover {
    background: rgba(251,191,36,0.2);
    transform: scale(1.05);
}

.input-btn:active {
    transform: scale(0.95);
}

.input-btn.recording {
    background: #ef4444;
    border-color: #ef4444;
    color: #fff;
    animation: pulseRed 1s infinite;
}

@keyframes pulseRed {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); }
    50% { box-shadow: 0 0 0 10px rgba(239,68,68,0); }
}

.input-btn .recording-dot {
    display: none;
    width: 10px;
    height: 10px;
    background: #fff;
    border-radius: 50%;
    animation: blink 0.8s infinite;
}

.input-btn.recording .recording-dot {
    display: block;
}

.input-btn.recording i {
    display: none;
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
}

.send-btn {
    background: #fbbf24;
    color: #000;
    border: none;
    padding: 0 20px;
    border-radius: 40px;
    cursor: pointer;
    font-weight: 700;
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
    min-height: 42px;
    flex-shrink: 0;
}

.send-btn:hover {
    background: #ffdd44;
    transform: translateY(-2px);
}

.send-btn:active {
    transform: scale(0.97);
}

.send-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
}

.voice-timer {
    font-size: 0.85rem;
    color: #fbbf24;
    min-width: 50px;
    text-align: center;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    display: none;
}

/* ===== ЭМОДЗИ-ПИКЕР ===== */
.emoji-picker {
    position: absolute;
    bottom: 70px;
    right: 20px;
    background: #1f1f2a;
    border: 1px solid rgba(251,191,36,0.2);
    border-radius: 16px;
    padding: 12px;
    display: none;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    max-width: 280px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    z-index: 100;
    animation: fadeIn 0.2s ease;
}

.emoji-picker.show {
    display: grid;
}

.emoji-picker .emoji-btn {
    background: none;
    border: none;
    font-size: 1.4rem;
    cursor: pointer;
    padding: 6px;
    border-radius: 8px;
    transition: all 0.15s ease;
    text-align: center;
}

.emoji-picker .emoji-btn:hover {
    background: rgba(251,191,36,0.1);
    transform: scale(1.2);
}

/* ===== КОНТЕКСТНОЕ МЕНЮ ===== */
.message-menu {
    background: #2a2a35;
    border-radius: 12px;
    padding: 6px 0;
    min-width: 180px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    border: 1px solid rgba(251,191,36,0.15);
    animation: fadeIn 0.1s ease;
    overflow: hidden;
}

.message-menu button {
    background: none;
    border: none;
    color: #ddd;
    padding: 10px 16px;
    width: 100%;
    text-align: left;
    cursor: pointer;
    font-size: 0.8rem;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: all 0.1s ease;
    font-family: 'Inter', sans-serif;
}

.message-menu button:hover {
    background: rgba(251,191,36,0.12);
    color: #fbbf24;
}

.message-menu button i {
    width: 18px;
    text-align: center;
    font-size: 0.8rem;
    color: #666;
}

.message-menu button:hover i {
    color: #fbbf24;
}

.message-menu .divider {
    height: 1px;
    background: rgba(255,255,255,0.05);
    margin: 4px 12px;
}

/* ===== ПУСТОЙ ЧАТ (КРАСИВЫЙ) ===== */
.empty-chat {
    text-align: center;
    padding: 80px 20px;
    color: #555;
    animation: fadeIn 0.5s ease;
}

.empty-chat .empty-icon {
    font-size: 4rem;
    color: #333;
    display: block;
    margin-bottom: 20px;
    animation: float 3s ease-in-out infinite;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

.empty-chat .empty-title {
    font-size: 1.2rem;
    font-weight: 700;
    color: #fff;
    margin-bottom: 8px;
}

.empty-chat .empty-subtitle {
    font-size: 0.85rem;
    color: #666;
    max-width: 300px;
    margin: 0 auto;
}

.empty-chat .empty-subtitle span {
    color: #fbbf24;
}

/* ===== SWIPE ===== */
.message.swiping {
    transform: translateX(20px);
    background: rgba(251,191,36,0.15);
    border-left: 4px solid #fbbf24;
}

.message .reply-hint {
    position: absolute;
    right: -50px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1.2rem;
    color: #fbbf24;
    opacity: 0;
    transition: opacity 0.2s ease;
}

.message.swiping .reply-hint {
    opacity: 1;
}

/* ===== СТИЛИ ДЛЯ ЗАПИСИ ГОЛОСА ===== */
.voice-recording-interface {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.9);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 20px 30px;
    display: none;
    align-items: center;
    gap: 20px;
    border: 1px solid rgba(251,191,36,0.2);
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    z-index: 1000;
    min-width: 300px;
    max-width: 90%;
}

.voice-cancel-btn {
    background: none;
    border: none;
    color: #ef4444;
    font-size: 1.5rem;
    cursor: pointer;
    transition: all 0.2s ease;
}

.voice-cancel-btn:hover {
    transform: scale(1.1);
}

.voice-timer-display {
    font-size: 1.2rem;
    font-weight: 700;
    color: #fbbf24;
    font-variant-numeric: tabular-nums;
    min-width: 60px;
    text-align: center;
}

.voice-send-btn {
    background: linear-gradient(135deg, #22c55e, #16a34a);
    border: none;
    color: #fff;
    font-size: 1.5rem;
    padding: 8px 12px;
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.2s ease;
}

.voice-send-btn:hover {
    transform: scale(1.05);
}

.voice-send-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

/* ===== АДАПТИВ ===== */
@media (max-width: 600px) {
    .message { max-width: 90%; }
    .input-wrapper { padding: 10px 14px; gap: 6px; }
    .chat-header { padding: 10px 14px; gap: 10px; }
    .chat-header-avatar { width: 36px; height: 36px; }
    .chat-header-name { font-size: 0.9rem; }
    .messages-area { padding: 12px 12px 16px; }
    .message { padding: 6px 12px; border-radius: 14px; }
    .message .msg-avatar { width: 26px; height: 26px; }
    .message-text { font-size: 0.85rem; }
    .chat-input-area input { font-size: 0.85rem; padding: 8px 14px; min-height: 38px; }
    .send-btn { padding: 0 14px; font-size: 0.8rem; min-height: 38px; }
    .input-btn { width: 38px; height: 38px; font-size: 0.9rem; }
    .reply-indicator { margin: 0 14px; padding: 6px 12px; font-size: 0.65rem; }
    .voice-message { gap: 8px; }
    .voice-play-btn { width: 32px; height: 32px; font-size: 12px; }
    .voice-waveform-container { height: 28px; min-width: 50px; }
    .voice-duration { font-size: 0.6rem; min-width: 28px; }

function formatTime(seconds) {

function generateSmartWaveform(container, duration) {
    if (!container) return;
    
    container.innerHTML = '';
    
    // Количество палочек зависит от длительности
    let barCount;
    if (duration <= 2) barCount = 20;
    else if (duration <= 4) barCount = 32;
    else if (duration <= 7) barCount = 48;
    else barCount = 60;
    
    // Генерируем паттерн громкости
    const volumePattern = [];
    
    for (let i = 0; i < barCount; i++) {
        const pos = i / barCount;
        let volume;
        
        if (duration <= 2) {
            volume = 0.2 + Math.random() * 0.8;
        } else {
            if (pos < 0.1) {
                volume = 0.1 + Math.random() * 0.2;
            } else if (pos < 0.3) {
                volume = 0.6 + Math.random() * 0.4;
            } else if (pos < 0.4) {
                volume = 0.05 + Math.random() * 0.15;
            } else if (pos < 0.6) {
                volume = 0.4 + Math.random() * 0.3;
            } else if (pos < 0.7) {
                volume = 0.05 + Math.random() * 0.15;
            } else if (pos < 0.85) {
                volume = 0.7 + Math.random() * 0.3;
            } else {
                volume = 0.3 + Math.random() * 0.2;
            }
        }
        
        volumePattern.push(volume);
    }
    
    // Создаем палочки
    for (let i = 0; i < barCount; i++) {
        const bar = document.createElement('div');
        bar.className = 'wf-bar';
        
        const volume = volumePattern[i] || 0.3;
        const height = 2 + volume * 28;
        
        bar.style.height = height + 'px';
        bar.dataset.index = i;
        bar.dataset.volume = volume;
        container.appendChild(bar);
    }
    
    // Сохраняем паттерн
    container.dataset.volumePattern = JSON.stringify(volumePattern);
}

function formatMessageDate(date) {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);
    const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    if (d.getTime() === today.getTime()) return 'Сегодня';
    if (d.getTime() === yesterday.getTime()) return 'Вчера';
    return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
}

}

function getReadStatus(message, allMessages, currentUserId) {
    if (message.from !== currentUserId) return '';
    
    const msgIndex = allMessages.findIndex(m => m.id === message.id);
    const nextMessages = allMessages.slice(msgIndex + 1);
    
    if (nextMessages.length > 0) {
        const hasReply = nextMessages.some(m => m.from !== currentUserId);
        if (hasReply) return '✓✓';
        return '✓';
    }
    return '✓';
}

function groupMessages(messages) {
    const groups = [];
    let currentGroup = [];
    
    messages.forEach((msg, index) => {
        const prev = messages[index - 1];
        const isSameAuthor = prev && prev.from === msg.from;
        const timeDiff = prev && prev.createdAt ? 
            (msg.createdAt.toDate() - prev.createdAt.toDate()) / 1000 : 999;
        const isWithinTime = timeDiff < 300;
        
        if (isSameAuthor && isWithinTime && prev.type !== 'system') {
            currentGroup.push(msg);
        } else {
            if (currentGroup.length > 0) {
                groups.push(currentGroup);
            }
            currentGroup = [msg];
        }
    });
    
    if (currentGroup.length > 0) {
        groups.push(currentGroup);
    }
    
    return groups;
}

async function addReaction(messageId, emoji) {
    if (!currentUser || !chatId) return;
    
    const reactionRef = doc(db, "chats", chatId, "reactions", messageId);
    const reactionSnap = await getDoc(reactionRef);
    
    let reactions = {};
    if (reactionSnap.exists()) {
        reactions = reactionSnap.data();
    }
    
    const userReactions = reactions[currentUser.uid] || [];
    
    // Если пользователь уже поставил эту реакцию - убираем её
    if (userReactions.includes(emoji)) {
        reactions[currentUser.uid] = userReactions.filter(e => e !== emoji);
        if (reactions[currentUser.uid].length === 0) {
            delete reactions[currentUser.uid];
        }
        await setDoc(reactionRef, reactions);
        showNotification(`❌ Реакция "${emoji}" убрана`, 'info');
    } else {
        // Иначе добавляем
        reactions[currentUser.uid] = [...userReactions, emoji];
        await setDoc(reactionRef, reactions);
        showNotification(`✅ Реакция "${emoji}" добавлена`, 'success');
    }
    
    // Обновляем отображение
    setTimeout(() => loadAllReactions(), 200);
}

// SWIPE ДЛЯ ОТВЕТА
// ============================================================
let swipeData = {
    element: null,
    startX: 0,
    startY: 0,
    isSwiping: false,
    threshold: 50
};

function setupSwipeReply() {
    const messagesArea = document.getElementById('messagesArea');

    messagesArea.addEventListener('touchstart', (e) => {
        const msg = e.target.closest('.message.other');
        if (!msg || msg.closest('.reply-preview')) return;
        const touch = e.touches[0];
        swipeData.element = msg;
        swipeData.startX = touch.clientX;
        swipeData.startY = touch.clientY;
        swipeData.isSwiping = false;
    }, { passive: true });

    messagesArea.addEventListener('touchmove', (e) => {
        if (!swipeData.element) return;
        const touch = e.touches[0];
        const deltaX = touch.clientX - swipeData.startX;
        const deltaY = touch.clientY - swipeData.startY;
        
        if (Math.abs(deltaY) > 20 && Math.abs(deltaY) > Math.abs(deltaX)) {
            resetSwipe();
            return;
        }
        
        if (deltaX > 10) {
            swipeData.isSwiping = true;
            const progress = Math.min(deltaX / swipeData.threshold, 1);
            const translate = progress * 20;
            swipeData.element.style.transform = `translateX(${translate}px)`;
            swipeData.element.style.borderLeft = `4px solid rgba(251,191,36,${progress})`;
            swipeData.element.style.background = `rgba(251,191,36,${progress * 0.12})`;
            
            let hint = swipeData.element.querySelector('.reply-hint');
            if (!hint) {
                hint = document.createElement('div');
                hint.className = 'reply-hint';
                hint.innerHTML = '<i class="fas fa-reply"></i>';
                swipeData.element.style.position = 'relative';
                swipeData.element.appendChild(hint);
            }
            hint.style.opacity = progress;
        }
    }, { passive: true });

    messagesArea.addEventListener('touchend', (e) => {
        if (!swipeData.element) return;
        const touch = e.changedTouches[0];
        const deltaX = touch.clientX - swipeData.startX;
        
        if (swipeData.isSwiping && deltaX > swipeData.threshold) {
            const el = swipeData.element;
            const text = el.dataset.isVoice === 'true' ? '🎤 Голосовое сообщение' : el.dataset.messageText;
            setReplyTo(el.dataset.messageId, text, el.dataset.messageAuthor);
        }
        resetSwipe();
    }, { passive: true });

    // Mouse support
    let mouseDownEl = null;
    let mouseStartX = 0;
    
    messagesArea.addEventListener('mousedown', (e) => {
        const msg = e.target.closest('.message.other');
        if (!msg || msg.closest('.reply-preview')) return;
        mouseDownEl = msg;
        mouseStartX = e.clientX;
        swipeData.element = msg;
        swipeData.startX = e.clientX;
        swipeData.startY = e.clientY;
        swipeData.isSwiping = false;
    });

    document.addEventListener('mousemove', (e) => {
        if (!mouseDownEl) return;
        const deltaX = e.clientX - mouseStartX;
        if (deltaX > 10) {
            swipeData.isSwiping = true;
            const progress = Math.min(deltaX / swipeData.threshold, 1);
            const translate = progress * 20;
            mouseDownEl.style.transform = `translateX(${translate}px)`;
            mouseDownEl.style.borderLeft = `4px solid rgba(251,191,36,${progress})`;
            mouseDownEl.style.background = `rgba(251,191,36,${progress * 0.12})`;
            
            let hint = mouseDownEl.querySelector('.reply-hint');
            if (!hint) {
                hint = document.createElement('div');
                hint.className = 'reply-hint';
                hint.innerHTML = '<i class="fas fa-reply"></i>';
                mouseDownEl.style.position = 'relative';
                mouseDownEl.appendChild(hint);
            }
            hint.style.opacity = progress;
        }
    });

    document.addEventListener('mouseup', (e) => {
        if (!mouseDownEl) return;
        const deltaX = e.clientX - mouseStartX;
        if (swipeData.isSwiping && deltaX > swipeData.threshold) {
            const el = mouseDownEl;
            const text = el.dataset.isVoice === 'true' ? '🎤 Голосовое сообщение' : el.dataset.messageText;
            setReplyTo(el.dataset.messageId, text, el.dataset.messageAuthor);
        }
        resetSwipe();
        mouseDownEl = null;
    });
}

function resetSwipe() {
    if (swipeData.element) {
        swipeData.element.style.transform = '';
        swipeData.element.style.borderLeft = '';
        swipeData.element.style.background = '';
        const hint = swipeData.element.querySelector('.reply-hint');
        if (hint) hint.remove();
    }
    swipeData.element = null;
    swipeData.isSwiping = false;
}

function handleTyping() {
    if (!currentUser || !chatId) return;
    const typingRef = doc(db, "chats", chatId, "typing", currentUser.uid);
    if (!isTyping) {
        isTyping = true;
        setDoc(typingRef, { userId: currentUser.uid, timestamp: new Date(), isTyping: true }).catch(() => {});
    }
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => {
        isTyping = false;
        setDoc(typingRef, { userId: currentUser.uid, timestamp: new Date(), isTyping: false }).catch(() => {});
    }, 2000);
}

function listenTyping() {
    if (unsubscribeTyping) { unsubscribeTyping(); unsubscribeTyping = null; }
    if (!chatId || !otherUserId) return;
    const typingRef = collection(db, "chats", chatId, "typing");
    unsubscribeTyping = onSnapshot(typingRef, (snapshot) => {
        let isOtherTyping = false;
        snapshot.forEach(doc => {
            const data = doc.data();
            if (data.userId === otherUserId && data.isTyping === true) {
                const timestamp = data.timestamp?.toDate() || new Date();
                if ((new Date() - timestamp) / 1000 < 5) isOtherTyping = true;
            }
        });
        const statusText = document.getElementById('statusText');
        if (isOtherTyping) {
            statusText.innerHTML = '<span class="typing">✏️ печатает...</span>';
        } else if (otherUserData.online) {
            statusText.innerHTML = '<span class="online">● В сети</span>';
        } else {
            statusText.textContent = otherUserData.lastSeenText || 'был(а) недавно';
        }
    }, (err) => console.warn('Ошибка слушания статуса печати:', err));
}

function initializeVoiceRecorder() {
    if (voiceRecorder) {
        voiceRecorder.destroy();
    }
    
    voiceRecorder = new VoiceRecorder({
        maxDuration: 60,
        minDuration: 1,
        onRecordingStart: () => {
            isRecording = true;
            recordingSeconds = 0;
            voiceBtn.classList.add('recording');
            voiceBtn.innerHTML = '<i class="fas fa-pause"></i>';
            voiceTimer.style.display = 'inline';
            voiceTimer.textContent = '00:00';
            document.getElementById('messageInput').disabled = true;
            document.getElementById('sendBtn').disabled = true;
            document.getElementById('sendBtn').style.display = 'none';
            
            // Показываем кнопку отмены (корзина)
            showCancelButton(true);
        },
        onRecordingStop: async (audioChunks) => {
            if (audioChunks && audioChunks.length > 0) {
                await sendVoiceMessageFromRecorder(audioChunks);
            }
            resetRecordingUI();
        },
        onRecordingCancel: () => {
            showNotification('❌ Запись отменена', 'warning');
            resetRecordingUI();
        },
        onRecordingProgress: (duration) => {
            recordingSeconds = duration;
            voiceTimer.textContent = formatTime(duration);
            
            if (duration === 55) {
                showNotification('⏰ Осталось 5 секунд', 'warning');
            }
        },
        onUploadProgress: (progress) => {
            if (progress < 100) {
                showNotification(`📤 Загрузка... ${Math.round(progress)}%`, 'info');
            }
        }
    });
}

async function startRecording() {
    try {
        if (!voiceRecorder) {
            initializeVoiceRecorder();
        }
        await voiceRecorder.startRecording();
    } catch (err) {
        showNotification('❌ ' + err.message, 'error');
        resetRecordingUI();
    }
}

async function stopRecording() {
    if (voiceRecorder && voiceRecorder.isRecording) {
        try {
            voiceRecorder.stopRecording();
        } catch (err) {
            showNotification('❌ ' + err.message, 'warning');
            resetRecordingUI();
        }
    }
}

function resetRecordingUI() {
    isRecording = false;
    voiceBtn.classList.remove('recording');
    voiceBtn.innerHTML = '<i class="fas fa-microphone"></i>';
    voiceTimer.style.display = 'none';
    voiceTimer.textContent = '00:00';
    document.getElementById('messageInput').disabled = false;
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('sendBtn').style.display = 'flex';
    recordingSeconds = 0;
    
    // Скрываем кнопку отмены
    showCancelButton(false);
    
    if (voiceRecorder) {
        voiceRecorder.destroy();
        voiceRecorder = null;
    }
}

let voiceAnimationInterval = null;

async function playVoiceMessage(voiceUrl, duration, voiceEl) {
    const playBtn = voiceEl.querySelector('.voice-play-btn');
    const bars = voiceEl.querySelectorAll('.wf-bar');
    const durationEl = voiceEl.querySelector('.voice-duration');
    
    // Останавливаем предыдущее аудио
    if (currentAudioElement && currentAudioElement !== voiceEl._audio) {
        currentAudioElement.pause();
        currentAudioElement.currentTime = 0;
        const prevVoiceEl = currentAudioElement.closest('.voice-message');
        if (prevVoiceEl) {
            const prevBtn = prevVoiceEl.querySelector('.voice-play-btn');
            const prevBars = prevVoiceEl.querySelectorAll('.wf-bar');
            if (prevBtn) {
                prevBtn.classList.remove('playing');
                prevBtn.innerHTML = '<i class="fas fa-play"></i>';
            }
            prevBars.forEach(bar => bar.classList.remove('active'));
        }
        currentAudioElement = null;
    }

    // Если аудио уже существует - переключаем play/pause
    if (voiceEl._audio) {
        const audio = voiceEl._audio;
        if (audio.paused) {
            await audio.play();
            playBtn.classList.add('playing');
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            startVoiceAnimation(bars, audio);
        } else {
            audio.pause();
            playBtn.classList.remove('playing');
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
            stopVoiceAnimation(bars);
        }
        currentAudioElement = audio;
        return;
    }

    try {
        let audioUrl = voiceUrl;
        let cachedResponse = await getCachedVoice(voiceUrl);
        
        if (cachedResponse) {
            const blob = await cachedResponse.blob();
            audioUrl = URL.createObjectURL(blob);
        }
        
        const audio = new Audio(audioUrl);
        voiceEl._audio = audio;
        currentAudioElement = audio;

        // Обновляем длительность
        audio.addEventListener('loadedmetadata', () => {
            if (durationEl && audio.duration) {
                durationEl.textContent = formatTime(Math.round(audio.duration));
            }
        });

        audio.onplay = () => {
            playBtn.classList.add('playing');
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            startVoiceAnimation(bars, audio);
        };

        audio.onpause = () => {
            playBtn.classList.remove('playing');
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
            stopVoiceAnimation(bars);
        };

        audio.onended = () => {
            playBtn.classList.remove('playing');
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
            
            // Закрашиваем все палочки и они остаются видны
            bars.forEach(bar => {
                bar.classList.add('active');
                const volume = parseFloat(bar.dataset.volume) || 0.3;
                const height = 2 + volume * 28;
                bar.style.height = height + 'px';
            });
            
            if (durationEl) {
                durationEl.textContent = formatTime(duration);
            }
            if (!audioUrl.startsWith('blob:')) {
                URL.revokeObjectURL(audioUrl);
            }
            currentAudioElement = null;
            voiceEl._audio = null;
            voiceAnimationInterval = false;
        };

        audio.onerror = () => {
            showNotification('❌ Ошибка воспроизведения', 'error');
            playBtn.classList.remove('playing');
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
            stopVoiceAnimation(bars);
            if (!audioUrl.startsWith('blob:')) {
                URL.revokeObjectURL(audioUrl);
            }
            currentAudioElement = null;
            voiceEl._audio = null;
        };

        await audio.play();

    } catch (err) {
        console.error('Ошибка:', err);
        showNotification('❌ Не удалось воспроизвести', 'error');
    }
}

function startVoiceAnimation(bars, audio) {
    stopVoiceAnimation(bars);
    
    // Получаем паттерн громкости из контейнера
    const container = bars[0]?.closest('.voice-waveform-container');
    let volumePattern = [];
    if (container && container.dataset.volumePattern) {
        volumePattern = JSON.parse(container.dataset.volumePattern);
    }
    
    const totalBars = bars.length;
    let startTime = Date.now();
    
    function animateBars() {
        if (!audio || audio.ended) {
            // Если закончилось - закрашиваем все палочки
            bars.forEach((bar, i) => {
                const volume = volumePattern[i] || 0.3;
                const height = 2 + volume * 28;
                bar.style.height = height + 'px';
                bar.classList.add('active');
            });
            return;
        }
        
        if (audio.paused) {
            requestAnimationFrame(animateBars);
            return;
        }
        
        // Вычисляем прогресс
        const elapsed = (Date.now() - startTime) / 1000;
        const progress = Math.min(elapsed / (audio.duration || 5), 1);
        const activeCount = Math.floor(progress * totalBars);
        
        // Обновляем палочки
        bars.forEach((bar, i) => {
            const volume = volumePattern[i] || 0.3;
            const pulse = Math.sin(Date.now() / 200 + i * 0.5) * 0.1 + 0.9;
            const height = 2 + volume * 28 * pulse;
            bar.style.height = height + 'px';
            
            if (i < activeCount) {
                bar.classList.add('active');
            } else {
                bar.classList.remove('active');
            }
        });
        
        if (!audio.paused && !audio.ended) {
            requestAnimationFrame(animateBars);
        }
    }
    
    requestAnimationFrame(animateBars);
    voiceAnimationInterval = true;
}

function stopVoiceAnimation(bars) {
    if (bars) {
        bars.forEach(bar => {
            // Убираем только класс active, но сохраняем высоту
            bar.classList.remove('active');
            // Восстанавливаем базовую высоту из dataset
            const volume = parseFloat(bar.dataset.volume) || 0.3;
            const height = 2 + volume * 28;
            bar.style.height = height + 'px';
            bar.style.background = '';
        });
    }
    voiceAnimationInterval = false;
}

// Функция для переключения play/pause
function toggleVoicePlay(voiceEl) {
    const audio = voiceEl._audio;
    const playBtn = voiceEl.querySelector('.voice-play-btn');
    const bars = voiceEl.querySelectorAll('.wf-bar');
    
    if (!audio) return;
    
    if (audio.paused) {
        audio.play();
        playBtn.classList.add('playing');
        playBtn.innerHTML = '<i class="fas fa-pause"></i>';
        startVoiceAnimation(bars, audio);
    } else {
        audio.pause();
        playBtn.classList.remove('playing');
        playBtn.innerHTML = '<i class="fas fa-play"></i>';
        stopVoiceAnimation(bars);
    }
}

async function loadChat() {
    const params = new URLSearchParams(window.location.search);
    chatId = params.get('id');
    
    if (!chatId) {
        document.getElementById('chatName').innerText = 'Чат не найден';
        document.querySelector('.chat-input-area').style.display = 'none';
        return;
    }

    const chatRef = doc(db, "chats", chatId);
    const chatSnap = await getDoc(chatRef);
    
    if (!chatSnap.exists()) {
        document.getElementById('chatName').innerText = 'Чат не найден';
        document.querySelector('.chat-input-area').style.display = 'none';
        return;
    }
    
    const chatData = chatSnap.data();
    const participants = chatData.participants || [];
    
    if (!currentUser || !participants.includes(currentUser.uid)) {
        document.getElementById('chatName').innerText = 'Нет доступа';
        document.querySelector('.chat-input-area').style.display = 'none';
        document.getElementById('messagesArea').innerHTML = '<div class="empty-chat"><i class="fas fa-lock empty-icon"></i><div class="empty-title">Нет доступа</div></div>';
        return;
    }
    
    try {
        const currentCounts = chatData.unreadCounts || {};
        if (currentCounts[currentUser.uid] > 0) {
            const updateData = {};
            updateData[`unreadCounts.${currentUser.uid}`] = 0;
            await updateDoc(chatRef, updateData);
        }
    } catch (err) {}
    
    otherUserId = participants.find(id => id !== currentUser.uid);
    
    if (otherUserId) {
        try {
            const userDoc = await getDoc(doc(db, "fighters", otherUserId));
            if (userDoc.exists()) {
                otherUserData = userDoc.data();
                document.getElementById('chatName').innerText = otherUserData.name || 'Боец';
                document.getElementById('chatAvatar').src = otherUserData.avatar || 'Avatar.png';
                
                const badge = document.getElementById('chatPremiumBadge');
                if (otherUserData.premium === true) {
                    badge.style.display = 'inline-flex';
                } else {
                    badge.style.display = 'none';
                }
                
                let isOnline = false;
                if (otherUserData.lastSeen) {
                    const lastSeen = otherUserData.lastSeen.toDate();
                    isOnline = (new Date() - lastSeen) < 5 * 60 * 1000;
                }
                otherUserData.online = isOnline;
                otherUserData.lastSeenText = isOnline ? 'В сети' : 'был(а) недавно';
                
                const statusText = document.getElementById('statusText');
                if (isOnline) {
                    statusText.innerHTML = '<span class="online">● В сети</span>';
                } else {
                    statusText.textContent = 'был(а) недавно';
                }
            }
        } catch (err) {
            console.warn('Ошибка загрузки данных собеседника:', err);
        }
    }
    
    listenTyping();
    
    const messagesRef = collection(db, "chats", chatId, "messages");
    const q = query(messagesRef, orderBy("createdAt", "asc"));
    
    if (unsubscribe) unsubscribe();
    unsubscribe = onSnapshot(q, (snapshot) => {
        const container = document.getElementById('messagesArea');
        allMessagesCache = [];
        snapshot.forEach(doc => {
            allMessagesCache.push({ id: doc.id, ...doc.data() });
        });
        
        if (allMessagesCache.length === 0) {
            container.innerHTML = `
                <div class="empty-chat">
                    <i class="fas fa-comment-dots empty-icon"></i>
                    <div class="empty-title">Начните общение!</div>
                    <div class="empty-subtitle">
                        Напишите <span>первое сообщение</span> вашему собеседнику ✨
                    </div>
                </div>
            `;
            return;
        }
        
        const groups = groupMessages(allMessagesCache);
        let html = '';
        let lastDate = null;
        const otherAvatar = document.getElementById('chatAvatar').src || 'Avatar.png';
        
        groups.forEach((group) => {
            const firstMsg = group[0];
            const msgDate = firstMsg.createdAt?.toDate();
            
            if (msgDate) {
                const dateStr = formatMessageDate(msgDate);
                if (dateStr !== lastDate) {
                    html += `<div class="message-date">${dateStr}</div>`;

                }

            group.forEach((msg, index) => {

                const isFirst = index === 0;
                const isLast = index === group.length - 1;
                const isSolo = group.length === 1;
                
                let cssClass = isOwn ? 'own' : 'other';
                if (isSolo) cssClass += ' solo';
                else if (isFirst) cssClass += ' first-in-group';
                else if (isLast) cssClass += ' last-in-group';
                
                if (!isOwn && isFirst) cssClass += ' has-avatar';
                else if (!isOwn) cssClass += ' no-avatar';
                
                const senderName = (!isOwn && isFirst && msg.fromName) ? 
                    `<div class="message-sender"><i class="fas fa-user"></i> ${escapeHtml(msg.fromName)}</div>` : '';
                
                let replyHtml = '';

                    replyHtml = `
                        <div class="reply-preview">
                            <div class="reply-author"><i class="fas fa-reply"></i> ${escapeHtml(msg.replyTo.fromName)}</div>
                            <div class="reply-text">${escapeHtml(msg.replyTo.text)}</div>
                        </div>
                    `;
                }
                
                const msgDateObj = msg.createdAt?.toDate();
                const timeStr = msgDateObj ? 
                    `${msgDateObj.getHours().toString().padStart(2,'0')}:${msgDateObj.getMinutes().toString().padStart(2,'0')}` : '';
                
                const messageId = msg.id;
                const messageAuthor = escapeHtml(msg.fromName || 'Соперник');
                
                const readStatus = getReadStatus(msg, allMessagesCache, currentUser?.uid);
                let statusHtml = '';
                if (isOwn && readStatus) {
                    const statusClass = readStatus === '✓✓' ? 'read' : (readStatus === '✓' ? 'delivered' : 'sent');
                    statusHtml = `<span class="message-read-status ${statusClass}">${readStatus}</span>`;
                }
                
                let contentHtml = '';
                
                // ===== ГЛАВНЫЙ БЛОК - РЕНДЕРИНГ ГОЛОСОВЫХ =====
                if (msg.type === 'voice' && msg.voiceUrl) {
                    const duration = msg.voiceDuration || 5;
                    
                    // Определяем ширину блока в зависимости от длительности
                    const minWidth = 80;
                    const maxWidth = 300;
                    const calculatedWidth = minWidth + (duration / 15) * (maxWidth - minWidth);
                    const blockWidth = Math.min(Math.max(calculatedWidth, minWidth), maxWidth);
                    
                    contentHtml = `
                        <div class="voice-message" data-voice-url="${escapeHtml(msg.voiceUrl)}" data-voice-duration="${duration}">
                            <button class="voice-play-btn">
                                <i class="fas fa-play"></i>
                            </button>
                            <div class="voice-waveform-container" style="width:${blockWidth}px; height:32px; display:flex; align-items:center; gap:2px; flex-shrink:0;" id="wave-${messageId}">
                                <!-- Палочки будут сгенерированы JS -->
                            </div>
                            <span class="voice-duration">${formatTime(duration)}</span>
                        </div>
                    `;
                } else if (msg.type === 'voice' && msg.voiceData) {
                    // Fallback для старых сообщений с base64
                    const duration = msg.voiceDuration || 5;
                    
                    const minWidth = 80;
                    const maxWidth = 300;
                    const calculatedWidth = minWidth + (duration / 15) * (maxWidth - minWidth);
                    const blockWidth = Math.min(Math.max(calculatedWidth, minWidth), maxWidth);
                    
                    contentHtml = `
                        <div class="voice-message" data-voice-data="${escapeHtml(msg.voiceData)}" data-voice-duration="${duration}">
                            <button class="voice-play-btn">
                                <i class="fas fa-play"></i>
                            </button>
                            <div class="voice-waveform-container" style="width:${blockWidth}px; height:32px; display:flex; align-items:center; gap:2px; flex-shrink:0;" id="wave-${messageId}">
                                <!-- Палочки будут сгенерированы JS -->
                            </div>
                            <span class="voice-duration">${formatTime(duration)}</span>
                        </div>
                    `;
                } else {
                    const messageText = escapeHtml(msg.text);
                    contentHtml = `
                        <div class="message-text">${messageText}</div>
                    `;
                }
                
                const avatarHtml = !isOwn && isFirst ? 
                    `<img src="${otherAvatar}" class="msg-avatar" onerror="this.src='Avatar.png'">` : '';
                
                const isVoice = msg.type === 'voice' ? 'true' : 'false';
                const textContent = msg.type === 'voice' ? '🎤 Голосовое сообщение' : escapeHtml(msg.text || '');
                
                html += `
                    <div class="message ${cssClass}" 
                         data-message-id="${messageId}" 
                         data-message-text="${textContent}"
                         data-message-author="${messageAuthor}"
                         data-is-voice="${isVoice}">
                        ${avatarHtml}
                        <div class="msg-content">
                            ${senderName}
                            ${replyHtml}
                            ${contentHtml}
                            <div class="message-footer">
                                <span class="message-time">${timeStr}</span>
                                ${statusHtml}
                            </div>
                            <div class="message-reactions" id="reactions-${messageId}"></div>
                        </div>
                    </div>
                `;
            });
        });
        
        container.innerHTML = html;
        container.scrollTop = container.scrollHeight;
        
        setTimeout(() => loadAllReactions(), 100);
        setupMessageHandlers();
        setupVoicePlayers();
    });
    
    document.querySelector('.chat-input-area').style.display = 'flex';
    setupSwipeReply();
}

// ============================================================
// НАСТРОЙКА ОБРАБОТЧИКОВ
// ============================================================
function setupMessageHandlers() {
    document.querySelectorAll('.message').forEach(msgEl => {
        msgEl.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            e.stopPropagation();
            showMessageMenu(e, msgEl);
        });
        
        let longPressTimer = null;
        msgEl.addEventListener('touchstart', (e) => {
            longPressTimer = setTimeout(() => {
                const touch = e.touches[0];
                const fakeEvent = { clientX: touch.clientX, clientY: touch.clientY };
                showMessageMenu(fakeEvent, msgEl);
                e.preventDefault();
            }, 500);
        }, { passive: true });
        
        msgEl.addEventListener('touchend', () => clearTimeout(longPressTimer));
        msgEl.addEventListener('touchmove', () => clearTimeout(longPressTimer));
    });
}

function setupVoicePlayers() {
    document.querySelectorAll('.voice-message').forEach(voiceEl => {
        const playBtn = voiceEl.querySelector('.voice-play-btn');
        const voiceUrl = voiceEl.dataset.voiceUrl;
        const voiceData = voiceEl.dataset.voiceData;
        const duration = parseInt(voiceEl.dataset.voiceDuration) || 5;
        const waveContainer = voiceEl.querySelector('.voice-waveform-container');
        
        // Генерируем умные волны
        if (waveContainer) {
            generateSmartWaveform(waveContainer, duration);
        }
        
        if (!playBtn) return;
        
        const newPlayBtn = playBtn.cloneNode(true);
        playBtn.parentNode.replaceChild(newPlayBtn, playBtn);
        
        newPlayBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            
            // Если есть аудио - переключаем play/pause
            if (voiceEl._audio) {
                toggleVoicePlay(voiceEl);
                return;
            }
            
            // Иначе создаем новое аудио
            if (voiceUrl) {
                playVoiceMessage(voiceUrl, duration, voiceEl);
            } else if (voiceData) {
                playVoiceMessageFromBase64(voiceData, duration, voiceEl);
            }
        });
    });
}

// Fallback для старых голосовых сообщений
async function playVoiceMessageFromBase64(voiceData, duration, voiceEl) {
    const playBtn = voiceEl.querySelector('.voice-play-btn');
    const bars = voiceEl.querySelectorAll('.wf-bar');
    const durationEl = voiceEl.querySelector('.voice-duration');
    
    if (currentAudioElement && currentAudioElement !== voiceEl._audio) {
        currentAudioElement.pause();
        currentAudioElement.currentTime = 0;
        const prevVoiceEl = currentAudioElement.closest('.voice-message');
        if (prevVoiceEl) {
            const prevBtn = prevVoiceEl.querySelector('.voice-play-btn');
            const prevBars = prevVoiceEl.querySelectorAll('.wf-bar');
            if (prevBtn) {
                prevBtn.classList.remove('playing');
                prevBtn.innerHTML = '<i class="fas fa-play"></i>';
            }
            prevBars.forEach(bar => bar.classList.remove('active'));
        }
        currentAudioElement = null;
    }

    if (voiceEl._audio) {
        const audio = voiceEl._audio;
        if (audio.paused) {
            await audio.play();
            playBtn.classList.add('playing');
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            startVoiceAnimation(bars, audio);
        } else {
            audio.pause();
            playBtn.classList.remove('playing');
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
            stopVoiceAnimation(bars);
        }
        currentAudioElement = audio;
        return;
    }
    
    try {
        const binaryString = atob(voiceData);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
            bytes[i] = binaryString.charCodeAt(i);
        }
        const blob = new Blob([bytes], { type: 'audio/webm' });
        const url = URL.createObjectURL(blob);
        
        const audio = new Audio(url);
        voiceEl._audio = audio;
        currentAudioElement = audio;

        audio.addEventListener('loadedmetadata', () => {
            if (durationEl && audio.duration) {
                durationEl.textContent = formatTime(Math.round(audio.duration));
            }
        });

        audio.onplay = () => {
            playBtn.classList.add('playing');
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            startVoiceAnimation(bars, audio);
        };

        audio.onpause = () => {
            playBtn.classList.remove('playing');
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
            stopVoiceAnimation(bars);
        };

        audio.onended = () => {
            playBtn.classList.remove('playing');
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
            stopVoiceAnimation(bars);
            if (durationEl) {
                durationEl.textContent = formatTime(duration);
            }
            URL.revokeObjectURL(url);
            currentAudioElement = null;
            voiceEl._audio = null;
        };

        await audio.play();

    } catch (err) {
        console.error('Ошибка:', err);
        showNotification('❌ Не удалось воспроизвести', 'error');
    }
}

document.getElementById('messageInput').addEventListener('input', handleTyping);

    if (!isTyping) handleTyping();

// ===== ОБРАБОТЧИК КНОПКИ ЗАПИСИ (КАК В WHATSAPP) =====
let pressTimer = null;

// Клик - запуск/остановка
voiceBtn.addEventListener('click', function(e) {
    e.preventDefault();
    
    if (isRecording) {
        // Если запись идет - останавливаем и отправляем
        if (voiceRecorder) {
            voiceRecorder.stopRecording();
        }
    } else {
        // Начинаем запись
        startRecording();
    }
});

// Удержание для записи
voiceBtn.addEventListener('mousedown', function(e) {
    e.preventDefault();
    if (isRecording) return;
    
    pressTimer = setTimeout(() => {
        if (!isRecording) {
            startRecording();
        }
    }, 300);
});

voiceBtn.addEventListener('mouseup', function(e) {
    e.preventDefault();
    clearTimeout(pressTimer);
});

voiceBtn.addEventListener('mouseleave', function() {
    clearTimeout(pressTimer);
});

// Touch поддержка
voiceBtn.addEventListener('touchstart', function(e) {
    e.preventDefault();
    if (isRecording) return;
    
    pressTimer = setTimeout(() => {
        if (!isRecording) {
            startRecording();
        }
    }, 300);
}, { passive: true });

voiceBtn.addEventListener('touchend', function(e) {
    e.preventDefault();
    clearTimeout(pressTimer);
    if (isRecording) {
        // Если отпустили кнопку во время записи - останавливаем
        if (voiceRecorder) {
            voiceRecorder.stopRecording();
        }
    }
}, { passive: true });

voiceBtn.addEventListener('touchcancel', function() {
    clearTimeout(pressTimer);
    if (isRecording) {
        if (voiceRecorder) {
            voiceRecorder.cancelRecording();
        }
        resetRecordingUI();
    }
});

document.getElementById('backBtn').addEventListener('click', () => {
    if (document.referrer && document.referrer.includes(window.location.host)) {
        window.history.back();
    } else {
        window.location.href = 'chats.html';
    }
});

document.getElementById('sendBtn').addEventListener('click', sendMessage);
document.getElementById('cancelReplyBtn').addEventListener('click', cancelReply);
document.getElementById('messageInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});
