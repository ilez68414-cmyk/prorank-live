<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PRORANK">
    <meta name="theme-color" content="#fbbf24">
    <meta name="mobile-web-app-capable" content="yes">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Чат | PRORANK</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <style>
        /* ===== ВСЕ СТИЛИ ИЗ ПРЕДЫДУЩЕЙ ВЕРСИИ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(ellipse at 30% 40%, rgba(251, 191, 36, 0.15) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 80%, rgba(251, 191, 36, 0.08) 0%, transparent 50%),
                        linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 40%, #1a1a1a 100%);
            background-attachment: fixed;
            color: #fff;
            line-height: 1.4;
            height: 100vh;
            overflow: hidden;
        }

        .chat-wrapper {
            height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            margin: 0 auto;
            background: rgba(10,10,10,0.6);
            backdrop-filter: blur(4px);
        }

        /* ===== HEADER ===== */
        .chat-header {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(251, 191, 36, 0.25);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
            min-height: 68px;
        }

        .back-btn {
            background: rgba(251,191,36,0.1);
            border: 1px solid rgba(251,191,36,0.3);
            color: #fbbf24;
            font-size: 1.2rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        .back-btn:hover {
            background: rgba(251,191,36,0.2);
            transform: scale(1.05);
        }

        .chat-header-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(251,191,36,0.3);
            flex-shrink: 0;
        }

        .chat-header-info {
            flex: 1;
            min-width: 0;
        }

        .chat-header-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-header-status {
            font-size: 0.65rem;
            color: #888;
            margin-top: 1px;
        }

        .chat-header-status .online {
            color: #22c55e;
        }
        .chat-header-status .typing {
            color: #fbbf24;
            animation: typingDots 1.2s infinite;
        }

        @keyframes typingDots {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .chat-premium-badge {
            font-size: 0.7rem;
            background: linear-gradient(135deg, #fbbf24, #e5a500);
            color: #000;
            padding: 0 8px;
            border-radius: 12px;
            font-weight: 700;
            height: 18px;
            display: inline-flex;
            align-items: center;
        }

        /* ===== СООБЩЕНИЯ ===== */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            scroll-behavior: smooth;
            touch-action: pan-y;
        }

        .messages-area::-webkit-scrollbar {
            width: 4px;
        }
        .messages-area::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        .messages-area::-webkit-scrollbar-thumb {
            background: #fbbf24;
            border-radius: 10px;
        }

        .message-date {
            text-align: center;
            font-size: 0.65rem;
            color: #555;
            padding: 16px 0 8px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .message {
            max-width: 82%;
            padding: 8px 14px;
            border-radius: 16px;
            word-wrap: break-word;
            animation: fadeIn 0.15s ease;
            position: relative;
            transition: all 0.2s ease;
            cursor: default;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            margin-bottom: 2px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .message .msg-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            margin-top: 2px;
            border: 1px solid rgba(251,191,36,0.15);
        }

        .message .msg-content {
            flex: 1;
            min-width: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.own {
            background: linear-gradient(135deg, #fbbf24, #e5a500);
            color: #000;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            margin-left: auto;
        }

        .message.own .msg-avatar {
            display: none;
        }

        .message.other {
            background: #1f1f2a;
            color: #fff;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(251,191,36,0.1);
        }

        .message-sender {
            font-size: 0.6rem;
            opacity: 0.7;
            margin-bottom: 2px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .message-text {
            font-size: 0.92rem;
            line-height: 1.4;
            word-break: break-word;
        }

        .message-time {
            font-size: 0.5rem;
            opacity: 0.4;
            margin-top: 2px;
            text-align: right;
            display: inline-block;
            margin-left: 8px;
        }

        .message.own .message-time {
            opacity: 0.6;
        }

        /* ===== ГОЛОСОВОЕ СООБЩЕНИЕ ===== */
        .voice-message {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 180px;
            max-width: 100%;
            padding: 4px 0;
        }

        .voice-play-btn {
            background: rgba(251,191,36,0.15);
            border: 1px solid rgba(251,191,36,0.3);
            color: #fbbf24;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .voice-play-btn:hover {
            background: rgba(251,191,36,0.25);
            transform: scale(1.05);
        }

        .voice-play-btn.playing {
            background: rgba(251,191,36,0.3);
            border-color: #fbbf24;
        }

        .voice-wave {
            flex: 1;
            height: 32px;
            display: flex;
            align-items: center;
            gap: 2px;
            min-width: 60px;
        }

        .voice-wave .bar {
            width: 3px;
            background: #555;
            border-radius: 2px;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .voice-wave .bar.active {
            background: #fbbf24;
        }

        .voice-duration {
            font-size: 0.7rem;
            color: #888;
            min-width: 32px;
            text-align: center;
            flex-shrink: 0;
        }

        .message.own .voice-duration {
            color: rgba(0,0,0,0.5);
        }

        .message.own .voice-play-btn {
            background: rgba(0,0,0,0.15);
            border-color: rgba(0,0,0,0.2);
            color: #000;
        }

        .message.own .voice-wave .bar {
            background: rgba(0,0,0,0.2);
        }

        .message.own .voice-wave .bar.active {
            background: #000;
        }

        /* ===== РЕПЛАЙ ===== */
        .reply-preview {
            background: rgba(0,0,0,0.25);
            border-left: 3px solid #fbbf24;
            padding: 6px 10px;
            margin-bottom: 4px;
            border-radius: 10px;
            font-size: 0.7rem;
        }

        .reply-preview .reply-author {
            color: #fbbf24;
            font-weight: 600;
            font-size: 0.6rem;
        }

        .reply-preview .reply-text {
            color: #aaa;
            font-style: italic;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 0.7rem;
        }

        .message.own .reply-preview {
            background: rgba(0,0,0,0.15);
        }

        /* ===== ИНДИКАТОР ОТВЕТА ===== */
        .reply-indicator {
            background: #1f1f2a;
            border-left: 3px solid #fbbf24;
            padding: 8px 14px;
            margin: 0 20px;
            border-radius: 12px;
            font-size: 0.7rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideDown 0.2s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .cancel-reply {
            background: rgba(220,38,38,0.2);
            border: none;
            color: #dc2626;
            cursor: pointer;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .cancel-reply:hover {
            background: rgba(220,38,38,0.3);
        }

        /* ===== ИНПУТ С ГОЛОСОМ ===== */
        .chat-input-area {
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(251,191,36,0.15);
            flex-shrink: 0;
        }

        .input-wrapper {
            display: flex;
            gap: 8px;
            padding: 12px 20px;
            align-items: center;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px 18px;
            background: #1f1f2a;
            border: 1px solid rgba(251,191,36,0.25);
            color: #fff;
            border-radius: 40px;
            font-size: 0.9rem;
            font-family: inherit;
            transition: all 0.2s ease;
            min-height: 42px;
        }

        .chat-input-area input:focus {
            outline: none;
            border-color: #fbbf24;
            box-shadow: 0 0 0 3px rgba(251,191,36,0.1);
        }

        .chat-input-area input:disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        /* ===== КНОПКИ ===== */
        .input-btn {
            background: rgba(251,191,36,0.1);
            border: 1px solid rgba(251,191,36,0.2);
            color: #fbbf24;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
            font-size: 1rem;
        }

        .input-btn:hover {
            background: rgba(251,191,36,0.2);
            transform: scale(1.05);
        }

        .input-btn:active {
            transform: scale(0.95);
        }

        .input-btn.recording {
            background: #ef4444;
            border-color: #ef4444;
            color: #fff;
            animation: pulseRed 1s infinite;
        }

        @keyframes pulseRed {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); }
            50% { box-shadow: 0 0 0 10px rgba(239,68,68,0); }
        }

        .input-btn .recording-dot {
            display: none;
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            animation: blink 0.8s infinite;
        }

        .input-btn.recording .recording-dot {
            display: block;
        }

        .input-btn.recording i {
            display: none;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .send-btn {
            background: #fbbf24;
            color: #000;
            border: none;
            padding: 0 20px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            min-height: 42px;
            flex-shrink: 0;
        }

        .send-btn:hover {
            background: #ffdd44;
            transform: translateY(-2px);
        }

        .send-btn:active {
            transform: scale(0.97);
        }

        .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .voice-timer {
            font-size: 0.8rem;
            color: #fbbf24;
            min-width: 40px;
            text-align: center;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        /* ===== КОНТЕКСТНОЕ МЕНЮ ===== */
        .message-menu {
            background: #2a2a35;
            border-radius: 12px;
            padding: 6px 0;
            min-width: 160px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(251,191,36,0.15);
            animation: fadeIn 0.1s ease;
            overflow: hidden;
        }

        .message-menu button {
            background: none;
            border: none;
            color: #ddd;
            padding: 10px 16px;
            width: 100%;
            text-align: left;
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.1s ease;
            font-family: 'Inter', sans-serif;
        }

        .message-menu button:hover {
            background: rgba(251,191,36,0.12);
            color: #fbbf24;
        }

        .message-menu button i {
            width: 18px;
            text-align: center;
            font-size: 0.8rem;
            color: #666;
        }

        .message-menu button:hover i {
            color: #fbbf24;
        }

        .message-menu .divider {
            height: 1px;
            background: rgba(255,255,255,0.05);
            margin: 4px 12px;
        }

        /* ===== SWIPE ===== */
        .message.swiping {
            transform: translateX(20px);
            background: rgba(251,191,36,0.15);
            border-left: 4px solid #fbbf24;
        }

        .message .reply-hint {
            position: absolute;
            right: -50px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
            color: #fbbf24;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .message.swiping .reply-hint {
            opacity: 1;
        }

        /* ===== ПУСТОЙ ЧАТ ===== */
        .empty-chat {
            text-align: center;
            padding: 60px 20px;
            color: #555;
        }

        .empty-chat i {
            font-size: 3rem;
            color: #333;
            display: block;
            margin-bottom: 16px;
        }

        .empty-chat p {
            font-size: 0.9rem;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 600px) {
            .message { max-width: 90%; }
            .input-wrapper { padding: 10px 14px; gap: 6px; }
            .chat-header { padding: 10px 14px; gap: 10px; }
            .chat-header-avatar { width: 36px; height: 36px; }
            .chat-header-name { font-size: 0.9rem; }
            .messages-area { padding: 12px 12px 16px; }
            .message { padding: 6px 12px; border-radius: 14px; }
            .message .msg-avatar { width: 24px; height: 24px; }
            .message-text { font-size: 0.85rem; }
            .chat-input-area input { font-size: 0.85rem; padding: 8px 14px; min-height: 38px; }
            .send-btn { padding: 0 14px; font-size: 0.8rem; min-height: 38px; }
            .input-btn { width: 38px; height: 38px; font-size: 0.9rem; }
            .reply-indicator { margin: 0 14px; padding: 6px 12px; font-size: 0.65rem; }
            .voice-message { min-width: 140px; }
            .voice-play-btn { width: 32px; height: 32px; font-size: 0.8rem; }
            .voice-wave { height: 28px; }
        }

        @media (max-width: 400px) {
            .chat-header-name { font-size: 0.8rem; }
            .chat-header-avatar { width: 30px; height: 30px; }
            .message { max-width: 95%; }
            .message .msg-avatar { width: 20px; height: 20px; }
            .message-text { font-size: 0.8rem; }
            .input-wrapper { padding: 8px 10px; gap: 4px; }
            .chat-input-area input { font-size: 0.8rem; padding: 6px 12px; min-height: 34px; }
            .send-btn { padding: 0 10px; font-size: 0.7rem; min-height: 34px; }
            .input-btn { width: 34px; height: 34px; font-size: 0.8rem; }
            .voice-message { min-width: 120px; }
            .voice-wave { height: 24px; }
        }
    </style>
</head>
<body>
    <div class="chat-wrapper">
        <!-- HEADER -->
        <div class="chat-header">
            <button class="back-btn" id="backBtn"><i class="fas fa-arrow-left"></i></button>
            <img src="Avatar.png" id="chatAvatar" class="chat-header-avatar" onerror="this.src='Avatar.png'">
            <div class="chat-header-info">
                <div class="chat-header-name" id="chatTitle">
                    <span id="chatName">Загрузка...</span>
                    <span class="chat-premium-badge" id="chatPremiumBadge" style="display:none;">👑</span>
                </div>
                <div class="chat-header-status" id="chatStatus">
                    <span id="statusText">Загрузка...</span>
                </div>
            </div>
        </div>

        <!-- СООБЩЕНИЯ -->
        <div id="messagesArea" class="messages-area">
            <div class="empty-chat"><i class="fas fa-spinner fa-pulse"></i><p>Загрузка...</p></div>
        </div>

        <!-- ИНДИКАТОР ОТВЕТА -->
        <div class="chat-input-area">
            <div id="replyIndicator" class="reply-indicator" style="display: none;">
                <div class="reply-info">
                    <div class="reply-author"><i class="fas fa-reply"></i> Ответ для <span id="replyAuthor"></span></div>
                    <div class="reply-text" id="replyText"></div>
                </div>
                <button class="cancel-reply" id="cancelReplyBtn"><i class="fas fa-times"></i></button>
            </div>

            <!-- ИНПУТ С ГОЛОСОМ -->
            <div class="input-wrapper">
                <button class="input-btn" id="voiceBtn" title="Голосовое сообщение">
                    <i class="fas fa-microphone"></i>
                    <span class="recording-dot"></span>
                </button>
                
                <span class="voice-timer" id="voiceTimer" style="display:none;">00:00</span>

                <input type="text" id="messageInput" placeholder="Напишите сообщение..." autocomplete="off">

                <button class="send-btn" id="sendBtn">
                    <i class="fas fa-paper-plane"></i> Отпр.
                </button>
            </div>
        </div>
    </div>

    <div id="errorContainer" style="position: fixed; top: 15px; left: 50%; transform: translateX(-50%); z-index: 9999; max-width: 90%; width: 480px; padding: 14px 20px; border-radius: 16px; font-weight: 600; font-size: 0.9rem; animation: slideDown 0.3s ease; box-shadow: 0 10px 30px rgba(0,0,0,0.4); backdrop-filter: blur(8px); display: none; text-align: center; border: 1px solid rgba(255,255,255,0.1);"></div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js"
            }
        }
    </script>
    <script type="module">
        import { initializeApp } from "firebase/app";
        import { 
            getFirestore, doc, getDoc, collection, query, orderBy, 
            onSnapshot, addDoc, updateDoc, setDoc 
        } from "firebase/firestore";
        import { getAuth, onAuthStateChanged } from "firebase/auth";
        import { showError, handleFirebaseError, withErrorHandling } from './error-handler.js';
        import { notifyAboutNewMessage } from './push-sender.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDUGYJY7pX7q02MS5SACMIIQXpjpQ97mPw",
            authDomain: "proranklive.firebaseapp.com",
            projectId: "proranklive",
            storageBucket: "proranklive.firebasestorage.app",
            messagingSenderId: "716836144015",
            appId: "1:716836144015:web:f1575147750608d0f881fa"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // ===== ПЕРЕМЕННЫЕ =====
        let currentUser = null;
        let chatId = null;
        let unsubscribe = null;
        let unsubscribeTyping = null;
        let currentReplyTo = null;
        let otherUserId = null;
        let otherUserData = {};
        let typingTimeout = null;
        let isTyping = false;

        // ===== ГОЛОСОВЫЕ ПЕРЕМЕННЫЕ =====
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let recordingTimer = null;
        let recordingSeconds = 0;
        let voiceBtn = document.getElementById('voiceBtn');
        let voiceTimer = document.getElementById('voiceTimer');

        // ===== ФУНКЦИИ =====
        function getLeague(frs) {
            if (frs >= 5000) return { name: 'ЛЕГЕНДАРНАЯ', icon: 'fa-skull', color: '#ff4500' };
            if (frs >= 3500) return { name: 'ЭЛИТНАЯ', icon: 'fa-dragon', color: '#9400d3' };
            if (frs >= 2000) return { name: 'АЛМАЗНАЯ', icon: 'fa-gem', color: '#00ffff' };
            if (frs >= 1000) return { name: 'ЗОЛОТАЯ', icon: 'fa-crown', color: '#ffd700' };
            if (frs >= 500) return { name: 'СЕРЕБРЯНАЯ', icon: 'fa-medal', color: '#c0c0c0' };
            return { name: 'БРОНЗОВАЯ', icon: 'fa-medal', color: '#cd7f32' };
        }

        function formatMessageDate(date) {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
            if (d.getTime() === today.getTime()) return 'Сегодня';
            if (d.getTime() === yesterday.getTime()) return 'Вчера';
            return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // ===== МЕНЮ ДЕЙСТВИЙ =====
        function showMessageMenu(event, messageEl) {
            const existing = document.querySelector('.message-menu');
            if (existing) existing.remove();

            const messageId = messageEl.dataset.messageId;
            const messageText = messageEl.dataset.messageText;
            const messageAuthor = messageEl.dataset.messageAuthor;
            const isOwn = messageEl.classList.contains('own');
            const isVoice = messageEl.dataset.isVoice === 'true';

            const menu = document.createElement('div');
            menu.className = 'message-menu';
            menu.style.position = 'fixed';
            menu.style.top = `${Math.min(event.clientY, window.innerHeight - 160)}px`;
            menu.style.left = `${Math.min(event.clientX, window.innerWidth - 180)}px`;
            menu.style.zIndex = '1000';

            let buttons = '';

            buttons += `
                <button data-action="reply">
                    <i class="fas fa-reply"></i> Ответить
                </button>

                buttons += `
                    <button data-action="copy">
                        <i class="fas fa-copy"></i> Копировать
                    </button>
                `;
            }

            if (isOwn) {
                buttons += `
                    <div class="divider"></div>
                    <button data-action="delete" style="color:#ef4444;">
                        <i class="fas fa-trash" style="color:#ef4444;"></i> Удалить
                    </button>
                `;
            }

            menu.innerHTML = buttons;

            menu.querySelector('[data-action="reply"]')?.addEventListener('click', () => {
                const text = isVoice ? '🎤 Голосовое сообщение' : messageText;
                setReplyTo(messageId, text, messageAuthor);
                menu.remove();
            });

            menu.querySelector('[data-action="copy"]')?.addEventListener('click', () => {
                navigator.clipboard.writeText(messageText).then(() => {
                    showNotification('📋 Скопировано', 'success');
                }).catch(() => {
                    const textarea = document.createElement('textarea');
                    textarea.value = messageText;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    textarea.remove();
                    showNotification('📋 Скопировано', 'success');

            menu.querySelector('[data-action="delete"]')?.addEventListener('click', () => {

            document.body.appendChild(menu);

            const closeMenu = (e) => {
                if (!menu.contains(e.target)) {
                    menu.remove();
                    document.removeEventListener('click', closeMenu);
                }
            };
            setTimeout(() => document.addEventListener('click', closeMenu), 10);
        }

        // ===== SWIPE =====
        let swipeData = {
            element: null,
            startX: 0,
            startY: 0,
            isSwiping: false,
            threshold: 50
        };

        function setupSwipeReply() {
            const messagesArea = document.getElementById('messagesArea');

            messagesArea.addEventListener('touchstart', (e) => {
                const msg = e.target.closest('.message.other');
                if (!msg || msg.closest('.reply-preview')) return;
                const touch = e.touches[0];
                swipeData.element = msg;
                swipeData.startX = touch.clientX;
                swipeData.startY = touch.clientY;
                swipeData.isSwiping = false;
            }, { passive: true });

            messagesArea.addEventListener('touchmove', (e) => {
                if (!swipeData.element) return;
                const touch = e.touches[0];
                const deltaX = touch.clientX - swipeData.startX;
                const deltaY = touch.clientY - swipeData.startY;
                
                if (Math.abs(deltaY) > 20 && Math.abs(deltaY) > Math.abs(deltaX)) {
                    resetSwipe();
                    return;
                }
                
                if (deltaX > 10) {
                    swipeData.isSwiping = true;
                    const progress = Math.min(deltaX / swipeData.threshold, 1);
                    const translate = progress * 20;
                    swipeData.element.style.transform = `translateX(${translate}px)`;
                    swipeData.element.style.borderLeft = `4px solid rgba(251,191,36,${progress})`;
                    swipeData.element.style.background = `rgba(251,191,36,${progress * 0.12})`;
                    
                    let hint = swipeData.element.querySelector('.reply-hint');
                    if (!hint) {
                        hint = document.createElement('div');
                        hint.className = 'reply-hint';
                        hint.innerHTML = '<i class="fas fa-reply"></i>';
                        swipeData.element.style.position = 'relative';
                        swipeData.element.appendChild(hint);
                    }
                    hint.style.opacity = progress;
                }
            }, { passive: true });

            messagesArea.addEventListener('touchend', (e) => {
                if (!swipeData.element) return;
                const touch = e.changedTouches[0];
                const deltaX = touch.clientX - swipeData.startX;
                
                if (swipeData.isSwiping && deltaX > swipeData.threshold) {
                    const el = swipeData.element;
                    const text = el.dataset.isVoice === 'true' ? '🎤 Голосовое сообщение' : el.dataset.messageText;
                    setReplyTo(el.dataset.messageId, text, el.dataset.messageAuthor);
                }
                resetSwipe();
            }, { passive: true });

            // Mouse support
            let mouseDownEl = null;
            let mouseStartX = 0;
            
            messagesArea.addEventListener('mousedown', (e) => {
                const msg = e.target.closest('.message.other');
                if (!msg || msg.closest('.reply-preview')) return;
                mouseDownEl = msg;
                mouseStartX = e.clientX;
                swipeData.element = msg;
                swipeData.startX = e.clientX;
                swipeData.startY = e.clientY;
                swipeData.isSwiping = false;
            });

            document.addEventListener('mousemove', (e) => {
                if (!mouseDownEl) return;
                const deltaX = e.clientX - mouseStartX;
                if (deltaX > 10) {
                    swipeData.isSwiping = true;
                    const progress = Math.min(deltaX / swipeData.threshold, 1);
                    const translate = progress * 20;
                    mouseDownEl.style.transform = `translateX(${translate}px)`;
                    mouseDownEl.style.borderLeft = `4px solid rgba(251,191,36,${progress})`;
                    mouseDownEl.style.background = `rgba(251,191,36,${progress * 0.12})`;
                    
                    let hint = mouseDownEl.querySelector('.reply-hint');
                    if (!hint) {
                        hint = document.createElement('div');
                        hint.className = 'reply-hint';
                        hint.innerHTML = '<i class="fas fa-reply"></i>';
                        mouseDownEl.style.position = 'relative';
                        mouseDownEl.appendChild(hint);
                    }
                    hint.style.opacity = progress;
                }
            });

            document.addEventListener('mouseup', (e) => {
                if (!mouseDownEl) return;
                const deltaX = e.clientX - mouseStartX;
                if (swipeData.isSwiping && deltaX > swipeData.threshold) {
                    const el = mouseDownEl;
                    const text = el.dataset.isVoice === 'true' ? '🎤 Голосовое сообщение' : el.dataset.messageText;
                    setReplyTo(el.dataset.messageId, text, el.dataset.messageAuthor);
                }
                resetSwipe();
                mouseDownEl = null;
            });
        }

        function resetSwipe() {
            if (swipeData.element) {
                swipeData.element.style.transform = '';
                swipeData.element.style.borderLeft = '';
                swipeData.element.style.background = '';
                const hint = swipeData.element.querySelector('.reply-hint');
                if (hint) hint.remove();
            }
            swipeData.element = null;
            swipeData.isSwiping = false;
        }

        // ===== ГОЛОСОВЫЕ СООБЩЕНИЯ =====
        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    await sendVoiceMessage(audioBlob);
                    
                    stream.getTracks().forEach(track => track.stop());
                    audioChunks = [];
                    mediaRecorder = null;
                    
                    voiceBtn.classList.remove('recording');
                    voiceTimer.style.display = 'none';
                    voiceTimer.textContent = '00:00';
                    document.getElementById('messageInput').disabled = false;
                    document.getElementById('sendBtn').disabled = false;
                    isRecording = false;
                    clearInterval(recordingTimer);
                    recordingSeconds = 0;
                };

                mediaRecorder.start();
                isRecording = true;
                recordingSeconds = 0;
                voiceBtn.classList.add('recording');
                voiceTimer.style.display = 'inline';
                voiceTimer.textContent = '00:00';
                document.getElementById('messageInput').disabled = true;
                document.getElementById('sendBtn').disabled = true;

                recordingTimer = setInterval(() => {
                    recordingSeconds++;
                    voiceTimer.textContent = formatTime(recordingSeconds);
                }, 1000);

                showNotification('🎙️ Запись началась... Нажмите ещё раз для отправки', 'info');

            } catch (err) {
                console.error('Ошибка записи:', err);
                showNotification('❌ Нет доступа к микрофону', 'error');
            }
        }

        async function sendVoiceMessage(audioBlob) {
            if (!currentUser || !chatId) return;

            // Проверяем размер (максимум 2MB)
            if (audioBlob.size > 2 * 1024 * 1024) {
                showNotification('❌ Голосовое сообщение слишком большое (макс. 2MB)', 'error');
                return;
            }

            try {
                // Конвертируем в base64
                const reader = new FileReader();
                const base64 = await new Promise((resolve) => {
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                    reader.readAsDataURL(audioBlob);
                });

                let userName = 'Пользователь';
                try {
                    const fighterDoc = await getDoc(doc(db, "fighters", currentUser.uid));
                    if (fighterDoc.exists()) userName = fighterDoc.data()?.name || 'Боец';
                } catch (err) {}

                const messagesRef = collection(db, "chats", chatId, "messages");
                const messageData = {
                    from: currentUser.uid,
                    fromName: userName,
                    type: 'voice',
                    voiceData: base64,
                    voiceDuration: recordingSeconds,
                    createdAt: new Date()
                };

                if (currentReplyTo) {
                    messageData.replyTo = {
                        messageId: currentReplyTo.id,
                        text: currentReplyTo.text.substring(0, 100),
                        fromName: currentReplyTo.fromName
                    };
                    cancelReply();
                }

                await addDoc(messagesRef, messageData);

                // Обновляем последнее сообщение
                const chatSnap = await getDoc(doc(db, "chats", chatId));
                const chatData = chatSnap.data();
                const participants = chatData.participants || [];
                const otherId = participants.find(id => id !== currentUser.uid);

                const updateData = {
                    lastMessage: '🎤 Голосовое сообщение',
                    lastMessageTime: new Date(),
                    lastMessageAuthor: currentUser.uid
                };

                if (otherId) {
                    const currentCounts = chatData.unreadCounts || {};
                    updateData.unreadCounts = {
                        ...currentCounts,
                        [currentUser.uid]: 0,
                        [otherId]: (currentCounts[otherId] || 0) + 1
                    };
                }

                await updateDoc(doc(db, "chats", chatId), updateData);

                // Уведомление
                if (otherId) {
                    try {
                        await notifyAboutNewMessage(otherId, userName, '🎤 Голосовое сообщение', chatId);
                    } catch (err) {}
                }

                showNotification('✅ Голосовое сообщение отправлено', 'success');

            } catch (err) {
                console.error('Ошибка отправки голоса:', err);
                showNotification('❌ Не удалось отправить голосовое сообщение', 'error');
            }
        }

        // ===== АУДИО-ПЛЕЕР =====
        let currentAudio = null;
        let currentAudioElement = null;

        function playVoiceMessage(audioData, duration, element) {
            if (currentAudioElement && currentAudioElement !== element) {
                currentAudioElement.pause();
                currentAudioElement.currentTime = 0;
                const oldBtn = currentAudioElement.closest('.voice-message')?.querySelector('.voice-play-btn');
                if (oldBtn) {
                    oldBtn.classList.remove('playing');
                    oldBtn.innerHTML = '<i class="fas fa-play"></i>';
                }
            }

            if (currentAudioElement === element && !element.paused) {
                element.pause();
                const btn = element.closest('.voice-message')?.querySelector('.voice-play-btn');
                if (btn) {
                    btn.classList.remove('playing');
                    btn.innerHTML = '<i class="fas fa-play"></i>';
                }
                currentAudioElement = null;
                return;
            }

            if (currentAudioElement === element && element.paused) {
                element.play();
                const btn = element.closest('.voice-message')?.querySelector('.voice-play-btn');
                if (btn) {
                    btn.classList.add('playing');
                    btn.innerHTML = '<i class="fas fa-pause"></i>';
                }
                return;
            }

            try {
                const binaryString = atob(audioData);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                const blob = new Blob([bytes], { type: 'audio/webm' });
                const url = URL.createObjectURL(blob);

                const audio = new Audio(url);
                audioElement = audio;
                currentAudioElement = audio;

                const btn = element.closest('.voice-message')?.querySelector('.voice-play-btn');
                
                audio.onplay = () => {
                    if (btn) {
                        btn.classList.add('playing');
                        btn.innerHTML = '<i class="fas fa-pause"></i>';
                    }
                };

                audio.onpause = () => {
                    if (btn) {
                        btn.classList.remove('playing');
                        btn.innerHTML = '<i class="fas fa-play"></i>';
                    }
                };

                audio.onended = () => {
                    if (btn) {
                        btn.classList.remove('playing');
                        btn.innerHTML = '<i class="fas fa-play"></i>';
                    }
                    currentAudioElement = null;
                    URL.revokeObjectURL(url);
                };

                audio.onerror = () => {
                    showNotification('❌ Ошибка воспроизведения', 'error');
                    if (btn) {
                        btn.classList.remove('playing');
                        btn.innerHTML = '<i class="fas fa-play"></i>';
                    }
                    currentAudioElement = null;
                    URL.revokeObjectURL(url);
                };

                audio.play();
                currentAudio = audio;

            } catch (err) {
                console.error('Ошибка воспроизведения:', err);
                showNotification('❌ Не удалось воспроизвести голосовое сообщение', 'error');
            }
        }

        // ===== ОСНОВНАЯ ЗАГРУЗКА =====
        async function loadChat() {
            const params = new URLSearchParams(window.location.search);
            chatId = params.get('id');
            
            if (!chatId) {
                document.getElementById('chatName').innerText = 'Чат не найден';
                document.querySelector('.chat-input-area').style.display = 'none';
                return;
            }

            const chatRef = doc(db, "chats", chatId);
            const chatSnap = await getDoc(chatRef);
            
            if (!chatSnap.exists()) {
                document.getElementById('chatName').innerText = 'Чат не найден';
                document.querySelector('.chat-input-area').style.display = 'none';
                return;
            }
            
            const chatData = chatSnap.data();
            const participants = chatData.participants || [];
            
            if (!currentUser || !participants.includes(currentUser.uid)) {
                document.getElementById('chatName').innerText = 'Нет доступа';
                document.querySelector('.chat-input-area').style.display = 'none';
                document.getElementById('messagesArea').innerHTML = '<div class="empty-chat"><i class="fas fa-lock"></i><p>Нет доступа</p></div>';
                return;
            }
            
            try {
                const currentCounts = chatData.unreadCounts || {};
                if (currentCounts[currentUser.uid] > 0) {
                    const updateData = {};
                    updateData[`unreadCounts.${currentUser.uid}`] = 0;
                    await updateDoc(chatRef, updateData);
                }
            } catch (err) {}
            
            otherUserId = participants.find(id => id !== currentUser.uid);
            
            if (otherUserId) {
                try {
                    const userDoc = await getDoc(doc(db, "fighters", otherUserId));
                    if (userDoc.exists()) {
                        otherUserData = userDoc.data();
                        document.getElementById('chatName').innerText = otherUserData.name || 'Боец';
                        document.getElementById('chatAvatar').src = otherUserData.avatar || 'Avatar.png';
                        
                        const badge = document.getElementById('chatPremiumBadge');
                        if (otherUserData.premium === true) {
                            badge.style.display = 'inline-flex';
                        } else {
                            badge.style.display = 'none';
                        }
                        
                        let isOnline = false;
                        if (otherUserData.lastSeen) {
                            const lastSeen = otherUserData.lastSeen.toDate();
                            isOnline = (new Date() - lastSeen) < 5 * 60 * 1000;
                        }
                        otherUserData.online = isOnline;
                        otherUserData.lastSeenText = isOnline ? 'В сети' : 'был(а) недавно';
                        
                        const statusText = document.getElementById('statusText');
                        if (isOnline) {
                            statusText.innerHTML = '<span class="online">● В сети</span>';
                        } else {
                            statusText.textContent = 'был(а) недавно';
                        }
                    }
                } catch (err) {
                    console.warn('Ошибка загрузки данных собеседника:', err);
                }
            }
            
            listenTyping();
            
            const messagesRef = collection(db, "chats", chatId, "messages");
            const q = query(messagesRef, orderBy("createdAt", "asc"));
            
            if (unsubscribe) unsubscribe();
            unsubscribe = onSnapshot(q, (snapshot) => {
                const container = document.getElementById('messagesArea');
                if (snapshot.empty) {
                    container.innerHTML = `
                        <div class="empty-chat">
                            <i class="fas fa-comment-dots"></i>
                            <p>Напишите первое сообщение!</p>
                        </div>
                    `;
                    return;
                }
                
                let html = '';
                let lastDate = null;
                const otherAvatar = document.getElementById('chatAvatar').src || 'Avatar.png';
                
                snapshot.forEach(doc => {
                    const msg = doc.data();
                    const isOwn = msg.from === currentUser?.uid;

                            html += `<div class="message-date">${dateStr}</div>`;
                            lastDate = dateStr;
                        }

                    }
                    
                    const timeStr = msgDate ? 
                        `${msgDate.getHours().toString().padStart(2,'0')}:${msgDate.getMinutes().toString().padStart(2,'0')}` : '';
                    
                    const messageId = doc.id;
                    const messageAuthor = escapeHtml(msg.fromName || 'Соперник');
                    
                    let contentHtml = '';
                    
                    // Голосовое сообщение
                    if (msg.type === 'voice' && msg.voiceData) {

                        const isVoiceOwn = isOwn;

                            seed = (seed * 9301 + 49297) % 233280;
                            const height = 4 + (seed % 233280) / 233280 * 20;
                            randomHeights.push(height);

                    const textContent = msg.type === 'voice' ? '🎤 Голосовое сообщение' : escapeHtml(msg.text || '');
                    
                    html += `
                        <div class="message ${isOwn ? 'own' : 'other'}" 
                             data-message-id="${messageId}" 
                             data-message-text="${textContent}"
                             data-message-author="${messageAuthor}"
                             data-is-voice="${isVoice}">
                            ${avatarHtml}
                            <div class="msg-content">
                                ${senderName}
                                ${replyHtml}
                                ${contentHtml}
                            </div>
                        </div>
                    `;
                });
                
                container.innerHTML = html;
                container.scrollTop = container.scrollHeight;
                
                // ===== ОБРАБОТЧИКИ =====
                // Контекстное меню
                document.querySelectorAll('.message').forEach(msgEl => {
                    msgEl.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        showMessageMenu(e, msgEl);
                    });
                    
                    let longPressTimer = null;
                    msgEl.addEventListener('touchstart', (e) => {
                        longPressTimer = setTimeout(() => {
                            const touch = e.touches[0];
                            const fakeEvent = { clientX: touch.clientX, clientY: touch.clientY };
                            showMessageMenu(fakeEvent, msgEl);
                            e.preventDefault();
                        }, 500);
                    }, { passive: true });
                    
                    msgEl.addEventListener('touchend', () => clearTimeout(longPressTimer));
                    msgEl.addEventListener('touchmove', () => clearTimeout(longPressTimer));
                });
                
                // ===== ВОСПРОИЗВЕДЕНИЕ ГОЛОСА =====
                document.querySelectorAll('.voice-message').forEach(voiceEl => {
                    const playBtn = voiceEl.querySelector('.voice-play-btn');
                    const voiceData = voiceEl.dataset.voiceData;
                    const duration = parseInt(voiceEl.dataset.voiceDuration) || 5;
                    
                    playBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const audioEl = voiceEl.querySelector('audio');
                        if (audioEl) {
                            playVoiceMessage(voiceData, duration, audioEl);
                            return;
                        }
                        
                        // Создаём аудио элемент и проигрываем
                        try {
                            const binaryString = atob(voiceData);
                            const bytes = new Uint8Array(binaryString.length);
                            for (let i = 0; i < binaryString.length; i++) {
                                bytes[i] = binaryString.charCodeAt(i);
                            }
                            const blob = new Blob([bytes], { type: 'audio/webm' });
                            const url = URL.createObjectURL(blob);
                            
                            const audio = new Audio(url);
                            audio.dataset.voiceData = voiceData;
                            
                            const bars = voiceEl.querySelectorAll('.bar');
                            
                            audio.onplay = () => {
                                playBtn.classList.add('playing');
                                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                                bars.forEach((bar, i) => {
                                    setTimeout(() => bar.classList.add('active'), i * 50);
                                });
                            };
                            
                            audio.onpause = () => {
                                playBtn.classList.remove('playing');
                                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                                bars.forEach(bar => bar.classList.remove('active'));
                            };
                            
                            audio.onended = () => {
                                playBtn.classList.remove('playing');
                                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                                bars.forEach(bar => bar.classList.remove('active'));
                                URL.revokeObjectURL(url);
                            };
                            
                            audio.onerror = () => {
                                showNotification('❌ Ошибка воспроизведения', 'error');
                                playBtn.classList.remove('playing');
                                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                                bars.forEach(bar => bar.classList.remove('active'));
                                URL.revokeObjectURL(url);
                            };
                            
                            // Останавливаем предыдущий
                            if (currentAudioElement) {
                                currentAudioElement.pause();
                                currentAudioElement.currentTime = 0;
                                const oldBtn = currentAudioElement.closest('.voice-message')?.querySelector('.voice-play-btn');
                                if (oldBtn) {
                                    oldBtn.classList.remove('playing');
                                    oldBtn.innerHTML = '<i class="fas fa-play"></i>';
                                }
                            }
                            
                            audio.play();
                            currentAudioElement = audio;
                            
                            // Сохраняем аудио в voiceEl для повторного использования
                            voiceEl.querySelector('audio')?.remove();
                            voiceEl.appendChild(audio);
                            
                        } catch (err) {
                            console.error('Ошибка:', err);
                            showNotification('❌ Не удалось воспроизвести', 'error');
                        }
                    });
                });
            });
            
            document.querySelector('.chat-input-area').style.display = 'flex';
            setupSwipeReply();
        }

        // ===== ОТПРАВКА ТЕКСТА =====
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (!text || !currentUser || !chatId) return;
            
            let userName = 'Пользователь';
            try {
                const fighterDoc = await getDoc(doc(db, "fighters", currentUser.uid));
                if (fighterDoc.exists()) userName = fighterDoc.data()?.name || 'Боец';
            } catch (err) {}
            
            const messagesRef = collection(db, "chats", chatId, "messages");
            const messageData = {
                from: currentUser.uid,
                fromName: userName,
                text: text,
                type: 'text',
                createdAt: new Date()
            };
            
            if (currentReplyTo) {
                messageData.replyTo = {
                    messageId: currentReplyTo.id,
                    text: currentReplyTo.text.substring(0, 100),
                    fromName: currentReplyTo.fromName
                };
                cancelReply();
            }
            
            await addDoc(messagesRef, messageData);

            const chatSnap = await getDoc(doc(db, "chats", chatId));
            const chatData = chatSnap.data();
            const participants = chatData.participants || [];
            const otherId = participants.find(id => id !== currentUser.uid);

            if (otherId) {
                try {
                    await notifyAboutNewMessage(otherId, userName, text, chatId);
                } catch (err) {}
            }
            
            const updateData = {
                lastMessage: text.substring(0, 100),
                lastMessageTime: new Date(),
                lastMessageAuthor: currentUser.uid
            };
            
            if (otherId) {
                const currentCounts = chatData.unreadCounts || {};
                updateData.unreadCounts = {
                    ...currentCounts,
                    [currentUser.uid]: 0,
                    [otherId]: (currentCounts[otherId] || 0) + 1
                };
            }
            
            await updateDoc(doc(db, "chats", chatId), updateData);
            
            input.value = '';
            input.focus();
            isTyping = false;
        }

        // ===== УВЕДОМЛЕНИЯ =====
        function showNotification(message, type = 'info') {
            const container = document.getElementById('errorContainer');
            if (!container) return;
            const colors = { success: '#22c55e', error: '#ef4444', warning: '#f59e0b', info: '#fbbf24' };
            container.style.display = 'block';
            container.style.background = colors[type] || colors.info;
            container.style.color = '#000';
            container.textContent = message;
            clearTimeout(container._timeout);
            container._timeout = setTimeout(() => { container.style.display = 'none'; }, 3000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
        }

        // ===== ОБРАБОТЧИКИ =====
        document.getElementById('messageInput').addEventListener('input', handleTyping);
        document.getElementById('messageInput').addEventListener('keydown', () => {
            if (!isTyping) handleTyping();
        });

        // Голосовая кнопка
        voiceBtn.addEventListener('click', async () => {
            if (isRecording) {
                if (mediaRecorder && mediaRecorder.state === 'recording') {
                    mediaRecorder.stop();
                }
            } else {
                await startRecording();
            }
        });

        // ===== АВТОРИЗАЦИЯ =====
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                loadChat();
            } else {
                document.getElementById('chatName').innerText = 'Войдите';
                document.querySelector('.chat-input-area').style.display = 'none';
                document.getElementById('messagesArea').innerHTML = 
                    '<div class="empty-chat"><i class="fas fa-lock"></i><p>Войдите в аккаунт</p></div>';
            }
        });

        // ===== ОБРАБОТЧИКИ КНОПОК =====
        document.getElementById('backBtn').addEventListener('click', goBack);
        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('cancelReplyBtn').addEventListener('click', cancelReply);
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        console.log('✅ Чат с голосовыми сообщениями загружен');
    </script>
