<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PRORANK">
    <meta name="theme-color" content="#fbbf24">
    <meta name="mobile-web-app-capable" content="yes">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#fbbf24">
    <meta name="description" content="Избранные товары на PRORANK">
    <title>Избранное | PRORANK</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(ellipse at 30% 40%, rgba(251, 191, 36, 0.15) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 80%, rgba(251, 191, 36, 0.08) 0%, transparent 50%),
                        linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 40%, #1a1a1a 100%);
            background-attachment: fixed;
            color: #fff;
            line-height: 1.4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        main { flex: 1; }
        
        .gold-top { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 3px; 
            background: linear-gradient(90deg, #fbbf24, #ffdd88, #fbbf24, #b8860b); 
            z-index: 1001; 
        }
        
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 0 24px; 
            position: relative; 
            z-index: 2;
            width: 100%;
        }
        
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(251, 191, 36, 0.25);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        
        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            cursor: pointer;
            background: linear-gradient(135deg, #ffffff, #fbbf24);
            background-clip: text;
            color: transparent;
            transition: transform 0.2s ease;
        }
        
        .logo:hover { transform: scale(1.02); }
        .logo span { background: linear-gradient(135deg, #fbbf24, #ffdd77); background-clip: text; color: transparent; }
        
        .balance-indicator {
            background: #111;
            border: 1px solid rgba(251,191,36,0.5);
            border-radius: 60px;
            padding: 7px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 0.9rem;
        }
        
        .balance-count { color: #fbbf24; }
        
        .balance-plus {
            background: rgba(251,191,36,0.15);
            border: none;
            color: #fbbf24;
            cursor: pointer;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            transition: all 0.2s ease;
        }
        
        .balance-plus:hover {
            background: rgba(251,191,36,0.3);
            transform: scale(1.05);
        }
        
        .balance-plus:active { 
            background: #fbbf24; 
            color: #000;
            transform: scale(0.95);
        }
        
        .menu-toggle { 
            display: none; 
            background: rgba(251,191,36,0.1); 
            border: 1px solid #fbbf24; 
            color: #fbbf24; 
            font-size: 1.6rem; 
            cursor: pointer; 
            padding: 8px 14px; 
            border-radius: 12px;
            transition: all 0.2s ease;
            min-height: 44px;
            min-width: 44px;
        }
        
        .menu-toggle:hover {
            background: rgba(251,191,36,0.2);
            transform: scale(1.02);
        }
        
        .menu-toggle:active { transform: scale(0.95); }
        
        .nav-links {
            display: flex;
            gap: 6px;
            background: rgba(15,15,15,0.7);
            backdrop-filter: blur(12px);
            padding: 5px 14px;
            border-radius: 60px;
            border: 1px solid rgba(251,191,36,0.2);
        }
        
        .nav-links a { 
            color: #ddd; 
            text-decoration: none; 
            font-size: 0.9rem; 
            font-weight: 500; 
            padding: 8px 18px; 
            border-radius: 40px; 
            transition: all 0.2s ease;
        }
        
        .nav-links a i { margin-right: 8px; color: #fbbf24; }
        .nav-links a:hover { color: #fbbf24; background: rgba(251,191,36,0.1); }
        
        /* ===== ХЛЕБНЫЕ КРОШКИ ===== */
        .breadcrumb {
            margin: 20px 0 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 0.85rem;
        }
        
        .breadcrumb a {
            color: #aaa;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        
        .breadcrumb a:hover { color: #fbbf24; transform: translateX(2px); }
        .breadcrumb .current { color: #fbbf24; }
        .breadcrumb .separator { color: #444; }
        
        .back-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(251,191,36,0.3);
            color: #fff;
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            min-height: 38px;
        }
        
        .back-btn:hover {
            background: rgba(251,191,36,0.2);
            color: #fbbf24;
            transform: translateX(-2px);
        }
        
        .back-btn:active { transform: translateX(-1px) scale(0.97); }
        
        /* ===== ЗАГОЛОВОК ===== */
        .page-header {
            text-align: center;
            padding: 20px 20px 20px;
            animation: fadeInUp 0.5s ease;
        }
        
        .page-header h1 { 
            font-size: clamp(1.5rem, 5vw, 1.8rem); 
            font-weight: 800; 
            background: linear-gradient(135deg, #fff, #fbbf24); 
            background-clip: text; 
            color: transparent; 
        }

        .page-header h1 i {
            color: #ef4444;
            background: none;
            -webkit-text-fill-color: #ef4444;
        }

        /* ===== СЧЁТЧИК ===== */
        .favorites-counter {
            font-size: 0.75rem;
            color: #666;
            margin-bottom: 12px;
            padding: 0 4px;
            text-align: center;
        }
        .favorites-counter span { color: #fbbf24; font-weight: 600; }

        /* ===== СКЕЛЕТОНЫ ===== */
        .skeleton-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
            margin: 16px 0 24px;
        }

        .skeleton-card {
            background: rgba(15,15,15,0.5);
            border-radius: 16px;
            padding: 12px;
            animation: pulse 1.5s ease-in-out infinite;
            border: 1px solid rgba(255,255,255,0.03);
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .skeleton-card .skeleton-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: rgba(255,255,255,0.06);
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .skeleton-card .skeleton-line {
            height: 12px;
            background: rgba(255,255,255,0.06);
            border-radius: 8px;
            margin-bottom: 8px;
            width: 100%;
        }

        .skeleton-card .skeleton-line.short {
            width: 60%;
            height: 10px;
        }

        .skeleton-card .skeleton-line.medium {
            width: 80%;
            height: 10px;
        }

        .skeleton-card .skeleton-line.price {
            width: 40%;
            height: 16px;
            margin-top: 4px;
        }

        .skeleton-card .skeleton-line.button {
            width: 100%;
            height: 36px;
            border-radius: 40px;
            margin-top: 6px;
        }

        .skeleton-card .skeleton-line.stars {
            width: 50%;
            height: 10px;
            margin: 6px 0;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ===== ТОВАРЫ ===== */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
            margin: 16px 0 24px;
        }
        
        .product-card {
            background: rgba(15,15,15,0.5);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 12px;
            border: 1px solid rgba(251,191,36,0.06);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            animation: fadeInUp 0.4s ease both;
        }
        
        .product-card:hover { 
            transform: translateY(-5px); 
            border-color: rgba(251,191,36,0.25);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .product-card:active { transform: translateY(-2px); }

        .product-card:nth-child(1) { animation-delay: 0.05s; }
        .product-card:nth-child(2) { animation-delay: 0.1s; }
        .product-card:nth-child(3) { animation-delay: 0.15s; }
        .product-card:nth-child(4) { animation-delay: 0.2s; }
        .product-card:nth-child(5) { animation-delay: 0.25s; }
        .product-card:nth-child(6) { animation-delay: 0.3s; }
        .product-card:nth-child(7) { animation-delay: 0.35s; }
        .product-card:nth-child(8) { animation-delay: 0.4s; }
        
        .product-image-wrap {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            overflow: hidden;
            background: #1a1a1a;
            position: relative;
            margin-bottom: 10px;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .product-card:hover .product-image {
            transform: scale(1.04);
        }
        
        /* ===== БЕЙДЖИ ===== */
        .product-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 3px 10px;
            border-radius: 30px;
            font-size: 0.55rem;
            font-weight: 600;
            z-index: 2;
        }

        .badge-hit {
            background: rgba(239,68,68,0.9);
            color: #fff;
        }

        .badge-sale {
            background: rgba(251,191,36,0.9);
            color: #000;
        }

        .badge-new {
            background: rgba(16,185,129,0.9);
            color: #fff;
        }
        
        .product-favorite {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            border: none;
            color: #ef4444;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
        }
        
        .product-favorite:hover { transform: scale(1.1); background: rgba(0,0,0,0.7); }
        
        .product-rating {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 4px 0;
            font-size: 0.7rem;
        }
        
        .stars { color: #fbbf24; letter-spacing: 1px; }
        .rating-count { color: #666; font-size: 0.6rem; }
        
        .product-title { 
            font-size: 0.85rem; 
            font-weight: 600; 
            color: #eee;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 38px;
            line-height: 1.3;
        }
        
        .product-store { 
            font-size: 0.6rem; 
            color: #666; 
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .product-store i { 
            color: #fbbf24;
            font-size: 0.5rem;
        }

        .product-price-block {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 4px 0 8px;
            flex-wrap: wrap;
        }
        
        .product-price { 
            font-size: 1rem; 
            font-weight: 700; 
            color: #fbbf24;
        }

        .product-old-price {
            font-size: 0.7rem;
            color: #555;
            text-decoration: line-through;
        }

        /* ===== КНОПКИ ===== */
        .product-actions {
            display: flex;
            gap: 8px;
            margin-top: auto;
            flex-wrap: wrap;
        }

        .btn-add-to-cart {
            background: #fbbf24;
            color: #000;
            border: none;
            padding: 8px 12px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.7rem;
            cursor: pointer;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.2s ease;
            min-height: 36px;
            font-family: 'Inter', sans-serif;
        }
        
        .btn-add-to-cart:hover {
            background: #ffdd44;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(251,191,36,0.25);
        }
        
        .btn-add-to-cart:active { transform: scale(0.96); }

        .btn-buy-now {
            background: rgba(251,191,36,0.12);
            color: #fbbf24;
            border: 1px solid rgba(251,191,36,0.12);
            padding: 8px 12px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 5px;
            min-height: 36px;
            white-space: nowrap;
            flex: 1;
        }

        .btn-buy-now:hover {
            background: rgba(251,191,36,0.2);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(251,191,36,0.1);
        }

        .btn-buy-now:active {
            transform: scale(0.95);
        }

        .btn-buy-now i {
            font-size: 0.7rem;
        }

        /* ===== УДАЛИТЬ ИЗ ИЗБРАННОГО ===== */
        .btn-remove-fav {
            background: rgba(220,38,38,0.1);
            color: #dc2626;
            border: 1px solid rgba(220,38,38,0.15);
            padding: 8px 12px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.65rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 4px;
            min-height: 36px;
            white-space: nowrap;
            flex: 0 0 auto;
        }

        .btn-remove-fav:hover {
            background: rgba(220,38,38,0.2);
            transform: translateY(-2px);
        }

        .btn-remove-fav:active {
            transform: scale(0.95);
        }

        /* ===== ПУСТОЕ СОСТОЯНИЕ ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
            grid-column: 1 / -1;
        }

        .empty-state i {
            font-size: 3.5rem;
            margin-bottom: 16px;
            color: #2a2a2a;
        }

        .empty-state h3 {
            color: #ccc;
            font-size: 1.2rem;
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 0.9rem;
            color: #666;
        }

        .empty-state a {
            color: #fbbf24;
            text-decoration: none;
            display: inline-block;
            margin-top: 12px;
            padding: 10px 28px;
            border-radius: 40px;
            background: rgba(251,191,36,0.1);
            border: 1px solid rgba(251,191,36,0.15);
            transition: all 0.2s ease;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .empty-state a:hover {
            background: rgba(251,191,36,0.2);
            transform: translateY(-2px);
        }

        /* ===== ФУТЕР ===== */
        .main-footer {
            background: #0a0a0a;
            border-top: 1px solid rgba(251,191,36,0.15);
            margin-top: 40px;
            padding: 30px 0 20px;
        }
        
        .footer-inner { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 20px; 
            margin-bottom: 20px; 
        }
        
        .footer-logo .logo { font-size: 1.2rem; display: inline-block; }
        .footer-logo p { font-size: 0.65rem; color: #777; margin-top: 4px; }
        .footer-social { display: flex; gap: 16px; }
        
        .social-icon { 
            color: #aaa; 
            font-size: 1.1rem; 
            transition: all 0.2s ease;
        }
        
        .social-icon:hover { 
            color: #fbbf24;
            transform: translateY(-3px);
        }
        
        .footer-links { display: flex; gap: 16px; flex-wrap: wrap; }
        .footer-links a { color: #888; text-decoration: none; font-size: 0.7rem; transition: color 0.2s ease; }
        .footer-links a:hover { color: #fbbf24; }
        .footer-bottom { text-align: center; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.05); font-size: 0.6rem; color: #555; }
        
        @media (max-width: 640px) {
            .footer-inner { flex-direction: column; text-align: center; }
        }

        /* ===== АНИМАЦИИ ===== */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 768px) {
            .navbar { padding: 12px 18px; }
            .menu-toggle { display: block; }
            .nav-links { 
                display: none; 
                flex-direction: column; 
                position: absolute; 
                top: 68px; 
                left: 18px; 
                right: 18px; 
                background: #0f0f0f; 
                border-radius: 24px; 
                padding: 20px; 
                gap: 10px; 
                border: 1px solid rgba(251,191,36,0.3); 
                z-index: 1000; 
                backdrop-filter: blur(20px);
            }
            .nav-links.show { display: flex; animation: fadeIn 0.2s ease; }
            .nav-links a { width: 100%; text-align: center; padding: 12px; }
            .container { padding: 0 16px; }

            .products-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .product-card {
                padding: 10px;
            }

            .product-title {
                font-size: 0.75rem;
                min-height: 32px;
            }

            .product-price {
                font-size: 0.85rem;
            }

            .product-actions {
                flex-direction: column;
                gap: 6px;
            }

            .btn-add-to-cart {
                font-size: 0.65rem;
                padding: 6px 10px;
                min-height: 32px;
            }

            .btn-buy-now {
                font-size: 0.6rem;
                padding: 6px 10px;
                min-height: 32px;
                justify-content: center;
            }

            .btn-remove-fav {
                font-size: 0.6rem;
                padding: 6px 10px;
                min-height: 32px;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .products-grid { gap: 8px; }
            .product-card { padding: 8px; }
            .product-title { font-size: 0.65rem; }
            .product-price { font-size: 0.75rem; }
            .product-old-price { font-size: 0.55rem; }
            .product-rating { font-size: 0.6rem; }
            .stars { letter-spacing: 0.5px; }
            .product-favorite { width: 26px; height: 26px; font-size: 0.7rem; top: 6px; right: 6px; }
            .product-badge { font-size: 0.45rem; padding: 2px 8px; top: 6px; left: 6px; }
            .btn-add-to-cart { font-size: 0.55rem; padding: 5px 8px; min-height: 28px; }
            .btn-buy-now { font-size: 0.5rem; padding: 5px 8px; min-height: 28px; }
            .btn-remove-fav { font-size: 0.5rem; padding: 5px 8px; min-height: 28px; }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #fbbf24; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="gold-top"></div>

    <header class="navbar">
        <div class="logo" onclick="window.location='index.html'">PRO<span>RANK</span></div>
        <div class="balance-indicator" id="balanceIndicator" style="display: none;">
            <i class="fas fa-crosshairs"></i>
            <span class="balance-count" id="headerChallengesCount">0</span>
            <button class="balance-plus" id="balancePlusBtn">+</button>
        </div>
        <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
        <nav class="nav-links" id="navLinks"></nav>
    </header>

    <main class="container">
        <!-- ===== ХЛЕБНЫЕ КРОШКИ С КНОПКОЙ НАЗАД ===== -->
        <div class="breadcrumb">
            <button class="back-btn" id="backBtn"><i class="fas fa-arrow-left"></i> Назад</button>
            <span class="separator">/</span>
            <a href="catalog.html">Каталог</a>
            <span class="separator">/</span>
            <span class="current">Избранное</span>
        </div>

        <!-- ===== ЗАГОЛОВОК ===== -->
        <div class="page-header">
            <h1><i class="fas fa-heart"></i> Избранное</h1>
        </div>

        <!-- ===== СЧЁТЧИК ===== -->
        <div class="favorites-counter">❤️ В избранном: <span id="favoritesCount">0</span> товаров</div>

        <!-- ===== ТОВАРЫ ===== -->
        <div id="favoritesGrid" class="products-grid">
            <!-- Скелетоны будут вставлены через JS -->
        </div>
    </main>

                    <a href="#" target="_blank" class="social-icon"><i class="fab fa-instagram"></i></a>

    <div id="mobileBottomNavContainer"></div>

    <!-- УВЕДОМЛЕНИЕ -->
    <div id="errorContainer" style="position: fixed; top: 15px; left: 50%; transform: translateX(-50%); z-index: 9999; max-width: 90%; width: 480px; padding: 14px 20px; border-radius: 16px; font-weight: 600; font-size: 0.9rem; animation: slideDown 0.3s ease; box-shadow: 0 10px 30px rgba(0,0,0,0.4); backdrop-filter: blur(8px); display: none; text-align: center; border: 1px solid rgba(255,255,255,0.1);"></div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js"
            }
        }
    </script>
    <script type="module" src="header.js"></script>
    <script type="module">
    import { initializeApp } from "firebase/app";
    import { getFirestore, collection, getDocs, doc, getDoc, deleteDoc } from "firebase/firestore";
    import { getAuth, onAuthStateChanged } from "firebase/auth";

    const firebaseConfig = {
        apiKey: "AIzaSyDUGYJY7pX7q02MS5SACMIIQXpjpQ97mPw",
        authDomain: "proranklive.firebaseapp.com",
        projectId: "proranklive",
        storageBucket: "proranklive.firebasestorage.app",
        messagingSenderId: "716836144015",
        appId: "1:716836144015:web:f1575147750608d0f881fa"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUser = null;
    let favoriteProducts = [];
    let allPartners = [];

    // ===== УВЕДОМЛЕНИЯ =====
    function showNotification(message, type = 'success') {
        const container = document.getElementById('errorContainer');
        if (!container) return;
        const colors = { success: '#22c55e', error: '#ef4444', warning: '#f59e0b', info: '#fbbf24' };
        container.style.display = 'block';
        container.style.background = colors[type] || colors.info;
        container.style.color = '#000';
        container.textContent = message;
        clearTimeout(container._timeout);
        container._timeout = setTimeout(() => { container.style.display = 'none'; }, 3000);
    }

    // ===== СКЕЛЕТОНЫ =====
    function renderSkeletons() {
        const container = document.getElementById('favoritesGrid');
        let html = '<div class="skeleton-grid">';
        for (let i = 0; i < 8; i++) {
            html += `
                <div class="skeleton-card">
                    <div class="skeleton-image"></div>
                    <div class="skeleton-line"></div>
                    <div class="skeleton-line stars"></div>
                    <div class="skeleton-line medium"></div>
                    <div class="skeleton-line short"></div>
                    <div class="skeleton-line price"></div>
                    <div class="skeleton-line button"></div>
                </div>
            `;
        }
        html += '</div>';
        container.innerHTML = html;
    }

    // ===== ПАРТНЁРЫ =====
    async function loadPartners() {
        try {
            const snapshot = await getDocs(collection(db, "partners"));
            allPartners = snapshot.docs.map(doc => ({ id: doc.id, name: doc.data().name }));
        } catch (err) {
            console.error('Ошибка загрузки магазинов:', err);
        }
    }

    function getStoreName(partnerId) {
        if (!partnerId) return 'Магазин';
        const partner = allPartners.find(p => p.id === partnerId);
        return partner ? partner.name : 'Магазин';
    }

    // ===== ЗАГРУЗКА ИЗБРАННОГО =====
    async function loadFavorites() {
        if (!currentUser) {
            document.getElementById('favoritesGrid').innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-lock"></i>
                    <h3>Требуется авторизация</h3>
                    <p>Войдите, чтобы увидеть избранные товары</p>
                    <a href="login.html"><i class="fas fa-sign-in-alt"></i> Войти</a>
                </div>
            `;
            return;
        }

        renderSkeletons();
        
        try {
            const favRef = collection(db, "users", currentUser.uid, "favorites");
            const snapshot = await getDocs(favRef);
            const favoriteIds = snapshot.docs.map(d => d.id);
            
            if (favoriteIds.length === 0) {
                document.getElementById('favoritesGrid').innerHTML = `
                    <div class="empty-state">
                        <i class="far fa-heart"></i>
                        <h3>Избранное пусто</h3>
                        <p>Добавляйте товары в избранное, чтобы не потерять их</p>
                        <a href="catalog.html"><i class="fas fa-store"></i> Перейти в каталог</a>
                    </div>
                `;
                document.getElementById('favoritesCount').textContent = '0';
                return;
            }

            const products = [];
            for (const id of favoriteIds) {
                const docRef = doc(db, "products", id);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    products.push({ id: docSnap.id, ...docSnap.data() });
                }
            }

            favoriteProducts = products;
            document.getElementById('favoritesCount').textContent = products.length;
            renderProducts(products);

        } catch (err) {
            console.error('Ошибка загрузки избранного:', err);
            document.getElementById('favoritesGrid').innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-exclamation-triangle"></i>
                    <h3>Ошибка загрузки</h3>
                    <p>Не удалось загрузить избранное. Попробуйте позже.</p>
                </div>
            `;
        }
    }

    // ===== РЕНДЕР ТОВАРОВ =====
    function renderProducts(products) {
        const container = document.getElementById('favoritesGrid');
        if (products.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="far fa-heart"></i>
                    <h3>Избранное пусто</h3>
                    <p>Добавляйте товары в избранное, чтобы не потерять их</p>
                    <a href="catalog.html"><i class="fas fa-store"></i> Перейти в каталог</a>
                </div>
            `;
            return;
        }

        let html = '';
        products.forEach(product => {
            const stars = '★'.repeat(Math.round(product.rating || 0)) + '☆'.repeat(5 - Math.round(product.rating || 0));
            const storeName = getStoreName(product.partnerId);
            
            const productForCart = {
                id: product.id,
                name: product.name,
                price: product.price,
                image: product.image,
                desc: product.desc || '',
                partnerId: product.partnerId || null,
                partnerName: storeName || null
            };
            
            let badgeHtml = '';
            if (product.badge === 'hit') {
                badgeHtml = `<span class="product-badge badge-hit">🔥 Хит</span>`;
            } else if (product.badge === 'sale') {
                const discount = product.oldPrice ? Math.round((1 - product.price / product.oldPrice) * 100) : '';
                badgeHtml = `<span class="product-badge badge-sale">🔥 -${discount}%</span>`;
            } else if (product.badge === 'new') {
                badgeHtml = `<span class="product-badge badge-new">🆕 Новинка</span>`;
            }
            
            html += `
                <div class="product-card" data-product-id="${product.id}">
                    <div class="product-image-wrap">
                        ${product.image ? `<img src="${product.image}" class="product-image" onerror="this.src='https://placehold.co/300x200/1a1a1a/fbbf24?text=No+Image'">` : '<div class="product-image" style="display:flex;align-items:center;justify-content:center;"><i class="fas fa-image" style="font-size: 2rem; color: #555;"></i></div>'}
                        ${badgeHtml}
                        <button class="product-favorite" data-product-id="${product.id}">
                            <i class="fas fa-heart"></i>
                        </button>
                    </div>
                    <div class="product-title">${escapeHtml(product.name)}</div>
                    <div class="product-rating">
                        <span class="stars">${stars}</span>
                        <span class="rating-count">(${product.ratingCount || 0})</span>
                    </div>
                    <div class="product-store"><i class="fas fa-store"></i> ${escapeHtml(storeName)}</div>
                    <div class="product-price-block">
                        <span class="product-price">${(product.price || 0).toLocaleString()} ₽</span>
                        ${product.oldPrice ? `<span class="product-old-price">${product.oldPrice.toLocaleString()} ₽</span>` : ''}
                    </div>
                    <div class="product-actions">
                        <button class="btn-add-to-cart" data-product='${JSON.stringify(productForCart)}'><i class="fas fa-cart-plus"></i> В корзину</button>
                        <button class="btn-buy-now" data-product='${JSON.stringify(productForCart)}'><i class="fas fa-bolt"></i> Купить</button>
                        <button class="btn-remove-fav" data-product-id="${product.id}"><i class="fas fa-times"></i></button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
        attachHandlers();
    }

    function attachHandlers() {
        // Клик по карточке
        document.querySelectorAll('.product-card').forEach(card => {
            card.addEventListener('click', (e) => {
                if (e.target.closest('.btn') || e.target.closest('.product-favorite')) return;
                const productId = card.dataset.productId;
                const product = favoriteProducts.find(p => p.id === productId);
                if (product) {
                    showNotification(`📦 ${product.name}`, 'info');
                }
            });
        });

        // Удалить из избранного (кнопка)
        document.querySelectorAll('.btn-remove-fav').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const productId = btn.dataset.productId;
                await removeFromFavorites(productId);
            });
        });

        // Удалить из избранного (сердечко)
        document.querySelectorAll('.product-favorite').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const productId = btn.dataset.productId;
                await removeFromFavorites(productId);
            });
        });

        // В корзину
        document.querySelectorAll('.btn-add-to-cart').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (!currentUser) {
                    showNotification('Войдите в аккаунт', 'warning');
                    setTimeout(() => window.location.href = 'login.html', 1000);
                    return;
                }
                const product = JSON.parse(btn.dataset.product);
                let cart = JSON.parse(localStorage.getItem('cart') || '[]');
                cart.push({
                    id: product.id,
                    name: product.name,
                    price: product.price,
                    image: product.image,
                    desc: product.desc,
                    partnerId: product.partnerId,
                    partnerName: product.partnerName
                });
                localStorage.setItem('cart', JSON.stringify(cart));
                showNotification(`✅ ${product.name} добавлен в корзину`, 'success');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> Добавлено!';
                btn.style.background = '#10b981';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.background = '#fbbf24';
                }, 1200);
            });
        });

        // Быстрая покупка
        document.querySelectorAll('.btn-buy-now').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (!currentUser) {
                    showNotification('Войдите в аккаунт', 'warning');
                    setTimeout(() => window.location.href = 'login.html', 1000);
                    return;
                }
                const product = JSON.parse(btn.dataset.product);
                let cart = JSON.parse(localStorage.getItem('cart') || '[]');
                cart = [{
                    id: product.id,
                    name: product.name,
                    price: product.price,
                    image: product.image,
                    desc: product.desc,
                    partnerId: product.partnerId,
                    partnerName: product.partnerName
                }];
                localStorage.setItem('cart', JSON.stringify(cart));
                showNotification(`⚡ Быстрая покупка: ${product.name}`, 'success');
                setTimeout(() => {
                    window.location.href = 'cart.html';
                }, 800);
            });
        });
    }

    // ===== УДАЛЕНИЕ ИЗ ИЗБРАННОГО =====
    async function removeFromFavorites(productId) {
        if (!currentUser) {
            showNotification('Войдите в аккаунт', 'warning');
            return;
        }
        try {
            const favRef = doc(db, "users", currentUser.uid, "favorites", productId);
            await deleteDoc(favRef);
            favoriteProducts = favoriteProducts.filter(p => p.id !== productId);
            document.getElementById('favoritesCount').textContent = favoriteProducts.length;
            renderProducts(favoriteProducts);
            showNotification('❤️ Удалено из избранного', 'info');
        } catch (err) {
            console.error('Ошибка удаления из избранного:', err);
            showNotification('Ошибка', 'error');
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
    }

    // ===== БАЛАНС =====
    async function updateHeaderBalance() {
        const user = auth.currentUser;
        const balanceDiv = document.getElementById('balanceIndicator');
        const balanceCount = document.getElementById('headerChallengesCount');
        if (!user || !balanceDiv) return;
        try {
            const userDoc = await getDoc(doc(db, "fighters", user.uid));
            const data = userDoc.data();
            const total = (data.freeChallenges || 0) + (data.purchasedChallenges || 0);
            balanceCount.innerText = total;
            balanceDiv.style.display = 'flex';
        } catch (err) { console.error(err); }
    }

    // ===== ИНИЦИАЛИЗАЦИЯ =====
    onAuthStateChanged(auth, async (user) => {
        currentUser = user;
        if (user) {
            setTimeout(updateHeaderBalance, 1000);
        } else {
            const balanceDiv = document.getElementById('balanceIndicator');
            if (balanceDiv) balanceDiv.style.display = 'none';
        }
        await loadPartners();
        await loadFavorites();
    });

    // ===== КНОПКА НАЗАД =====
    document.getElementById('backBtn')?.addEventListener('click', () => {
        window.history.back();
    });

    const plusBtn = document.getElementById('balancePlusBtn');
    if (plusBtn) plusBtn.onclick = () => window.location.href = 'shop.html';

    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');
    if (menuToggle && navLinks) {
        menuToggle.addEventListener('click', () => navLinks.classList.toggle('show'));
        navLinks.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => navLinks.classList.remove('show'));
        });
    }

    console.log('✅ Страница избранного загружена');
    </script>
</body>
