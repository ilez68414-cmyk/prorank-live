<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="manifest" href="/prorank-live/manifest.json">
    <link rel="apple-touch-icon" href="/prorank-live/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PRORANK">
    <meta name="theme-color" content="#fbbf24">
    <meta name="mobile-web-app-capable" content="yes">
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://www.gstatic.com">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#fbbf24">
    <meta name="description" content="Избранные товары на PRORANK">
    <title>Избранное | PRORANK</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(ellipse at 30% 40%, rgba(251, 191, 36, 0.15) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 80%, rgba(251, 191, 36, 0.08) 0%, transparent 50%),
                        linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 40%, #1a1a1a 100%);
            background-attachment: fixed;
            color: #fff;
            line-height: 1.4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        main { flex: 1; }
        
        .gold-top { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 3px; 
            background: linear-gradient(90deg, #fbbf24, #ffdd88, #fbbf24, #b8860b); 
            z-index: 1001; 
        }
        
        .container { 
            max-width: 900px; 
            margin: 0 auto; 
            padding: 0 24px; 
            position: relative; 
            z-index: 2;
            width: 100%;
        }
        
        /* ===== ВЕРХНЯЯ ПАНЕЛЬ С КНОПКОЙ НАЗАД ===== */
        .top-nav {
            margin: 20px 0 10px;
            display: flex;
            align-items: center;
        }
        
        .back-arrow-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(251,191,36,0.15);
            color: #fbbf24;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            flex-shrink: 0;
        }
        
        .back-arrow-btn:hover {
            background: rgba(251,191,36,0.15);
            border-color: rgba(251,191,36,0.4);
            transform: translateX(-3px);
            box-shadow: 0 4px 15px rgba(251,191,36,0.1);
        }
        
        .back-arrow-btn:active {
            transform: translateX(-1px) scale(0.95);
        }
        
        /* ===== ЗАГОЛОВОК ===== */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 4px 0 20px;
        }
        
        .page-header h1 { 
            font-size: clamp(1.5rem, 4vw, 1.8rem); 
            font-weight: 800; 
            background: linear-gradient(135deg, #fff, #fbbf24); 
            background-clip: text; 
            color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-header h1 i {
            color: #ef4444;
            background: none;
            -webkit-text-fill-color: #ef4444;
        }

        .favorites-counter {
            font-size: 0.8rem;
            color: #888;
            background: rgba(15,15,15,0.6);
            padding: 6px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.06);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .favorites-counter i {
            color: #ef4444;
            font-size: 0.75rem;
        }

        .favorites-counter span {
            color: #fbbf24;
            font-weight: 600;
        }

        /* ===== СПИСОК ТОВАРОВ ===== */
        .favorites-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 30px;
        }

        .fav-item {
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(15,15,15,0.5);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 14px 18px;
            border: 1px solid rgba(251,191,36,0.06);
            transition: all 0.3s ease;
            animation: fadeInUp 0.4s ease both;
        }

        .fav-item:hover {
            border-color: rgba(251,191,36,0.15);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .fav-item:nth-child(1) { animation-delay: 0.05s; }
        .fav-item:nth-child(2) { animation-delay: 0.1s; }
        .fav-item:nth-child(3) { animation-delay: 0.15s; }
        .fav-item:nth-child(4) { animation-delay: 0.2s; }
        .fav-item:nth-child(5) { animation-delay: 0.25s; }

        /* ===== ФОТО СЛЕВА ===== */
        .fav-item-image {
            width: 80px;
            height: 80px;
            min-width: 80px;
            border-radius: 12px;
            object-fit: cover;
            background: #1a1a1a;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .fav-item-image:hover {
            transform: scale(1.04);
        }

        /* ===== ИНФОРМАЦИЯ ПОСЕРЕДИНЕ ===== */
        .fav-item-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .fav-item-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: #eee;
            cursor: pointer;
            transition: color 0.2s ease;
            line-height: 1.3;
        }

        .fav-item-name:hover {
            color: #fbbf24;
        }

        .fav-item-store {
            font-size: 0.65rem;
            color: #666;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .fav-item-store i {
            color: #fbbf24;
            font-size: 0.55rem;
        }

        .fav-item-price-block {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .fav-item-price {
            font-weight: 700;
            font-size: 1.05rem;
            color: #fbbf24;
        }

        .fav-item-old-price {
            font-size: 0.7rem;
            color: #555;
            text-decoration: line-through;
        }

        /* ===== ДЕЙСТВИЯ СПРАВА ===== */
        .fav-item-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn-add-to-cart {
            background: #fbbf24;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            min-height: 40px;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn-add-to-cart:hover {
            background: #ffdd44;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(251,191,36,0.25);
        }

        .btn-add-to-cart:active { transform: scale(0.96); }

        .btn-buy-now {
            background: rgba(251,191,36,0.12);
            color: #fbbf24;
            border: 1px solid rgba(251,191,36,0.15);
            padding: 8px 14px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 6px;
            min-height: 40px;
            white-space: nowrap;
        }

        .btn-buy-now:hover {
            background: rgba(251,191,36,0.2);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(251,191,36,0.1);
        }

        .btn-buy-now:active { transform: scale(0.95); }

        .btn-favorite {
            background: rgba(239,68,68,0.12);
            color: #ef4444;
            border: 1px solid rgba(239,68,68,0.15);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .btn-favorite:hover {
            background: rgba(239,68,68,0.2);
            transform: scale(1.08);
        }

        .btn-favorite:active { transform: scale(0.9); }

        .btn-favorite i {
            font-size: 0.95rem;
        }

        /* ===== ПУСТОЕ СОСТОЯНИЕ ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
            animation: fadeInUp 0.4s ease;
        }
        
        .empty-state i {
            font-size: 3.5rem;
            margin-bottom: 16px;
            color: #2a2a2a;
        }
        
        .empty-state h3 {
            color: #ccc;
            font-size: 1.1rem;
            margin-bottom: 6px;
        }
        
        .empty-state p {
            color: #666;
            font-size: 0.85rem;
        }

        /* ===== ФУТЕР ===== */
        .main-footer {
            background: #0a0a0a;
            border-top: 1px solid rgba(251,191,36,0.15);
            margin-top: 40px;
            padding: 30px 0 20px;
        }
        
        .footer-inner { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 20px; 
            margin-bottom: 20px; 
        }
        
        .footer-logo .logo { font-size: 1.2rem; display: inline-block; }
        .footer-logo p { font-size: 0.65rem; color: #777; margin-top: 4px; }
        .footer-social { display: flex; gap: 16px; }
        
        .social-icon { 
            color: #aaa; 
            font-size: 1.1rem; 
            transition: all 0.2s ease;
        }
        
        .social-icon:hover { 
            color: #fbbf24;
            transform: translateY(-3px);
        }
        
        .footer-links { display: flex; gap: 16px; flex-wrap: wrap; }
        .footer-links a { color: #888; text-decoration: none; font-size: 0.7rem; transition: color 0.2s ease; }
        .footer-links a:hover { color: #fbbf24; }
        .footer-bottom { text-align: center; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.05); font-size: 0.6rem; color: #555; }
        
        @media (max-width: 640px) {
            .footer-inner { flex-direction: column; text-align: center; }
        }

        /* ===== АНИМАЦИИ ===== */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 768px) {
            .navbar { padding: 12px 18px; }
            
            .nav-links.show { display: flex; animation: fadeIn 0.2s ease; }
            
            .container { padding: 0 16px; }

            .fav-item {
                padding: 12px 14px;
                gap: 12px;
                flex-wrap: wrap;
            }
            
            .fav-item-image {
                width: 64px;
                height: 64px;
                min-width: 64px;
            }
            
            .fav-item-name {
                font-size: 0.85rem;
            }
            
            .fav-item-price {
                font-size: 0.9rem;
            }
            
            .fav-item-actions {
                width: 100%;
                justify-content: flex-end;
                padding-top: 8px;
                border-top: 1px solid rgba(255,255,255,0.05);
                flex-wrap: wrap;
                gap: 8px;
            }
            
            .btn-add-to-cart,
            .btn-buy-now {
                font-size: 0.7rem;
                padding: 6px 14px;
                min-height: 36px;
            }
            
            .btn-favorite {
                width: 36px;
                height: 36px;
            }
        }

        @media (max-width: 480px) {
            .fav-item {
                padding: 10px 12px;
                gap: 10px;
            }
            
            .fav-item-image {
                width: 52px;
                height: 52px;
                min-width: 52px;
                border-radius: 10px;
            }
            
            .fav-item-name {
                font-size: 0.75rem;
            }
            
            .fav-item-price {
                font-size: 0.8rem;
            }
            
            .fav-item-store {
                font-size: 0.55rem;
            }
            
            .fav-item-old-price {
                font-size: 0.55rem;
            }
            
            .btn-add-to-cart {
                font-size: 0.65rem;
                padding: 5px 12px;
                min-height: 32px;
            }
            
            .btn-buy-now {
                font-size: 0.65rem;
                padding: 5px 12px;
                min-height: 32px;
            }
            
            .btn-favorite {
                width: 32px;
                height: 32px;
            }
            
            .btn-favorite i {
                font-size: 0.8rem;
            }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #fbbf24; border-radius: 10px; }

        .loading-spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 2px solid rgba(251,191,36,0.3);
            border-top-color: #fbbf24;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <script src="modals.js"></script>
</head>
<body>
    <div class="gold-top"></div>

    <header class="navbar">
        <div class="logo" onclick="window.location='index.html'">PRO<span>RANK</span></div>

    <div id="mobileBottomNavContainer"></div>

    <!-- УВЕДОМЛЕНИЕ -->
    <div id="errorContainer" style="position: fixed; top: 15px; left: 50%; transform: translateX(-50%); z-index: 9999; max-width: 90%; width: 480px; padding: 14px 20px; border-radius: 16px; font-weight: 600; font-size: 0.9rem; animation: slideDown 0.3s ease; box-shadow: 0 10px 30px rgba(0,0,0,0.4); backdrop-filter: blur(8px); display: none; text-align: center; border: 1px solid rgba(255,255,255,0.1);"></div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js"
            }
        }
    </script>
    <script type="module" src="header.js"></script>
    <script type="module">
    import { initializeApp } from "firebase/app";
    import { getFirestore, collection, getDocs, doc, getDoc, deleteDoc } from "firebase/firestore";
    import { getAuth, onAuthStateChanged } from "firebase/auth";

    const firebaseConfig = {
        apiKey: "AIzaSyDUGYJY7pX7q02MS5SACMIIQXpjpQ97mPw",
        authDomain: "proranklive.firebaseapp.com",
        projectId: "proranklive",
        storageBucket: "proranklive.firebasestorage.app",
        messagingSenderId: "716836144015",
        appId: "1:716836144015:web:f1575147750608d0f881fa"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUser = null;
    let favoriteProducts = [];
    let allPartners = [];

    // ===== УВЕДОМЛЕНИЯ =====
    function showNotification(message, type = 'success') {
        if (typeof window.showToast === 'function') {
            window.showToast(message, type);
            return;
        }
        const container = document.getElementById('errorContainer');
        if (!container) return;
        const colors = { success: '#22c55e', error: '#ef4444', warning: '#f59e0b', info: '#fbbf24' };
        container.style.display = 'block';
        container.style.background = colors[type] || colors.info;
        container.style.color = '#000';
        container.textContent = message;
        clearTimeout(container._timeout);
        container._timeout = setTimeout(() => { container.style.display = 'none'; }, 3000);
    }

    // ===== ПАРТНЁРЫ =====
    async function loadPartners() {
        try {
            const snapshot = await getDocs(collection(db, "partners"));
            allPartners = snapshot.docs.map(doc => ({ id: doc.id, name: doc.data().name }));
        } catch (err) {
            console.error('Ошибка загрузки магазинов:', err);
        }
    }

    function getStoreName(partnerId) {
        if (!partnerId) return 'Магазин';
        const partner = allPartners.find(p => p.id === partnerId);
        return partner ? partner.name : 'Магазин';
    }

    function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function safeImageUrl(url) {
        if (!url) return '';
        const raw = String(url).trim();
        if (!/^(https?:\/\/|\/\/|\/|\.\/|\.\.\/)/i.test(raw)) return '';
        return escapeHtml(raw);
    }

    // ===== РЕНДЕР ТОВАРОВ =====
    function renderProducts(products) {
        const container = document.getElementById('favoritesGrid');
        if (!container) return;
        
        if (products.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="far fa-heart"></i>
                    <h3>Избранное пусто</h3>
                    <p>Добавляйте товары в избранное, чтобы не потерять их</p>
                </div>
            `;
            document.getElementById('favoritesCount').textContent = '0';
            return;
        }

        let html = '';
        products.forEach((product) => {
            const storeName = getStoreName(product.partnerId);
            const safeImage = safeImageUrl(product.image);
            
            const productForCart = {
                id: product.id,
                name: product.name,
                price: product.price,
                image: product.image,
                desc: product.desc || '',
                partnerId: product.partnerId || null,
                partnerName: storeName || null
            };
            
            const cartJson = escapeHtml(JSON.stringify(productForCart));
            
            html += `
                <div class="fav-item" data-product-id="${escapeHtml(product.id)}">
                    ${safeImage 
                        ? `<img src="${safeImage}" class="fav-item-image" onerror="this.src='https://placehold.co/300x200/1a1a1a/fbbf24?text=No+Image'">` 
                        : `<div class="fav-item-image" style="display:flex;align-items:center;justify-content:center;"><i class="fas fa-image" style="font-size:1.5rem;color:#555;"></i></div>`
                    }
                    <div class="fav-item-info">
                        <div class="fav-item-name">${escapeHtml(product.name)}</div>
                        <div class="fav-item-store"><i class="fas fa-store"></i> ${escapeHtml(storeName)}</div>
                        <div class="fav-item-price-block">
                            <span class="fav-item-price">${(product.price || 0).toLocaleString()} ₽</span>
                            ${product.oldPrice ? `<span class="fav-item-old-price">${product.oldPrice.toLocaleString()} ₽</span>` : ''}
                        </div>
                    </div>
                    <div class="fav-item-actions">
                        <button class="btn-add-to-cart" data-product='${cartJson}'><i class="fas fa-cart-plus"></i> В корзину</button>
                        <button class="btn-buy-now" data-product='${cartJson}'><i class="fas fa-bolt"></i> Купить</button>
                        <button class="btn-favorite" data-product-id="${escapeHtml(product.id)}" title="Убрать из избранного">
                            <i class="fas fa-heart"></i>
                        </button>
                    </div>
                </div>
            `;
        });
        
        container.innerHTML = html;
        document.getElementById('favoritesCount').textContent = products.length;
        attachHandlers();
    }

    // ===== ОБРАБОТЧИКИ =====
    function attachHandlers() {
        const container = document.getElementById('favoritesGrid');
        
        // Удалить из избранного (сердечко)
        container.querySelectorAll('.btn-favorite').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                await removeFromFavorites(btn.dataset.productId);
            });
        });

        // В корзину
        container.querySelectorAll('.btn-add-to-cart').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (!currentUser) {
                    showNotification('Войдите в аккаунт', 'warning');
                    setTimeout(() => window.location.href = 'login.html', 1000);
                    return;
                }
                const product = JSON.parse(btn.dataset.product);
                let cart = JSON.parse(localStorage.getItem('cart') || '[]');
                cart.push({
                    id: product.id,
                    name: product.name,
                    price: product.price,
                    image: product.image,
                    desc: product.desc,
                    partnerId: product.partnerId,
                    partnerName: product.partnerName
                });
                localStorage.setItem('cart', JSON.stringify(cart));
                showNotification(`${product.name} добавлен в корзину`, 'success');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> Добавлено!';
                btn.style.background = '#10b981';
                btn.style.color = '#fff';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.background = '';
                    btn.style.color = '';
                }, 1200);
            });
        });

        // Быстрая покупка
        container.querySelectorAll('.btn-buy-now').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (!currentUser) {
                    showNotification('Войдите в аккаунт', 'warning');
                    setTimeout(() => window.location.href = 'login.html', 1000);
                    return;
                }
                const product = JSON.parse(btn.dataset.product);
                let cart = JSON.parse(localStorage.getItem('cart') || '[]');
                cart = [{
                    id: product.id,
                    name: product.name,
                    price: product.price,
                    image: product.image,
                    desc: product.desc,
                    partnerId: product.partnerId,
                    partnerName: product.partnerName
                }];
                localStorage.setItem('cart', JSON.stringify(cart));
                showNotification(`Быстрая покупка: ${product.name}`, 'success');
                setTimeout(() => {
                    window.location.href = 'cart.html';
                }, 800);
            });
        });

        // Клик по фото/названию
        container.querySelectorAll('.fav-item-image, .fav-item-name').forEach(el => {
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                const item = el.closest('.fav-item');
                const productId = item?.dataset.productId;
                const product = favoriteProducts.find(p => p.id === productId);
                if (product) {
                    showNotification(product.name, 'info');
                }
            });
        });
    }

    // ===== УДАЛЕНИЕ ИЗ ИЗБРАННОГО =====
    async function removeFromFavorites(productId) {
        if (!currentUser) {
            showNotification('Войдите в аккаунт', 'warning');
            return;
        }
        try {
            const favRef = doc(db, "users", currentUser.uid, "favorites", productId);
            await deleteDoc(favRef);
            favoriteProducts = favoriteProducts.filter(p => p.id !== productId);
            renderProducts(favoriteProducts);
            showNotification('Удалено из избранного', 'info');
        } catch (err) {
            console.error('Ошибка удаления из избранного:', err);
            showNotification('Ошибка', 'error');
        }
    }

    // ===== ЗАГРУЗКА ИЗБРАННОГО =====
    async function loadFavorites() {
        if (!currentUser) {
            document.getElementById('favoritesGrid').innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-lock"></i>
                    <h3>Требуется авторизация</h3>
                    <p>Войдите, чтобы увидеть избранные товары</p>
                </div>
            `;
            document.getElementById('favoritesCount').textContent = '0';
            return;
        }

        // Показываем загрузку
        document.getElementById('favoritesGrid').innerHTML = `
            <div style="text-align:center;padding:40px;">
                <div class="loading-spinner"></div>
            </div>
        `;
        
        try {
            const favRef = collection(db, "users", currentUser.uid, "favorites");
            const snapshot = await getDocs(favRef);
            const favoriteIds = snapshot.docs.map(d => d.id);
            
            if (favoriteIds.length === 0) {
                renderProducts([]);
                return;
            }

            const products = [];
            for (const id of favoriteIds) {
                const docRef = doc(db, "products", id);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    products.push({ id: docSnap.id, ...docSnap.data() });
                }
            }

            favoriteProducts = products;
            renderProducts(products);

        } catch (err) {
            console.error('Ошибка загрузки избранного:', err);
            document.getElementById('favoritesGrid').innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-exclamation-triangle"></i>
                    <h3>Ошибка загрузки</h3>
                    <p>Не удалось загрузить избранное. Попробуйте позже.</p>
                </div>
            `;
        }
    }

    // ===== БАЛАНС =====
    async function updateHeaderBalance() {
        const user = auth.currentUser;
        const balanceDiv = document.getElementById('balanceIndicator');
        const balanceCount = document.getElementById('headerChallengesCount');
        if (!user || !balanceDiv) return;
        try {
            const userDoc = await getDoc(doc(db, "fighters", user.uid));
            const data = userDoc.data();
            const total = (data.freeChallenges || 0) + (data.purchasedChallenges || 0);
            balanceCount.innerText = total;
            balanceDiv.style.display = 'flex';
        } catch (err) { console.error(err); }
    }

    // ===== ИНИЦИАЛИЗАЦИЯ =====
    onAuthStateChanged(auth, async (user) => {
        currentUser = user;
        if (user) {
            setTimeout(updateHeaderBalance, 1000);
        } else {
            const balanceDiv = document.getElementById('balanceIndicator');
            if (balanceDiv) balanceDiv.style.display = 'none';
        }
        await loadPartners();
        await loadFavorites();
    });

    // ===== КНОПКА НАЗАД (СТРЕЛКА) =====
    document.getElementById('backBtn')?.addEventListener('click', () => {
        window.history.back();
    });

    const plusBtn = document.getElementById('balancePlusBtn');
    if (plusBtn) plusBtn.onclick = () => window.location.href = 'shop.html';

    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');
    if (menuToggle && navLinks) {
        menuToggle.addEventListener('click', () => navLinks.classList.toggle('show'));
        navLinks.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => navLinks.classList.remove('show'));
        });
    }

    console.log('✅ Избранное обновлено по ТЗ');
    </script>
</body>
</html>
