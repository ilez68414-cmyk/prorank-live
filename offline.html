<!DOCTYPE html>
<html lang="ru">
<head>
    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="/prorank-live/manifest.json">
    <link rel="apple-touch-icon" href="/prorank-live/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PRORANK">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#fbbf24">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Офлайн-режим | PRORANK</title>
    <!-- Страница полностью автономна: ни style.css, ни CDN не подключаем,
         чтобы офлайн-экран гарантированно отрисовался без сети. -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(ellipse at 30% 30%, rgba(251, 191, 36, 0.10) 0%, transparent 60%),
                        radial-gradient(ellipse at 75% 80%, rgba(251, 191, 36, 0.06) 0%, transparent 55%),
                        linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 45%, #1a1a1a 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }

        .offline-container { width: 100%; max-width: 340px; }

        .offline-logo {
            width: 96px;
            height: 96px;
            border-radius: 22px;
            display: block;
            margin: 0 auto 18px;
        }

        .offline-badge {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 9px 16px;
            margin-bottom: 18px;
            border: 1px solid rgba(251, 191, 36, 0.35);
            border-radius: 40px;
            background: rgba(251, 191, 36, 0.10);
            color: #fbbf24;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }

        .offline-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #fbbf24;
            animation: offlinePulse 1.6s ease-out infinite;
        }

        @keyframes offlinePulse {
            0%   { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.55); }
            70%  { box-shadow: 0 0 0 10px rgba(251, 191, 36, 0); }
            100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); }
        }

        h1 { font-size: 1.45rem; font-weight: 800; margin-bottom: 10px; letter-spacing: -0.2px; }
        p  { color: #a1a1a1; font-size: 0.9rem; line-height: 1.55; margin-bottom: 24px; }

        .offline-actions { display: flex; flex-direction: column; gap: 10px; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 22px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.15s ease, opacity 0.2s ease;
        }

        .btn:active { transform: scale(0.97); }

        .btn-primary {
            border: none;
            background: linear-gradient(135deg, #fbbf24, #ffdd88);
            color: #000;
        }

        .btn-ghost {
            border: 1px solid rgba(251, 191, 36, 0.35);
            background: rgba(251, 191, 36, 0.08);
            color: #fbbf24;
        }

        .offline-hint {
            margin-top: 22px;
            color: #555;
            font-size: 0.72rem;
            line-height: 1.5;
        }

        .offline-status {
            margin-top: 14px;
            color: #4ade80;
            font-size: 0.75rem;
            font-weight: 600;
            min-height: 18px;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <img class="offline-logo" src="/prorank-live/icons/icon-192.png" alt="PRORANK"
             onerror="this.style.display='none'">

        <div class="offline-badge">
            <span class="offline-dot"></span>
            Офлайн-режим. Проверьте сеть
        </div>

        <h1>Нет соединения</h1>
        <p>Интернет недоступен, поэтому открыта локальная копия приложения PRORANK.</p>

        <div class="offline-actions">
            <button type="button" class="btn btn-primary" onclick="window.location.reload()">
                Повторить попытку
            </button>
            <a class="btn btn-ghost" href="/prorank-live/index.html">Открыть локальную копию</a>
        </div>

        <div class="offline-status" id="offlineStatus"></div>

        <div class="offline-hint">
            Интернет вернулся? Страница перезагрузится автоматически.
        </div>
    </div>

    <script>
        (function () {
            var status = document.getElementById('offlineStatus');
            var restored = false;

            function setStatus(text) {
                if (status) status.textContent = text || '';
            }

            // Проверяем связь «в лоб» (мимо кэша), чтобы не было ложного «онлайн»
            function probe() {
                fetch(window.location.href, { method: 'HEAD', cache: 'no-store' })
                    .then(function () {
                        if (restored) return;
                        restored = true;
                        setStatus('Соединение восстановлено. Загружаем приложение...');
                        setTimeout(function () { window.location.reload(); }, 900);
                    })
                    .catch(function () {
                        setStatus('');
                    });
            }

            window.addEventListener('online', probe);
            setInterval(probe, 8000);
        })();
    </script>
</body>
</html>
