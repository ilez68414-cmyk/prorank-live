<!DOCTYPE html>
<html lang="ru">
<head>
    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PRORANK">
    <meta name="theme-color" content="#fbbf24">
    <meta name="mobile-web-app-capable" content="yes">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#fbbf24">
    <meta name="description" content="Управляй вызовами на спарринг в PRORANK — принимай и отправляй вызовы другим бойцам">
    <title>Вызовы | PRORANK</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(ellipse at 30% 40%, rgba(251, 191, 36, 0.15) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 80%, rgba(251, 191, 36, 0.08) 0%, transparent 50%),
                        linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 40%, #1a1a1a 100%);
            background-attachment: fixed;
            color: #fff;
            line-height: 1.4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main { flex: 1; }

        .gold-top {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #fbbf24, #ffdd88, #fbbf24, #b8860b);
            z-index: 1001;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 24px;
            position: relative;
            z-index: 2;
            width: 100%;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(251, 191, 36, 0.25);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            cursor: pointer;
            background: linear-gradient(135deg, #ffffff, #fbbf24);
            background-clip: text;
            color: transparent;
        }

        .logo span {
            background: linear-gradient(135deg, #fbbf24, #ffdd77);
            background-clip: text;
            color: transparent;
        }

        .balance-indicator {
            background: #111;
            border: 1px solid rgba(251, 191, 36, 0.5);
            border-radius: 60px;
            padding: 7px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .balance-count { color: #fbbf24; font-size: 1.1rem; }

        .balance-plus {
            background: rgba(251,191,36,0.15);
            border: none;
            color: #fbbf24;
            cursor: pointer;
            width: 28px;
            height: 28px;
            border-radius: 50%;
        }

        .balance-plus:active { background: #fbbf24; color: #000; transform: scale(0.94); }

        .menu-toggle {
            display: none;
            background: rgba(251,191,36,0.1);
            border: 1px solid #fbbf24;
            color: #fbbf24;
            font-size: 1.6rem;
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 12px;
            min-height: 44px;
        }

        .nav-links {
            display: flex;
            gap: 6px;
            background: rgba(15,15,15,0.7);
            backdrop-filter: blur(12px);
            padding: 5px 14px;
            border-radius: 60px;
            border: 1px solid rgba(251,191,36,0.2);
        }

        .nav-links a {
            color: #ddd;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 8px 18px;
            border-radius: 40px;
            transition: all 0.2s;
        }

        .nav-links a i {
            margin-right: 8px;
            color: #fbbf24;
        }

        .nav-links a:hover {
            color: #fbbf24;
            background: rgba(251,191,36,0.1);
        }

        .page-header {
            text-align: center;
            padding: 40px 20px 20px;
            animation: fadeInUp 0.5s ease;
        }

        .page-header h1 {
            font-size: clamp(1.6rem, 5vw, 2rem);
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #fbbf24);
            background-clip: text;
            color: transparent;
        }

        .page-header p {
            color: #aaa;
            margin-top: 12px;
            font-size: clamp(0.8rem, 3vw, 0.9rem);
        }

        /* ===== ТАБЫ ===== */
        .tabs-container {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            background: rgba(15,15,15,0.5);
            padding: 6px;
            border-radius: 60px;
            border: 1px solid rgba(251,191,36,0.1);
            overflow-x: auto;
            flex-wrap: nowrap;
        }

        .tab-btn {
            flex: 1;
            min-width: 120px;
            padding: 10px 16px;
            border: none;
            border-radius: 40px;
            background: transparent;
            color: #888;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn:hover {
            color: #fbbf24;
            background: rgba(251,191,36,0.05);
        }

        .tab-btn.active {
            background: #fbbf24;
            color: #000;
        }

        .tab-btn.active i { color: #000; }

        .tab-content {
            display: none;
            animation: fadeInUp 0.3s ease;
        }

        .tab-content.active { display: block; }

        /* ===== ВЫЗОВЫ ===== */
        .challenges-section {
            background: rgba(15,15,15,0.7);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid rgba(251,191,36,0.15);
        }

        .challenges-section h2 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fbbf24;
        }

        .challenges-section .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .challenges-section .section-header h2 {
            margin-bottom: 0;
        }

        .btn-clear-history {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.3);
            color: #ef4444;
            padding: 6px 16px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            transition: all 0.2s;
            min-height: 36px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-clear-history:hover {
            background: rgba(239,68,68,0.25);
            transform: translateY(-2px);
        }

        .btn-clear-history:active { transform: scale(0.95); }

        .btn-refresh {
            background: rgba(251,191,36,0.1);
            border: 1px solid rgba(251,191,36,0.2);
            color: #fbbf24;
            padding: 6px 16px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            transition: all 0.2s;
            min-height: 36px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-refresh:hover {
            background: rgba(251,191,36,0.2);
            transform: translateY(-2px);
        }

        .btn-refresh:active { transform: scale(0.95); }

        .challenge-card {
            background: #1a1a1a;
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 16px;
            border-left: 4px solid;
            transition: all 0.2s;
            cursor: pointer;
        }

        .challenge-card:hover { transform: translateX(5px); background: #222; }
        .challenge-card:active { transform: scale(0.99); }
        .challenge-card.incoming { border-left-color: #fbbf24; }
        .challenge-card.outgoing { border-left-color: #8b5cf6; }

        .challenge-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 10px;
        }

        .challenge-name { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .challenge-status { padding: 4px 12px; border-radius: 40px; font-size: 0.7rem; font-weight: 600; }
        .status-pending { background: #fbbf24; color: #000; }
        .status-accepted { background: #16a34a; color: #fff; }
        .status-rejected { background: #dc2626; color: #fff; }
        .status-active { background: #3b82f6; color: #fff; }

        .challenge-details {
            color: #aaa;
            font-size: 0.8rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .challenge-message {
            background: #0f0f0f;
            padding: 10px 14px;
            border-radius: 14px;
            margin: 10px 0;
            font-style: italic;
            font-size: 0.85rem;
            border-left: 2px solid #fbbf24;
        }

        .challenge-actions {
            display: flex;
            gap: 12px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .btn-accept, .btn-reject, .btn-chat, .btn-respond, .btn-cancel-challenge {
            padding: 8px 20px;
            border-radius: 40px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            min-height: 38px;
        }

        .btn-accept { background: #16a34a; color: white; }
        .btn-accept:hover { background: #15803d; transform: translateY(-2px); }
        .btn-reject { background: #dc2626; color: white; }
        .btn-reject:hover { background: #b91c1c; transform: translateY(-2px); }
        .btn-chat { background: #3b82f6; color: white; }
        .btn-chat:hover { background: #2563eb; transform: translateY(-2px); }
        .btn-respond { background: #fbbf24; color: #000; }
        .btn-respond:hover { background: #ffdd44; transform: translateY(-2px); }
        .btn-respond:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-cancel-challenge { background: #555; color: #fff; }
        .btn-cancel-challenge:hover { background: #444; transform: translateY(-2px); }

        .btn-publish {
            background: #fbbf24;
            color: #000;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-publish:hover { background: #ffdd44; transform: translateY(-2px); }
        .btn-publish:active { transform: scale(0.97); }
        .btn-publish:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .empty-state { text-align: center; color: #888; padding: 40px 20px; }
        .empty-state i { font-size: 2.5rem; margin-bottom: 12px; color: #555; }

        .empty-state .btn-buy-challenges {
            margin-top: 16px;
            background: #fbbf24;
            color: #000;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .empty-state .btn-buy-challenges:hover {
            background: #ffdd44;
            transform: translateY(-2px);
        }

        /* ===== ФИЛЬТРЫ ===== */
        .filters-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .filter-group {
            flex: 1;
            min-width: 140px;
        }

        .filter-group label {
            display: block;
            font-size: 0.65rem;
            color: #888;
            margin-bottom: 4px;
        }

        .filter-group select,
        .filter-group input {
            width: 100%;
            padding: 8px 12px;
            background: #1a1a1a;
            border: 1px solid rgba(251,191,36,0.2);
            color: #fff;
            border-radius: 40px;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            border-color: #fbbf24;
        }

        .offer-card {
            background: rgba(20,20,25,0.8);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 14px;
            border: 1px solid rgba(251,191,36,0.1);
            transition: all 0.2s;
        }

        .offer-card:hover {
            transform: translateY(-3px);
            border-color: rgba(251,191,36,0.3);
            background: rgba(30,30,40,0.9);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .offer-card .offer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }

        .offer-card .offer-name {
            font-size: 1rem;
            font-weight: 700;
        }

        .offer-card .offer-name .city {
            font-size: 0.75rem;
            color: #888;
            font-weight: 400;
        }

        .offer-card .offer-details {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            font-size: 0.75rem;
            color: #aaa;
        }

        .offer-card .offer-details i { color: #fbbf24; width: 16px; }
        .offer-card .offer-message { font-size: 0.8rem; color: #aaa; margin: 8px 0; padding: 8px 12px; background: rgba(255,255,255,0.03); border-radius: 8px; }
        .offer-card .offer-actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }

        .own-offer { border-color: rgba(251,191,36,0.3); background: rgba(251,191,36,0.05); }

        .btn-delete-offer {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.3);
            color: #ef4444;
            padding: 6px 16px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 600;
            transition: all 0.2s;
            min-height: 34px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-delete-offer:hover {
            background: rgba(239,68,68,0.25);
            transform: translateY(-2px);
        }

        /* ===== МОДАЛКА ПРЕДЛОЖЕНИЯ ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 2000;
            animation: fadeIn 0.2s ease;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: #151515;
            padding: 28px;
            border-radius: 28px;
            width: 90%;
            max-width: 440px;
            border: 1px solid rgba(251,191,36,0.3);
            animation: slideUp 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h3 {
            color: #fbbf24;
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-content .input-group { margin-bottom: 16px; }
        .modal-content .input-group label { display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 4px; }
        .modal-content .input-group select,
        .modal-content .input-group input,
        .modal-content .input-group textarea {
            width: 100%;
            padding: 12px 16px;
            background: #1a1a1a;
            border: 1px solid rgba(251,191,36,0.25);
            color: #fff;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .modal-content .input-group select:focus,
        .modal-content .input-group input:focus,
        .modal-content .input-group textarea:focus {
            outline: none;
            border-color: #fbbf24;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            min-height: 44px;
        }

        .btn-confirm { background: #fbbf24; color: #000; }
        .btn-confirm:hover { background: #ffdd44; transform: translateY(-2px); }
        .btn-cancel { background: #2a2a2a; color: #fff; }
        .btn-cancel:hover { background: #3a3a3a; transform: translateY(-2px); }

        /* ===== ПОДВАЛ ===== */
        .main-footer {
            background: #0a0a0a;
            border-top: 1px solid rgba(251,191,36,0.15);
            margin-top: 40px;
            padding: 40px 0 24px;
        }

        .footer-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 32px;
            margin-bottom: 32px;
        }

        .footer-logo .logo { font-size: 1.3rem; display: inline-block; }
        .footer-logo p { font-size: 0.7rem; color: #777; margin-top: 6px; }
        .footer-social { display: flex; gap: 20px; }
        .social-icon { color: #aaa; font-size: 1.3rem; transition: all 0.2s; }
        .social-icon:hover { color: #fbbf24; transform: translateY(-3px); }
        .footer-links { display: flex; gap: 24px; flex-wrap: wrap; }
        .footer-links a { color: #888; text-decoration: none; font-size: 0.75rem; transition: color 0.2s; }
        .footer-links a:hover { color: #fbbf24; }
        .footer-bottom { text-align: center; padding-top: 24px; border-top: 1px solid rgba(255,255,255,0.05); font-size: 0.65rem; color: #555; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .container { padding: 0 16px; }
            .navbar { padding: 12px 18px; }
            .menu-toggle { display: block; }
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 68px;
                left: 18px;
                right: 18px;
                background: #0f0f0f;
                border-radius: 24px;
                padding: 20px;
                gap: 10px;
                border: 1px solid rgba(251,191,36,0.3);
                z-index: 1000;
                backdrop-filter: blur(20px);
            }
            .nav-links.show { display: flex; animation: fadeIn 0.2s ease; }
            .nav-links a { width: 100%; text-align: center; padding: 12px; }
            .page-header h1 { font-size: 1.6rem; }
            .challenge-header { flex-direction: column; align-items: flex-start; }
            .challenge-details { font-size: 0.7rem; gap: 8px; }
            .challenge-name { font-size: 0.95rem; }
            .btn-accept, .btn-reject, .btn-chat, .btn-respond { padding: 6px 16px; font-size: 0.75rem; min-height: 36px; }
            .tabs-container { gap: 4px; padding: 4px; border-radius: 40px; }
            .tab-btn { min-width: 80px; padding: 8px 12px; font-size: 0.75rem; }
            .footer-inner { flex-direction: column; text-align: center; }
            .filters-row { flex-direction: column; gap: 8px; }
            .filter-group { min-width: unset; }
            .challenges-section .section-header { flex-direction: column; align-items: stretch; }
            .challenges-section .section-header .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
            .challenges-section .section-header .header-actions .btn { flex: 1; justify-content: center; }
        }

        @media (max-width: 480px) {
            .challenges-section { padding: 16px; }
            .challenge-card { padding: 14px; }
            .challenge-name { font-size: 0.85rem; }
            .challenge-details { font-size: 0.65rem; }
            .tab-btn { min-width: 60px; padding: 6px 10px; font-size: 0.65rem; }
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #fbbf24; border-radius: 10px; }

        .icon-gold { color: #fbbf24; }
        .icon-red { color: #ff5555; }
        .icon-green { color: #16a34a; }

        .loading-spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 2px solid rgba(251,191,36,0.3);
            border-top-color: #fbbf24;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .manual-hall-input {
            margin-top: 8px;
        }

        .manual-hall-input input {
            width: 100%;
            padding: 10px 14px;
            background: #1a1a1a;
            border: 1px solid rgba(251,191,36,0.2);
            color: #fff;
            border-radius: 12px;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .manual-hall-input input:focus {
            outline: none;
            border-color: #fbbf24;
        }

        .hall-select-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .hall-select-group select {
            width: 100%;
            padding: 12px 16px;
            background: #1a1a1a;
            border: 1px solid rgba(251,191,36,0.25);
            color: #fff;
            border-radius: 12px;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .hall-select-group select:focus {
            outline: none;
            border-color: #fbbf24;
        }

        .hall-select-group .hall-option-other {
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>

    <script type="module">
        import { initializeApp } from "firebase/app";

        import { notifyAboutChallenge, notifyAboutChallengeAccepted } from './push-sender.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDUGYJY7pX7q02MS5SACMIIQXpjpQ97mPw",
            authDomain: "proranklive.firebaseapp.com",
            projectId: "proranklive",
            storageBucket: "proranklive.firebasestorage.app",
            messagingSenderId: "716836144015",
            appId: "1:716836144015:web:f1575147750608d0f881fa"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const BOT_TOKEN = '8527160088:AAGc2311QFkp6F7-Jx5k8MJfqlpvbueSl5E';

        let currentUser = null;
        let currentUserData = null;
        let allHalls = [];

        // ===== ТАБЫ =====
        function initTabs() {
            const tabs = document.querySelectorAll('.tab-btn');
            const contents = {
                'my-challenges': document.getElementById('my-challenges'),
                'sparring-board': document.getElementById('sparring-board')
            };

            if (tabs.length === 0) {
                console.error('❌ Кнопки вкладок не найдены');
                return;
            }

            tabs.forEach(btn => {
                btn.removeEventListener('click', () => {});
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    const target = this.dataset.tab;
                    
                    tabs.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    
                    Object.keys(contents).forEach(key => {
                        contents[key].classList.remove('active');
                    });
                    
                    if (contents[target]) {
                        contents[target].classList.add('active');
                        console.log('✅ Показана вкладка:', target);
                    }
                });
            });

            const defaultTab = document.querySelector('.tab-btn.active') || tabs[0];
            if (defaultTab) {
                defaultTab.click();
            }

            console.log('✅ Табы инициализированы');
        }

        // ===== ОБНОВЛЕНИЕ БАЛАНСА =====
        async function updateHeaderBalance() {
            const user = auth.currentUser;
            const balanceDiv = document.getElementById('balanceIndicator');
            const balanceCount = document.getElementById('headerChallengesCount');
            if (!user || !balanceDiv) return;
            try {
                const userDoc = await getDoc(doc(db, "fighters", user.uid));
                const data = userDoc.data();
                if (!data) return;
                const total = (data.freeChallenges || 0) + (data.purchasedChallenges || 0);
                balanceCount.innerText = total;
                balanceDiv.style.display = 'flex';
            } catch (err) { console.error(err); }
        }

        // ===== ЗАГРУЗКА ЗАЛОВ =====
        async function loadHalls() {
            try {
                const snapshot = await getDocs(collection(db, "halls"));
                allHalls = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                console.log(`✅ Загружено залов: ${allHalls.length}`);
                populateHallSelect();
            } catch (err) {
                console.error('Ошибка загрузки залов:', err);
                allHalls = [];
                populateHallSelect();
            }
        }

        function populateHallSelect() {
            const select = document.getElementById('offerHall');
            if (!select) return;

            // Сохраняем текущее выбранное значение
            const currentValue = select.value;

            // Очищаем, оставляя только первую опцию
            select.innerHTML = '<option value="">-- Выберите зал --</option>';

            // Добавляем залы из базы
            allHalls.forEach(hall => {
                const option = document.createElement('option');
                option.value = hall.id;
                option.textContent = hall.name || hall.id;
                select.appendChild(option);
            });

            // Добавляем опцию "Другое"
            const otherOption = document.createElement('option');
            otherOption.value = 'other';
            otherOption.textContent = '✏️ Другое (ввести вручную)';
            otherOption.className = 'hall-option-other';
            select.appendChild(otherOption);

            // Восстанавливаем выбранное значение, если оно было
            if (currentValue) {
                select.value = currentValue;
            }

            // Показываем/скрываем поле ручного ввода
            toggleManualHallInput();
        }

        function toggleManualHallInput() {
            const select = document.getElementById('offerHall');
            const manualContainer = document.getElementById('manualHallContainer');
            if (select && manualContainer) {
                manualContainer.style.display = select.value === 'other' ? 'block' : 'none';
            }
        }

        // ===== ЗАГРУЗКА ВЫЗОВОВ =====
        async function loadChallenges() {
            if (!currentUser) {
                document.getElementById('incomingList').innerHTML = '<div class="empty-state"><i class="fas fa-lock icon-gold"></i><p>Войдите, чтобы видеть вызовы</p></div>';
                document.getElementById('outgoingList').innerHTML = '<div class="empty-state"><i class="fas fa-lock icon-gold"></i><p>Войдите, чтобы видеть вызовы</p></div>';
                return;
            }

            try {
                const incomingQuery = query(
                    collection(db, "challenges"),
                    where("toUserId", "==", currentUser.uid),
                    orderBy("createdAt", "desc")
                );

                const outgoingQuery = query(
                    collection(db, "challenges"),
                    where("fromUserId", "==", currentUser.uid),
                    orderBy("createdAt", "desc")
                );

                const [incomingSnap, outgoingSnap] = await Promise.all([
                    getDocs(incomingQuery),
                    getDocs(outgoingQuery)
                ]);

                renderIncoming(incomingSnap.docs);
                renderOutgoing(outgoingSnap.docs);
            } catch (err) {
                console.error('Ошибка загрузки вызовов:', err);
                document.getElementById('incomingList').innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle icon-red"></i><p>Ошибка загрузки</p></div>';
                document.getElementById('outgoingList').innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle icon-red"></i><p>Ошибка загрузки</p></div>';
            }
        }

        function renderIncoming(docs) {
            const container = document.getElementById('incomingList');
            
            const active = docs.filter(d => d.data().status === 'pending' || d.data().status === 'accepted');
            const history = docs.filter(d => d.data().status === 'rejected' || d.data().status === 'completed');

            if (active.length === 0 && history.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <p>Нет входящих вызовов</p>
                    </div>
                `;
                return;
            }

            let html = '';

            // Активные вызовы
            if (active.length > 0) {
                active.forEach(docSnap => renderChallengeCard(docSnap, container, 'incoming', true));
            }

            // История (свернутая, с кнопкой показать)
            if (history.length > 0) {
                html += `<div style="margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.05);">
                    <details>
                        <summary style="cursor:pointer;color:#888;font-size:0.8rem;padding:8px 0;">
                            📜 История (${history.length})
                        </summary>
                        <div style="margin-top:8px;">`;
                history.forEach(docSnap => {
                    html += renderChallengeCardHTML(docSnap, 'incoming');
                });
                html += `</div></details></div>`;
            }

            container.innerHTML = html;
        }

        function renderOutgoing(docs) {
            const container = document.getElementById('outgoingList');
            
            if (docs.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-paper-plane"></i>
                        <p>Нет исходящих вызовов</p>
                    </div>
                `;
                return;
            }

            let html = '';

            // ВСЕ вызовы (активные + история) — без разделения
            docs.forEach(docSnap => {
                const challenge = docSnap.data();
                const challengeId = docSnap.id;
                const chatId = `${challenge.fromUserId}_${challenge.toUserId}`;

                html += `
                    <div class="challenge-card outgoing">
                        <div class="challenge-header">
                            <span class="challenge-name"><i class="fas fa-arrow-up icon-gold"></i> ${escapeHtml(challenge.toName || 'Соперник')}</span>
                            <span class="challenge-status status-${challenge.status}">${getStatusText(challenge.status)}</span>
                        </div>
                        <div class="challenge-details">
                            <span><i class="fas fa-weight-hanging"></i> Вес: ${challenge.toWeight || 'не указан'} кг</span>
                            <span><i class="fas fa-calendar-alt"></i> ${challenge.date ? new Date(challenge.date).toLocaleString('ru-RU') : '—'}</span>
                            <span><i class="fas fa-map-marker-alt"></i> ${challenge.place || '—'}</span>
                            <span><i class="fas fa-fist-raised"></i> ${challenge.sport || '—'}</span>
                        </div>
                        ${challenge.message ? `<div class="challenge-message"><i class="fas fa-quote-left"></i> ${escapeHtml(challenge.message)}</div>` : ''}
                        <div class="challenge-actions">
                            ${challenge.status === 'pending' ? `
                                <button class="btn-cancel-challenge" data-id="${challengeId}"><i class="fas fa-times"></i> Отменить вызов</button>
                            ` : ''}
                            ${challenge.status === 'accepted' ? `
                                <button class="btn-chat" data-chat-id="${chatId}"><i class="fas fa-comments"></i> Перейти в чат</button>
                                <div class="challenge-details"><i class="fas fa-check-circle icon-green"></i> Соперник принял вызов!</div>
                            ` : ''}
                            ${challenge.status === 'rejected' ? '<div class="challenge-details"><i class="fas fa-times-circle icon-red"></i> Соперник отклонил вызов</div>' : ''}
                            ${challenge.status === 'completed' ? '<div class="challenge-details"><i class="fas fa-check-circle icon-green"></i> Вызов завершён</div>' : ''}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;

            // Обработчики
            container.querySelectorAll('.btn-cancel-challenge').forEach(btn => {
                btn.addEventListener('click', () => cancelChallenge(btn.dataset.id));
            });
            container.querySelectorAll('.btn-chat').forEach(btn => {
                btn.addEventListener('click', () => {
                    window.location.href = `chat.html?id=${btn.dataset.chatId}`;
                });
            });
        }

        function renderChallengeCardHTML(docSnap, type) {
            const challenge = docSnap.data();
            const challengeId = docSnap.id;
            const isIncoming = type === 'incoming';
            const chatId = `${challenge.fromUserId}_${challenge.toUserId}`;

            let actionsHtml = '';
            if (isIncoming && challenge.status === 'pending') {
                actionsHtml = `
                    <div class="challenge-actions">
                        <button class="btn-accept" data-id="${challengeId}"><i class="fas fa-check"></i> Принять</button>
                        <button class="btn-reject" data-id="${challengeId}"><i class="fas fa-times"></i> Отклонить</button>
                    </div>
                `;
            } else if (challenge.status === 'accepted') {
                actionsHtml = `
                    <div class="challenge-actions">
                        <button class="btn-chat" data-chat-id="${chatId}"><i class="fas fa-comments"></i> Перейти в чат</button>
                    </div>
                    <div class="challenge-details"><i class="fas fa-check-circle icon-green"></i> ${isIncoming ? 'Вы приняли вызов!' : 'Соперник принял вызов!'}</div>
                `;
            } else if (!isIncoming && challenge.status === 'pending') {
                actionsHtml = `
                    <div class="challenge-actions">
                        <button class="btn-cancel-challenge" data-id="${challengeId}"><i class="fas fa-times"></i> Отменить вызов</button>
                    </div>
                `;
            } else if (challenge.status === 'rejected') {
                actionsHtml = `<div class="challenge-details"><i class="fas fa-times-circle icon-red"></i> ${isIncoming ? 'Вы отклонили вызов' : 'Соперник отклонил вызов'}</div>`;
            }

            return `
                <div class="challenge-card ${isIncoming ? 'incoming' : 'outgoing'}">
                    <div class="challenge-header">
                        <span class="challenge-name"><i class="fas ${isIncoming ? 'fa-arrow-down icon-gold' : 'fa-arrow-up icon-gold'}"></i> ${escapeHtml(isIncoming ? challenge.fromName || 'Боец' : challenge.toName || 'Соперник')}</span>
                        <span class="challenge-status status-${challenge.status}">${getStatusText(challenge.status)}</span>
                    </div>
                    <div class="challenge-details">
                        <span><i class="fas fa-weight-hanging"></i> Вес: ${isIncoming ? (challenge.fromWeight || 'не указан') : (challenge.toWeight || 'не указан')} кг</span>
                        <span><i class="fas fa-calendar-alt"></i> ${challenge.date ? new Date(challenge.date).toLocaleString('ru-RU') : '—'}</span>
                        <span><i class="fas fa-map-marker-alt"></i> ${challenge.place || '—'}</span>
                        <span><i class="fas fa-fist-raised"></i> ${challenge.sport || '—'}</span>
                    </div>
                    ${challenge.message ? `<div class="challenge-message"><i class="fas fa-quote-left"></i> ${escapeHtml(challenge.message)}</div>` : ''}
                    ${actionsHtml}
                </div>
            `;
        }

        function renderChallengeCard(docSnap, container, type) {
            const html = renderChallengeCardHTML(docSnap, type);
            const temp = document.createElement('div');
            temp.innerHTML = html;
            container.appendChild(temp.firstElementChild);

            // Обработчики
            container.querySelectorAll('.btn-accept').forEach(btn => {
                btn.addEventListener('click', () => updateChallengeStatus(btn.dataset.id, 'accepted'));
            });
            container.querySelectorAll('.btn-reject').forEach(btn => {
                btn.addEventListener('click', () => updateChallengeStatus(btn.dataset.id, 'rejected'));
            });
            container.querySelectorAll('.btn-cancel-challenge').forEach(btn => {
                btn.addEventListener('click', () => cancelChallenge(btn.dataset.id));
            });
            container.querySelectorAll('.btn-chat').forEach(btn => {
                btn.addEventListener('click', () => {
                    window.location.href = `chat.html?id=${btn.dataset.chatId}`;
                });
            });
        }

        async function updateChallengeStatus(challengeId, newStatus) {
            try {
                const challengeRef = doc(db, "challenges", challengeId);
                const challengeSnap = await getDoc(challengeRef);
                const challenge = challengeSnap.data();

                await updateDoc(challengeRef, {
                    status: newStatus,
                    updatedAt: new Date()
                });

                if (newStatus === 'accepted' && challenge) {
                    const chatId = `${challenge.fromUserId}_${challenge.toUserId}`;
                    const chatRef = doc(db, "chats", chatId);
                    const chatSnap = await getDoc(chatRef);

                    if (!chatSnap.exists()) {
                        await setDoc(chatRef, {
                            participants: [challenge.fromUserId, challenge.toUserId],
                            participantNames: {
                                [challenge.fromUserId]: challenge.fromName || 'Боец',
                                [challenge.toUserId]: challenge.toName || 'Боец'
                            },
                            createdAt: new Date(),
                            lastMessage: "Вызов принят! Обсудите детали.",
                            lastMessageTime: new Date()
                        });
                    }

                    await notifyAboutChallengeAccepted(challenge.fromUserId, challenge.toUserId, challenge.toName || 'Соперник');
                }

                alert(`✅ Вызов ${newStatus === 'accepted' ? 'принят' : 'отклонён'}`);
                loadChallenges();
            } catch (err) {
                console.error('Ошибка:', err);
                alert('❌ Ошибка при обновлении статуса');
            }
        }

        async function cancelChallenge(challengeId) {
            if (!confirm('Отменить вызов?')) return;
            try {
                await deleteDoc(doc(db, "challenges", challengeId));
                alert('✅ Вызов отменён');
                loadChallenges();
            } catch (err) {
                console.error('Ошибка:', err);
                alert('❌ Ошибка при отмене');
            }
        }

        function getStatusText(status) {
            const statuses = {
                'pending': '⏳ Ожидает',
                'accepted': '✅ Принят',
                'rejected': '❌ Отклонён',
                'completed': '✅ Завершён'
            };
            return statuses[status] || status;
        }

        // ===== ОЧИСТКА ИСТОРИИ =====
        async function clearHistory() {
            if (!currentUser) return;
            if (!confirm('Удалить все завершённые вызовы (принятые и отклонённые)?')) return;

            try {
                const incomingQuery = query(
                    collection(db, "challenges"),
                    where("toUserId", "==", currentUser.uid)
                );
                const outgoingQuery = query(
                    collection(db, "challenges"),
                    where("fromUserId", "==", currentUser.uid)
                );

                const [incomingSnap, outgoingSnap] = await Promise.all([
                    getDocs(incomingQuery),
                    getDocs(outgoingQuery)
                ]);

                let deleted = 0;
                const allDocs = [...incomingSnap.docs, ...outgoingSnap.docs];
                
                for (const docSnap of allDocs) {
                    const data = docSnap.data();
                    if (data.status === 'rejected' || data.status === 'completed') {
                        await deleteDoc(doc(db, "challenges", docSnap.id));
                        deleted++;
                    }
                }

                alert(`✅ Удалено ${deleted} записей истории`);
                loadChallenges();
            } catch (err) {
                console.error('Ошибка очистки:', err);
                alert('❌ Ошибка при очистке истории');
            }
        }

        // ===== ДОСКА ОБЪЯВЛЕНИЙ =====
        async function loadOffers() {
            if (!currentUser) {
                document.getElementById('offersList').innerHTML = '<div class="empty-state"><i class="fas fa-lock"></i><p>Войдите, чтобы видеть предложения</p></div>';
                return;
            }

            try {
                const q = query(
                    collection(db, "sparring_offers"),
                    where("status", "==", "active"),
                    orderBy("createdAt", "desc")
                );
                const snapshot = await getDocs(q);
                renderOffers(snapshot.docs);
            } catch (err) {
                console.error('Ошибка загрузки предложений:', err);
                document.getElementById('offersList').innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle icon-red"></i><p>Ошибка загрузки</p></div>';
            }
        }

        function renderOffers(docs) {
            const container = document.getElementById('offersList');

            const sportFilter = document.getElementById('filterSport').value;
            const cityFilter = document.getElementById('filterCity').value.toLowerCase().trim();
            const weightFilter = document.getElementById('filterWeight').value;

            let filtered = docs.filter(doc => {
                const data = doc.data();
                if (sportFilter !== 'all' && data.sport !== sportFilter) return false;
                if (cityFilter && !(data.userCity || '').toLowerCase().includes(cityFilter)) return false;
                if (weightFilter !== 'all' && data.userWeight !== weightFilter) return false;
                return true;
            });

            // ===== СОРТИРОВКА: СВОИ ПЕРВЫМИ =====
            filtered.sort((a, b) => {
                const aData = a.data();
                const bData = b.data();
                const aIsOwn = aData.userId === currentUser?.uid;
                const bIsOwn = bData.userId === currentUser?.uid;
                if (aIsOwn && !bIsOwn) return -1;
                if (!aIsOwn && bIsOwn) return 1;
                return 0;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-bullhorn"></i><p>Нет активных предложений</p><p style="font-size:0.75rem;color:#666;">Нажми «Предложить спарринг» чтобы создать своё</p></div>`;
                return;
            }

            container.innerHTML = '';
            for (const docSnap of filtered) {
                const offer = docSnap.data();
                const offerId = docSnap.id;
                const isOwn = offer.userId === currentUser?.uid;

                const card = document.createElement('div');
                card.className = `offer-card ${isOwn ? 'own-offer' : ''}`;
                card.innerHTML = `
                    <div class="offer-header">
                        <span class="offer-name">
                            ${isOwn ? '⭐ ' : ''}${escapeHtml(offer.userName || 'Боец')}
                            <span class="city"><i class="fas fa-map-marker-alt"></i> ${escapeHtml(offer.userCity || '—')}</span>
                        </span>
                        <span style="font-size:0.7rem;color:#666;">
                            ${offer.createdAt ? new Date(offer.createdAt.toDate()).toLocaleDateString() : ''}
                            ${isOwn ? '<span style="color:#fbbf24;margin-left:8px;">(Ваше)</span>' : ''}
                        </span>
                    </div>
                    <div class="offer-details">
                        <span><i class="fas fa-fist-raised"></i> ${offer.sport || '—'}</span>
                        <span><i class="fas fa-weight-hanging"></i> ${offer.userWeight || '—'}</span>
                        <span><i class="fas fa-map-marker-alt"></i> ${offer.place || '—'}</span>
                        <span><i class="fas fa-calendar-alt"></i> ${offer.date ? new Date(offer.date).toLocaleString('ru-RU') : '—'}</span>
                    </div>
                    ${offer.message ? `<div class="offer-message">${escapeHtml(offer.message)}</div>` : ''}
                    <div class="offer-actions">
                        ${!isOwn ? `
                            <button class="btn-respond" data-offer-id="${offerId}" data-user-id="${offer.userId}" data-user-name="${offer.userName}">
                                <i class="fas fa-fist-raised"></i> Хочу спарринг
                            </button>
                        ` : `
                            <button class="btn-delete-offer" data-offer-id="${offerId}">
                                <i class="fas fa-trash"></i> Удалить
                            </button>
                        `}
                    </div>
                `;
                container.appendChild(card);
            }

            // Обработчики
            document.querySelectorAll('.btn-respond').forEach(btn => {
                btn.addEventListener('click', () => {
                    const offerId = btn.dataset.offerId;
                    const userId = btn.dataset.userId;
                    const userName = btn.dataset.userName;
                    respondToOffer(offerId, userId, userName);
                });
            });

            document.querySelectorAll('.btn-delete-offer').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const offerId = btn.dataset.offerId;
                    if (confirm('Удалить своё предложение?')) {
                        try {
                            await deleteDoc(doc(db, "sparring_offers", offerId));
                            alert('✅ Предложение удалено');
                            loadOffers();
                        } catch (err) {
                            console.error('Ошибка:', err);
                            alert('❌ Ошибка при удалении');
                        }
                    }
                });
            });
        }

        async function respondToOffer(offerId, userId, userName) {
            if (!currentUser) {
                alert('Войдите в аккаунт');
                return;
            }

            if (currentUser.uid === userId) {
                alert('Нельзя откликнуться на своё предложение');
                return;
            }

            if (!currentUserData) {
                const userDoc = await getDoc(doc(db, "fighters", currentUser.uid));
                if (!userDoc.exists()) {
                    alert('❌ Данные пользователя не найдены');
                    return;
                }
                currentUserData = userDoc.data();
            }

            let freeChallenges = currentUserData.freeChallenges || 0;
            let purchasedChallenges = currentUserData.purchasedChallenges || 0;
            let totalChallenges = freeChallenges + purchasedChallenges;

            if (totalChallenges <= 0) {
                if (confirm('❌ У вас закончились вызовы!\nПерейти в магазин?')) {
                    window.location.href = 'shop.html';
                }
                return;
            }

            const offerDoc = await getDoc(doc(db, "sparring_offers", offerId));
            const offer = offerDoc.data();

            if (!offer) {
                alert('❌ Предложение больше не активно');
                return;
            }

            try {
                await addDoc(collection(db, "challenges"), {
                    fromUserId: currentUser.uid,
                    fromName: currentUserData?.name || 'Боец',
                    fromWeight: currentUserData?.weightClass || 'не указан',
                    toUserId: userId,
                    toName: userName,
                    toWeight: offer.userWeight || 'не указан',
                    sport: offer.sport || '—',
                    place: offer.place || '—',
                    date: offer.date || new Date().toISOString(),
                    message: `Отклик на предложение: ${offer.message || 'Хочу спарринг'}`,
                    status: 'pending',
                    createdAt: new Date(),
                    updatedAt: new Date()
                });

                await notifyAboutChallenge(currentUser.uid, userId, currentUserData?.name || 'Боец');

                if (freeChallenges > 0) {
                    await updateDoc(doc(db, "fighters", currentUser.uid), {
                        freeChallenges: freeChallenges - 1
                    });
                } else {
                    await updateDoc(doc(db, "fighters", currentUser.uid), {
                        purchasedChallenges: purchasedChallenges - 1
                    });
                }

                await updateDoc(doc(db, "sparring_offers", offerId), {
                    status: 'taken',
                    takenBy: currentUser.uid,
                    takenAt: new Date()
                });

                alert('✅ Вызов отправлен!');
                loadOffers();
                loadChallenges();
                updateHeaderBalance();

            } catch (err) {
                console.error('Ошибка:', err);
                alert('❌ Ошибка при отправке вызова');
            }
        }

        // ===== ПУБЛИКАЦИЯ ПРЕДЛОЖЕНИЯ =====
        async function publishOffer() {
            if (!currentUser) {
                alert('Войдите в аккаунт');
                return;
            }

            const sport = document.getElementById('offerSport').value;
            const hallSelect = document.getElementById('offerHall');
            const manualHall = document.getElementById('manualHallInput').value.trim();
            const date = document.getElementById('offerDate').value;
            const message = document.getElementById('offerMessage').value.trim();

            // Определяем место
            let place = '';
            if (hallSelect.value === 'other') {
                if (!manualHall) {
                    alert('Введите название зала');
                    return;
                }
                place = manualHall;
            } else if (hallSelect.value) {
                const selectedHall = allHalls.find(h => h.id === hallSelect.value);
                place = selectedHall ? selectedHall.name : hallSelect.value;
            } else {
                alert('Выберите зал или введите название');
                return;
            }

            if (!sport || !place || !date) {
                alert('Заполните все обязательные поля');
                return;
            }

            // ===== ПРОВЕРКА ЛИМИТА =====
            try {
                const userOffersQuery = query(
                    collection(db, "sparring_offers"),
                    where("userId", "==", currentUser.uid),
                    where("status", "==", "active")
                );
                const userOffersSnap = await getDocs(userOffersQuery);
                
                if (userOffersSnap.size >= 3) {
                    alert('❌ У вас уже 3 активных предложения на доске. Сначала удалите одно из них.');
                    return;
                }
            } catch (err) {
                console.error('Ошибка проверки лимита:', err);
                alert('❌ Ошибка при проверке лимита');
                return;
            }

            // ===== ПРОВЕРКА БАЛАНСА ВЫЗОВОВ =====
            if (!currentUserData) {
                const userDoc = await getDoc(doc(db, "fighters", currentUser.uid));
                if (!userDoc.exists()) {
                    alert('❌ Данные пользователя не найдены');
                    return;
                }
                currentUserData = userDoc.data();
            }

            let freeChallenges = currentUserData.freeChallenges || 0;
            let purchasedChallenges = currentUserData.purchasedChallenges || 0;
            let totalChallenges = freeChallenges + purchasedChallenges;

            if (totalChallenges <= 0) {
                if (confirm('❌ У вас закончились вызовы!\nПерейти в магазин?')) {
                    window.location.href = 'shop.html';
                }
                return;
            }

            const btn = document.getElementById('publishOfferConfirm');
            btn.disabled = true;
            btn.innerHTML = '<div class="loading-spinner" style="width:20px;height:20px;"></div> Публикация...';

            try {
                // ===== СПИСЫВАЕМ ВЫЗОВ =====
                if (freeChallenges > 0) {
                    await updateDoc(doc(db, "fighters", currentUser.uid), {
                        freeChallenges: freeChallenges - 1
                    });
                } else {
                    await updateDoc(doc(db, "fighters", currentUser.uid), {
                        purchasedChallenges: purchasedChallenges - 1
                    });
                }

                // ===== СОЗДАЁМ ПРЕДЛОЖЕНИЕ =====
                await addDoc(collection(db, "sparring_offers"), {
                    userId: currentUser.uid,
                    userName: currentUserData?.name || 'Боец',
                    userCity: currentUserData?.city || '—',
                    userWeight: currentUserData?.weightClass || '—',
                    sport: sport,
                    place: place,
                    date: date,
                    message: message || '',
                    status: 'active',
                    createdAt: new Date(),
                    expiresAt: new Date(Date.now() + 7 * 24 * 60 * 60 * 1000)
                });

                alert('✅ Предложение опубликовано! Потрачен 1 вызов.');
                document.getElementById('offerModal').classList.remove('active');
                document.getElementById('offerMessage').value = '';
                document.getElementById('offerDate').value = '';
                document.getElementById('offerHall').value = '';
                document.getElementById('manualHallInput').value = '';
                document.getElementById('manualHallContainer').style.display = 'none';
                
                updateHeaderBalance();
                loadOffers();
                loadChallenges();

            } catch (err) {
                console.error('Ошибка:', err);
                alert('❌ Ошибка при публикации');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Опубликовать';
            }
        }

        function initFilters() {
            document.getElementById('filterSport').addEventListener('change', loadOffers);
            document.getElementById('filterCity').addEventListener('input', loadOffers);
            document.getElementById('filterWeight').addEventListener('change', loadOffers);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
        }

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        initTabs();
        initFilters();

        document.getElementById('offerHall')?.addEventListener('change', toggleManualHallInput);

        document.getElementById('clearHistoryBtn')?.addEventListener('click', clearHistory);
        document.getElementById('refreshChallengesBtn')?.addEventListener('click', loadChallenges);

        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            if (user) {
                const userDoc = await getDoc(doc(db, "fighters", user.uid));
                currentUserData = userDoc.data();
                updateHeaderBalance();
                await loadHalls();
                loadChallenges();
                loadOffers();
            } else {
                const balanceDiv = document.getElementById('balanceIndicator');
                if (balanceDiv) balanceDiv.style.display = 'none';
                document.getElementById('incomingList').innerHTML = '<div class="empty-state"><i class="fas fa-lock"></i><p>Войдите, чтобы видеть вызовы</p></div>';
                document.getElementById('outgoingList').innerHTML = '<div class="empty-state"><i class="fas fa-lock"></i><p>Войдите, чтобы видеть вызовы</p></div>';
                document.getElementById('offersList').innerHTML = '<div class="empty-state"><i class="fas fa-lock"></i><p>Войдите, чтобы видеть предложения</p></div>';
            }
        });

        document.getElementById('publishOfferBtn').addEventListener('click', () => {
            if (!currentUser) { alert('Войдите в аккаунт'); return; }
            document.getElementById('offerModal').classList.add('active');
        });

        document.getElementById('closeOfferModal').addEventListener('click', () => {
            document.getElementById('offerModal').classList.remove('active');
        });

        document.getElementById('publishOfferConfirm').addEventListener('click', publishOffer);

        document.getElementById('offerModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('offerModal')) {
                document.getElementById('offerModal').classList.remove('active');
            }
        });

        const plusBtn = document.getElementById('balancePlusBtn');
        if (plusBtn) plusBtn.onclick = () => window.location.href = 'shop.html';

        const menuToggle = document.getElementById('menuToggle');
        const navLinks = document.getElementById('navLinks');
        if (menuToggle && navLinks) {
            menuToggle.addEventListener('click', () => {
                navLinks.classList.toggle('show');
            });

            navLinks.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    navLinks.classList.remove('show');
                });
            });
        }
    </script>
</body>
</html>
