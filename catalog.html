<!DOCTYPE html>
<html lang="ru">
<head>
    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="/prorank-live/manifest.json">
    <link rel="apple-touch-icon" href="/prorank-live/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PRORANK">
    <meta name="theme-color" content="#fbbf24">
    <meta name="mobile-web-app-capable" content="yes">
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://www.gstatic.com">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#fbbf24">
    <meta name="description" content="Каталог товаров PRORANK — экипировка, спорт-пит, одежда, аксессуары">
    <title>Каталог товаров | PRORANK</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(ellipse at 30% 40%, rgba(251, 191, 36, 0.15) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 80%, rgba(251, 191, 36, 0.08) 0%, transparent 50%),
                        linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 40%, #1a1a1a 100%);
            background-attachment: fixed;
            color: #fff;
            line-height: 1.4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main { flex: 1; }

        .gold-top { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 3px; 
            background: linear-gradient(90deg, #fbbf24, #ffdd88, #fbbf24, #b8860b); 
            z-index: 1001; 
        }

        .container { 
            max-width: 1400px; 
            margin: 0 auto; 
            padding: 0 24px; 
            position: relative; 
            z-index: 2;
            width: 100%;
        }

        /* ===== ХЕДЕР СТРАНИЦЫ ===== */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 8px 0 16px;
        }

        .page-header h1 { 
            font-size: clamp(1.5rem, 4vw, 1.8rem); 
            font-weight: 800; 
            background: linear-gradient(135deg, #fff, #fbbf24); 
            background-clip: text; 
            color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-header h1 i {
            color: #fbbf24;
            background: none;
            -webkit-text-fill-color: #fbbf24;
        }

        .header-icons {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-icon-btn {
            background: rgba(251,191,36,0.08);
            border: 1px solid rgba(251,191,36,0.15);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            color: #fbbf24;
            font-size: 1.1rem;
        }

        .header-icon-btn:hover {
            background: rgba(251,191,36,0.2);
            transform: scale(1.05);
        }

        .header-icon-btn:active {
            transform: scale(0.95);
        }

        .header-icon-btn .badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #fbbf24;
            color: #000;
            font-size: 0.55rem;
            font-weight: 700;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 18px;
            padding: 0 4px;
        }

        .header-icon-btn .badge-red {
            background: #ef4444;
            color: #fff;
        }

        /* ===== КНОПКА "МОИ ТОВАРЫ" ДЛЯ ПРОДАВЦА ===== */
        .seller-btn {
            background: rgba(251,191,36,0.12);
            border: 1px solid rgba(251,191,36,0.3);
            color: #fbbf24;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 44px;
            text-decoration: none;
        }

        .seller-btn:hover {
            background: rgba(251,191,36,0.2);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(251,191,36,0.15);
        }

        .seller-btn:active {
            transform: scale(0.96);
        }

        .seller-btn i {
            font-size: 0.9rem;
        }

        /* ===== ПОИСК (единственный фильтр) ===== */
        .search-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 12px;
        }

        .search-group {
            flex: 1;
            position: relative;
        }

        .search-group .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-size: 0.9rem;
            pointer-events: none;
            transition: color 0.25s ease;
        }

        .search-group input {
            width: 100%;
            padding: 12px 18px 12px 44px;
            background: rgba(15,15,15,0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(251,191,36,0.1);
            border-radius: 30px;
            color: #fff;
            font-size: 0.85rem;
            transition: all 0.25s ease;
            font-family: 'Inter', sans-serif;
        }

        .search-group input::placeholder {
            color: #555;
        }

        .search-group input:focus {
            outline: none;
            border-color: #fbbf24;
            box-shadow: 0 0 0 3px rgba(251,191,36,0.08);
            background: rgba(0,0,0,0.5);
        }

        .search-group:focus-within .search-icon {
            color: #fbbf24;
        }

        /* ===== КАТЕГОРИИ ===== */
        .categories-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 4px 0 18px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .categories-scroll::-webkit-scrollbar { display: none; }

        .category-chip {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 10px 6px;
            background: none;
            border: none;
            color: #888;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: 'Inter', sans-serif;
            flex-shrink: 0;
            min-width: 76px;
        }

        .category-chip .cat-icon-wrap {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
        }

        .category-chip .cat-icon-wrap svg {
            width: 26px;
            height: 26px;
            stroke: #aaa;
            fill: none;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.25s ease;
        }

        .category-chip:hover .cat-icon-wrap {
            background: rgba(251,191,36,0.06);
            border-color: rgba(251,191,36,0.2);
            transform: translateY(-3px);
        }

        .category-chip:hover .cat-icon-wrap svg {
            stroke: #fbbf24;
        }

        .category-chip:hover {
            color: #fff;
        }

        .category-chip.active .cat-icon-wrap {
            background: #fbbf24;
            border-color: #fbbf24;
            box-shadow: 0 4px 20px rgba(251,191,36,0.25);
        }

        .category-chip.active .cat-icon-wrap svg {
            stroke: #000;
        }

        .category-chip.active {
            color: #fbbf24;
            font-weight: 600;
        }

        /* ===== СЧЁТЧИК ===== */
        .products-counter {
            font-size: 0.75rem;
            color: #666;
            margin-bottom: 12px;
            padding: 0 4px;
        }
        .products-counter span { color: #fbbf24; font-weight: 600; }

        /* ============================================================
           СКЕЛЕТОНЫ
           ============================================================ */
        .skeleton-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
            margin: 16px 0 24px;
        }

        .skeleton-card {
            background: rgba(15, 15, 15, 0.5);
            border-radius: 16px;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            animation: pulse 1.5s ease-in-out infinite;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            min-height: 320px;
        }

        .skeleton-card .skeleton-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .skeleton-card .skeleton-title {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 4px;
        }

        .skeleton-card .skeleton-title .line {
            height: 18px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 6px;
            display: block;
        }

        .skeleton-card .skeleton-title .line:first-child { width: 85%; }
        .skeleton-card .skeleton-title .line:last-child { width: 70%; }

        .skeleton-card .skeleton-rating {
            height: 14px;
            width: 50%;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 6px;
            margin: 4px 0;
        }

        .skeleton-card .skeleton-store {
            height: 12px;
            width: 60%;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 6px;
            margin-bottom: 4px;
        }

        .skeleton-card .skeleton-price-block {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 4px 0 8px;
        }

        .skeleton-card .skeleton-price {
            height: 20px;
            width: 40%;
            background: rgba(251, 191, 36, 0.15);
            border-radius: 6px;
        }

        .skeleton-card .skeleton-old-price {
            height: 14px;
            width: 25%;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 6px;
        }

        .skeleton-card .skeleton-actions {
            display: flex;
            gap: 8px;
            margin-top: auto;
            padding-top: 4px;
        }

        .skeleton-card .skeleton-actions .skeleton-btn {
            height: 36px;
            border-radius: 40px;
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
        }

        .skeleton-card .skeleton-actions .skeleton-btn:last-child {
            flex: 0 0 44px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ============================================================
           ТОВАРЫ
           ============================================================ */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
            margin: 16px 0 24px;
        }

        .product-card {
            background: rgba(15,15,15,0.5);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 12px;
            border: 1px solid rgba(251,191,36,0.06);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            animation: fadeInUp 0.4s ease both;
            height: 100%;
        }

        .product-card:hover { 
            transform: translateY(-5px); 
            border-color: rgba(251,191,36,0.25);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .product-card:active { transform: translateY(-2px); }

        .product-card:nth-child(1) { animation-delay: 0.05s; }
        .product-card:nth-child(2) { animation-delay: 0.1s; }
        .product-card:nth-child(3) { animation-delay: 0.15s; }
        .product-card:nth-child(4) { animation-delay: 0.2s; }
        .product-card:nth-child(5) { animation-delay: 0.25s; }
        .product-card:nth-child(6) { animation-delay: 0.3s; }
        .product-card:nth-child(7) { animation-delay: 0.35s; }
        .product-card:nth-child(8) { animation-delay: 0.4s; }

        .product-image-wrap {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            overflow: hidden;
            background: #1a1a1a;
            position: relative;
            margin-bottom: 10px;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .product-card:hover .product-image {
            transform: scale(1.04);
        }

        .product-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 3px 10px;
            border-radius: 30px;
            font-size: 0.55rem;
            font-weight: 600;
            z-index: 2;
        }

        .badge-hit { background: rgba(239,68,68,0.9); color: #fff; }
        .badge-sale { background: rgba(251,191,36,0.9); color: #000; }
        .badge-new { background: rgba(16,185,129,0.9); color: #fff; }

        .product-favorite {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            border: none;
            color: #666;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
        }

        .product-favorite:hover { transform: scale(1.1); background: rgba(0,0,0,0.7); }
        .product-favorite.active { color: #ef4444; }

        .product-rating {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 4px 0;
            font-size: 0.7rem;
        }

        .stars { color: #fbbf24; letter-spacing: 1px; }
        .rating-count { color: #666; font-size: 0.6rem; }

        .product-title { 
            font-size: 0.85rem; 
            font-weight: 600; 
            color: #eee;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 38px;
            line-height: 1.3;
        }

        .product-store { 
            font-size: 0.6rem; 
            color: #666; 
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .product-store i { 
            color: #fbbf24;
            font-size: 0.5rem;
        }

        .product-price-block {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 4px 0 8px;
            flex-wrap: wrap;
        }

        .product-price { 
            font-size: 1rem; 
            font-weight: 700; 
            color: #fbbf24;
        }

        .product-old-price {
            font-size: 0.7rem;
            color: #555;
            text-decoration: line-through;
        }

        /* ===== ПОЛОСКА ОСТАТКА ===== */
        .stock-bar-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 4px 0 6px;
        }

        .stock-bar-track {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            overflow: hidden;
        }

        .stock-bar-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        .stock-bar-text {
            font-size: 0.6rem;
            font-weight: 500;
            white-space: nowrap;
            min-width: 70px;
            text-align: right;
        }

        .stock-bar-text.in-stock { color: #22c55e; }
        .stock-bar-text.medium-stock { color: #fbbf24; }
        .stock-bar-text.low-stock { color: #f59e0b; }
        .stock-bar-text.out-of-stock { color: #ef4444; }

        /* ===== КНОПКИ ===== */
        .product-actions {
            display: flex;
            gap: 8px;
            margin-top: auto;
        }

        .btn-add-to-cart {
            background: #fbbf24;
            color: #000;
            border: none;
            padding: 8px 12px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.7rem;
            cursor: pointer;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.2s ease;
            min-height: 36px;
            font-family: 'Inter', sans-serif;
        }

        .btn-add-to-cart:hover {
            background: #ffdd44;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(251,191,36,0.25);
        }

        .btn-add-to-cart:active { transform: scale(0.96); }

        .btn-buy-now {
            background: rgba(251,191,36,0.12);
            color: #fbbf24;
            border: 1px solid rgba(251,191,36,0.12);
            padding: 8px 12px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 5px;
            min-height: 36px;
            white-space: nowrap;
            flex: 1;
        }

        .btn-buy-now:hover {
            background: rgba(251,191,36,0.2);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(251,191,36,0.1);
        }

        .btn-buy-now:active {
            transform: scale(0.95);
        }

        .btn-buy-now i {
            font-size: 0.7rem;
        }

        /* ===== СООБЩЕНИЕ ДЛЯ ПРОДАВЦА ===== */
        .seller-message {
            background: rgba(251,191,36,0.06);
            border: 1px solid rgba(251,191,36,0.15);
            border-radius: 12px;
            padding: 12px 16px;
            color: #888;
            font-size: 0.8rem;
            text-align: center;
            width: 100%;
        }

        .seller-message i {
            color: #fbbf24;
            margin-right: 8px;
        }

        /* ===== МОДАЛЬНОЕ ОКНО ===== */
        .product-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(16px);
            justify-content: center;
            align-items: center;
            z-index: 2000;
            animation: fadeIn 0.2s ease;
            padding: 16px;
        }

        .product-modal-content {
            background: #151515;
            border-radius: 24px;
            padding: 24px;
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(251,191,36,0.3);
            animation: slideUp 0.3s ease;
            position: relative;
        }

        .product-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .product-modal-header h2 { color: #fbbf24; font-size: 1.3rem; }

        .close-modal {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-modal:hover {
            background: rgba(251,191,36,0.2);
            transform: rotate(90deg);
        }

        .product-modal-body {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ===== ОБЁРТКА ДЛЯ ФОТО С КНОПКОЙ МАГАЗИНА ===== */
        .modal-image-wrapper {
            position: relative;
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            background: #0a0a0a;
        }

        .product-modal-image {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            display: block;
        }

        /* ===== КНОПКА "ПЕРЕЙТИ В ПРОФИЛЬ МАГАЗИНА" ===== */
        .modal-store-btn {
            position: absolute;
            bottom: 12px;
            left: 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(251,191,36,0.3);
            color: #fff;
            padding: 8px 14px 8px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.25s ease;
            max-width: calc(100% - 24px);
            text-decoration: none;
        }

        .modal-store-btn:hover {
            background: rgba(251,191,36,0.15);
            border-color: #fbbf24;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        .modal-store-btn:active {
            transform: scale(0.97);
        }

        .modal-store-btn .store-btn-icon {
            color: #fbbf24;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .modal-store-btn .store-btn-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

                <div class="skeleton-actions"><div class="skeleton-btn"></div><div class="skeleton-btn"></div></div>
            `;

    // ===== ЗВЕЗДОЧКИ =====
    function initStarsInput() {
        const stars = document.querySelectorAll('#starsInput i');
        stars.forEach(star => {
            star.removeEventListener('click', handleStarClick);
            star.addEventListener('click', handleStarClick);
            star.removeEventListener('mouseenter', handleStarHover);
            star.addEventListener('mouseenter', handleStarHover);
        });
        const starsContainer = document.getElementById('starsInput');
        starsContainer.removeEventListener('mouseleave', handleStarsLeave);
        starsContainer.addEventListener('mouseleave', handleStarsLeave);
    }
    
    function handleStarClick(e) {
        currentRating = parseInt(e.target.dataset.rating);
        updateStarsUI(currentRating);
    }
    function handleStarHover(e) {
        updateStarsUI(parseInt(e.target.dataset.rating));
    }
    function handleStarsLeave() {
        updateStarsUI(currentRating);
    }
    function updateStarsUI(rating) {
        document.querySelectorAll('#starsInput i').forEach((s, index) => {
            s.className = index < rating ? 'fas fa-star' : 'far fa-star';
        });
    }

    // ===== БАЛАНС =====
    async function updateHeaderBalance() {
        const user = auth.currentUser;
        const balanceDiv = document.getElementById('balanceIndicator');
        const balanceCount = document.getElementById('headerChallengesCount');
        if (!user || !balanceDiv) return;
        try {
            const userDoc = await getDoc(doc(db, "fighters", user.uid));
            const data = userDoc.data();
            const total = (data.freeChallenges || 0) + (data.purchasedChallenges || 0);
            balanceCount.innerText = total;
            balanceDiv.style.display = 'flex';
        } catch (err) { console.error(err); }

    // ===== КОРЗИНА =====
    function updateCartCount() {
        if (isSeller) {
            const cartIcon = document.getElementById('cartIcon');
            if (cartIcon) cartIcon.style.display = 'none';
            return;
        }
        const cart = JSON.parse(localStorage.getItem('cart') || '[]');
        const cartCount = document.getElementById('cartCount');
        if (cartCount) cartCount.innerText = cart.length;
        const cartIcon = document.getElementById('cartIcon');
        if (cartIcon) cartIcon.style.display = 'flex';

    // ===== СЧЁТЧИК АКТИВНЫХ ЗАКАЗОВ =====
    async function updateOrdersCount() {
        if (!currentUser || isSeller) {
            const badge = document.getElementById('ordersCount');
            if (badge) badge.style.display = 'none';
            return;
        }
        try {
            const q = query(
                collection(db, "physical_orders"),
                where("userId", "==", currentUser.uid)
            );
            const snapshot = await getDocs(q);
            let count = 0;
            snapshot.forEach(docSnap => {
                const status = docSnap.data().status;
                if (status === 'pending' || status === 'paid' || status === 'shipped' || status === 'delivered') {
                    count++;
                }
            });
            const badge = document.getElementById('ordersCount');
            if (badge) {
                if (count > 0) {
                    badge.innerText = count > 99 ? '99+' : count;
                    badge.style.display = 'flex';
                } else {
                    badge.style.display = 'none';
                }
            }
        } catch (err) {
            console.error('Ошибка подсчёта заказов:', err);
            const badge = document.getElementById('ordersCount');
            if (badge) badge.style.display = 'none';
        }
    }

    // ===== ИЗБРАННОЕ =====
    async function loadFavorites() {
        if (!currentUser || isSeller) return;
        try {
            const favRef = collection(db, "users", currentUser.uid, "favorites");
            const snapshot = await getDocs(favRef);
            favorites = snapshot.docs.map(d => d.id);
            const favCount = document.getElementById('favoritesCount');
            if (favCount) favCount.innerText = favorites.length;
        } catch (err) {
            console.error('Ошибка загрузки избранного:', err);
        }
    }

    async function toggleFavorite(productId) {
        if (!currentUser || isSeller) {
            showNotification('Войдите в аккаунт', 'warning');
            return;
        }
        try {
            const favRef = doc(db, "users", currentUser.uid, "favorites", productId);
            if (favorites.includes(productId)) {
                await deleteDoc(favRef);
                favorites = favorites.filter(id => id !== productId);
                showNotification('Удалено из избранного', 'info');
            } else {
                await setDoc(favRef, { productId, addedAt: new Date() });
                favorites.push(productId);
                showNotification('Добавлено в избранное', 'success');
            }
            const favCount = document.getElementById('favoritesCount');
            if (favCount) favCount.innerText = favorites.length;
            applyFilters();
        } catch (err) {
            console.error('Ошибка избранного:', err);
            showNotification('Ошибка', 'error');
        }
    }

    // ===== ПАРТНЁРЫ =====
    async function loadPartners() {
        try {
            const snapshot = await getDocs(collection(db, "partners"));
            allPartners = snapshot.docs.map(doc => ({ id: doc.id, name: doc.data().name }));
        } catch (err) {
            console.error('Ошибка загрузки партнёров:', err);
        }
    }

    // ===== ОТЗЫВЫ =====
    async function loadProductReviews(productId) {
        const reviewsList = document.getElementById('reviewsList');
        try {
            const reviewsQuery = query(
                collection(db, "reviews"),
                where("productId", "==", productId),
                orderBy("createdAt", "desc")
            );
            const snapshot = await getDocs(reviewsQuery);
            if (snapshot.empty) {
                reviewsList.innerHTML = '<div class="empty-reviews">Нет отзывов. Будьте первым!</div>';
                return;
            }
            let html = '';
            snapshot.forEach(docSnap => {
                const review = docSnap.data();
                html += `
                    <div class="review-item">
                        <div class="review-header">
                            <span class="review-author"><i class="fas fa-user"></i> ${escapeHtml(review.userName || 'Покупатель')}</span>
                            <span class="review-stars">${'★'.repeat(review.rating)}${'☆'.repeat(5-review.rating)}</span>
                            <span class="review-date">${review.createdAt?.toDate().toLocaleDateString() || '—'}</span>
                        </div>
                        <div class="review-text">${escapeHtml(review.text)}</div>
                        ${review.reply ? `<div class="review-reply"><i class="fas fa-reply"></i> Продавец: ${escapeHtml(review.reply)}</div>` : ''}
                    </div>
                `;
            });
            reviewsList.innerHTML = html;
        } catch (err) {
            console.error('Ошибка загрузки отзывов:', err);
            reviewsList.innerHTML = '<div class="empty-reviews">Ошибка загрузки отзывов</div>';
        }
    }

    async function getProductRating(productId) {
        try {
            const reviewsQuery = query(collection(db, "reviews"), where("productId", "==", productId));
            const snapshot = await getDocs(reviewsQuery);
            if (snapshot.empty) return { rating: 0, count: 0 };
            let sum = 0;
            snapshot.forEach(docSnap => sum += docSnap.data().rating);
            return { rating: sum / snapshot.size, count: snapshot.size };
        } catch (err) {
            return { rating: 0, count: 0 };
        }
    }

    // ===== ЗАГРУЗКА ТОВАРОВ =====
    async function loadProducts() {
        renderSkeletons();
        try {
            const snapshot = await getDocs(collection(db, "products"));
            allProducts = [];
            for (const docSnap of snapshot.docs) {
                const product = { id: docSnap.id, ...docSnap.data() };
                const ratingData = await getProductRating(product.id);
                product.rating = ratingData.rating;
                product.ratingCount = ratingData.count;
                allProducts.push(product);
            }
            await loadFavorites();
            applyFilters();
        } catch (err) {
            console.error('Ошибка загрузки товаров:', err);
            document.getElementById('productsGrid').innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i> Ошибка загрузки</div>';
        }
    }

    // ===== ФИЛЬТРЫ (поиск + категория) =====
    function applyFilters() {
        let filtered = [...allProducts];
        
        if (currentCategory !== 'all') {
            filtered = filtered.filter(p => p.category === currentCategory);
        }
        
        const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
        if (searchTerm) {
            filtered = filtered.filter(p => 
                p.name?.toLowerCase().includes(searchTerm) || 
                p.desc?.toLowerCase().includes(searchTerm)
            );
        }
        
        filtered.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
        
        document.getElementById('productsCount').innerText = filtered.length;
        renderProducts(filtered);
    }

    // ===== РЕНДЕР ТОВАРОВ =====
    function renderProducts(products) {
        const container = document.getElementById('productsGrid');
        if (products.length === 0) {
            container.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><i class="fas fa-search"></i><p>Ничего не найдено</p></div>';
            return;
        }
        
        let html = '';
        products.forEach(product => {
            const stars = '★'.repeat(Math.round(product.rating || 0)) + '☆'.repeat(5 - Math.round(product.rating || 0));
            const isFavorite = favorites.includes(product.id);
            
            const stock = product.stock !== undefined ? product.stock : 999;
            const maxStock = 100;
            
            let barColor = '#22c55e';
            let statusText = 'В наличии';
            let statusClass = 'in-stock';
            
            if (stock === 0) {
                barColor = '#ef4444';
                statusText = 'Нет в наличии';
                statusClass = 'out-of-stock';
            } else if (stock < 5) {
                barColor = '#ef4444';
                statusText = `Осталось ${stock} шт`;
                statusClass = 'low-stock';
            } else if (stock < 20) {
                barColor = '#f59e0b';
                statusText = `Осталось ${stock} шт`;
                statusClass = 'low-stock';
            } else if (stock < 50) {
                barColor = '#fbbf24';
                statusText = `Осталось ${stock} шт`;
                statusClass = 'medium-stock';
            }
            
            const barPercent = stock === 0 ? 0 : Math.min((stock / maxStock) * 100, 100);
            
            let storeName = product.partnerName;
            if (!storeName && product.partnerId) {
                const partner = allPartners.find(p => p.id === product.partnerId);
                storeName = partner ? partner.name : 'Магазин';
            }
            
            const productForCart = {
                id: product.id,
                name: product.name,
                price: product.price,
                image: product.image,
                desc: product.desc || '',
                partnerId: product.partnerId || null,
                partnerName: storeName || null,
                stock: stock
            };
            
            let badgeHtml = '';
            if (product.badge === 'hit') {
                badgeHtml = `<span class="product-badge badge-hit">Хит</span>`;
            } else if (product.badge === 'sale') {
                const discount = product.oldPrice ? Math.round((1 - product.price / product.oldPrice) * 100) : '';
                badgeHtml = `<span class="product-badge badge-sale">-${discount}%</span>`;
            } else if (product.badge === 'new') {
                badgeHtml = `<span class="product-badge badge-new">Новинка</span>`;
            }
            
            const isProductOwner = isSeller && product.partnerId === currentUser?.uid;
            
            let buyButtons = '';
            if (isSeller) {
                if (isProductOwner) {
                    buyButtons = `
                        <div class="seller-message" style="margin-top:4px;">
                            <i class="fas fa-edit"></i> Ваш товар
                        </div>
                    `;
                } else {
                    buyButtons = `
                        <div class="seller-message" style="margin-top:4px;">
                            <i class="fas fa-store"></i> Вы — продавец
                        </div>
                    `;
                }
            } else if (stock > 0) {
                const cartJson = escapeHtml(JSON.stringify(productForCart));
                buyButtons = `
                    <button class="btn-add-to-cart" data-product='${cartJson}'><i class="fas fa-cart-plus"></i> В корзину</button>
                    <button class="btn-buy-now" data-product='${cartJson}'><i class="fas fa-bolt"></i> Купить</button>
                `;
            } else {
                buyButtons = `
                    <button class="btn-add-to-cart" style="background:#2a2a2a;color:#555;cursor:not-allowed;opacity:0.6;" disabled><i class="fas fa-times"></i> Нет в наличии</button>
                `;
            }
            
            const safeProductId = escapeHtml(product.id);
            const safeImage = safeImageUrl(product.image);
            const safeTitle = escapeHtml(product.name);

            html += `
                <div class="product-card" data-product-id="${safeProductId}">
                    <div class="product-image-wrap">
                        ${safeImage ? `<img src="${safeImage}" alt="${safeTitle}" class="product-image" loading="lazy" onerror="this.src='https://placehold.co/300x200/1a1a1a/fbbf24?text=No+Image'">` : '<div class="product-image" style="display:flex;align-items:center;justify-content:center;background:#1a1a1a;height:100%;"><i class="fas fa-image" style="font-size: 2rem; color: #555;"></i></div>'}
                        ${badgeHtml}
                        ${!isSeller ? `<button class="product-favorite ${isFavorite ? 'active' : ''}" data-product-id="${safeProductId}">
                            <i class="${isFavorite ? 'fas' : 'far'} fa-heart"></i>
                        </button>` : ''}
                    </div>
                    <div class="product-title">${escapeHtml(product.name)}</div>
                    <div class="product-rating">
                        <span class="stars">${stars}</span>
                        <span class="rating-count">(${product.ratingCount || 0})</span>
                    </div>
                    <div class="product-store"><i class="fas fa-store"></i> ${escapeHtml(storeName || 'Магазин')}</div>
                    <div class="product-price-block">
                        <span class="product-price">${(product.price || 0).toLocaleString()} ₽</span>
                        ${product.oldPrice ? `<span class="product-old-price">${product.oldPrice.toLocaleString()} ₽</span>` : ''}
                    </div>
                    ${stock > 0 ? `
                    <div class="stock-bar-wrap">
                        <div class="stock-bar-track">
                            <div class="stock-bar-fill" style="width:${barPercent}%;background:${barColor};"></div>
                        </div>
                        <div class="stock-bar-text ${statusClass}">${statusText}</div>
                    </div>
                    ` : `
                    <div class="stock-bar-wrap">
                        <div class="stock-bar-track" style="background:rgba(239,68,68,0.1);">
                            <div class="stock-bar-fill" style="width:0%;background:#ef4444;"></div>
                        </div>
                        <div class="stock-bar-text out-of-stock">${statusText}</div>
                    </div>
                    `}
                    <div class="product-actions">
                        ${buyButtons}
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
        
        // ===== КЛИК ПО КАРТОЧКЕ =====
        document.querySelectorAll('.product-card').forEach(card => {
            card.addEventListener('click', async (e) => {
                if (e.target.closest('.product-favorite') || e.target.closest('.btn-add-to-cart') || e.target.closest('.btn-buy-now')) return;
                const productId = card.dataset.productId;
                const product = allProducts.find(p => p.id === productId);
                if (product) await openProductModal(product);
            });
        });
        
        // ===== ИЗБРАННОЕ =====
        if (!isSeller) {
            document.querySelectorAll('.product-favorite').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    await toggleFavorite(btn.dataset.productId);
                });
            });
        }
        
        // ===== В КОРЗИНУ =====
        if (!isSeller) {
            document.querySelectorAll('.btn-add-to-cart:not([disabled])').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (!currentUser) {
                        showNotification('Войдите в аккаунт', 'warning');
                        setTimeout(() => window.location.href = 'login.html', 1000);
                        return;
                    }
                    
                    const product = JSON.parse(btn.dataset.product);
                    
                    if (!product.partnerId) {
                        showNotification('Ошибка: у товара нет продавца', 'error');
                        return;
                    }
                    
                    if (product.partnerId === currentUser?.uid) {
                        showNotification('Вы не можете купить свой товар', 'warning');
                        return;
                    }
                    
                    let cart = JSON.parse(localStorage.getItem('cart') || '[]');
                    cart.push({
                        id: product.id,
                        name: product.name,
                        price: product.price,
                        image: product.image,
                        desc: product.desc,
                        partnerId: product.partnerId,
                        partnerName: product.partnerName
                    });
                    localStorage.setItem('cart', JSON.stringify(cart));
                    updateCartCount();
                    showNotification(`${product.name} добавлен в корзину`, 'success');
                    const originalText = btn.innerHTML;
                    btn.innerHTML = '<i class="fas fa-check"></i> Добавлено!';
                    btn.style.background = '#10b981';
                    btn.style.color = '#fff';
                    setTimeout(() => {
                        btn.innerHTML = originalText;
                        btn.style.background = '';
                        btn.style.color = '';
                    }, 1200);
                });
            });
            
            document.querySelectorAll('.btn-buy-now').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (!currentUser) {
                        showNotification('Войдите в аккаунт', 'warning');
                        setTimeout(() => window.location.href = 'login.html', 1000);
                        return;
                    }
                    
                    const product = JSON.parse(btn.dataset.product);
                    
                    if (!product.partnerId) {
                        showNotification('Ошибка: у товара нет продавца', 'error');
                        return;
                    }
                    
                    if (product.partnerId === currentUser?.uid) {
                        showNotification('Вы не можете купить свой товар', 'warning');
                        return;
                    }
                    
                    let cart = JSON.parse(localStorage.getItem('cart') || '[]');
                    cart = [{
                        id: product.id,
                        name: product.name,
                        price: product.price,
                        image: product.image,
                        desc: product.desc,
                        partnerId: product.partnerId,
                        partnerName: product.partnerName
                    }];
                    localStorage.setItem('cart', JSON.stringify(cart));
                    showNotification(`Быстрая покупка: ${product.name}`, 'success');
                    setTimeout(() => {
                        window.location.href = 'cart.html';
                    }, 800);
                });
            });
        }
    }

    // ===== МОДАЛЬНОЕ ОКНО =====

        const modal = document.getElementById('productModal');
        
        let storeName = product.partnerName;

        }
        
        document.getElementById('modalProductTitle').innerText = product.name;
        document.getElementById('modalProductPrice').innerHTML = `${(product.price || 0).toLocaleString()} ₽`;

        // ===== КНОПКА "ПЕРЕЙТИ В ПРОФИЛЬ МАГАЗИНА" =====

        const storeNameSpan = document.getElementById('modalStoreName');

        const modalImage = document.getElementById('modalProductImage');

        if (modalImageUrl) {

            modalImage.style.display = 'block';

        }

        const modalSellerMessage = document.getElementById('modalSellerMessage');
        
        if (isSeller) {

            modalSellerMessage.style.display = 'block';
        } else {
            modalActions.style.display = 'flex';
            modalSellerMessage.style.display = 'none';
        }
        
        const reviewForm = document.getElementById('reviewForm');
        if (currentUser && !isSeller) {
            reviewForm.style.display = 'block';
            currentRating = 0;
            updateStarsUI(0);

            initStarsInput();
        } else {
            reviewForm.style.display = 'none';
        }
        
        modal.style.display = 'flex';
    }

    // ===== ОТПРАВКА ОТЗЫВА =====
    async function submitReview() {
        if (!currentUser || isSeller) {
            showNotification('Войдите в аккаунт', 'warning');
            return;
        }
        if (currentRating === 0) {
            showNotification('Поставьте оценку', 'warning');
            return;
        }
        const reviewText = document.getElementById('reviewText').value.trim();
        if (!reviewText) {
            showNotification('Напишите текст отзыва', 'warning');
            return;
        }
        try {
            const userDoc = await getDoc(doc(db, "fighters", currentUser.uid));
            const userData = userDoc.data();
            await addDoc(collection(db, "reviews"), {
                productId: currentProduct.id,
                productName: currentProduct.name,
                partnerId: currentProduct.partnerId,
                userId: currentUser.uid,
                userName: userData?.name || currentUser.email?.split('@')[0] || 'Покупатель',
                rating: currentRating,
                text: reviewText,
                createdAt: new Date()
            });
            showNotification('Спасибо за отзыв!', 'success');
            document.getElementById('reviewText').value = '';
            currentRating = 0;
            updateStarsUI(0);
            await loadProductReviews(currentProduct.id);
            const ratingData = await getProductRating(currentProduct.id);
            const productIndex = allProducts.findIndex(p => p.id === currentProduct.id);
            if (productIndex !== -1) {
                allProducts[productIndex].rating = ratingData.rating;
                allProducts[productIndex].ratingCount = ratingData.count;
            }
            applyFilters();
        } catch (err) {
            console.error('Ошибка:', err);
            showNotification('Ошибка при отправке отзыва', 'error');
        }
    }

    // ===== XSS-защита =====
    function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function safeImageUrl(url) {
        if (!url) return '';
        const raw = String(url).trim();
        if (!/^(https?:\/\/|\/\/|\/|\.\/|\.\.\/)/i.test(raw)) return '';
        return escapeHtml(raw);
    }

            return;
        }
        if (currentProduct) {
            let storeName = currentProduct.partnerName;
            if (!storeName && currentProduct.partnerId) {
                const partner = allPartners.find(p => p.id === currentProduct.partnerId);
                storeName = partner ? partner.name : 'Магазин';
            }
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            cart.push({ 
                id: currentProduct.id, 
                name: currentProduct.name, 
                price: currentProduct.price, 
                image: currentProduct.image,
                desc: currentProduct.desc || '',
                partnerId: currentProduct.partnerId || null,
                partnerName: storeName || null
            });
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            showNotification(`${currentProduct.name} добавлен в корзину`, 'success');
            const btn = document.getElementById('modalAddToCartBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check"></i> Добавлено!';
            btn.style.background = '#10b981';
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.background = '#fbbf24';
            }, 1200);
        }
    });
    
    document.getElementById('modalBuyNowBtn')?.addEventListener('click', () => {
        if (!currentUser || isSeller) {
            showNotification('Войдите в аккаунт', 'warning');
            setTimeout(() => window.location.href = 'login.html', 1000);
            return;
        }
        if (currentProduct) {
            let storeName = currentProduct.partnerName;
            if (!storeName && currentProduct.partnerId) {
                const partner = allPartners.find(p => p.id === currentProduct.partnerId);
                storeName = partner ? partner.name : 'Магазин';
            }
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            cart = [{ 
                id: currentProduct.id, 
                name: currentProduct.name, 
                price: currentProduct.price, 
                image: currentProduct.image,
                desc: currentProduct.desc || '',
                partnerId: currentProduct.partnerId || null,
                partnerName: storeName || null
            }];
            localStorage.setItem('cart', JSON.stringify(cart));
            showNotification(`Быстрая покупка: ${currentProduct.name}`, 'success');
            setTimeout(() => {
                window.location.href = 'cart.html';
            }, 800);
        }
    });

    // ===== АВТОРИЗАЦИЯ И ПРОВЕРКА ПРОДАВЦА =====
    onAuthStateChanged(auth, async (user) => {
        currentUser = user;
        
        if (user) {
            try {
                const partnerDoc = await getDoc(doc(db, "partners", user.uid));
                isSeller = partnerDoc.exists();
                
                if (!isSeller) {
                    const fighterDoc = await getDoc(doc(db, "fighters", user.uid));
                    if (fighterDoc.exists()) {
                        isSeller = fighterDoc.data().isPartner === true;
                    }
                }
                
                const myProductsBtn = document.getElementById('myProductsBtn');
                const cartIcon = document.getElementById('cartIcon');
                const favoritesBtn = document.getElementById('favoritesBtn');
                const ordersBtn = document.getElementById('ordersBtn');
                
                if (isSeller) {
                    myProductsBtn.style.display = 'inline-flex';
                    if (cartIcon) cartIcon.style.display = 'none';
                    if (favoritesBtn) favoritesBtn.style.display = 'none';
                    if (ordersBtn) ordersBtn.style.display = 'none';
                } else {
                    myProductsBtn.style.display = 'none';
                    if (cartIcon) cartIcon.style.display = 'flex';
                    if (favoritesBtn) favoritesBtn.style.display = 'flex';
                    if (ordersBtn) ordersBtn.style.display = 'flex';
                }
            } catch (err) {
                console.error('Ошибка проверки продавца:', err);
                isSeller = false;
            }
            
            setTimeout(() => {
                updateHeaderBalance();
                updateOrdersCount();
            }, 1000);
        } else {
            isSeller = false;
            const balanceDiv = document.getElementById('balanceIndicator');
            if (balanceDiv) balanceDiv.style.display = 'none';
            
            const cartIcon = document.getElementById('cartIcon');
            if (cartIcon) cartIcon.style.display = 'flex';
            const myProductsBtn = document.getElementById('myProductsBtn');
            if (myProductsBtn) myProductsBtn.style.display = 'none';
            const ordersBtn = document.getElementById('ordersBtn');
            if (ordersBtn) ordersBtn.style.display = 'flex';
            
            const ordersCount = document.getElementById('ordersCount');
            if (ordersCount) ordersCount.style.display = 'none';
        }
        
        updateCartCount();
        await loadPartners();
        await loadProducts();
    });

    const plusBtn = document.getElementById('balancePlusBtn');
    if (plusBtn) plusBtn.onclick = () => window.location.href = 'shop.html';

    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');
    if (menuToggle && navLinks) menuToggle.addEventListener('click', () => navLinks.classList.toggle('show'));
    
    console.log('✅ Каталог обновлён по ТЗ');
    </script>
</body>
</html>
