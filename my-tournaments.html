<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="manifest" href="/prorank-live/manifest.json">
    <link rel="apple-touch-icon" href="/prorank-live/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PRORANK">
    <meta name="theme-color" content="#fbbf24">
    <meta name="mobile-web-app-capable" content="yes">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Мои турниры | PRORANK</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(ellipse at 30% 40%, rgba(251, 191, 36, 0.15) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 80%, rgba(251, 191, 36, 0.08) 0%, transparent 50%),
                        linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 40%, #1a1a1a 100%);
            background-attachment: fixed;
            color: #fff;
            line-height: 1.4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .gold-top {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #fbbf24, #ffdd88, #fbbf24, #b8860b);
            z-index: 1001;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(251, 191, 36, 0.25);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            cursor: pointer;
            background: linear-gradient(135deg, #ffffff, #fbbf24);
            background-clip: text;
            color: transparent;
        }

        .logo span {
            background: linear-gradient(135deg, #fbbf24, #ffdd77);
            background-clip: text;
            color: transparent;
        }

        .menu-toggle {
            display: none;
            background: rgba(251,191,36,0.1);
            border: 1px solid #fbbf24;
            color: #fbbf24;
            font-size: 1.6rem;
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 12px;
            min-height: 44px;
            min-width: 44px;
        }

        .nav-links {
            display: flex;
            gap: 6px;
            background: rgba(15,15,15,0.7);
            backdrop-filter: blur(12px);
            padding: 5px 14px;
            border-radius: 60px;
            border: 1px solid rgba(251,191,36,0.2);
        }

        .nav-links a {
            color: #ddd;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 8px 18px;
            border-radius: 40px;
            transition: all 0.2s ease;
        }

        .nav-links a i {
            margin-right: 8px;
            color: #fbbf24;
        }

        .nav-links a:hover {
            color: #fbbf24;
            background: rgba(251,191,36,0.1);
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 24px;
            width: 100%;
            flex: 1;
        }

        /* ===== ХЛЕБНЫЕ КРОШКИ ===== */
        .breadcrumbs {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            font-size: 0.75rem;
            color: #888;
        }

        .breadcrumbs a {
            color: #888;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .breadcrumbs a:hover {
            color: #fbbf24;
        }

        .breadcrumbs i {
            font-size: 0.6rem;
            color: #555;
        }

        .breadcrumbs .current {
            color: #fbbf24;
            font-weight: 600;
        }

        /* ===== ШАПКА СТРАНИЦЫ ===== */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .page-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
        }

        .page-title span {
            color: #fbbf24;
        }

        .page-subtitle {
            font-size: 0.85rem;
            color: #888;
            margin-top: 4px;
        }

        .btn {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.75rem;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 40px;
            min-height: 40px;
            transition: all 0.2s ease;
            white-space: nowrap;
            text-decoration: none;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: #fbbf24;
            color: #0a0a0a;
        }

        .btn-primary:hover {
            background: #ffd94d;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.25);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(251, 191, 36, 0.4);
            color: #fbbf24;
            padding: 8px 16px;
            font-size: 0.7rem;
        }

        /* ===== ФИЛЬТРЫ ===== */
        .filters-row {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-tabs {
            display: flex;
            gap: 4px;
            background: rgba(15,15,15,0.5);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 4px;
            border: 1px solid rgba(251,191,36,0.1);
            flex: 1;
        }

        .filter-tab {
            flex: 1;
            padding: 8px 14px;
            border: none;
            background: transparent;
            color: #888;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.75rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 38px;
            white-space: nowrap;
        }

        .filter-tab:hover {
            color: #fff;
            background: rgba(255,255,255,0.05);
        }

        .filter-tab.active {
            color: #fbbf24;
            background: rgba(251,191,36,0.12);
        }

        .filter-tab .count {
            background: rgba(0,0,0,0.2);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 700;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(15,15,15,0.5);
            border: 1px solid rgba(251,191,36,0.15);
            border-radius: 16px;
            padding: 0 14px;
            min-height: 44px;
            min-width: 240px;
        }

        .search-box i {
            color: #888;
            font-size: 0.8rem;
        }

        .search-box input {
            background: transparent;
            border: none;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            width: 100%;
            outline: none;
        }

        .search-box input::placeholder {
            color: #555;
        }

        /* ===== СЕТКА ТУРНИРОВ ===== */
        .tournament-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }

        .tournament-card {
            background: rgba(15,15,15,0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(251,191,36,0.1);
            border-radius: 20px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .tournament-card:hover {
            border-color: rgba(251,191,36,0.35);
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .tournament-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            gap: 10px;
        }

        .tournament-card .tournament-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: #fff;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.55rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 30px;
            height: 22px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .status-badge i {
            font-size: 0.45rem;
        }

        .status-badge.registration {
            background: rgba(251,191,36,0.12);
            color: #fbbf24;
            border: 1px solid rgba(251,191,36,0.2);
        }

        .status-badge.active {
            background: rgba(16,185,129,0.12);
            color: #10b981;
            border: 1px solid rgba(16,185,129,0.2);
        }

        .status-badge.completed {
            background: rgba(59,130,246,0.12);
            color: #60a5fa;
            border: 1px solid rgba(59,130,246,0.2);
        }

        .status-badge.cancelled {
            background: rgba(239,68,68,0.12);
            color: #ef4444;
            border: 1px solid rgba(239,68,68,0.2);
        }

        .tournament-card .card-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }

        .tournament-card .info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem;
            color: #888;
        }

        .tournament-card .info-item i {
            color: #fbbf24;
            width: 14px;
            font-size: 0.65rem;
            text-align: center;
        }

        .progress-bar {
            height: 5px;
            background: #2a2a2a;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #fbbf24, #ffdd77);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: #666;
            margin-bottom: 12px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .card-footer .participants {
            font-size: 0.7rem;
            color: #888;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-footer .fee {
            font-size: 0.8rem;
            font-weight: 700;
            color: #fbbf24;
        }

        .btn-manage {
            background: rgba(251,191,36,0.1);
            border: 1px solid rgba(251,191,36,0.2);
            color: #fbbf24;
            padding: 6px 14px;
            font-size: 0.65rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            min-height: 30px;
        }

        .btn-manage:hover {
            background: rgba(251,191,36,0.2);
        }

        /* ===== ПУСТОЕ СОСТОЯНИЕ ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state i {
            font-size: 3rem;
            color: #333;
            display: block;
            margin-bottom: 16px;
        }

        .empty-state h3 {
            color: #888;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .empty-state p {
            font-size: 0.8rem;
            margin-bottom: 20px;
        }

        /* ===== ЗАГРУЗКА ===== */
        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .loading-spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid rgba(251,191,36,0.1);
            border-top-color: #fbbf24;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 768px) {
            .container { padding: 0 16px; }
            .navbar { padding: 12px 18px; }
            .menu-toggle { display: block; }

            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 68px;
                left: 18px;
                right: 18px;
                background: #0f0f0f;
                border-radius: 24px;
                padding: 20px;
                gap: 10px;
                border: 1px solid rgba(251,191,36,0.3);
            }

            .nav-links.show { display: flex; }

            .page-title {
                font-size: 1.4rem;
            }

            .filters-row {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                min-width: 100%;
            }

            .tournament-grid {
                grid-template-columns: 1fr;
            }

            .filter-tab {
                font-size: 0.65rem;
                padding: 6px 8px;
            }
        }

        @media (max-width: 480px) {
            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .page-header .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="gold-top"></div>

    <header class="navbar">
        <div class="logo" onclick="window.location='index.html'">PRO<span>RANK</span></div>
        <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
        <nav class="nav-links" id="navLinks"></nav>
    </header>

    <main>
        <div class="container">
            <!-- ХЛЕБНЫЕ КРОШКИ -->
            <div class="breadcrumbs">
                <a href="organization-dashboard.html">Дашборд</a>
                <i class="fas fa-chevron-right"></i>
                <span class="current">Мои турниры</span>
            </div>

            <!-- ШАПКА -->
            <div class="page-header">
                <div>
                    <div class="page-title">Мои <span>турниры</span></div>
                    <div class="page-subtitle">Управляйте всеми своими турнирами</div>
                </div>
                <button class="btn btn-primary" onclick="window.location.href='tournament-create.html'">
                    <i class="fas fa-plus"></i> Создать турнир
                </button>
            </div>

            <!-- ФИЛЬТРЫ -->
            <div class="filters-row">
                <div class="filter-tabs" id="filterTabs">
                    <button class="filter-tab active" data-filter="all">
                        Все <span class="count" id="countAll">0</span>
                    </button>
                    <button class="filter-tab" data-filter="registration">
                        Набор <span class="count" id="countRegistration">0</span>
                    </button>
                    <button class="filter-tab" data-filter="active">
                        Идут <span class="count" id="countActive">0</span>
                    </button>
                    <button class="filter-tab" data-filter="completed">
                        Завершены <span class="count" id="countCompleted">0</span>
                    </button>
                </div>
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Поиск по названию...">
                </div>
            </div>

            <!-- СПИСОК ТУРНИРОВ -->
            <div id="tournamentsList">
                <div class="loading-state">
                    <div class="loading-spinner"></div>
                    Загрузка турниров...
                </div>
            </div>
        </div>
    </main>

    <div id="mobileBottomNavContainer"></div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js"
            }
        }
    </script>
    <script type="module" src="header.js"></script>
        <script type="module">
        import { initializeApp } from "firebase/app";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs, orderBy } from "firebase/firestore";
        import { getAuth, onAuthStateChanged } from "firebase/auth";

        const firebaseConfig = {
            apiKey: "AIzaSyDUGYJY7pX7q02MS5SACMIIQXpjpQ97mPw",
            authDomain: "proranklive.firebaseapp.com",
            projectId: "proranklive",
            storageBucket: "proranklive.firebasestorage.app",
            messagingSenderId: "716836144015",
            appId: "1:716836144015:web:f1575147750608d0f881fa"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentOrgId = null;
        let allTournaments = [];
        let currentFilter = 'all';
        let searchQuery = '';

        // Форматирование даты в читаемый вид (25.10.2024)
        const formatDate = (dateStr) => {
            if (!dateStr) return '—';
            return new Date(dateStr + 'T00:00:00').toLocaleDateString('ru-RU');
        };

        // ===== ФИЛЬТРЫ =====
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentFilter = tab.dataset.filter;
                renderTournaments();
            });
        });

        // ===== ПОИСК =====
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase().trim();
            renderTournaments();
        });

        // ===== ЗАГРУЗКА ТУРНИРОВ =====
        async function loadTournaments() {
            if (!currentOrgId) return;

            try {
                const q = query(
                    collection(db, "tournaments"),
                    where("organizationId", "==", currentOrgId),
                    orderBy("date", "asc")
                );
                const snapshot = await getDocs(q);
                allTournaments = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                updateCounts();
                renderTournaments();
            } catch (err) {
                console.error('Ошибка:', err);
                document.getElementById('tournamentsList').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>Ошибка загрузки</h3>
                        <p>Проверьте подключение или попробуйте позже</p>
                    </div>
                `;
            }
        }

        function updateCounts() {
            document.getElementById('countAll').textContent = allTournaments.length;
            document.getElementById('countRegistration').textContent = allTournaments.filter(t => t.status === 'registration').length;
            document.getElementById('countActive').textContent = allTournaments.filter(t => t.status === 'active').length;
            document.getElementById('countCompleted').textContent = allTournaments.filter(t => t.status === 'completed').length;
        }

        function renderTournaments() {
            const container = document.getElementById('tournamentsList');

            let filtered = allTournaments;

            if (currentFilter !== 'all') {
                filtered = filtered.filter(t => t.status === currentFilter);
            }

            if (searchQuery) {
                filtered = filtered.filter(t => t.name.toLowerCase().includes(searchQuery));
            }

            if (!filtered.length) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-trophy"></i>
                        <h3>${allTournaments.length ? 'Ничего не найдено' : 'Нет турниров'}</h3>
                        <p>${allTournaments.length ? 'Попробуйте изменить фильтры или поиск' : 'Создайте свой первый турнир'}</p>
                        ${!allTournaments.length ? `<button class="btn btn-primary" onclick="window.location.href='tournament-create.html'"><i class="fas fa-plus"></i> Создать турнир</button>` : ''}
                    </div>
                `;
                return;
            }

            container.innerHTML = `<div class="tournament-grid">${filtered.map(t => {
                const progress = t.maxParticipants ? Math.round((t.participantCount || 0) / t.maxParticipants * 100) : 0;
                const statusLabels = {
                    registration: 'Набор',
                    active: 'Идёт',
                    completed: 'Завершён',
                    cancelled: 'Отменён'
                };
                const statusClass = t.status || 'registration';
                const statusLabel = statusLabels[t.status] || t.status;

                return `
                    <div class="tournament-card" onclick="window.location.href='tournament-details.html?id=${t.id}'">
                        <div class="card-header">
                            <div class="tournament-name">${t.name}</div>
                            <span class="status-badge ${statusClass}">
                                <i class="fas fa-circle"></i> ${statusLabel}
                            </span>
                        </div>
                        <div class="card-info">
                            <div class="info-item">
                                <i class="fas fa-calendar-alt"></i> ${formatDate(t.date)}
                            </div>
                            <div class="info-item">
                                <i class="fas fa-map-marker-alt"></i> ${t.city || '—'}
                            </div>
                            <div class="info-item">
                                <i class="fas fa-fist-raised"></i> ${t.sport || '—'}
                            </div>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${progress}%;"></div>
                        </div>
                        <div class="progress-text">
                            <span>${t.participantCount || 0} / ${t.maxParticipants || 0} участников</span>
                            <span>${progress}%</span>
                        </div>
                        <div class="card-footer">
                            <div class="participants">
                                <i class="fas fa-users"></i> ${t.participantCount || 0}
                            </div>
                            <div class="fee">${t.entryFee || 0} ₽</div>
                            <button class="btn-manage" onclick="event.stopPropagation(); window.location.href='tournament-details.html?id=${t.id}'">
                                Управлять
                            </button>
                        </div>
                    </div>
                `;
            }).join('')}</div>`;
        }

        // ===== ЗАГРУЗКА ОРГАНИЗАЦИИ =====
        async function loadOrganizationData(orgId) {
            try {
                const requestDoc = await getDoc(doc(db, "organization_requests", orgId));
                if (requestDoc.exists() && requestDoc.data().organizationId) {
                    orgId = requestDoc.data().organizationId;
                }

                const orgDoc = await getDoc(doc(db, "organizations", orgId));
                if (!orgDoc.exists()) {
                    window.location.href = 'organization-dashboard.html';
                    return;
                }

                currentOrgId = orgDoc.id;
                await loadTournaments();
            } catch (err) {
                console.error('Ошибка:', err);
            }
        }

        // ===== АВТОРИЗАЦИЯ =====
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            let orgId = urlParams.get('id');

            if (!orgId) {
                const orgRequests = await getDocs(query(
                    collection(db, "organization_requests"),
                    where("userId", "==", user.uid),
                    where("status", "==", "approved")
                ));
                if (!orgRequests.empty) {
                    const request = orgRequests.docs[0].data();
                    orgId = request.organizationId || orgRequests.docs[0].id;
                    window.history.replaceState(null, '', `?id=${orgId}`);
                }
            }

            if (orgId) {
                loadOrganizationData(orgId);
            } else {
                window.location.href = 'organization-dashboard.html';
            }
        });
    </script>
</body>
</html>
